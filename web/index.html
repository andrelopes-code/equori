<!doctype html>
<html lang="en" data-slotted-theme="equori" data-slotted-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the on-screen keyboard shrinks the layout, as Android's adjustResize
         does, so a full-screen layer such as the command palette ends above the keys and its
         list scrolls in its own box. It also covers the Slotted finding "A full-screen dialog
         does not recede by the on-screen keyboard". -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- #0c0c0f is --slotted-surface in the dark scheme (equori.gen.css). -->
    <meta name="theme-color" content="#0c0c0f" />
    <!-- Boot files: the stored scheme and its surface, painted before the application loads. They
         are files because the CSP of ADR 028 forbids inline scripts and styles. -->
    <script src="/boot.js"></script>
    <link rel="stylesheet" href="/boot.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>equori</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="equori">
        <span class="boot-logo"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
