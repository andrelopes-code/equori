services:
  app:
    # A release attaches this file with the default set to its version (V7 of the distribution design); from a clone, compose builds the standalone stage.
    image: ghcr.io/andrelopes-code/equori:${EQUORI_VERSION:-dev}-standalone
    build:
      context: .
      target: standalone
    ports:
      # P14 A162: loopback unless .env sets EQUORI_HOST_IP (docs/operations/remote-access.md).
      - "${EQUORI_HOST_IP:-127.0.0.1}:${EQUORI_PORT:-8080}:8080"
    environment:
      EQUORI_DATABASE_URL: postgres://equori:${POSTGRES_PASSWORD:-equori}@db:5432/equori?sslmode=disable
      # P13 A154, A155: backups and the encrypted copy run in the app container.
      EQUORI_BACKUP_DIR: /backups
      EQUORI_POSTGRES_BIN: /usr/lib/postgresql/18/bin
      EQUORI_COPY_DIR: /copies
      # A194: the notice of a newer release names the upgrade of this form.
      EQUORI_DISTRIBUTION: compose
      # P14 A162.2: the install variables of .env; an empty value reads as unset.
      EQUORI_SECRET_KEY: ${EQUORI_SECRET_KEY:-}
      EQUORI_SECRET_KEY_PREVIOUS: ${EQUORI_SECRET_KEY_PREVIOUS:-}
      EQUORI_LOG_LEVEL: ${EQUORI_LOG_LEVEL:-}
      EQUORI_INSECURE_COOKIES: ${EQUORI_INSECURE_COOKIES:-}
      EQUORI_API_DOCS: ${EQUORI_API_DOCS:-}
    volumes:
      - backups:/backups
      - ${EQUORI_COPY_FOLDER:-./copies}:/copies
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: equori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equori}
      POSTGRES_DB: equori
      # B5: a new volume orders text by code point, as managed mode does; an existing volume keeps its order.
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "equori", "-d", "equori"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  backups:
