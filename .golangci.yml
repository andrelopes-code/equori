version: "2"

run:
  build-tags:
    - cluster

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - dupl
    - errorlint
    - gosec
    - noctx
    - wsl_v5
  settings:
    # A declaration stays beside the block that uses it; a closing brace is followed by a blank line.
    wsl_v5:
      allow-whole-block: true
      disable:
        - decl
      enable:
        - after-block
    depguard:
      rules:
        domain:
          list-mode: strict
          files:
            - "**/internal/*/domain/**"
          allow:
            - $gostd
            - github.com/andrelopes-code/equori/internal/*/domain
            - github.com/andrelopes-code/equori/internal/platform/money
            - github.com/andrelopes-code/equori/internal/platform/registry
            - github.com/andrelopes-code/equori/internal/platform/textfold
            - github.com/google/uuid
        app:
          list-mode: lax
          files:
            - "**/internal/*/app/**"
          deny:
            - pkg: net/http
              desc: app must not depend on transport; use httpapi
            - pkg: database/sql
              desc: app reaches data through ports; use postgres
            - pkg: github.com/jackc/pgx
              desc: app reaches data through ports; use postgres
            - pkg: github.com/andrelopes-code/equori/internal/assistant/httpapi
              desc: inverted dependency; httpapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/assistant/postgres
              desc: inverted dependency; postgres imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/assistant/toolapi
              desc: inverted dependency; toolapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/assistant/llmapi
              desc: inverted dependency; llmapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/capture/httpapi
              desc: inverted dependency; httpapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/capture/postgres
              desc: inverted dependency; postgres imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/capture/toolapi
              desc: inverted dependency; toolapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/capture/llmapi
              desc: inverted dependency; llmapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/classification/httpapi
              desc: inverted dependency; httpapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/classification/postgres
              desc: inverted dependency; postgres imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/classification/toolapi
              desc: inverted dependency; toolapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/classification/llmapi
              desc: inverted dependency; llmapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/identity/httpapi
              desc: inverted dependency; httpapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/identity/postgres
              desc: inverted dependency; postgres imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/identity/toolapi
              desc: inverted dependency; toolapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/identity/llmapi
              desc: inverted dependency; llmapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/ingestion/httpapi
              desc: inverted dependency; httpapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/ingestion/postgres
              desc: inverted dependency; postgres imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/ingestion/toolapi
              desc: inverted dependency; toolapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/ingestion/llmapi
              desc: inverted dependency; llmapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/instance/httpapi
              desc: inverted dependency; httpapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/instance/postgres
              desc: inverted dependency; postgres imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/instance/toolapi
              desc: inverted dependency; toolapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/instance/llmapi
              desc: inverted dependency; llmapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/ledger/httpapi
              desc: inverted dependency; httpapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/ledger/postgres
              desc: inverted dependency; postgres imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/ledger/toolapi
              desc: inverted dependency; toolapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/ledger/llmapi
              desc: inverted dependency; llmapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/marketdata/httpapi
              desc: inverted dependency; httpapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/marketdata/postgres
              desc: inverted dependency; postgres imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/marketdata/toolapi
              desc: inverted dependency; toolapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/marketdata/llmapi
              desc: inverted dependency; llmapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/planning/httpapi
              desc: inverted dependency; httpapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/planning/postgres
              desc: inverted dependency; postgres imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/planning/toolapi
              desc: inverted dependency; toolapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/planning/llmapi
              desc: inverted dependency; llmapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/portfolio/httpapi
              desc: inverted dependency; httpapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/portfolio/postgres
              desc: inverted dependency; postgres imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/portfolio/toolapi
              desc: inverted dependency; toolapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/portfolio/llmapi
              desc: inverted dependency; llmapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/reporting/httpapi
              desc: inverted dependency; httpapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/reporting/postgres
              desc: inverted dependency; postgres imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/reporting/toolapi
              desc: inverted dependency; toolapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/reporting/llmapi
              desc: inverted dependency; llmapi imports app, never the reverse
            - pkg: github.com/andrelopes-code/equori/internal/platform/problem
              desc: HTTP error mapping belongs to httpapi (ADR 004)
        platform:
          list-mode: lax
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/identity
              desc: platform must not depend on business modules (ADR 002)
            - pkg: github.com/andrelopes-code/equori/internal/ledger
              desc: platform must not depend on business modules (ADR 002)
            - pkg: github.com/andrelopes-code/equori/internal/marketdata
              desc: platform must not depend on business modules (ADR 002)
            - pkg: github.com/andrelopes-code/equori/internal/reporting
              desc: platform must not depend on business modules (ADR 002)
            - pkg: github.com/andrelopes-code/equori/internal/ingestion
              desc: platform must not depend on business modules (ADR 002)
            - pkg: github.com/andrelopes-code/equori/internal/classification
              desc: platform must not depend on business modules (ADR 002)
            - pkg: github.com/andrelopes-code/equori/internal/capture
              desc: platform must not depend on business modules (ADR 002)
            - pkg: github.com/andrelopes-code/equori/internal/planning
              desc: platform must not depend on business modules (ADR 002)
            - pkg: github.com/andrelopes-code/equori/internal/portfolio
              desc: platform must not depend on business modules (ADR 002)
            - pkg: github.com/andrelopes-code/equori/internal/instance
              desc: platform must not depend on business modules (ADR 002)
        module-assistant:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/assistant/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/assistant/*
              desc: a module is reached only through its root package (ADR 033)
        module-capture:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/capture/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/capture/
              desc: a module is reached only through its root package (ADR 033)
        module-classification:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/classification/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/classification/*
              desc: a module is reached only through its root package (ADR 033)
        module-identity:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/identity/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/identity/*
              desc: a module is reached only through its root package (ADR 033)
        module-ingestion:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/ingestion/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/ingestion/*
              desc: a module is reached only through its root package (ADR 033)
        module-instance:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/instance/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/instance/*
              desc: a module is reached only through its root package (ADR 033)
        module-ledger:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/ledger/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/ledger/*
              desc: a module is reached only through its root package (ADR 033)
        module-marketdata:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/marketdata/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/marketdata/*
              desc: a module is reached only through its root package (ADR 033)
        module-planning:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/planning/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/planning/*
              desc: a module is reached only through its root package (ADR 033)
        module-portfolio:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/portfolio/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/portfolio/*
              desc: a module is reached only through its root package (ADR 033)
        module-reporting:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/reporting/**"
          deny:
            - pkg: github.com/andrelopes-code/equori/internal/reporting/*
              desc: a module is reached only through its root package (ADR 033)
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    # A line holds at most 100 columns, a tab counts as 4; golines breaks a call, a signature or
    # a literal one element per line (CONTRIBUTING, Code layout).
    golines:
      max-len: 100
      tab-len: 4
      shorten-comments: false
      chain-split-dots: true
    goimports:
      local-prefixes:
        - github.com/andrelopes-code/equori
