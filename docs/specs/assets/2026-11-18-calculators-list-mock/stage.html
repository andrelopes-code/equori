<!doctype html>
<!-- FIXED FILE: do not edit. The stage draws one concept in one state inside the app's own
     design system. The design lives in design.html and design.css. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage</title>
    <link rel="stylesheet" href="theme/app.css" />
    <link rel="stylesheet" href="design.css" />
    <style>
      /* Plumbing only: nothing here may style the design. */
      html,
      body {
        block-size: auto !important;
        overflow: visible !important;
      }
      body {
        margin: 0;
      }
      [data-mock-chain] {
        display: contents !important;
      }
      /* shortcut: a query container answers inline-size queries only; give it a block size
         when the design depends on a height query. */
      [data-mock-container] {
        display: block !important;
        position: static !important;
        box-sizing: border-box !important;
        margin: 0 auto !important;
        padding: 0 !important;
        border: 0 !important;
        block-size: auto !important;
        min-block-size: 0 !important;
        max-inline-size: none !important;
        overflow: visible !important;
        background: none !important;
        transform: none !important;
        container-type: inline-size !important;
      }
      #stage {
        box-sizing: border-box;
        margin-inline: auto;
      }
      #stage-error {
        margin: 0;
        padding: 16px;
        font:
          14px/20px system-ui,
          sans-serif;
        color: #b3261e;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="overlay"></div>
    <script src="stage.js"></script>
  </body>
</html>
