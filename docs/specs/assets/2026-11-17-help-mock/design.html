">3</span><span class="stepText" data-wrap-ok="">Escolha quanto pagar: <strong>Em aberto</strong> paga tudo o que falta; <strong>Mínimo</strong> paga o pagamento mínimo.</span></button></li><li class="step"><button class="stepLine stepButton" type="button"><span class="stepNumber" aria-hidden="true">4</span><span class="stepText" data-wrap-ok="">Em <strong>Pago com</strong>, escolha a conta de onde o dinheiro sai, e informe a data.</span></button></li><li class="step"><button class="stepLine stepButton" type="button"><span class="stepNumber" aria-hidden="true">5</span><span class="stepText" data-wrap-ok="">Escolha <strong>Pagar fatura</strong>.</span></button></li></ol><div class="stage" data-part="stage"><div class="stageBar"><div aria-label="Mídia dos passos" aria-orientation="horizontal" data-condense="none" data-orientation="horizontal" data-part="root" data-size="sm" data-ui="segmented-control" data-variant="track" role="radiogroup" data-part-root="" data-ui-segmented-control="" style="--slotted-segmented-control-count: 2; --slotted-segmented-control-index: 0;"><span aria-hidden="true" data-part="indicator" data-part-indicator=""></span><label data-checked="" data-part="item" data-part-item=""><input data-part="control" data-part-control="" id="slotted-segment-_r_1e_" type="radio" value="type" checked="" name="slotted-segmented-control-_r_1d_"><span data-part="label" data-part-label="">Figuras</span></label><label data-part="item" data-part-item=""><input data-part="control" data-part-control="" id="slotted-segment-_r_1f_" type="radio" value="currency" name="slotted-segmented-control-_r_1d_"><span data-part="label" data-part-label="">Vídeo · 18 s</span></label></div><button data-ui="button" data-part="root" data-tone="secondary" data-variant="ghost" data-size="sm" data-justify="center" type="button" data-part-root="" data-ui-button=""><span data-part="start" data-part-start=""><span data-size="sm" aria-hidden="true" data-part="root" data-part-root="" data-ui="i timo backup diário tem mais de 48 horas</a></li></ol></div></nav></div><article class="reading"><div class="lead"><div data-flow="normal" data-part="root" data-status="ready" data-ui="markdown" data-part-root="" data-ui-markdown=""><div data-flow="normal" data-part="root" data-size="xl" data-ui="prose" data-part-root="" data-ui-prose=""><p data-wrap-ok="">Cada entrada nomeia um sintoma como a tela o mostra. Em seguida traz a causa, os passos e a página com mais detalhes.</p></div></div></div><section class="part" aria-labelledby="s0"><h2 class="partTitle" id="s0">Uma conexão aparece como Consentimento a vencer</h2><dl class="fix"><div class="fixRow"><dt class="fixLabel">Causa</dt><dd class="fixBody" data-wrap-ok="">O consentimento dado à instituição tem validade. Perto do fim dela, a conexão avisa antes de parar de trazer transações.</dd></div><div class="fixRow"><dt class="fixLabel">Como resolver</dt><dd class="fixBody"><ol class="steps"><li class="step"><span class="stepLine"><span class="stepNumber" aria-hidden="true">1</span><span class="stepText" data-wrap-ok="">Abra <strong>Contas</strong> e escolha <strong>Conexões</strong>.</span></span></li><li class="step"><span class="stepLine"><span class="stepNumber" aria-hidden="true">2</span><span class="stepText" data-wrap-ok="">Na conexão marcada, escolha <strong>Renovar consentimento</strong> e siga a tela da instituição.</span></span></li></ol></dd></div><div class="fixRow"><dt class="fixLabel">Mais detalhes</dt><dd class="fixBody"><span data-size="lg" data-part="root" data-ui="typography" data-part-root="" data-ui-typography=""><a data-part="root" data-ui="link" data-underline="always" data-variant="accent" data-part-root="" data-ui-link="" href="/help/bank-connections">Conexões bancárias</a></span></dd></div></dl></section><section class="part" aria-labelledby="s1"><h2 class="partTitle" id="s1">O valor de uma fatura difere do da instituição</h2><dl class="fix"><div class="fixRow"><dt class="fixLabel">Causa</dt>< dia/fig-pay-dark.png" alt="O diálogo de pagamento, com a conta e a data marcadas" width="640" height="400"><img class="shotImage shotLight" src="media/fig-pay-light.png" alt="O diálogo de pagamento, com a conta e a data marcadas" width="640" height="400"><span class="spot spotAccount" aria-hidden="true"><span class="spotNumber">4</span></span></span></figure></li><li class="step"><span class="stepLine"><span class="stepNumber" aria-hidden="true">5</span><span class="stepText" data-wrap-ok="">Escolha <strong>Pagar fatura</strong>.</span></span><figure class="figure stepFigure"><span class="shot"><img class="shotImage shotDark" src="media/fig-pay-dark.png" alt="O diálogo de pagamento, com o botão Pagar fatura marcado" width="640" height="400"><img class="shotImage shotLight" src="media/fig-pay-light.png" alt="O diálogo de pagamento, com o botão Pagar fatura marcado" width="640" height="400"><span class="spot spotConfirm" aria-hidden="true"><span class="spotNumber">5</span></span></span></figure></li></ol></div><p class="outcome" data-wrap-ok=""><strong>Depois do pagamento.</strong> O valor sai da conta escolhida e aparece como crédito na próxima fatura. Um pagamento menor que o total deixa o restante em aberto, e a tela mostra quanto fica.</p></section><section class="part" aria-labelledby="s1"><h2 class="partTitle" id="s1">Pagar em parcelas</h2><div data-flow="normal" data-part="root" data-status="ready" data-ui="markdown" data-part-root="" data-ui-markdown=""><div data-flow="normal" data-part="root" data-size="lg" data-ui="prose" data-part-root="" data-ui-prose=""><p data-wrap-ok="">Quando a instituição parcela a fatura, escolha <strong>Financiar</strong> na página da fatura. Informe o número de parcelas e o valor de cada uma. O valor em aberto vira parcelas cobradas nas próximas faturas, e a tela mostra quanto do total é juros.</p></div></div></section><section class="part" aria-labelledby="s2"><h2 class="partTitle" id="s2">Conferir com a instituição</h2><div data-flow="normal" data-part="root" data-status="ready" data-ui="markdown" data-part-root="" data-ui-markdown=""><div data-flow="normal" data-part="root" data-size="lg" data-ui="prose" data-part-root="" data-ui-prose=""><p data-wrap-ok="">Quando a fatura da instituição chegar, compare o total com o do equori. Escolha <strong>Conferir</strong> na página da fatura e digite o total que a instituição mostra. Se os totais forem diferentes, registre os dados da instituição para que datas e transações sigam a fatura dela.</p></div></div><figure class="figure inlineFigure"><span class="shot"><img class="shotImage shotDark" src="media/fig-statement-dark.png" alt="A página da fatura, com o total do ciclo marcado" width="640" height="400"><img class="shotImage shotLight" src="media/fig-statement-light.png" alt="A página da fatura, com o total do ciclo marcado" width="640" height="400"><span class="spot spotTotal" aria-hidden="true"><span class="spotNumber"></span></span></span><figcaption class="caption"><span data-size="sm" data-tone="muted" data-part="root" data-ui="typography" data-part-root="" data-ui-typography="">O total do ciclo fica no alto da página da fatura.</span><button data-ui="button" data-part="root" data-tone="secondary" data-variant="ghost" data-size="sm" data-justify="center" type="button" data-part-root="" data-ui-button=""><span data-part="start" data-part-start=""><span data-size="sm" aria-hidden="true" data-part="root" data-part-root="" data-ui="icon" data-ui-icon=""><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" data-part="glyph" data-part-glyph=""><g><path d="M15 3h6v6"></path><path d="m21 3-7 7"></path><path d="M9 21H3v-6"></path><path d="m3 21 7-7"></path></g></svg></span></span><span data-part="label" data-part-label="">Ampliar</span></button></figcaption></figure></section><section class="part" aria-labelledby="s3"><h2 class="partTitle" id="s en="true" data-part="root" data-part-root="" data-ui="icon" data-ui-icon=""><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" data-part="glyph" data-part-glyph="" data-glyph="chevron-down"><g><path d="m6 9 6 6 6-6"></path></g></svg></span></span></button><div data-part="panel" data-part-panel="" id="_r_7_-panel"><div aria-hidden="true" data-part="marker" data-part-marker="" style="--_marker-start: 0px; --_marker-size: 0px;"></div><ol data-part="list" data-part-list=""><li data-depth="1" data-part="item" data-part-item=""><a data-part="link" href="#s0" data-part-link="">Uma conexão aparece como Consentimento a vencer</a></li><li data-depth="1" data-part="item" data-part-item="" data-current=""><a data-part="link" href="#s1" data-part-link="" aria-current="location" data-current="">O valor de uma fatura difere do da instituição</a></li><li data-depth="1" data-part="item" data-part-item=""><a data-part="link" href="#s2" data-part-link="">O acesso recusa o código do segundo fator</a></li><li data-depth="1" data-part="item" data-part-item=""><a data-part="link" href="#s3" data-part-link="">O último backup diário tem mais de 48 horas</a></li></ol></div></nav></div><article class="reading"><div class="lead"><div data-flow="normal" data-part="root" data-status="ready" data-ui="markdown" data-part-root="" data-ui-markdown=""><div data-flow="normal" data-part="root" data-size="xl" data-ui="prose" data-part-root="" data-ui-prose=""><p data-wrap-ok="">Cada entrada nomeia um sintoma como a tela o mostra. Em seguida traz a causa, os passos e a página com mais detalhes.</p></div></div></div><section class="part" aria-labelledby="s0"><h2 class="partTitle" id="s0">Uma conexão aparece como Consentimento a vencer</h2><dl class="fix"><div class="fixRow"><dt class="fixLabel">Causa</dt><dd class="fixBody" data-wrap-ok="">O consentimento dado à instituição tem validade. Perto do fim dela, a conexão avisa antes de parar de trazer transações.</dd></div><div class="fixRow"><dt class="fixLabel">Como resolver</dt><dd class="fixBody"><ol class="steps"><li class="step"><span class="stepLine"><span class="stepNumber" aria-hidden="true">1</span><span class="stepText" data-wrap-ok="">Abra <strong>Contas</strong> e escolha <strong>Conexões</strong>.</span></span></li><li class="step"><span class="stepLine"><span class="stepNumber" aria-hidden="true">2</span><span class="stepText" data-wrap-ok="">Na conexão marcada, escolha <strong>Renovar consentimento</strong> e siga a tela da instituição.</span></span></li></ol></dd></div><div class="fixRow"><dt class="fixLabel">Mais detalhes</dt><dd class="fixBody"><span data-size="lg" data-part="root" data-ui="typography" data-part-root="" data-ui-typography=""><a data-part="root" data-ui="link" data-underline="always" data-variant="accent" data-part-root="" data-ui-link="" href="/help/bank-connections">Conexões bancárias</a></span></dd></div></dl></section><section class="part" aria-labelledby="s1"><h2 class="partTitle" id="s1">O valor de uma fatura difere do da instituição</h2><dl class="fix"><div class="fixRow"><dt class="fixLabel">Causa</dt><dd class="fixBody" data-wrap-ok="">Uma compra entrou no ciclo errado, um encargo da instituição não foi registrado, ou um estorno chegou depois do fechamento.</dd></div><div class="fixRow"><dt class="fixLabel">Como resolver</dt><dd class="fixBody"><ol class="steps"><li class="step"><span class="stepLine"><span class="stepNumber" aria-hidden="true">1</span><span class="stepText" data-wrap-ok="">Abra a fatura e escolha <strong>Conferir</strong>.</span></span></li><li class="step"><span class="stepLine"><span class="stepNumber" aria-hidden="true">2</span><span class="stepText" data-wrap-ok="">Digite o total que a instituição mostra. A tela lista a diferença por tipo: compras, parcelas anteriores, encargos e estornos.</span></span></li><li class="step"><span class="stepLine"><span class="stepNumber" aria-hidden="true">3</span><span class="stepText" data-wrap-ok="">Registre os dados da instituição para que datas e transações sigam a fatura dela.</span></span></li></ol><figure class="figure inlineFigure"><span class="shot"><img class="shotImage shotDark" src="media/fig-statement-dark.png" alt="A página da fatura, com o total do ciclo marcado" width="640" height="400"><img class="shotImage shotLight" src="media/fig-statement-light.png" alt="A página da fatura, com o total do ciclo marcado" width="640" height="400"><span class="spot spotTotal" aria-hidden="true"><span class="spotNumber"></span></span></span><figcaption class="caption"><span data-size="sm" data-tone="muted" data-part="root" data-ui="typography" data-part-root="" data-ui-typography="">O total do ciclo fica no alto da página da fatura.</span><button data-ui="button" data-part="root" data-tone="secondary" data-variant="ghost" data-size="sm" data-justify="center" type="button" data-part-root="" data-ui-button=""><span data-part="start" data-part-start=""><span data-size="sm" aria-hidden="true" data-part="root" data-part-root="" data-ui="icon" data-ui-icon=""><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" data-part="glyph" data-part-glyph=""><g><path d="M15 3h6v6"></path><path d="m21 3-7 7"></path><path d="M9 21H3v-6"></path><path d="m3 21 7-7"></path></g></svg></span></span><span data-part="label" data-part-label="">Ampliar</span></button></figcaption></figure></dd></div><div class="fixRow"><dt class="fixLabel">Mais detalhes</dt><dd class="fixBody"><span data-size="lg" data-part="root" data-ui="typography" data-part-root="" data-ui-typography=""><a data-part="root" data-ui="link" data-underline="always" data-variant="accent" data-part-root="" data-ui-link="" href="/help/pay-statement#conferir-com-a-instituição">Pagar uma fatura: Conferir com a instituição</a></span></dd
