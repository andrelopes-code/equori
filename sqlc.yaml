version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity
    gen:
      go: &go
        package: postgres
        out: internal/identity/internal/adapter/postgres
        sql_package: pgx/v5
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/marketdata
    gen:
      go:
        <<: *go
        out: internal/marketdata/internal/adapter/postgres
