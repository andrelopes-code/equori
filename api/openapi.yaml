                $ref: "#/components/schemas/BulkCategorizeResult"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/categorize:
    post:
      tags: [ledger]
      operationId: categorizeTransaction
      summary: Replace the category postings of a transaction, keeping their total (P5 amendment A18).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
