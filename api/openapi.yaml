        passkey:
          type: object
          additionalProperties: false
          required: [credential_id, client_data_json, authenticator_data, signature]
          description: Base64url values without padding.
          properties:
            credential_id:
              type: string
              maxLength: 2048
            client_data_json:
              type: string
              maxLength: 8192
            authenticator_data:
              type: string
              maxLength: 8192
            signature:
              type: string
              maxLength: 2048
    CreateBooksInput:
      type: object
      additionalProperties: false
      required: [region]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        region:
          type: string
          pattern: "^[A-Z]{2}$"
        base_currency:
          type: string
          pattern: "^[A-Z]{3}$"
    SwitchBooksInput:
      type: object
      additionalProperties: false
      required: [books_id]
      properties:
        books_id:
          type: integer
          format: int64
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
    SetupInput:
      type: object
      additionalProperties: false
      required: [token, email, password, language, region, update_check]
      properties:
        token:
          type: string
        email:
          type: string
        password:
          type: string
        language:
          type: string
          pattern: "^[a-z]{2,3}$"
        region:
          type: string
          pattern: "^[A-Z]{2}$"
        base_currency:
          type: string
          pattern: "^[A-Z]{3}$"
        update_check:
          type: boolean
        books_name:
          type: string
          minLength: 1
          maxLength: 80
        time_zone:
          type: string
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: |
            Stable error identifier. Values: invalid_request, request_too_large, invalid_credentials,
            too_many_attempts, unauthenticated, forbidden, not_found, validation_failed, internal_error,
            server_busy, invalid_account, version_conflict, transaction_voided, posting_reconciled,
            account_not_empty, settings_locked, statement_not_closed, statement_financed, dispute_open, dispute_resolved,
            already_reconciled, difference_remains, method_not_allowed, unsupported_media_type,
            record_resolved, already_matched, group_changed, not_categorizable, suggestion_closed, pairing_ambiguous,
            integration_unavailable, aggregator_unauthorized, aggregator_unavailable, integration_in_use,
            currency_unsupported, occurrence_closed, transaction_in_use, pause_overlap, schedule_ended,
            budget_exists, instrument_exists, mixed_instruments, price_missing, later_sale_exists,
            investment_transaction, system_account, attachment_not_inlineable, archive_too_new, passphrase_invalid, passphrase_required,
            setup_token_invalid, setup_complete, book_role_required, books_not_found, member_not_found,
            last_owner, already_member, invitation_not_found, invitation_email_mismatch,
            confirmation_mismatch, books_has_members, last_books,
            backup_off, backup_failed, password_too_short, institution_in_use.
        request_id:
          type: string
        retry_at:
          type: string
          format: date-time
          description: Instant after which the same request can succeed.
        archive_version:
          type: integer
          description: The archive_version of a refused archive (archive_too_new, ADR 021).
        instance_version:
          type: integer
          description: The highest archive_version the instance imports (archive_too_new, ADR 021).
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
