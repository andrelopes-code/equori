    StatementSummary:
      type: object
      required: [id, account_id, reference, closing_date, due_date, opening, charges, credits, amount_due, payments, unpaid, status, reconciled,
        settled, prior_credits, early_payments, billed_amount, open_amount]
      description: >-
        Amounts are positive when owed by the user. Every card posting is billed on the statement of its
        cycle (A89). opening is the previous amount_due; credits and payments are those billed on the
        statement; amount_due = opening + charges − credits − payments, the card balance at closing;
        settled is the credits and payments of the next statement, up to today, that cover amount_due;
        unpaid = amount_due − settled, zero for a credit balance; prior_credits are the credits that
        settled the previous statement; early_payments are the payments beyond what settled it;
        billed_amount = amount_due + early_payments; open_amount = amount_due less the unpaid amount of a
        previous statement not yet due (closed or partially_paid), the institution's open bill (A138). institution and amount_difference (amount_due −
        institution.total) are present when the institution reported the statement (A92). confirmed_amount and
        awaiting_amount split amount_due − opening into the postings an external record confirms and those it
        does not; both are present when some posting of the account carries a record (A170).
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        reference:
          type: string
        closing_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        opening:
          $ref: "#/components/schemas/Money"
        charges:
          $ref: "#/components/schemas/Money"
        credits:
          $ref: "#/components/schemas/Money"
        amount_due:
          $ref: "#/components/schemas/Money"
        payments:
          $ref: "#/components/schemas/Money"
        settled:
          $ref: "#/components/schemas/Money"
        unpaid:
          $ref: "#/components/schemas/Money"
        prior_credits:
          $ref: "#/components/schemas/Money"
        early_payments:
          $ref: "#/components/schemas/Money"
        billed_amount:
          $ref: "#/components/schemas/Money"
        open_amount:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [open, closed, paid, partially_paid, overdue, financed]
        reconciled:
          type: boolean
          description: The institution's amount due was confirmed (POST /statements/{id}/reconcile).
        institution:
          $ref: "#/components/schemas/StatementFact"
        amount_difference:
          $ref: "#/components/schemas/Money"
        confirmed_amount:
          $ref: "#/components/schemas/Money"
        awaiting_amount:
          $ref: "#/components/schemas/Money"
    StatementFact:
      type: object
      description: What the institution reported for the statement (A85); the owner's facts first.
      required: [source, due_date, total]
      properties:
