        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/projection:
    get:
      tags: [planning]
      operationId: getProjection
      x-book-role: read
      summary: Projected balance of a balance account to a date after today, at most today + 12 months (P7 amendment A56).
      description: |
        opening is the booked balance today. Each point is an expected occurrence on the account, an overdue one
        dated today, ordered by date then amount. closing is the booked balance at to plus every point.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Projection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /commitments:
    get:
      tags: [planning]
      operationId: getCommitted
      x-book-role: read
      summary: Installments and expected bills, subscriptions and savings committed in a month (P7 amendment A57).
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Committed"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budget-plan:
    get:
      tags: [planning]
      operationId: getBudgetPlan
      x-book-role: read
      summary: The reference income of a month, what is committed and the budgets to distribute it across (budget plan A129, A131).
      parameters:
        - $ref: "#/components/parameters/PlanMonth"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPlan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    put:
      tags: [planning]
      operationId: saveBudgetPlan
      x-book-role: write
      summary: Save the reference choice and the amounts of a month from the current one on, in one transaction (budget plan A130).
      description: |
        Each listed category gets the amount from the month on, replacing the version of that month; a category without a
        budget and an amount above zero gets a budget without rollover. Versions of other months are not touched.
      parameters:
        - $ref: "#/components/parameters/PlanMonth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetPlanInput"
      responses:
        "200":
          description: The plan after the save.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPlan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/reopen:
    post:
      tags: [planning]
      operationId: reopenOccurrence
      x-book-role: write
      summary: Make a skipped occurrence expected again; a recorded transaction that fits it realizes it (P7 amendment A200).
      description: |
        409 occurrence_closed when the occurrence is not skipped; 409 schedule_ended when its date is on or after
        ends_on; 422 when its date falls inside a pause.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/unrealize:
    post:
      tags: [planning]
      operationId: unrealizeOccurrence
      x-book-role: write
      summary: Release a realized occurrence (409 occurrence_closed when it is not realized).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /instance/backup:
    get:
      tags: [instance]
      operationId: getBackup
      x-book-role: read
      summary: Backups and encrypted copy of the instance; admin only (P13 A157).
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      tags: [instance]
      operationId: runBackup
      x-book-role: read
      summary: Write a periodic backup and its copy now; admin only. 409 backup_off without EQUORI_BACKUP_DIR; 500 backup_failed.
      responses:
        "200":
          description: The new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /instance/backup/copy-password:
    put:
      tags: [instance]
      operationId: setCopyPassword
      x-book-role: read
      summary: Set the password of the encrypted copies; admin only. 400 password_too_short below 12 characters; 409 secret_key_missing without EQUORI_SECRET_KEY.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyPasswordInput"
      responses:
        "204":
          description: Stored.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /instance/diagnostic:
    get:
      tags: [instance]
      operationId: getDiagnostic
      x-book-role: read
      summary: The diagnostic file, without amounts, names or descriptions; admin only (P13 A158).
      responses:
        "200":
          description: equori-diagnostic-<YYYY-MM-DD>.json as an attachment.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnostic"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /instance/version:
    get:
      tags: [instance]
      operationId: getVersion
      x-book-role: read
      summary: Version of the binary and the newest release found; admin only (P13 A159).
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /instance/version/update-check:
    put:
      tags: [instance]
      operationId: setUpdateCheck
      x-book-role: read
      summary: Allow or refuse the daily request for the latest release; admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCheckInput"
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: equori_session
  parameters:
    Year:
      name: year
      in: query
      required: true
      description: Year in which the tax year of the owner's jurisdiction starts.
      schema:
        type: integer
        minimum: 1900
        maximum: 2200
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanMonth:
      name: month
      in: query
      required: true
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
    TagName:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 60
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    SessionCookie:
      name: equori_session
      in: cookie
      required: false
      schema:
        type: string
    LoginCookie:
      name: equori_login
      in: cookie
      required: false
      schema:
        type: string
    Origin:
      name: Origin
      in: header
      required: false
      description: The browser's origin; its host name is the WebAuthn RP ID (HA42).
      schema:
        type: string
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Capability:
      type: string
      enum: [tools, structured_output, image_input]
    Notice:
      type: string
      description: trains, the free tier uses submitted content; local, data stays on the configured host; provider_terms, read the provider's terms.
      enum: [trains, local, provider_terms]
    PresetModel:
      type: object
      required: [id, capabilities]
      properties:
        id:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
    Preset:
      type: object
      required: [id, api, base_url, key_required, notice, models]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        api:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        base_url:
          type: string
          description: Empty for custom.
        key_required:
          type: boolean
        notice:
          $ref: "#/components/schemas/Notice"
        models:
          type: array
          items:
            $ref: "#/components/schemas/PresetModel"
    PresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Preset"
    Provider:
      type: object
      required: [id, preset, name, base_url, has_key, notice, instance]
      properties:
        id:
          type: string
          description: A UUID, or the adapter name of an instance provider.
        preset:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        name:
          type: string
        base_url:
          type: string
          description: Empty for an instance provider.
        has_key:
          type: boolean
        notice:
          $ref: "#/components/schemas/Notice"
        instance:
          type: boolean
          description: Configured through the environment for every book; read-only.
    ProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Provider"
    ProviderInput:
      type: object
      required: [preset, name]
      properties:
        preset:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        name:
          type: string
        base_url:
          type: string
          description: Absent takes the preset's.
        key:
          type: string
          writeOnly: true
    ProviderPatch:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
        key:
          type: string
          writeOnly: true
          description: Absent keeps the stored key; empty removes it.
    ProviderModels:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
    UseTarget:
      type: object
      required: [provider_id, provider_name, preset, notice, model, capabilities]
      properties:
        provider_id:
          type: string
        provider_name:
          type: string
        preset:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        notice:
          $ref: "#/components/schemas/Notice"
        model:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
    Use:
      type: object
      required: [id, needs, sends_financial_data, default, targets]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_.]{2,40}$"
        needs:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        sends_financial_data:
          type: boolean
        default:
          type: boolean
          description: The chain comes from the use's declaration.
        targets:
          type: array
          items:
            $ref: "#/components/schemas/UseTarget"
    UseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Use"
    UsageRow:
      type: object
      required: [provider_id, provider_name, preset, instance, model, today_requests, today_errors, today_tokens,
        period_requests, period_tokens, period_days]
      properties:
        provider_id:
          type: string
        provider_name:
          type: string
        preset:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        instance:
          type: boolean
        model:
          type: string
        today_requests:
          type: integer
          format: int64
          description: Requests sent today, answered or not.
        today_errors:
          type: integer
          format: int64
        today_tokens:
          type: integer
          format: int64
          description: Input and output tokens of today's answers.
        period_requests:
          type: integer
          format: int64
        period_tokens:
          type: integer
          format: int64
        period_days:
          type: integer
          description: Days summed in the period figures, today included.
        requests_per_day:
          type: integer
          format: int64
          description: Absent when the owner declared none.
        tokens_per_day:
          type: integer
          format: int64
        cooling_until:
          type: string
          format: date-time
          description: Present while the model cools down after a refusal.
    UsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageRow"
    UsageDay:
      type: object
      required: [day, provider_id, model, requests, errors, tokens]
      properties:
        day:
          type: string
          format: date
        provider_id:
          type: string
        model:
          type: string
        requests:
          type: integer
          format: int64
          description: Requests sent that day, answered or not.
        errors:
          type: integer
          format: int64
        tokens:
          type: integer
          format: int64
          description: Input and output tokens of the day's answers.
    UsageDayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageDay"
    AssistantChat:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available: {type: boolean}
        provider_name: {type: string}
        model: {type: string}
        notice: {type: string, pattern: "^[a-z0-9_]{2,40}$"}
        retry_at: {type: string, format: date-time}
    AssistantTurnInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        conversation_id: {type: string, format: uuid}
        text: {type: string, minLength: 1, maxLength: 4000}
        page: {type: string, pattern: "^/[A-Za-z0-9/_$.-]{0,199}$"}
    AssistantConversation:
      type: object
      additionalProperties: false
      required: [id, title, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AssistantConversationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssistantConversation"
        next_cursor:
          type: string
          description: Absent on the last page.
    AssistantMessage:
      type: object
      additionalProperties: false
      required: [id, role, content, created_at, proposals]
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [user, assistant]}
        content: {type: string}
        outcome: {type: string, enum: [answered, step_limit, failed, canceled]}
        created_at: {type: string, format: date-time}
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/AssistantProposal"
    AssistantConversationDetail:
      type: object
      additionalProperties: false
      required: [id, title, created_at, updated_at, messages]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AssistantMessage"
    AssistantProposal:
      type: object
      additionalProperties: false
      required: [id, tool, status, preview, created_at, expires_at, suggested, waiting_for]
      properties:
        id: {type: string, format: uuid}
        tool: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}
        status: {type: string, enum: [pending, executing, executed, failed, rejected, stale, discarded, expired, waiting, blocked]}
        suggested: {type: boolean}
        reason: {type: string, maxLength: 200}
        summary: {type: string, maxLength: 200}
        waiting_for: {type: array, items: {type: string, format: uuid}}
        preview: {$ref: "#/components/schemas/AssistantPreview"}
        result: {description: "Tool output when executed, tool error when failed."}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
    AssistantPreview:
      type: object
