        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /integrations/{id}/credentials:
    put:
      tags: [ingestion]
      operationId: updateIntegrationCredentials
      summary: Replace the credentials of an integration after the aggregator validates them.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
