    delete:
      tags: [ledger]
      operationId: deleteAttachment
      x-book-role: write
      summary: Remove an attachment; the stored file is deleted when no attachment references it.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /attachments/{id}/content:
    get:
      tags: [ledger]
      operationId: getAttachmentContent
      x-book-role: read
      summary: Download the attached file, or show a PDF or an image in a frame of the application.
      description: |
        With disposition=inline the response is shown in place and its Content-Security-Policy
        allows a frame of the application's own origin (ADR 007, C9a); 422
        attachment_not_inlineable for any media type but a PDF or an image. The default is a
        download and no frame may show it.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: disposition
          in: query
          required: false
          schema:
            type: string
            enum: [attachment, inline]
            default: attachment
      responses:
        "200":
          description: The file, with its stored media type.
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Security-Policy:
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
