      properties:
        field:
          type: string
          enum: [description, raw_description, payee, amount, absolute_amount, account, account_kind, source, weekday, day_of_month, installment]
        operator:
          type: string
          enum: [equals, contains, starts_with, regex, between, greater_than, less_than, in_list]
        value: {}
