# Generated by make gen from api/base.yaml, api/shared.yaml and internal/*/openapi.yaml. Do not edit.
openapi: 3.0.3
info:
  title: equori API
  version: 0.1.0
  description: |
    Each operation declares x-book-role. public needs no session; read, write and owner need a
    session whose role in the active book ranks at least as high (read < write < owner). A lower
    role is 403 book_role_required (ADR 029, HA9).
    Errors use RFC 9457 problem details (docs/adr/004-api-errors.md).
servers:
  - url: /api/v1
tags:
  - name: identity
    description: Members and sessions.
  - name: ledger
    description: Accounts, transactions and balances.
  - name: reporting
    description: Derived views over the ledger.
  - name: portfolio
    description: Positions, realized results and income events derived from Ledger (P8 amendment A71).
  - name: marketdata
    description: Instruments, prices and business-day calendars.
  - name: ingestion
    description: File imports, aggregator integrations and connections, external records and their review.
  - name: instance
    description: Backups, the encrypted copy, the diagnostic file and the version notice of the instance.
  - name: classification
    description: Categorization rules, payee aliases, suggestions and categorization methods.
  - name: planning
    description: Schedules and their occurrences, budgets, goals, projections and committed amounts.
  - name: capture
    description: Transaction drafts read from text the owner writes.
  - name: assistant
    description: Language model providers of each book and the chain of each use (ADR 019).
security:
  - sessionCookie: []
paths:
  /assistant/presets:
    get:
      tags: [assistant]
      operationId: listPresets
      x-book-role: read
      summary: Known language model services, their notices and suggested models.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetList"
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/providers:
    get:
      tags: [assistant]
      operationId: listProviders
      x-book-role: read
      summary: The book's providers in creation order, then the instance providers; never a key.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [assistant]
      operationId: createProvider
      x-book-role: owner
      summary: Store a provider; its key is sealed under EQUORI_SECRET_KEY (ADR 008).
      description: |
        422 key_required when the preset requires a key and none is sent; 409 secret_key_missing
        when a key is sent and EQUORI_SECRET_KEY is not set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /assistant/providers/{id}:
    patch:
      tags: [assistant]
      operationId: updateProvider
      x-book-role: owner
      summary: Change a provider's name, base URL or key; an absent key keeps the stored one.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [assistant]
      operationId: deleteProvider
      x-book-role: owner
      summary: Delete a provider and its chain targets; their uses fall back to the default.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /assistant/providers/{id}/models:
    get:
      tags: [assistant]
      operationId: listProviderModels
      x-book-role: read
      summary: Ask the provider's API for its models, which also checks its key.
      description: 502 provider_unauthorized when the provider rejects the key; 502 provider_unavailable otherwise.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderModels"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /assistant/usage:
    get:
      tags: [assistant]
      operationId: listUsage
      x-book-role: read
      summary: The book's usage per provider and model today and over the last 30 days, with declared limits (ADR 019 U6).
      description: Today is the instance's date; a provider resets its quota on its own schedule.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageList"
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/usage/days:
    get:
      tags: [assistant]
      operationId: listUsageDays
      x-book-role: read
      summary: The book's usage per day, provider and model over a range of at most 90 days.
      description: Both ends are included and the figures sum the uses. A day without use has no row.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageDayList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/usage/limits:
    put:
      tags: [assistant]
      operationId: setUsageLimit
      x-book-role: owner
      summary: Declare the daily limits of a provider and model; absent quotas remove them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageLimitInput"
      responses:
        "204":
          description: Stored.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /assistant/chat:
    get:
      tags: [assistant]
      operationId: getAssistantChat
      x-book-role: read
      summary: Whether the conversation can be used now, with the target it would reach and when to retry.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChat"
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/turns:
    post:
      tags: [assistant]
      operationId: sendAssistantMessage
      x-book-role: read
      summary: Run one conversation turn and stream its progress as Server-Sent Events.
      description: |
        Events: turn {conversation_id, message_id}, delta {text}, step {tool}, answer (AssistantMessage) and error (Problem).
        Text received since the previous step belongs to a model call that asked for tools; a client drops it at the step.
        The stream ends after answer or error. Problems before the stream: 404 conversation_not_found,
        429 assistant_exhausted with retry_at, 503 assistant_unavailable, 400 invalid_request for text that is
        empty without a file or over 4000 characters after trimming, 404 file_not_found for a file_ids entry
        that is not an unsent file of the member. An error event carries assistant_exhausted,
        assistant_unavailable or assistant_failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantTurnInput"
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /assistant/conversations:
    get:
      tags: [assistant]
      operationId: listAssistantConversations
      x-book-role: read
      summary: The book's conversations, most recently updated first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationPage"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [assistant]
      operationId: deleteAssistantConversations
      x-book-role: read
      summary: Delete every conversation of the book with its messages and proposals.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/conversations/{id}:
    get:
      tags: [assistant]
      operationId: getAssistantConversation
      x-book-role: read
      summary: A conversation with its messages and their proposals.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [assistant]
      operationId: deleteAssistantConversation
      x-book-role: read
      summary: Delete a conversation with its messages and proposals; 404 conversation_not_found.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /assistant/files:
    post:
      tags: [assistant]
      operationId: createAssistantFile
      x-book-role: read
      summary: Store a file the member attaches to the next message of a conversation.
      description: |
        The kind is read from the content: ofx, csv, pdf, image (JPEG, PNG, WebP) or text; another content
        returns 415 file_kind_unsupported. At most 10 MiB per file (413 file_too_large) and 50 MiB per
        conversation, or for the unsent files of the member when conversation_id is absent
        (409 conversation_files_full). The same content attached twice to one conversation returns the
        stored file. An unsent file is deleted 24 hours after its upload. 404 conversation_not_found.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                conversation_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantFile"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /assistant/files/{id}/content:
    get:
      tags: [assistant]
      operationId: getAssistantFileContent
      x-book-role: read
      summary: Open a conversation file of the member; 404 file_not_found.
      description: |
        A pdf, image or text file is shown in place (inline); an ofx or csv file is a download. The
        Content-Security-Policy lets no content of the file run.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The file, with the media type of its content.
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Security-Policy:
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /assistant/files/{id}:
    delete:
      tags: [assistant]
      operationId: deleteAssistantFile
      x-book-role: read
      summary: Remove a file no message has sent yet; 404 file_not_found.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /assistant/proposals/{id}/confirm:
    post:
      tags: [assistant]
      operationId: confirmAssistantProposal
      x-book-role: write
      summary: Execute a pending proposal once, after checking that its data did not change.
      description: "Answers 409 with Problem code proposal_closed, proposal_expired, proposal_stale or proposal_waiting (the proposal waits for the confirmation of another)."
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantProposal"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /assistant/proposals/{id}/reject:
    post:
      tags: [assistant]
      operationId: rejectAssistantProposal
      x-book-role: read
      summary: Reject a pending proposal.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantProposal"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /assistant/uses:
    get:
      tags: [assistant]
      operationId: listUses
      x-book-role: read
      summary: Every declared use with its effective chain for the book.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseList"
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/uses/{use}/chain:
    put:
      tags: [assistant]
      operationId: setUseChain
      x-book-role: owner
      summary: Replace the book's chain of a use; an empty list restores the default.
      description: 422 capability_missing when a model lacks a capability the use needs.
      parameters:
        - name: use
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9_.]{2,40}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChainInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Use"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /capture/preview:
    post:
      tags: [capture]
      operationId: previewCapture
      x-book-role: write
      summary: Read each line of a text as a transaction draft; records nothing (A106).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapturePreviewInput"
      responses:
        "200":
          description: One draft per non-blank line, in text order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturePreview"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /capture/suggestions:
    post:
      tags: [capture]
      operationId: suggestCaptureCategories
      x-book-role: write
      summary: Name a category for descriptions classification left uncategorized (ADR 014).
      description: Kept answers are served without a model call; the others are asked of a language model in one request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureSuggestionInput"
      responses:
        "200":
          description: One suggestion per item, in input order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureSuggestions"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /transactions/category-suggestions:
    post:
      tags: [capture]
      operationId: suggestTransactionCategories
      x-book-role: write
      summary: Name a category for existing uncategorized transactions (ADR 014 L1a).
      description: |
        Each transaction is asked as a capture line of its class with its description, under the use capture.suggest.
        Nothing is recorded; categorizeTransactions records an accepted suggestion. 404 not_found when an id is not
        one of the book's transactions; 422 transaction_not_uncategorized when one is not an uncategorized expense or
        income.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionSuggestionInput"
      responses:
        "200":
          description: One suggestion per transaction, in input order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSuggestions"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /rules:
    get:
      tags: [classification]
      operationId: listRules
      x-book-role: read
      summary: Categorization rules by priority.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [classification]
      operationId: createRule
      x-book-role: write
      summary: Create a rule at the last priority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /rules/reorder:
    post:
      tags: [classification]
      operationId: reorderRules
      x-book-role: write
      summary: Give every rule a new priority, in the order listed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleOrder"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /rules/preview:
    post:
      tags: [classification]
      operationId: previewRule
      x-book-role: write
      summary: What a rule would do alone over the transactions of the last 365 days (A81).
      description: |
        would_categorize counts the uncategorized transactions the rule categorizes; conflicts counts the categorized
        ones whose category postings differ from the rule's allocation. Each list holds the newest 50 ids. Nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulePreview"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /rules/run:
    post:
      tags: [classification]
      operationId: runRules
      x-book-role: write
      summary: Run categorization (F5) on every uncategorized transaction.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleRun"
        "401":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/categorization:
    get:
      tags: [classification]
      operationId: getCategorization
      x-book-role: read
      summary: How the categories of a transaction were decided (P5 amendment A20).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categorization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /categorizations:
    get:
      tags: [classification]
      operationId: listCategorizations
      x-book-role: read
      summary: How the categories of several transactions were decided (A79).
      description: A transaction without a categorization record, or voided, is absent from items.
      parameters:
        - name: transaction_id
          in: query
          required: true
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 200
            items:
              type: string
              format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizationList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /source-categories:
    get:
      tags: [classification]
      operationId: listSourceCategories
      x-book-role: read
      summary: Categories aggregators assigned to imported lines, by name (P6 amendment A41).
      description: count is the number of imported lines that carried the category.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCategoryList"
        "401":
          $ref: "#/components/responses/Problem"
  /source-categories/{id}:
    put:
      tags: [classification]
      operationId: mapSourceCategory
      x-book-role: write
      summary: Set the category of lines that carry the source category and no rule decides.
      description: category_id null clears it. The mapping applies to lines imported afterwards (method source, F5).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceCategoryMapping"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCategory"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /categorization-statistics:
    get:
      tags: [classification]
      operationId: getCategorizationStatistics
      x-book-role: read
      summary: Transactions dated in [from, to] by categorization method (SC5).
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
