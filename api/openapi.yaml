      required: [available]
      properties:
        available: {type: boolean}
        provider_name: {type: string}
        model: {type: string}
        notice: {type: string, pattern: "^[a-z0-9_]{2,40}$"}
        reads_files:
          type: boolean
          description: A model of the chat reads the content of a pdf, image or text file (F5).
        retry_at: {type: string, format: date-time}
    AssistantFile:
      type: object
      additionalProperties: false
      required: [id, name, kind, size, created_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [ofx, csv, pdf, image, text]}
        size: {type: integer, minimum: 1}
