        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [planning]
      operationId: updateGoal
      x-book-role: write
      summary: Change the name, target, due date or accounts of a goal; fields not sent stay as they are.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [planning]
      operationId: deleteGoal
