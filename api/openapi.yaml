      tags: [ingestion]
      operationId: listConnectionSyncs
      x-book-role: read
      summary: The last 10 sync runs of the connection that decided, created or placed a line in review (A149).
      description: |
        Newest first. Each run lists its batches, one per mapped account, and the records its
        summary lists: those the run linked, changed, withdrew, re-identified, created, matched or
        placed in review. A record a later run decided belongs to that run. A run that changed
        nothing is not listed.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
