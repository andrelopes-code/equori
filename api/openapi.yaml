    get:
      tags: [ledger]
      operationId: listBalanceAssertions
      summary: Balances reported by the institution for a leaf balance account.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
