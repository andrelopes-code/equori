        region:
          type: string
          pattern: "^[A-Z]{2}$"
        base_currency:
          type: string
          pattern: "^[A-Z]{3}$"
        update_check:
          type: boolean
        books_name:
          type: string
          minLength: 1
          maxLength: 80
        time_zone:
          type: string
    IntegrationInput:
      type: object
      additionalProperties: false
      required: [aggregator, name, credentials]
      properties:
        aggregator:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        name:
          type: string
          minLength: 1
          maxLength: 60
        credentials:
          $ref: "#/components/schemas/IntegrationCredentials"
    IntegrationCredentials:
      type: object
      description: |
        One value per credential field the aggregator declares in listAggregators; a missing
        or undeclared member is 422 validation_failed on credentials.<name>.
      additionalProperties:
        type: string
        maxLength: 200
    Aggregator:
      type: object
      required: [id, name, credential_fields, connect_method]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        name:
          type: string
        credential_fields:
          type: array
          items:
            type: object
            required: [name, secret]
            properties:
              name:
                type: string
              secret:
                type: boolean
        connect_method:
          type: string
          description: "reference: a connection takes the item reference of an application the owner connected elsewhere."
    AggregatorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Aggregator"
    Integration:
      type: object
      required: [id, aggregator, name, updated_at]
      properties:
        id:
          type: string
          format: uuid
        aggregator:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        name:
          type: string
        updated_at:
          type: string
          format: date-time
    IntegrationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Integration"
        next_cursor:
          type: string
          description: Absent on the last page.
    ConnectionInput:
      type: object
      additionalProperties: false
      required: [integration_id, external_id]
      properties:
        integration_id:
          type: string
          format: uuid
        external_id:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 60
    Connection:
      type: object
      required: [id, integration_id, external_id, state, name, provider_status, created_at, accounts]
      properties:
        id:
          type: string
          format: uuid
        integration_id:
          type: string
          format: uuid
        external_id:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [ok, needs_owner, failed, stalled, consent_expiring]
          description: |
            The aggregator-neutral reading of provider_status. stalled: the aggregator reports
            the item ready but the institution's data or the last sync is more than 72 hours
            old (A150). consent_expiring: the consent expires within 14 days (A151). An expired
            consent reads needs_owner (A146).
        provider_status:
          type: string
          description: The item status the aggregator reported, verbatim.
        portal:
          type: string
          description: The aggregator's site or app where the owner acts on the item; absent when the aggregator names none.
        last_item_update_at:
          type: string
          format: date-time
          description: When the aggregator last updated the item from the institution, as of the last sync; the ledger holds the data of this update.
        next_item_update_at:
          type: string
          format: date-time
          description: When the aggregator will next update the item, as the last check read it (A95). The owner cannot bring it forward.
        consent_expires_at:
          type: string
          format: date-time
          description: When the consent the owner gave the institution expires; absent when it does not expire (A151).
        last_synced_at:
          type: string
          format: date-time
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ExternalAccount"
    SyncResult:
      type: object
      required: [connection, batches]
      properties:
        connection:
          $ref: "#/components/schemas/Connection"
        batches:
          type: array
          items:
            $ref: "#/components/schemas/ImportBatch"
    InvestmentConfirmation:
      type: object
      description: brokerage_id is required for the first application of an investment and category_id for an income.
      properties:
        brokerage_id:
          type: string
          format: uuid
        cash_account_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          description: The income category of an income movement; required for it.
    InvestmentList:
      type: object
      required: [investments]
      properties:
        investments:
          type: array
          items:
            $ref: "#/components/schemas/ExternalInvestment"
    ExternalInvestment:
      type: object
      description: An investment of an item with its movements (A236 FC27).
      required:
        [id, name, type, subtype, issuer, index_id, percent_of_index_bp, spread_bp, has_terms, balance, balance_date, movements]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        subtype:
          type: string
          description: Empty when the aggregator's subtype has no equivalent.
        issuer:
          type: string
        index_id:
          type: string
          description: Empty when the rate has no index.
        percent_of_index_bp:
          type: integer
        spread_bp:
          type: integer
        has_terms:
          type: boolean
          description: False when the aggregator gave no rate to read the terms from.
        issued_on:
          type: string
          format: date
        matures_on:
          type: string
          format: date
        balance:
          $ref: "#/components/schemas/Money"
        balance_date:
          type: string
          format: date
        instrument:
          type: string
          description: The instrument of the application, absent until it is confirmed.
        brokerage_id:
          type: string
          format: uuid
        movements:
          type: array
          items:
            $ref: "#/components/schemas/InvestmentMovement"
    InvestmentMovement:
      type: object
      required: [id, investment_id, kind, date, amount, state, proposal]
      properties:
        id:
          type: string
          format: uuid
        investment_id:
          type: string
          format: uuid
        kind:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: buy, sell, income, tax, amortization or transfer.
        date:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        state:
          type: string
          enum: [pending, confirmed, dismissed]
        proposal:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: application, contribution, sale, income, tax_of_sale or none.
        taxes:
          $ref: "#/components/schemas/Money"
        transaction_id:
          type: string
          format: uuid
    SyncRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SyncRun"
    SyncRun:
      type: object
      description: One sync of a connection, manual or scheduled (A149).
      required: [sync_id, started_at, batches, records]
      properties:
        sync_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        batches:
          type: array
          items:
            $ref: "#/components/schemas/ImportBatch"
        records:
          type: array
          description: The records the run's summary lists, by date.
          items:
            $ref: "#/components/schemas/ExternalRecord"
    ConnectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        next_cursor:
          type: string
          description: Absent on the last page.
    ExternalAccount:
      type: object
      required: [id, type, subtype, name, currency, state]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        subtype:
          type: string
          description: |
            CHECKING_ACCOUNT, SAVINGS_ACCOUNT, CREDIT_CARD or RESERVED_BALANCE (a reserved
            balance of a bank account, outside its balance).
        name:
          type: string
        number_last4:
          type: string
          description: |
            Last four digits of the account number; the full number is never stored. Absent for
            RESERVED_BALANCE.
        currency:
          type: string
        state:
          type: string
          enum: [pending, mapped, ignored]
        account_id:
          type: string
          format: uuid
        sync_from:
          type: string
          format: date
        last_synced_on:
          type: string
          format: date
        gone_since:
          type: string
          format: date
          description: The date a listing of the item first lacked this account (A214).
    AccountMappingInput:
      type: object
      additionalProperties: false
      description: account_id with sync_from maps the account; ignored true leaves it out of syncs.
      properties:
        account_id:
          type: string
          format: uuid
        sync_from:
          type: string
          format: date
        ignored:
          type: boolean
    RecordResolution:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [match, create, discard]
        transaction_id:
          type: string
          format: uuid
          description: Required for match; one of the record's candidates.
    BulkResolveInput:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [record_id, resolution]
            properties:
              record_id:
                type: string
                format: uuid
              resolution:
                $ref: "#/components/schemas/RecordResolution"
    BulkResolveResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One result per item, in request order.
          items:
            $ref: "#/components/schemas/BulkResolveItemResult"
    BulkResolveItemResult:
      type: object
      required: [record_id, status]
      properties:
        record_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [resolved, validation_failed, not_found, record_resolved, group_changed, already_matched, transaction_voided, posting_reconciled]
    ExternalRecord:
      type: object
      required: [id, batch_id, account_id, date, amount, description, state, candidates]
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        external_id:
          type: string
        date:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
        state:
          type: string
          enum: [received, matched, created, needs_review, discarded, withdrawn]
        transaction_id:
          type: string
          format: uuid
        candidates:
          type: array
          description: Transactions the record may confirm, while it needs review.
          items:
            type: string
            format: uuid
        unapplied_change:
          type: string
          description: A change the aggregator reported that the ledger did not take (P6 amendment A36).
        decision:
          type: string
          enum: [linked, followed, withdrawn, re_identified, paired]
          description: The last automatic decision of a sync, present while POST /external-records/{id}/undo can revert it (A148, A220).
        review_reason:
          type: string
          enum: [ambiguous, probable, changed, repeated, group, reserve, duplicate, transfer]
          description: Why the record waits for review (A100, A102, A142, A168, A213, A215, A219).
        group_record_ids:
          type: array
          description: The other lines of the group, while review_reason is group (A168).
          items:
            type: string
            format: uuid
        scored_candidates:
          type: array
          description: The candidates as matching scored them, best first (A99, A100).
          items:
            $ref: "#/components/schemas/ScoredCandidate"
    UnconfirmedList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UnconfirmedEntry"
    UnconfirmedEntry:
      type: object
      required: [transaction_id, date, amount, description]
      properties:
        transaction_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: The date by which the institution reports the line.
        statement_id:
          type: string
          format: uuid
          description: The card statement of the posting.
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
        payee_id:
          type: string
          format: uuid
    ScoredCandidate:
      type: object
      required: [transaction_id, score, amount, date, counterparty]
      properties:
        transaction_id:
          type: string
          format: uuid
        score:
          type: integer
        amount:
          type: string
          enum: [identical, close, bounded]
        date:
          type: string
          enum: [same_day, near, far]
        counterparty:
          type: string
          enum: [same_payee, other_payee, similar_description, unknown]
    ExternalRecordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalRecord"
        next_cursor:
          type: string
          description: Absent on the last page.
    SyncSchedule:
      type: object
      additionalProperties: false
      required: [minutes]
      properties:
        minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1440
    CsvProfile:
      type: object
      additionalProperties: false
      required: [date_column, date_layout, decimal_separator, description_column]
      properties:
        delimiter:
          type: string
          enum: [comma, semicolon, tab, pipe]
        header_rows:
          type: integer
          minimum: 0
          maximum: 10
        date_column:
          type: string
          minLength: 1
          maxLength: 100
        date_layout:
          type: string
          pattern: '^(DD|MM|YYYY|YY)[/. -](DD|MM|YYYY|YY)[/. -](DD|MM|YYYY|YY)$'
          description: Order and separator of the date; day, month and year appear once each.
        amount_column:
          type: string
          minLength: 1
          maxLength: 100
        debit_column:
          type: string
          minLength: 1
          maxLength: 100
        credit_column:
          type: string
          minLength: 1
          maxLength: 100
        decimal_separator:
          type: string
          enum: [",", "."]
        description_column:
          type: string
          minLength: 1
          maxLength: 100
        id_column:
          type: string
          minLength: 1
          maxLength: 100
        amount_sign:
          type: string
          enum: [as_is, inverted]
          description: inverted flips the sign of every amount, for exports that list card charges as positive.
        encoding:
          type: string
          pattern: "^[a-z0-9_-]{2,40}$"
          default: auto
          description: Text encoding of the file. auto keeps valid UTF-8 and decodes anything else as windows-1252.
        group_separator:
          type: string
          pattern: "^[,. \u00a0']?$"
          description: Digit group separator of amounts; empty for none. Defaults to the one that is not decimal_separator.
        footer_rows:
          type: integer
          minimum: 0
          maximum: 10
          description: Rows under the data that are not lines of the statement.
        sign_column:
          type: string
          minLength: 1
          maxLength: 100
          description: Column that says whether a line is a debit. Needs debit_marker and amount_column.
        debit_marker:
          type: string
          minLength: 1
          maxLength: 40
          description: |
            The text that marks a debit, compared without case, in sign_column or, without one, in the
            letters after the number of the amount. A matching line is negative; any other keeps its sign.
    CsvColumnSample:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        header:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 200
          description: The header row; absent for a file without one.
        rows:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: array
            maxItems: 40
            items:
              type: string
              maxLength: 200
    CsvColumnSuggestion:
      type: object
      required: [date_column, description_column]
      description: Header names, or 1-based positions as text for a file without a header.
      properties:
        date_column:
          type: string
        description_column:
          type: string
        amount_column:
          type: string
        debit_column:
          type: string
        credit_column:
          type: string
        id_column:
          type: string
        sign_column:
          type: string
    ImportBatch:
      type: object
      description: One file import, or one sync of a mapped account (source aggregator).
      required: [id, account_id, source, counts, balance, started_at]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        source:
          type: string
          enum: [ofx, csv, aggregator]
        file_name:
          type: string
          description: Absent for a sync.
        external_account_id:
          type: string
          format: uuid
          description: The mapped account a sync read; absent for files and after its connection is deleted.
        sync_id:
          type: string
          format: uuid
          description: The sync run that made the batch; the batches of one run share it (A149). Absent for files.
        period_from:
          type: string
          format: date
        period_to:
          type: string
          format: date
        counts:
          $ref: "#/components/schemas/ImportCounts"
        read_empty:
          type: boolean
          description: Present and true when the date read returned no line while the account held records in the window; nothing was withdrawn (A146).
        balance:
          $ref: "#/components/schemas/ImportBalance"
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    ImportCounts:
      type: object
      description: |
        Records of the batch by outcome; received is the number of lines read. updated counts
        stored lines an aggregator changed (status, bill or amount); withdrawn counts stored
        lines it stopped returning (P6 amendments A36, A38). re_identified counts stored lines
        the institution line id joined to a new external id (A143).
      required: [received, ignored, matched, created, needs_review, discarded, updated, withdrawn, re_identified, paired]
      properties:
        received:
          type: integer
        ignored:
          type: integer
        matched:
          type: integer
        created:
          type: integer
        needs_review:
          type: integer
        discarded:
          type: integer
        updated:
          type: integer
        withdrawn:
          type: integer
        re_identified:
          type: integer
          description: Stored lines that took the external id of a line carrying their institution line id (A143).
        paired:
          type: integer
          description: Lines a sync paired with a transaction of another account of the book as a transfer (A220).
    ImportBalance:
      type: object
      description: The balance the file reports and what became of it (chapter 3, F4).
      required: [status]
      properties:
        status:
          type: string
          enum: [none, recorded, skipped]
        date:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
    ImportBatchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportBatch"
        next_cursor:
          type: string
          description: Absent on the last page.
    BackupStatus:
      type: object
      additionalProperties: false
      required: [backups, copy]
      properties:
        backups:
          $ref: "#/components/schemas/BackupState"
        copy:
          $ref: "#/components/schemas/CopyStatus"
    BackupState:
      type: object
      additionalProperties: false
      required: [state, periodic_at, pre_migration_at, late]
      properties:
        state:
          type: string
          enum: ["on", "off"]
        periodic_at:
          type: string
          format: date-time
          nullable: true
        pre_migration_at:
          type: string
          format: date-time
          nullable: true
        late:
          type: boolean
    CopyStatus:
      type: object
      additionalProperties: false
      required: [state, copied_at, file, late]
      properties:
        state:
          type: string
          enum: [folder_unset, password_unset, ok, folder_not_writable, failed]
        copied_at:
          type: string
          format: date-time
          nullable: true
        file:
          type: string
          nullable: true
        late:
          type: boolean
    CopyPasswordInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          maxLength: 1024
    UpdateCheckInput:
      type: object
      additionalProperties: false
      required: [update_check]
      properties:
        update_check:
          type: boolean
    VersionStatus:
      type: object
      additionalProperties: false
      required: [version, update_check, latest, newer, distribution]
      properties:
        version:
          type: string
        update_check:
          type: boolean
          nullable: true
        latest:
          $ref: "#/components/schemas/Release"
        newer:
          type: boolean
        distribution:
          description: >-
            The form of the instance, whose upgrade differs: compose for compose.yaml,
            managed for managed mode, other otherwise (A194).
          type: string
          enum: [compose, managed, other]
    Release:
      type: object
      nullable: true
      additionalProperties: false
      required: [version, url, checked_at]
      properties:
        version:
          type: string
        url:
          type: string
        checked_at:
          type: string
          format: date-time
    Diagnostic:
      type: object
      additionalProperties: false
      required: [generated_at, version, schema, go, os, arch, mode, postgres, environment, tables, backup, connections, outbox, log]
      properties:
        generated_at:
          type: string
          format: date-time
        version:
          type: string
        schema:
          type: object
          additionalProperties: false
          required: [database, binary]
          properties:
            database:
              type: integer
              format: int64
            binary:
              type: integer
              format: int64
        go:
          type: string
        os:
          type: string
        arch:
          type: string
        mode:
          type: string
          enum: [managed, external]
        postgres:
          type: object
          additionalProperties: false
          required: [version, locale_provider, locale]
          properties:
            version:
              type: string
            locale_provider:
              type: string
            locale:
              type: string
        environment:
          type: array
          items:
            type: string
        tables:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, rows]
            properties:
              name:
                type: string
              rows:
                type: integer
                format: int64
        backup:
          type: object
          additionalProperties: false
          required: [backups, copy]
          properties:
            backups:
              $ref: "#/components/schemas/BackupState"
            copy:
              type: object
              additionalProperties: false
              required: [state, copied_at, late]
              properties:
                state:
                  type: string
                copied_at:
                  type: string
                  format: date-time
                  nullable: true
                late:
                  type: boolean
        connections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, aggregator, state, last_update, failed]
            properties:
              id:
                type: string
                format: uuid
              aggregator:
                type: string
              state:
                type: string
              last_update:
                type: string
                format: date-time
                nullable: true
              failed:
                type: boolean
        outbox:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, pending, failed]
            properties:
              type:
                type: string
              pending:
                type: integer
                format: int64
              failed:
                type: integer
                format: int64
        log:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [time, level, message, attrs]
            properties:
              time:
                type: string
                format: date-time
              level:
                type: string
              message:
                type: string
              attrs:
                type: object
                additionalProperties:
                  type: string
    Attachment:
      type: object
      required: [id, transaction_id, file_name, media_type, size, sha256, created_at]
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        file_name:
          type: string
        media_type:
          type: string
        size:
