          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: Business-day calendar id from GET /calendars; defaults to the calendar of the owner's region.
        match_tolerance_bp:
          type: integer
          minimum: 0
          maximum: 10000
          default: 1000
        grace_days:
          type: integer
          minimum: 0
          maximum: 31
          default: 3
        match_window_days:
          type: integer
    ScheduleTerms:
