      operationId: listBatchRecords
      summary: The external records of a batch, in file order.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: state
          in: query
          schema:
            type: string
            enum: [received, matched, created, needs_review, discarded, withdrawn]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalRecordList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/unconfirmed:
    get:
      tags: [ingestion]
      operationId: listUnconfirmed
      summary: Entries of the account that no institution line confirmed (A103).
      description: |
        Postings without an external record, dated on or after the start of the account's lines
        from an institution (the mapping's start date, or the first imported file's period) and
        more than 10 days before the last synced date or the end of the last imported period,
        oldest first. An account without lines from an institution lists none.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnconfirmedList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /external-records/{id}/resolve:
    post:
      tags: [ingestion]
      operationId: resolveExternalRecord
      summary: Resolve a record that needs review.
      description: |
        match links the record to one of its candidates and clears that posting; create records a
        transaction against an uncategorized account; discard leaves the line out of the ledger.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordResolution"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalRecord"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /aggregators:
    get:
      tags: [ingestion]
      operationId: listAggregators
      summary: Aggregators this instance offers, with the credential fields each requires.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregatorList"
        "401":
          $ref: "#/components/responses/Problem"
  /integrations:
    get:
      tags: [ingestion]
      operationId: listIntegrations
      summary: Aggregator integrations, by name.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
