openapi: 3.0.3
info:
  title: equori API
  version: 0.1.0
  description: |
    Every endpoint under /api/v1 requires a session cookie except POST /api/v1/session.
    Errors use RFC 9457 problem details (docs/adr/004-api-errors.md).
servers:
  - url: /api/v1
tags:
  - name: identity
    description: Users and sessions.
  - name: ledger
    description: Accounts, transactions and balances.
  - name: reporting
    description: Derived views over the ledger.
  - name: marketdata
    description: Instruments and business-day calendars.
  - name: ingestion
    description: File imports, external records and their review.
paths:
  /session:
    post:
      tags: [identity]
      operationId: createSession
      summary: Log in and start a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "204":
          description: Session created.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [identity]
      operationId: deleteSession
      summary: Log out and end the current session.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "204":
          description: Session ended.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      summary: Return the authenticated user.
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
  /settings:
    get:
      tags: [ledger]
      operationId: getSettings
      summary: Return the ledger settings.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Problem"
    put:
      tags: [ledger]
      operationId: updateSettings
      summary: Change the base currency; allowed only before the first transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /institutions:
    get:
      tags: [ledger]
      operationId: listInstitutions
      summary: List institutions.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createInstitution
      summary: Create an institution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionInput"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /payees:
    get:
      tags: [ledger]
      operationId: listPayees
      summary: List payees.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayeeList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createPayee
      summary: Create a payee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayeeInput"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payee"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /tags:
    get:
      tags: [ledger]
      operationId: listTags
      summary: List tags in use.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "401":
          $ref: "#/components/responses/Problem"
  /accounts:
    get:
      tags: [ledger]
      operationId: listAccounts
      summary: List accounts, categories included.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createAccount
      summary: Create an account or category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: OK.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}:
    get:
      tags: [ledger]
      operationId: getAccount
      summary: Return an account.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [ledger]
      operationId: updateAccount
      summary: Rename or move an account.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/close:
    post:
      tags: [ledger]
      operationId: closeAccount
      summary: Close an account with zero balance.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseAccountInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/balance:
    get:
      tags: [ledger]
      operationId: getAccountBalance
      summary: Balance of an account at the end of a date.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: basis
          in: query
          required: false
          schema:
            type: string
            enum: [booked, settled]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /transactions:
    get:
      tags: [ledger]
      operationId: listTransactions
      summary: List transactions, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: account_id
          in: query
          schema:
            type: string
            format: uuid
        - name: payee_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createTransaction
      summary: Record a transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: OK.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}:
    get:
      tags: [ledger]
      operationId: getTransaction
      summary: Return a transaction.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [ledger]
      operationId: correctTransaction
      summary: Correct a transaction; creates a new version.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectionInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/void:
    post:
      tags: [ledger]
      operationId: voidTransaction
      summary: Void a transaction; it stays in history.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/versions:
    get:
      tags: [ledger]
      operationId: listTransactionVersions
      summary: Previous versions of a transaction.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionVersionList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /reports/balances:
    get:
      tags: [reporting]
      operationId: getBalanceSeries
      summary: Daily balance of an account and its sub-accounts, one item per day in [from, to].
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: basis
          in: query
          required: false
          schema:
            type: string
            enum: [booked, settled]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSeries"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /calendars/{name}/holidays:
    get:
      tags: [marketdata]
      operationId: listHolidays
      summary: Non-business days of a calendar in a year, weekends excluded.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1900
            maximum: 2200
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HolidayList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/billing-cycle-rules:
    get:
      tags: [ledger]
      operationId: listBillingCycleRules
      summary: Billing cycle rule versions of a card.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCycleRuleList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createBillingCycleRule
      summary: Add a billing cycle rule version, effective from a reference month.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCycleRule"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCycleRule"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/credit-limits:
    get:
      tags: [ledger]
      operationId: listCreditLimits
      summary: Credit limit versions of a card.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLimitList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createCreditLimit
      summary: Add a credit limit version.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditLimit"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLimit"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/cards:
    get:
      tags: [ledger]
      operationId: listCards
      summary: Physical and virtual cards of a card account.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createCard
      summary: Add a card.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/statements:
    get:
      tags: [ledger]
      operationId: listStatements
      summary: Statements of a card with amounts and status derived from its postings.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: from
          in: query
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
        - name: to
          in: query
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /statements/{id}:
    get:
      tags: [ledger]
      operationId: getStatement
      summary: A statement with its postings.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /installment-purchases:
    post:
      tags: [ledger]
      operationId: createInstallmentPurchase
      summary: Record a card purchase in installments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallmentPurchaseInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentPurchase"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/commitments:
    get:
      tags: [ledger]
      operationId: getCommitment
      summary: Installments not yet billed on the statement of a month.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /statements/{id}/payments:
    post:
      tags: [ledger]
      operationId: payStatement
      summary: Pay a statement from a balance account.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementPaymentInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /statements/{id}/financing:
    post:
      tags: [ledger]
      operationId: financeStatement
      summary: Convert the unpaid amount of a closed statement into installments.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementFinancingInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallmentPurchase"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/refunds:
    post:
      tags: [ledger]
      operationId: refundTransaction
      summary: Refund all or part of a card purchase.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /installment-plans/{id}/cancellation:
    post:
      tags: [ledger]
      operationId: cancelInstallmentPlan
      summary: Cancel an installment purchase.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /installment-plans/{id}/anticipation:
    post:
      tags: [ledger]
      operationId: anticipateInstallments
      summary: Pay future installments early.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnticipationInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/disputes:
    post:
      tags: [ledger]
      operationId: openDispute
      summary: Open a dispute on a card purchase.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /disputes/{id}/resolve:
    post:
      tags: [ledger]
      operationId: resolveDispute
      summary: Resolve a dispute; a won dispute refunds the remaining charged amount.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeResolution"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/balance-assertions:
    get:
      tags: [ledger]
      operationId: listBalanceAssertions
      summary: Balances reported by the institution for a leaf balance account.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceAssertionList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createBalanceAssertion
      summary: Record the institution's balance and reconcile the account when it matches.
      description: |
        The difference is the asserted amount minus the settled balance at the date. Zero reconciles
        the account; a positive difference on an account with yield mode auto records yield and
        reconciles; any other difference stays open.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAssertionInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssertionResult"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /balance-assertions/{id}/resolve:
    post:
      tags: [ledger]
      operationId: resolveBalanceAssertion
      summary: Resolve the open difference of an assertion and reconcile the account.
      description: |
        adjustment records the difference against the equity account Adjustments; transactions_added
        requires the settled balance to match the assertion after the missing transactions were recorded.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssertionResolutionInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssertionResult"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/reconciliation:
    get:
      tags: [ledger]
      operationId: getReconciliationStatus
      summary: Last reconciliation date and the open difference of the latest assertion.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/unlock:
    post:
      tags: [ledger]
      operationId: unlockAccount
      summary: Return reconciled postings settled on or after a date to cleared.
      description: Deletes the account's reconciliations dated on or after the date (P3 amendment A8).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /statements/{id}/reconcile:
    post:
      tags: [ledger]
      operationId: reconcileStatement
      summary: Confirm the institution's amount due for a closed statement.
      description: |
        An amount equal to the derived amount due marks the statement's postings reconciled
        (P3 amendment A7); a different amount returns difference_remains.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementReconciliationInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/attachments:
    get:
      tags: [ledger]
      operationId: listAttachments
      summary: Files attached to a transaction.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createAttachment
      summary: Attach a file to a transaction.
      description: |
        At most 10 MiB of content (N26); the request body limit of this route is 11 MiB. Accepted media
        types, detected from the content: application/pdf, image/jpeg, image/png, image/webp, text/plain.
        A file already attached to the transaction returns the existing attachment.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /attachments/{id}:
    delete:
      tags: [ledger]
      operationId: deleteAttachment
      summary: Remove an attachment; the stored file is deleted when no attachment references it.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /attachments/{id}/content:
    get:
      tags: [ledger]
      operationId: getAttachmentContent
      summary: Download the attached file.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The file, with its stored media type.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /import-batches:
    get:
      tags: [ingestion]
      operationId: listImportBatches
      summary: Import batches, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchList"
        "401":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/csv-profile:
    get:
      tags: [ingestion]
      operationId: getCsvProfile
      summary: How the CSV files of the account are read.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvProfile"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [ingestion]
      operationId: saveCsvProfile
      summary: Set how the CSV files of the account are read (P4 amendment A13).
      description: |
        Columns are header names, or 1-based positions when header_rows is 0. Set amount_column, or
        debit_column and credit_column. Defaults: delimiter comma, header_rows 1, amount_sign as_is.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvProfile"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvProfile"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/imports:
    post:
      tags: [ingestion]
      operationId: importFile
      summary: Import an OFX or CSV statement into a balance account.
      description: |
        Each line is deduplicated (I10), matched to an existing transaction of the account with the
        same amount within 3 days, or created against an uncategorized account; ambiguous matches
        wait for review. A file balance becomes a balance assertion (chapter 3, F4). At most 10 MiB
        (P4 amendment A16); a CSV file needs the account's CSV profile.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [format, file]
              properties:
                format:
                  type: string
                  enum: [ofx, csv]
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /import-batches/{id}:
    get:
      tags: [ingestion]
      operationId: getImportBatch
      summary: One import batch with its counts.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: equori_session
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    SessionCookie:
      name: equori_session
      in: cookie
      required: false
      schema:
        type: string
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CsvProfile:
      type: object
      additionalProperties: false
      required: [date_column, date_layout, decimal_separator, description_column]
      properties:
        delimiter:
          type: string
          enum: [comma, semicolon, tab, pipe]
        header_rows:
          type: integer
          minimum: 0
          maximum: 10
        date_column:
          type: string
          minLength: 1
          maxLength: 100
        date_layout:
          type: string
          enum: [DD/MM/YYYY, YYYY-MM-DD, MM/DD/YYYY]
        amount_column:
          type: string
          minLength: 1
          maxLength: 100
        debit_column:
          type: string
          minLength: 1
          maxLength: 100
        credit_column:
          type: string
          minLength: 1
          maxLength: 100
        decimal_separator:
          type: string
          enum: [",", "."]
        description_column:
          type: string
          minLength: 1
          maxLength: 100
        id_column:
          type: string
          minLength: 1
          maxLength: 100
        amount_sign:
          type: string
          enum: [as_is, inverted]
          description: inverted flips the sign of every amount, for exports that list card charges as positive.
    ImportBatch:
      type: object
      required: [id, account_id, source, file_name, counts, balance, started_at]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        source:
          type: string
          enum: [ofx, csv]
        file_name:
          type: string
        period_from:
          type: string
          format: date
        period_to:
          type: string
          format: date
        counts:
          $ref: "#/components/schemas/ImportCounts"
        balance:
          $ref: "#/components/schemas/ImportBalance"
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    ImportCounts:
      type: object
      description: Records of the file by outcome; received is the number of lines read.
      required: [received, ignored, matched, created, needs_review, discarded]
      properties:
        received:
          type: integer
        ignored:
          type: integer
        matched:
          type: integer
        created:
          type: integer
        needs_review:
          type: integer
        discarded:
          type: integer
    ImportBalance:
      type: object
      description: The balance the file reports and what became of it (chapter 3, F4).
      required: [status]
      properties:
        status:
          type: string
          enum: [none, recorded, skipped]
        date:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
    ImportBatchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportBatch"
        next_cursor:
          type: string
          description: Absent on the last page.
    Attachment:
      type: object
      required: [id, transaction_id, file_name, media_type, size, sha256, created_at]
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        file_name:
          type: string
        media_type:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
          description: Hexadecimal SHA-256 of the content.
        created_at:
          type: string
          format: date-time
    AttachmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        next_cursor:
          type: string
          description: Absent on the last page.
    StatementReconciliationInput:
      type: object
      additionalProperties: false
      required: [amount_due]
      properties:
        amount_due:
          $ref: "#/components/schemas/Money"
    AssertionResolutionInput:
      type: object
      additionalProperties: false
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [adjustment, transactions_added]
    ReconciliationStatus:
      type: object
      properties:
        last_reconciled_on:
          type: string
          format: date
        open_difference:
          $ref: "#/components/schemas/OpenDifference"
    OpenDifference:
      type: object
      required: [assertion_id, date, difference]
      properties:
        assertion_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        difference:
          $ref: "#/components/schemas/Money"
    UnlockInput:
      type: object
      additionalProperties: false
      required: [from]
      properties:
        from:
          type: string
          format: date
    BalanceAssertionInput:
      type: object
      additionalProperties: false
      required: [date, amount]
      properties:
        date:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        source:
          type: string
          enum: [manual, import, open_finance]
    BalanceAssertion:
      type: object
      required: [id, account_id, date, amount, source, recorded_at, reconciled]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        source:
          type: string
          enum: [manual, import, open_finance]
        recorded_at:
          type: string
          format: date-time
        reconciled:
          type: boolean
    BalanceAssertionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BalanceAssertion"
        next_cursor:
          type: string
          description: Absent on the last page.
    AssertionResult:
      type: object
      required: [assertion, difference]
      properties:
        assertion:
          $ref: "#/components/schemas/BalanceAssertion"
        difference:
          $ref: "#/components/schemas/Money"
        resolution:
          type: string
          enum: [none, yield, adjustment, transactions_added]
          description: Absent while the difference stays open.
        resolution_transaction_id:
          type: string
          format: uuid
          description: The yield or adjustment transaction recorded by the resolution.
    DisputeInput:
      type: object
      additionalProperties: false
      required: [opened_on]
      properties:
        opened_on:
          type: string
          format: date
    DisputeResolution:
      type: object
      additionalProperties: false
      required: [resolved_on, outcome]
      properties:
        resolved_on:
          type: string
          format: date
        outcome:
          type: string
          enum: [won, lost]
        statement:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
    Dispute:
      type: object
      required: [id, transaction_id, opened_on]
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        opened_on:
          type: string
          format: date
        resolved_on:
          type: string
          format: date
        outcome:
          type: string
          enum: [won, lost]
        refund_transaction_id:
          type: string
          format: uuid
    RefundInput:
      type: object
      additionalProperties: false
      required: [date, amount]
      properties:
        date:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        statement:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
    CancellationInput:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date:
          type: string
          format: date
        credit_statement:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
    AnticipationInput:
      type: object
      additionalProperties: false
      required: [date, from_installment, to_installment, target_statement, amount]
      properties:
        date:
          type: string
          format: date
        from_installment:
          type: integer
          minimum: 1
          maximum: 420
        to_installment:
          type: integer
          minimum: 1
          maximum: 420
        target_statement:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        amount:
          $ref: "#/components/schemas/Money"
    StatementPaymentInput:
      type: object
      additionalProperties: false
      required: [date, from_account_id, amount]
      properties:
        date:
          type: string
          format: date
        from_account_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
    StatementFinancingInput:
      type: object
      additionalProperties: false
      required: [date, installment_count, installment_amount]
      properties:
        date:
          type: string
          format: date
        installment_count:
          type: integer
          minimum: 2
          maximum: 420
        installment_amount:
          $ref: "#/components/schemas/Money"
    Split:
      type: object
      additionalProperties: false
      required: [account_id, amount]
      properties:
        account_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
    InstallmentPurchaseInput:
      type: object
      additionalProperties: false
      required: [card_account_id, date, splits, installment_count]
      properties:
        card_account_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 500
        payee_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 60
        splits:
          type: array
          items:
            $ref: "#/components/schemas/Split"
          minItems: 1
          maxItems: 500
        installment_count:
          type: integer
          minimum: 2
          maximum: 420
        interest:
          $ref: "#/components/schemas/Money"
        first_statement:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        installment_amounts:
          type: array
          items:
            $ref: "#/components/schemas/Money"
          maxItems: 420
    InstallmentPurchase:
      type: object
      required: [transaction, plan_id]
      properties:
        transaction:
          $ref: "#/components/schemas/Transaction"
        plan_id:
          type: string
          format: uuid
    Commitment:
      type: object
      required: [month, amount]
      properties:
        month:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    StatementSummary:
      type: object
      required: [id, account_id, reference, closing_date, due_date, opening, charges, credits, amount_due, payments, unpaid, status, reconciled]
      description: Amounts are positive when owed by the user.
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        reference:
          type: string
        closing_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        opening:
          $ref: "#/components/schemas/Money"
        charges:
          $ref: "#/components/schemas/Money"
        credits:
          $ref: "#/components/schemas/Money"
        amount_due:
          $ref: "#/components/schemas/Money"
        payments:
          $ref: "#/components/schemas/Money"
        unpaid:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [open, closed, paid, partially_paid, overdue, financed]
        reconciled:
          type: boolean
          description: The institution's amount due was confirmed (POST /statements/{id}/reconcile).
