        due_on:
          type: string
          format: date
        account_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
    Goal:
      type: object
      required: [id, name, target, due_on, account_ids, current, remaining, progress_bp]
      description: |
        current is the sum of the booked balances of the accounts today, valued in the target currency with
        stored prices (P8 amendment A72); remaining is max(target - current, 0); progress_bp is current / target
        in basis points, rounded down, between 0 and 10000.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        target:
          $ref: "#/components/schemas/Money"
        due_on:
          type: string
          format: date
        account_ids:
          type: array
          items:
            type: string
            format: uuid
        current:
          $ref: "#/components/schemas/Money"
        remaining:
          $ref: "#/components/schemas/Money"
        progress_bp:
          type: integer
        prices:
          type: array
          description: Prices that value accounts in another currency (P8 amendment A72).
          items:
            $ref: "#/components/schemas/Price"
        parts:
          type: array
          description: |
            What current is made of: for each goal account, each instrument held in it and its sub-accounts with a
            non-zero quantity, in instrument order, valued in the target currency (P8 amendment A121).
          items:
            $ref: "#/components/schemas/GoalPart"
        trailing_return:
          $ref: "#/components/schemas/TrailingReturn"
    TrailingReturn:
      type: object
      required: [period_months, annual_bp]
      description: |
        The money-weighted return of the goal's accounts, taken as one tree, over the last 12 months or since their
        first posting if shorter, valued in the target currency (investments design 4.4). Absent with less than three
        months of postings or no external flow in the window.
      properties:
        period_months:
          type: integer
        annual_bp:
          type: integer
    GoalPart:
