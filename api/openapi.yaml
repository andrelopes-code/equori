          enum: [set_category, set_payee, add_tags, split, transfer, mark_reimbursable]
        category_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
          description: Target of transfer (an asset or liability account) and mark_reimbursable (a receivable), P5b amendment A31.
        payee_id:
          type: string
          format: uuid
        tags:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            pattern: '^[\p{Ll}\p{Lm}\p{Lo}\p{N}][\p{Ll}\p{Lm}\p{Lo}\p{N}-]{0,59}$'
        parts:
          type: array
          minItems: 2
          maxItems: 10
