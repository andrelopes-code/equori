openapi: 3.0.3
info:
  title: equori API
  version: 0.1.0
  description: |
    Each operation declares x-book-role. public needs no session; read, write and owner need a
    session whose role in the active book ranks at least as high (read < write < owner). A lower
    role is 403 book_role_required (ADR 029, HA9).
    Errors use RFC 9457 problem details (docs/adr/004-api-errors.md).
servers:
  - url: /api/v1
tags:
  - name: identity
    description: Members and sessions.
  - name: ledger
    description: Accounts, transactions and balances.
  - name: reporting
    description: Derived views over the ledger.
  - name: portfolio
    description: Positions, realized results and income events derived from Ledger (P8 amendment A71).
  - name: marketdata
    description: Instruments, prices and business-day calendars.
  - name: ingestion
    description: File imports, aggregator integrations and connections, external records and their review.
  - name: instance
    description: Backups, the encrypted copy, the diagnostic file and the version notice of the instance.
  - name: classification
    description: Categorization rules, payee aliases, suggestions and categorization methods.
  - name: planning
    description: Schedules and their occurrences, budgets, goals, projections and committed amounts.
  - name: capture
    description: Transaction drafts read from text the owner writes.
  - name: assistant
    description: Language model providers of each book and the chain of each use (ADR 019).
paths:
  /session:
    post:
      tags: [identity]
      operationId: createSession
      x-book-role: public
      summary: Log in; a member with a second factor receives 202 and finishes with completeSecondFactor (HA46).
      security: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "202":
          description: The password is right and the member has a second factor; the cookie equori_login holds the pending login for 5 minutes.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactorChallenge"
        "204":
          description: Session created.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [identity]
      operationId: deleteSession
      x-book-role: read
      summary: Log out and end the current session.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "204":
          description: Session ended.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /setup:
    get:
      tags: [identity]
      operationId: getSetup
      x-book-role: public
      summary: Report whether the first member is still to be created (ADR 003, amendment of 2026-10-27).
      security: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      tags: [identity]
      operationId: completeSetup
      x-book-role: public
      summary: Create the first member, an admin, with the setup token, and start a session.
      description: |
        The token is the one serve logs and writes to setup.url while no member exists. A token
        that differs is 403 setup_token_invalid; once a member exists, 409 setup_complete. Without
        base_currency the default of the region applies; a region without one is 422 on
        base_currency. update_check answers the question of P13 A159.1. Without books_name the book
        is named after the email; a time_zone that is not an IANA time zone name is 422
        time_zone_invalid, and one equal to the region's default is stored as null.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: First member created and signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      x-book-role: read
      summary: Return the authenticated member.
      responses:
        "200":
          description: Authenticated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [identity]
      operationId: updateCurrentUser
      x-book-role: read
      summary: Change the language or the display name of the authenticated member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /me/appearance:
    get:
      tags: [identity]
      operationId: getMemberAppearance
      x-book-role: read
      summary: Return the appearance choices of the authenticated member (ADR 029 BK21).
      responses:
        "200":
          description: Stored choices; an empty object before the first save.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"
        "401":
          $ref: "#/components/responses/Problem"
    put:
      tags: [identity]
      operationId: setMemberAppearance
      x-book-role: read
      summary: Replace the appearance choices of the authenticated member.
      description: |
        Any JSON object is stored; 422 appearance_too_large when its encoding is over 16 KiB. The
        web validates each value when it reads them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Appearance"
      responses:
        "200":
          description: Stored choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /books/current:
    get:
      tags: [identity]
      operationId: getCurrentBooks
      x-book-role: read
      summary: Return the settings of the active book (ADR 029 BK22).
      responses:
        "200":
          description: Settings of the active book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksSettings"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [identity]
      operationId: updateCurrentBooks
      x-book-role: owner
      summary: Change the name, the region and the time zone of the active book.
      description: |
        A null time_zone restores the region's default. 422 time_zone_invalid when time_zone is not
        an IANA time zone name; 422 validation_failed when region is not an ISO 3166-1 alpha-2 code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooksSettingsInput"
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksSettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [identity]
      operationId: deleteCurrentBooks
      x-book-role: owner
      summary: Delete the active book with all its data; the session ends with it (DB1).
      description: |
        The body repeats the book name; a different value is 422 confirmation_mismatch. 409
        books_has_members while another member belongs to the book; 409 last_books while the book is
        the only one of a member, because that member could not sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteBooksInput"
      responses:
        "204":
          description: Deleted; the session cookie is cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /me/books:
    get:
      tags: [identity]
      operationId: listMyBooks
      x-book-role: read
      summary: List the books of the member's memberships (HA5).
      responses:
        "200":
          description: Memberships, by books ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksMembershipList"
        "401":
          $ref: "#/components/responses/Problem"
  /books:
    post:
      tags: [identity]
      operationId: createBooks
      x-book-role: read
      summary: Create a book with the member as owner; the session stays in its book (HA6).
      description: |
        Without name the book takes the member's email; without base_currency, the default of the
        region; a region without one is 422 on base_currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBooksInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksMembership"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /session/books:
    put:
      tags: [identity]
      operationId: switchBooks
      x-book-role: read
      summary: Move the current session to another book of the member (HA4).
      description: A books ID without a membership of the member is 404 books_not_found.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchBooksInput"
      responses:
        "204":
          description: Switched.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /books/current/members:
    get:
      tags: [identity]
      operationId: listMembers
      x-book-role: read
      summary: List the memberships of the active book (HA19).
      responses:
        "200":
          description: Memberships, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksMemberList"
        "401":
          $ref: "#/components/responses/Problem"
  /books/current/members/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags: [identity]
      operationId: updateMember
      x-book-role: owner
      summary: Change the role of a membership of the active book (HA20).
      description: 404 member_not_found for a member without a membership in the book; 409 last_owner when the book would keep no owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleInput"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [identity]
      operationId: removeMember
      x-book-role: owner
      summary: Remove a membership of the active book with its sessions, access tokens and conversations (HA20, HA22).
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /books/current/membership:
    delete:
      tags: [identity]
      operationId: leaveBooks
      x-book-role: read
      summary: Remove the caller's membership of the active book; the session ends with it (HA20).
      responses:
        "204":
          description: Left; the session cookie is cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /books/current/invitations:
    get:
      tags: [identity]
      operationId: listInvitations
      x-book-role: owner
      summary: List the pending invitations of the active book, without tokens (HA24).
      responses:
        "200":
          description: Pending invitations, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      tags: [identity]
      operationId: createInvitation
      x-book-role: owner
      summary: Invite an email to the active book; the answer holds the token once (HA24).
      description: 409 already_member when the email has a membership in the book; 422 validation_failed on email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Created; token is shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /books/current/invitations/{id}:
    delete:
      tags: [identity]
      operationId: deleteInvitation
      x-book-role: owner
      summary: Revoke a pending invitation of the active book.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /account-invitations:
    post:
      tags: [identity]
      operationId: createAccountInvitation
      x-book-role: read
      summary: Invite an email to an account with a book of its own; instance admin only.
      description: |
        The answer holds the token once. The new member chooses its password when it accepts the
        invitation. Without base_currency, the default of the region; a region without one is 422
        on base_currency. 403 admin_required for a member; 409 email_taken when a member has the
        email; 422 validation_failed on email or region.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInvitationInput"
      responses:
        "201":
          description: Created; token is shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /invitations/preview:
    post:
      tags: [identity]
      operationId: previewInvitation
      x-book-role: public
      summary: Describe the invitation of a token (HA25).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationToken"
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /invitations/accept:
    post:
      tags: [identity]
      operationId: acceptInvitation
      x-book-role: public
      summary: Accept an invitation (HA26).
      description: |
        Without a member of the invited email, password and language create one and the answer
        sets a session in the book. With such a member, the request needs that member's session,
        which moves to the book: 401 unauthenticated without it, 403 invitation_email_mismatch
        with another member's, 409 already_member when the membership exists.
      security: []
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationInput"
      responses:
        "204":
          description: Accepted.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /access-tokens:
    get:
      tags: [identity]
      operationId: listAccessTokens
      x-book-role: read
      summary: The book's personal access tokens for MCP, newest first, without their text.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [identity]
      operationId: createAccessToken
      x-book-role: read
      summary: Create a personal access token that opens /mcp only; the answer holds its text once.
      description: |
        422 validation_failed when the name is empty or over 80 characters, the scope is not read or
        write, or expires_in_days is not 30, 90 or 365.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenInput"
      responses:
        "201":
          description: Created; token is shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /access-tokens/{id}:
    delete:
      tags: [identity]
      operationId: deleteAccessToken
      x-book-role: read
      summary: Delete a personal access token; it stops working at once.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /me/second-factor:
    get:
      tags: [identity]
      operationId: getSecondFactor
      x-book-role: read
      summary: The member's second factors (HA39).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactor"
        "401":
          $ref: "#/components/responses/Problem"
  /me/totp:
    post:
      tags: [identity]
      operationId: startTotp
      x-book-role: read
      summary: Store a new unconfirmed TOTP secret and return it once (HA35).
      description: |
        Replaces an unconfirmed secret. 409 totp_enabled when a confirmed secret exists; 409
        secret_key_missing when the server has no EQUORI_SECRET_KEY.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /me/totp/confirm:
    post:
      tags: [identity]
      operationId: confirmTotp
      x-book-role: read
      summary: Confirm the TOTP secret with a code of the app (HA35, HA37).
      description: |
        422 totp_code_invalid for a wrong code or without a secret to confirm. When no second factor
        existed, the answer holds 10 recovery codes, shown only here, and the member's other sessions
        end; otherwise the list is empty.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeInput"
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /me/totp/disable:
    post:
      tags: [identity]
      operationId: disableTotp
      x-book-role: read
      summary: Delete the TOTP secret; the recovery codes go with the last factor (HA35, HA37).
      description: 403 password_invalid for a wrong password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInput"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /me/recovery-codes:
    post:
      tags: [identity]
      operationId: regenerateRecoveryCodes
      x-book-role: read
      summary: Replace every recovery code; the answer holds them once (HA37).
      description: 403 password_invalid for a wrong password; 409 second_factor_missing without a second factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInput"
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /me/passkeys/options:
    post:
      tags: [identity]
      operationId: createPasskeyOptions
      x-book-role: read
      summary: Start a passkey registration; the challenge lasts 5 minutes (HA44).
      description: 422 passkey_invalid without an http or https Origin.
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /me/passkeys:
    post:
      tags: [identity]
      operationId: createPasskey
      x-book-role: read
      summary: Register a passkey on the host of the request (HA41 to HA44).
      description: |
        422 passkey_invalid when a check fails or the challenge is missing or expired. When no
        second factor existed, the answer holds 10 recovery codes, shown only here, and the member's
        other sessions end; otherwise the list is empty.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyInput"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
