          format: date
        total:
          $ref: "#/components/schemas/Money"
        minimum:
          $ref: "#/components/schemas/Money"
    StatementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StatementSummary"
        next_cursor:
          type: string
          description: Absent on the last page.
    StatementPosting:
      type: object
      required: [transaction_id, date, description, card_role, amount, provisional]
      properties:
        transaction_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
        card_role:
          type: string
          enum: [charge, credit, payment]
        amount:
          $ref: "#/components/schemas/Money"
        installment:
          $ref: "#/components/schemas/Installment"
        provisional:
          type: boolean
          description: >-
            The institution may still bill the posting on another statement: no line stated its bill,
            the statement is not reconciled and the posting is dated within 10 days before the closing
            date (A136).
    StatementDetail:
      allOf:
        - $ref: "#/components/schemas/StatementSummary"
        - type: object
          required: [postings]
          properties:
            postings:
              type: array
              items:
                $ref: "#/components/schemas/StatementPosting"
            difference_proposal:
              $ref: "#/components/schemas/DifferenceProposal"
            rounding_difference:
              type: boolean
              description: >-
                Present and true when no set of provisional postings explains amount_difference and the
                difference is at most one minor unit per posting: the source likely rounded a line (A137).
    DifferenceProposal:
      type: object
      required: [transaction_ids, amount]
      description: >-
        On a closed statement whose amount due differs from the institution's total, the provisional
        postings whose move to the next statement closes the difference (A137).
      properties:
        transaction_ids:
          type: array
          items:
            type: string
            format: uuid
        amount:
          $ref: "#/components/schemas/Money"
    DeferPostingsInput:
      type: object
      additionalProperties: false
      required: [transaction_ids]
      properties:
        transaction_ids:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
    BillingCycleRule:
      type: object
      additionalProperties: false
      required: [effective_from, due_day]
      description: >-
        closing_mode day closes on closing_day; before_due closes closing_days_before_due days before
        the nominal due date. closing_adjustment shifts the closing date, projected or reported by the
        institution, on the rule's calendar (A87).
      properties:
        effective_from:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          description: Reference month (YYYY-MM) from which the rule applies.
        closing_mode:
          type: string
          enum: [day, before_due]
        closing_day:
          type: integer
          minimum: 1
          maximum: 31
        closing_days_before_due:
          type: integer
          minimum: 1
          maximum: 28
        closing_adjustment:
          type: string
          enum: [none, following, preceding, modified_following]
        due_day:
          type: integer
          minimum: 1
          maximum: 31
        closing_day_assignment:
          type: string
          enum: [next, closing]
        due_date_adjustment:
          type: string
          enum: [none, following, preceding, modified_following]
        calendar:
          type: string
          description: Business-day calendar id from GET /calendars; defaults to the calendar of the owner's region.
    StatementPlacement:
      type: object
      additionalProperties: false
      required: [reference, closing_date, due_date]
      description: previous_closing_date and previous_due_date are the dates of the statement before, present when a rule or a stored statement gives them.
      properties:
        previous_closing_date:
          type: string
          format: date
        previous_due_date:
          type: string
          format: date
        reference:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        closing_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
    BillingCycleRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BillingCycleRule"
    CreditLimit:
      type: object
      additionalProperties: false
      required: [effective_from, amount]
      properties:
        effective_from:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
    CreditLimitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreditLimit"
    CardInput:
      type: object
      additionalProperties: false
      required: [holder, last_four]
      properties:
        holder:
          type: string
          minLength: 1
          maxLength: 120
        last_four:
          type: string
          pattern: "^[0-9]{4}$"
        virtual:
          type: boolean
        foreign_charge_bp:
          type: integer
          minimum: 0
          maximum: 10000
          description: Default from the region of the owner.
    Card:
      allOf:
        - $ref: "#/components/schemas/CardInput"
        - type: object
          required: [id, active, foreign_charge_bp]
          properties:
            foreign_charge_bp:
              type: integer
              minimum: 0
              maximum: 10000
            id:
              type: string
              format: uuid
            active:
              type: boolean
    CardUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        holder:
          type: string
          minLength: 1
          maxLength: 120
        last_four:
          type: string
          pattern: "^[0-9]{4}$"
        active:
          type: boolean
    CardList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Card"
    CardSummary:
      type: object
      properties:
        credit_limit:
          $ref: "#/components/schemas/Money"
        available_limit:
          $ref: "#/components/schemas/Money"
    CalendarList:
      type: object
      required: [items, default]
      properties:
        default:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: Calendar id the owner's region gives a new record (ADR 016).
        items:
          type: array
          items:
            $ref: "#/components/schemas/Calendar"
    Calendar:
      type: object
      additionalProperties: false
      required: [id, weekend]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        weekend:
          type: array
          items:
            type: string
            enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
    HolidayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Holiday"
    Index:
      type: object
      additionalProperties: false
      required: [id, period, first, last, expected]
      properties:
        id:
          type: string
        expected:
          type: boolean
          description: An enabled expectation source stored points for the index (ADR 026 E5).
        period:
          type: string
          enum: [day, month]
          description: The span one rate covers.
        first:
          type: string
          format: date
        last:
          type: string
          format: date
    IndexList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Index"
    IndexExpectations:
      type: object
      additionalProperties: false
      required: [survey_date, items]
      properties:
        survey_date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: "#/components/schemas/IndexExpectation"
    IndexExpectation:
      type: object
      additionalProperties: false
      required: [date, rate]
      properties:
        date:
          type: string
          format: date
        rate:
          type: string
          description: Expected annual rate of the index on the date, an exact decimal fraction (0.1315 is 13.15%).
          example: "0.131500000000"
    MarketDataFeed:
      type: object
      additionalProperties: false
      required: [id, kind, enabled, suggested, last, stale, last_run, error]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        kind:
          type: string
          enum: [price, index, expectation]
        enabled:
          type: boolean
        suggested:
          type: boolean
          description: Suggested for the calling book's region (ADR 025 F3); a suggestion enables nothing.
        last:
          type: string
          format: date
          nullable: true
          description: The latest date the feed stored.
        stale:
          type: boolean
          description: Enabled, and its next publication is overdue (ADR 025 F9).
        last_run:
          type: string
          format: date-time
          nullable: true
          description: The last tick that ran the feed since the process started.
        error:
          type: string
          nullable: true
          description: The failure of that tick, null when it succeeded.
    MarketDataFeedList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketDataFeed"
    MarketDataFeedInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    IndexRate:
      type: object
      additionalProperties: false
      required: [date, rate]
      properties:
        date:
          type: string
          format: date
          description: The date the rate is published for; the first day of the month for a monthly index.
        rate:
          type: string
          description: Exact decimal fraction, negative when the index fell (0.0042 is 0.42%).
          example: "0.004200000000"
    IndexRateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IndexRate"
    InstrumentType:
      type: string
      enum: [currency, stock, etf, reit, depositary_receipt, fixed_income, fund, crypto]
    Instrument:
      type: object
      additionalProperties: false
      required: [code, type, scale, name]
      properties:
        code:
          type: string
        type:
          $ref: "#/components/schemas/InstrumentType"
        scale:
          type: integer
        name:
          type: string
        quote_currency:
          type: string
          description: Absent for currencies.
        exchange:
          type: string
          pattern: "^[A-Z0-9]{4}$"
        subtype:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
    InstrumentInput:
      type: object
      additionalProperties: false
      required: [code, type, scale, name, quote_currency]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9.]{2,20}$"
        type:
          $ref: "#/components/schemas/InstrumentType"
        scale:
          type: integer
          minimum: 0
          maximum: 12
        name:
          type: string
          minLength: 1
          maxLength: 120
        quote_currency:
          type: string
        exchange:
          type: string
          pattern: "^[A-Z0-9]{4}$"
        subtype:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: Refines the type for the owner's jurisdiction, such as cri, cdb or equity_fund (investments design 4.1).
    InstrumentEdit:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        exchange:
          type: string
          pattern: "^[A-Z0-9]{4}$"
        subtype:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
    InstrumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Instrument"
    FixedIncomeTermsInput:
      type: object
      additionalProperties: false
      required: [issued_on, matures_on, day_count, face_value]
      properties:
        issued_on:
          type: string
          format: date
        matures_on:
          type: string
          format: date
        index_id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: The index the security follows; absent for a pre-fixed security.
        percent_of_index_bp:
          type: integer
          minimum: 1
          description: 10000 is 100% of the index; 10000 when omitted.
        spread_bp:
          type: integer
          minimum: 0
          description: Annual spread over the index, or the annual rate of a pre-fixed security; 0 when omitted.
        day_count:
          $ref: "#/components/schemas/TermsDayCount"
        face_value:
          type: integer
          format: int64
          minimum: 1
          description: Price of one unit on issued_on, in minor units of the quote currency.
    FixedIncomeTerms:
      type: object
      required: [issued_on, matures_on, percent_of_index_bp, spread_bp, day_count, face_value]
      properties:
        issued_on:
          type: string
          format: date
        matures_on:
          type: string
          format: date
        index_id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        percent_of_index_bp:
          type: integer
        spread_bp:
          type: integer
        day_count:
          $ref: "#/components/schemas/TermsDayCount"
        face_value:
          type: integer
          format: int64
    TermsDayCount:
      type: string
      enum: [bus252, act365]
    Rate:
      type: string
      description: Positive exact decimal with at most 12 decimals (ADR 005).
      example: "5.4830"
    Price:
      type: object
      additionalProperties: false
      required: [instrument, quote_instrument, date, value, source]
      properties:
        instrument:
          type: string
        quote_instrument:
          type: string
        date:
          type: string
          format: date
        value:
          $ref: "#/components/schemas/Rate"
        source:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
    PriceInput:
      type: object
      additionalProperties: false
      required: [instrument, quote_instrument, date, value]
      properties:
        instrument:
          type: string
        quote_instrument:
          type: string
        date:
          type: string
          format: date
        value:
          $ref: "#/components/schemas/Rate"
    PriceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Price"
    PriceImport:
      type: object
      required: [recorded]
      properties:
        recorded:
          type: integer
    Holiday:
      type: object
