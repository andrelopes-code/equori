openapi: 3.0.3
info:
  title: equori API
  version: 0.1.0
  description: |
    Every endpoint under /api/v1 requires a session cookie except POST /api/v1/session.
    Errors use RFC 9457 problem details (docs/adr/004-api-errors.md).
servers:
  - url: /api/v1
tags:
  - name: identity
    description: Users and sessions.
  - name: ledger
    description: Accounts, transactions and balances.
  - name: reporting
    description: Derived views over the ledger.
  - name: portfolio
    description: Positions, realized results and income events derived from Ledger (P8 amendment A71).
  - name: marketdata
    description: Instruments, prices and business-day calendars.
  - name: ingestion
    description: File imports, aggregator integrations and connections, external records and their review.
  - name: classification
    description: Categorization rules, payee aliases, suggestions and categorization methods.
  - name: planning
    description: Schedules and their occurrences, budgets, goals, projections and committed amounts.
  - name: capture
    description: Transaction drafts read from text the owner writes.
paths:
  /session:
    post:
      tags: [identity]
      operationId: createSession
      summary: Log in and start a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "204":
          description: Session created.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [identity]
      operationId: deleteSession
      summary: Log out and end the current session.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "204":
          description: Session ended.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      summary: Return the authenticated user.
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [identity]
      operationId: updateCurrentUser
      summary: Change the language or region of the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /settings:
    get:
      tags: [ledger]
      operationId: getSettings
      summary: Return the ledger settings.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Problem"
    put:
      tags: [ledger]
      operationId: updateSettings
      summary: Change the base currency; allowed only before the first transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /institutions:
    get:
      tags: [ledger]
      operationId: listInstitutions
      summary: List institutions.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createInstitution
      summary: Create an institution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionInput"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /institution-identifier-schemes:
    get:
      tags: [ledger]
      operationId: listInstitutionIdentifierSchemes
      summary: List the institution identifier schemes and their patterns.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionIdentifierSchemeList"
        "401":
          $ref: "#/components/responses/Problem"
  /institutions/{id}/identifier:
    put:
      tags: [ledger]
      operationId: setInstitutionIdentifier
      summary: Set or clear the identifier of an institution; the br_ispb identifier keys its logo (ADR 013).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionIdentifierInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /payees:
    get:
      tags: [ledger]
      operationId: listPayees
      summary: List payees.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayeeList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createPayee
      summary: Create a payee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayeeInput"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payee"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /payees/{id}:
    patch:
      tags: [ledger]
      operationId: renamePayee
      summary: Rename a payee (A82).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayeeInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payee"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /payees/{id}/merge:
    post:
      tags: [ledger]
      operationId: mergePayee
      summary: Merge a payee into another; returns the destination (A82).
      description: |
        Every non-voided transaction of the payee gets a new version naming the destination; voided transactions and
        counterparty accounts name it in place. The payee is kept as merged and leaves listPayees.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePayeeInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payee"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /tags:
    get:
      tags: [ledger]
      operationId: listTags
      summary: List tags in use.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "401":
          $ref: "#/components/responses/Problem"
  /accounts:
    get:
      tags: [ledger]
      operationId: listAccounts
      summary: List accounts, categories included.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createAccount
      summary: Create an account or category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: OK.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}:
    get:
      tags: [ledger]
      operationId: getAccount
      summary: Return an account.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [ledger]
      operationId: updateAccount
      summary: Rename or move an account.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/close:
    post:
      tags: [ledger]
      operationId: closeAccount
      summary: Close an account and its open descendants (A74).
      description: |
        Every closed account needs no postings after closed_on; an asset, liability or equity account
        also needs a zero balance. A subtree holding a system account is rejected with system_account.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseAccountInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/reopen:
    post:
      tags: [ledger]
      operationId: reopenAccount
      summary: Reopen a closed account and its closed ancestors (A74).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/appearance:
    put:
      tags: [ledger]
      operationId: setAccountAppearance
      summary: Set or clear the colour and the icon of an account (A83).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAppearance"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/parent:
    put:
      tags: [ledger]
      operationId: setAccountParent
      summary: Set or clear the parent of an account (A84).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountParent"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/merge:
    post:
      tags: [ledger]
      operationId: mergeAccount
      summary: Merge a category into another; returns the destination (A75).
      description: |
        Every non-voided transaction with a posting on the category gets a new version with that posting
        on the destination; the subcategories move under the destination; the category closes today.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeAccountInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/balance:
    get:
      tags: [ledger]
      operationId: getAccountBalance
      summary: Balance of an account at the end of a date.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: basis
          in: query
          required: false
          schema:
            type: string
            enum: [booked, settled]
        - name: value_in
          in: query
          required: false
          description: Currency to value the balance in with stored prices (P8 amendment A65).
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /balances:
    get:
      tags: [ledger]
      operationId: listBalances
      summary: Balance of every balance-sheet account at the end of a date, ordered by account name then id.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: basis
          in: query
          required: false
          schema:
            type: string
            enum: [booked, settled]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /transactions:
    get:
      tags: [ledger]
      operationId: listTransactions
      summary: List transactions, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: account_id
          in: query
          description: Transactions with a posting on the account or on one of its descendants (A76).
          schema:
            type: string
            format: uuid
        - name: payee_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: uncategorized
          in: query
          description: When true, only transactions whose category postings are all uncategorized (P5 amendment A17).
          schema:
            type: boolean
        - name: q
          in: query
          description: Case-insensitive substring of description, payee name or posting memo.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createTransaction
      summary: Record a transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: OK.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /foreign-purchases:
    post:
      tags: [ledger]
      operationId: recordForeignPurchase
      summary: Record a purchase charged in another currency, with the card's foreign charge (P8 amendment A66).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForeignPurchaseInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /exchanges:
    post:
      tags: [ledger]
      operationId: exchangeCurrency
      summary: Exchange money between own accounts in two currencies, one of them the base currency (P8 amendment A67).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /trades:
    post:
      tags: [ledger]
      operationId: recordTrade
      summary: Buy or sell a security for cash of the same brokerage at average cost (P8 amendment A68).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /investment-income:
    post:
      tags: [ledger]
      operationId: recordInvestmentIncome
      summary: Record income paid on a security into cash of the same brokerage (P8 amendment A70).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentIncomeInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /positions:
    get:
      tags: [portfolio]
      operationId: listPositions
      summary: Positions of the security accounts at the end of a date, valued with stored prices.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /realized-results:
    get:
      tags: [portfolio]
      operationId: listRealizedResults
      summary: Results of the sales of a year at average cost (D1).
      parameters:
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealizedResultList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /income-events:
    get:
      tags: [portfolio]
      operationId: listIncomeEvents
      summary: Investment income of a year by tax treatment (D1).
      parameters:
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeEventList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /investment-income-types:
    get:
      tags: [portfolio]
      operationId: listInvestmentIncomeTypes
      summary: Income types the user's jurisdiction accepts.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeTypeList"
        "401":
          $ref: "#/components/responses/Problem"
  /transactions/{id}:
    get:
      tags: [ledger]
      operationId: getTransaction
      summary: Return a transaction.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [ledger]
      operationId: correctTransaction
      summary: Correct a transaction; creates a new version.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectionInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/void:
    post:
      tags: [ledger]
