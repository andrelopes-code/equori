        "409":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ingestion]
      operationId: createIntegration
      summary: Store the credentials of an aggregator application (P6 amendment A34).
      description: |
        The aggregator validates the credentials before they are stored, sealed under
        EQUORI_SECRET_KEY (ADR 008); no response returns them. 409 integration_unavailable
        without the key; 422 aggregator_unauthorized when the aggregator rejects them; 502
        aggregator_unavailable when it does not answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationInput"
      responses:
        "201":
          description: OK.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /integrations/{id}:
    get:
      tags: [ingestion]
      operationId: getIntegration
      summary: Return an integration, without its credentials.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
