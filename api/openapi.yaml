          type: string
          format: uuid
        percent:
          type: integer
          minimum: 1
          maximum: 9999
        amount:
          $ref: "#/components/schemas/Money"
        remainder:
          type: boolean
    RuleAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
