    get:
      tags: [ingestion]
      operationId: listImportBatches
      x-book-role: read
      summary: Import batches, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchList"
        "401":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/csv-profile:
    get:
      tags: [ingestion]
      operationId: getCsvProfile
      x-book-role: read
      summary: How the CSV files of the account are read.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
