        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        next_cursor:
          type: string
    RuleCondition:
      type: object
      additionalProperties: false
      required: [field, operator, value]
      description: The value type depends on the field (P5 amendment A21); between and in_list take an array.
      properties:
        field:
          type: string
          enum: [description, raw_description, payee, amount, absolute_amount, account, account_kind, source, weekday, day_of_month, installment]
        operator:
          type: string
          enum: [equals, contains, starts_with, regex, between, greater_than, less_than, in_list]
        value: {}
