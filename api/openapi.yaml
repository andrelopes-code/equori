    post:
      tags: [ingestion]
      operationId: reopenExternalRecord
      x-book-role: write
      summary: Return a discarded record to review (A140).
      description: |
        The record waits for review again, with the candidates the ledger holds now; a record that
        is not discarded returns record_not_discarded.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
