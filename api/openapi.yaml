          type: string
          enum: [expense, income]
    CaptureSuggestions:
      type: object
      required: [items, available]
      properties:
        available:
          type: boolean
          description: False when the language model could not be asked; the items then hold kept answers only.
        items:
          type: array
          items:
            $ref: "#/components/schemas/CaptureSuggestion"
    CaptureSuggestion:
      type: object
      properties:
        category_id:
          type: string
          format: uuid
          description: Absent when no category is named.
        source:
          type: string
          enum: [kept, model]
          description: Absent when no category is named.
    TransactionBatchInput:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/TransactionBatchEntry"
    TransactionBatchEntry:
      type: object
      additionalProperties: false
      description: Exactly one member is set.
      properties:
        transaction:
          $ref: "#/components/schemas/TransactionInput"
        installment_purchase:
          $ref: "#/components/schemas/InstallmentPurchaseInput"
    TransactionBatch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
    CorrectionInput:
      type: object
      additionalProperties: false
      required: [date, postings, expected_version, reason]
      properties:
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 500
        payee_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 60
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        postings:
          type: array
          items:
            $ref: "#/components/schemas/PostingInput"
          minItems: 2
          maxItems: 500
        expected_version:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500
    Transaction:
      type: object
      required: [id, date, description, balancing_currency, origin, version, tags, links, postings]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
        payee_id:
          type: string
          format: uuid
        balancing_currency:
          type: string
        origin:
          type: string
          enum: [manual, import, schedule, system]
        version:
          type: integer
        voided_at:
          type: string
          format: date-time
        void_reason:
          type: string
        tags:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        referenced_by:
          type: array
          description: Set only by GET /transactions/{id}; ordered by type, then source.
          items:
            $ref: "#/components/schemas/LinkReference"
        investment_income:
          $ref: "#/components/schemas/InvestmentIncome"
        trade:
