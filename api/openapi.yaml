        "422":
          $ref: "#/components/responses/Problem"
  /transactions/categorize:
    post:
      tags: [ledger]
      operationId: categorizeTransactions
      summary: Give several transactions one category, each item decided on its own (A78).
      description: |
        Each item replaces the category postings of its transaction with one posting on category_id holding their
        total, method manual. An item that fails reports its status and leaves the others applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCategorizeInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
