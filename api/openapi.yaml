      x-book-role: write
      summary: Create a schedule and generate its occurrences up to today + 12 months (P7 amendments A46-A49).
      description: |
        Money leaves account_id for every kind except income. The counterpart is an expense category for bill
        and subscription, an income category for income, and another balance account for transfer and savings.
        Both accounts are in the base currency (422 currency_unsupported otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /schedules/{id}:
    get:
      tags: [planning]
      operationId: getSchedule
      x-book-role: read
      summary: A schedule with its terms versions and pauses.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [planning]
      operationId: updateScheduleMatching
      x-book-role: write
      summary: Rename a schedule, start it earlier or change how transactions are matched to its occurrences (P7 amendments A198, A199).
      description: |
        Each field is optional; absent fields keep their value. The description applies to every occurrence of
        the schedule, an ended schedule included. starts_on moves the first date of the schedule before the
        current one, on the rhythm of its recurrence: the occurrences that exist stay, the dates gained before
        them are inserted, a recorded transaction realizes one it fits, and one that is overdue is skipped.
        422 validation_failed on starts_on when it is not before the current start, is off the rhythm, or the
        recurrence has a count. The matching change applies to transactions recorded,
        corrected or voided afterwards; occurrences already realized stay.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                starts_on:
                  type: string
                  format: date
                match_tolerance_bp:
                  type: integer
                grace_days:
                  type: integer
                match_window_days:
                  type: integer
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences:
    get:
