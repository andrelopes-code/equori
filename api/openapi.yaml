        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceAssertionList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createBalanceAssertion
      summary: Record the institution's balance and reconcile the account when it matches.
      description: |
        The difference is the asserted amount minus the settled balance at the date. Zero reconciles
        the account; a positive difference on an account with yield mode auto records yield and
        reconciles; any other difference stays open.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAssertionInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssertionResult"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /balance-assertions/{id}/resolve:
    post:
      tags: [ledger]
      operationId: resolveBalanceAssertion
      summary: Resolve the open difference of an assertion and reconcile the account.
      description: |
        adjustment records the difference against the equity account Adjustments; yield records a
        positive difference as income against the account Yield and is rejected for a negative one;
        transactions_added requires the settled balance to match the assertion after the missing
        transactions were recorded.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssertionResolutionInput"
