            application/json:
              schema:
                $ref: "#/components/schemas/CardStatementAnalytics"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /reports/balances:
    get:
      tags: [reporting]
      operationId: getBalanceSeries
      x-book-role: read
      summary: Daily balance of an account and its sub-accounts, one item per day in [from, to].
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: basis
          in: query
          required: false
          schema:
            type: string
            enum: [booked, settled]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSeries"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /reports/flows:
    get:
      tags: [reporting]
      operationId: getAccountFlows
      x-book-role: read
      summary: Booked inflow and outflow of one account, one item per day in [from, to] that has a posting (A119).
      description: >-
        Inflow is the sum of the positive amounts of the account's non-voided postings booked on the date;
        outflow is the sum of the absolute values of the negative ones. Sub-accounts are not included. The
        range holds at most 366 days.
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The days with a posting, in date order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountFlows"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /reports/categories:
    get:
      tags: [reporting]
      operationId: getCategoryTotals
      x-book-role: read
      summary: Totals of each category of a class in [from, to], at most 366 days, in the accrual or cash view (A77).
      description: |
        Spending of an expense category and earnings of an income category are positive. An account is listed
        when it is open or when its total or the total of its subtree is not zero; items are ordered by name then id.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: class
          in: query
          required: true
          schema:
            type: string
            enum: [income, expense]
        - name: view
          in: query
          required: false
          description: |
            accrual counts each amount on its transaction date. cash counts a card line when its statement is paid,
            in proportion to the payment, and any other amount on its date (docs/plans/2026-10-26-p9-cash-view.md,
            CV1 to CV10).
          schema:
            type: string
            enum: [accrual, cash]
            default: accrual
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryTotals"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /reports/categories/{id}/cash-payments:
    get:
      tags: [reporting]
      operationId: listCategoryCashPayments
      x-book-role: read
      summary: Card amounts of one category in the cash view of [from, to], at most 366 days, each naming its statement and payment (N20).
      description: |
        Each item is the share a card payment gives the category (docs/plans/2026-10-26-p9-cash-view.md, CV1 to CV10),
        signed as the category's postings, in the order the payments apply. Amounts of transactions without a card line are not
        listed; they count on their own date. The items of a category sum to the card part of its cash total.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCashPayments"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /reports/indicators:
    get:
      tags: [reporting]
      operationId: getIndicators
      x-book-role: read
      summary: Savings rate, liquidity, committed share, debt service share and liabilities of a month and the 11 months before it, cash view (analytics design 4).
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indicators"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: equori_session
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    SessionCookie:
      name: equori_session
      in: cookie
      required: false
      schema:
        type: string
    LoginCookie:
      name: equori_login
      in: cookie
      required: false
      schema:
        type: string
    Origin:
      name: Origin
      in: header
      required: false
      description: The browser's origin; its host name is the WebAuthn RP ID (HA42).
      schema:
        type: string
    TagName:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 60
    GoalTransactionID:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanMonth:
      name: month
      in: query
      required: true
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
    Year:
      name: year
      in: query
      required: true
      description: Year in which the tax year of the owner's jurisdiction starts.
      schema:
        type: integer
        minimum: 1900
        maximum: 2200
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    InstrumentType:
      type: string
      enum: [currency, stock, etf, reit, depositary_receipt, fixed_income, fund, crypto]
    Rate:
      type: string
      description: Positive exact decimal with at most 12 decimals (ADR 005).
      example: "5.4830"
    Price:
      type: object
      additionalProperties: false
      required: [instrument, quote_instrument, date, value, source]
      properties:
        instrument:
          type: string
        quote_instrument:
          type: string
        date:
          type: string
          format: date
        value:
          $ref: "#/components/schemas/Rate"
        source:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        at:
          type: string
          format: date-time
          description: Instant of a current quote; absent for a close (A248 CQ23).
        open:
          type: boolean
          description: The session of a current quote is running; absent for a close.
    CurrentQuotes:
      type: object
      additionalProperties: false
      required: [count, open, oldest_at]
      properties:
        count:
          type: integer
          minimum: 1
          description: Prices of the total that are current quotes (A248 CQ24).
        open:
          type: boolean
          description: One of them belongs to a running session.
        oldest_at:
          type: string
          format: date-time
          description: The earliest instant among them.
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Integer units of the instrument scale (ADR 005).
        currency:
          type: string
          example: BRL
          description: Instrument code; a currency or a security (P8 amendment A58).
          pattern: "^[A-Z0-9.]{2,20}$"
    IncomeType:
      type: string
      pattern: "^[a-z0-9_]{2,40}$"
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: |
            Stable error identifier. Values: invalid_request, request_too_large, invalid_credentials,
            too_many_attempts, unauthenticated, forbidden, not_found, validation_failed, internal_error,
            server_busy, invalid_account, version_conflict, transaction_voided, posting_reconciled,
            account_not_empty, settings_locked, statement_not_closed, statement_financed, dispute_open, dispute_resolved,
            already_reconciled, difference_remains, method_not_allowed, unsupported_media_type,
            record_resolved, already_matched, group_changed, not_categorizable, suggestion_closed, pairing_ambiguous,
            integration_unavailable, aggregator_unauthorized, aggregator_unavailable, integration_in_use,
            csv_suggestion_unavailable, csv_suggestion_unusable, currency_unsupported, occurrence_closed, transaction_in_use, pause_overlap, schedule_ended,
            budget_exists, instrument_exists, instrument_in_use, mixed_instruments, price_missing, no_source, later_sale_exists, odd_lot_code,
            investment_transaction, system_account, attachment_not_inlineable, archive_too_new, passphrase_invalid, passphrase_required,
            contribution_target_sum, contribution_member_target_sum, contribution_class_name_duplicate,
            contribution_member_duplicate, contribution_member_invalid, contribution_amount_invalid,
            setup_token_invalid, setup_complete, book_role_required, books_not_found, member_not_found,
            last_owner, already_member, invitation_not_found, invitation_email_mismatch,
            confirmation_mismatch, books_has_members, last_books,
            backup_off, backup_failed, password_too_short, institution_in_use,
            trade_target_required, brokerage_cash_missing, brokerage_cash_ambiguous, holding_not_found,
            posting_not_movable, archive_invalid, import_not_empty, import_conflict, export_pending,
            export_not_ready, record_not_discarded, no_decision, too_many_lines, proposal_not_found,
            provider_not_found, use_not_found, capability_missing, key_required, secret_key_missing,
            admin_required, unofficial_source.
        request_id:
          type: string
        retry_at:
          type: string
          format: date-time
          description: Instant after which the same request can succeed.
        archive_version:
          type: integer
          description: The archive_version of a refused archive (archive_too_new, ADR 021).
        instance_version:
          type: integer
          description: The highest archive_version the instance imports (archive_too_new, ADR 021).
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Capability:
      type: string
      enum: [tools, structured_output, image_input]
    Notice:
      type: string
      description: trains, the free tier uses submitted content; local, data stays on the configured host; provider_terms, read the provider's terms.
      enum: [trains, local, provider_terms]
    PresetModel:
      type: object
      required: [id, capabilities]
      properties:
        id:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
    Preset:
      type: object
      required: [id, api, base_url, key_required, notice, models]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        api:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        base_url:
          type: string
          description: Empty for custom.
        key_required:
          type: boolean
        notice:
          $ref: "#/components/schemas/Notice"
        models:
          type: array
          items:
            $ref: "#/components/schemas/PresetModel"
    PresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Preset"
    Provider:
      type: object
      required: [id, preset, name, base_url, has_key, notice, instance]
      properties:
        id:
          type: string
          description: A UUID, or the adapter name of an instance provider.
        preset:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        name:
          type: string
        base_url:
          type: string
          description: Empty for an instance provider.
        has_key:
          type: boolean
        notice:
          $ref: "#/components/schemas/Notice"
        instance:
          type: boolean
          description: Configured through the environment for every book; read-only.
    ProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Provider"
    ProviderInput:
      type: object
      required: [preset, name]
      properties:
        preset:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        name:
          type: string
        base_url:
          type: string
          description: Absent takes the preset's.
        key:
          type: string
          writeOnly: true
    ProviderPatch:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
        key:
          type: string
          writeOnly: true
          description: Absent keeps the stored key; empty removes it.
    ProviderModels:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
    UseTarget:
      type: object
      required: [provider_id, provider_name, preset, notice, model, capabilities]
      properties:
        provider_id:
          type: string
        provider_name:
          type: string
        preset:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        notice:
          $ref: "#/components/schemas/Notice"
        model:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
    Use:
      type: object
      required: [id, needs, sends_financial_data, default, targets]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_.]{2,40}$"
        needs:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        sends_financial_data:
          type: boolean
        default:
          type: boolean
          description: The chain comes from the use's declaration.
        targets:
          type: array
          items:
            $ref: "#/components/schemas/UseTarget"
    UseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Use"
    UsageRow:
      type: object
      required: [provider_id, provider_name, preset, instance, model, today_requests, today_errors, today_tokens,
        period_requests, period_tokens, period_days]
      properties:
        provider_id:
          type: string
        provider_name:
          type: string
        preset:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        instance:
          type: boolean
        model:
          type: string
        today_requests:
          type: integer
          format: int64
          description: Requests sent today, answered or not.
        today_errors:
          type: integer
          format: int64
        today_tokens:
          type: integer
          format: int64
          description: Input and output tokens of today's answers.
        period_requests:
          type: integer
          format: int64
        period_tokens:
          type: integer
          format: int64
        period_days:
          type: integer
          description: Days summed in the period figures, today included.
        requests_per_day:
          type: integer
          format: int64
          description: Absent when the owner declared none.
        tokens_per_day:
          type: integer
          format: int64
        cooling_until:
          type: string
          format: date-time
          description: Present while the model cools down after a refusal.
    UsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageRow"
    UsageDay:
      type: object
      required: [day, provider_id, model, requests, errors, tokens]
      properties:
        day:
          type: string
          format: date
        provider_id:
          type: string
        model:
          type: string
        requests:
          type: integer
          format: int64
          description: Requests sent that day, answered or not.
        errors:
          type: integer
          format: int64
        tokens:
          type: integer
          format: int64
          description: Input and output tokens of the day's answers.
    UsageDayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageDay"
    AssistantChat:
      type: object
