        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budgets/{id}/progress:
    get:
      tags: [planning]
      operationId: getBudgetProgress
      x-book-role: read
      summary: Planned, carried, spent and available amounts of a month, accrual view (P7 amendment A54).
      description: Spending of an income category is reported as a positive amount.
      parameters:
        - $ref: "#/components/parameters/ID"
