        conversation_id: {type: string, format: uuid}
        text:
          type: string
          maxLength: 4000
          description: Empty only when file_ids names a file.
        file_ids:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {type: string, format: uuid}
          description: Unsent files of createAssistantFile the message carries.
        page: {type: string, pattern: "^/[A-Za-z0-9/_$.-]{0,199}$"}
    AssistantConversation:
      type: object
      additionalProperties: false
      required: [id, title, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AssistantConversationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssistantConversation"
        next_cursor:
          type: string
          description: Absent on the last page.
    AssistantMessage:
      type: object
      additionalProperties: false
      required: [id, role, content, created_at, proposals, files]
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [user, assistant]}
        content: {type: string}
        outcome: {type: string, enum: [answered, step_limit, failed, canceled]}
        created_at: {type: string, format: date-time}
        files:
          type: array
          description: The files the message carried, in the order uploaded (FU5).
          items:
            $ref: "#/components/schemas/AssistantFile"
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/AssistantProposal"
    AssistantConversationDetail:
      type: object
      additionalProperties: false
      required: [id, title, created_at, updated_at, messages]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AssistantMessage"
    AssistantProposal:
      type: object
      additionalProperties: false
      required: [id, tool, status, preview, created_at, expires_at, suggested, waiting_for]
      properties:
        id: {type: string, format: uuid}
        tool: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}
        status: {type: string, enum: [pending, executing, executed, failed, rejected, stale, discarded, expired, waiting, blocked]}
        suggested: {type: boolean}
        reason: {type: string, maxLength: 200}
        summary: {type: string, maxLength: 200}
        waiting_for: {type: array, items: {type: string, format: uuid}}
        preview: {$ref: "#/components/schemas/AssistantPreview"}
        result: {description: "Tool output when executed, tool error when failed."}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
    AssistantPreview:
      type: object
      additionalProperties: false
      required: [action, changes]
      properties:
        action: {type: string}
        target: {type: string}
        destructive: {type: boolean}
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field]
            properties:
              field: {type: string, pattern: "^[a-z_]{2,40}$"}
              before: {$ref: "#/components/schemas/AssistantValue"}
              after: {$ref: "#/components/schemas/AssistantValue"}
        items:
          type: array
          items: {$ref: "#/components/schemas/AssistantPreviewItem"}
        recurrence: {$ref: "#/components/schemas/AssistantRecurrence"}
    AssistantPreviewItem:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description: {type: string}
        date: {type: string, format: date}
        amount: {$ref: "#/components/schemas/AssistantValue"}
        account: {type: string}
        category: {type: string}
    AssistantRecurrence:
      type: object
      additionalProperties: false
      required: [frequency, interval]
      properties:
        frequency: {type: string, pattern: "^[a-z_]{2,40}$"}
        interval: {type: integer, minimum: 1}
        day: {type: integer, minimum: 1, maximum: 31}
    AssistantValue:
      type: object
      additionalProperties: false
      properties:
        text: {type: string}
        amount: {type: string}
        currency: {type: string}
        date: {type: string, format: date}
    UsageLimitInput:
      type: object
      required: [provider_id, model]
      properties:
        provider_id:
          type: string
          minLength: 1
          maxLength: 60
        model:
          type: string
          minLength: 1
          maxLength: 200
        requests_per_day:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        tokens_per_day:
          type: integer
          format: int64
          minimum: 1
    ChainTargetInput:
      type: object
      required: [provider_id, model]
      properties:
        provider_id:
          type: string
          format: uuid
        model:
          type: string
        capabilities:
          type: array
          description: Asserted for a model its preset does not name.
          items:
            $ref: "#/components/schemas/Capability"
    ChainInput:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ChainTargetInput"
    CapturePreviewInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          maxLength: 10000
        default_account_id:
          type: string
          format: uuid
          description: Account of a line that names none (A111).
        reference_date:
          type: string
          format: date
