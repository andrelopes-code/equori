      type: object
      required: [id, integration_id, external_id, state, name, provider_status, created_at, accounts]
      properties:
        id:
          type: string
          format: uuid
        integration_id:
          type: string
          format: uuid
        external_id:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [ok, needs_owner, failed, stalled, consent_expiring]
          description: |
            The aggregator-neutral reading of provider_status. stalled: the aggregator reports
            the item ready but the institution's data or the last sync is more than 72 hours
            old (A150). consent_expiring: the consent expires within 14 days (A151). An expired
            consent reads needs_owner (A146).
        provider_status:
          type: string
          description: The item status the aggregator reported, verbatim.
        portal:
          type: string
          description: The aggregator's site or app where the owner acts on the item; absent when the aggregator names none.
        last_item_update_at:
          type: string
          format: date-time
          description: When the aggregator last updated the item from the institution, as of the last sync; the ledger holds the data of this update.
        next_item_update_at:
          type: string
          format: date-time
          description: When the aggregator will next update the item, as the last check read it (A95). The owner cannot bring it forward.
        consent_expires_at:
          type: string
          format: date-time
          description: When the consent the owner gave the institution expires; absent when it does not expire (A151).
