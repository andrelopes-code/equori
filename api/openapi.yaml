openapi: 3.0.3
info:
  title: equori API
  version: 0.1.0
  description: |
    Every endpoint under /api/v1 requires a session cookie except POST /api/v1/session.
    Errors use RFC 9457 problem details (docs/adr/004-api-errors.md).
servers:
  - url: /api/v1
tags:
  - name: identity
    description: Users and sessions.
  - name: ledger
    description: Accounts, transactions and balances.
  - name: reporting
    description: Derived views over the ledger.
  - name: marketdata
    description: Instruments and business-day calendars.
  - name: ingestion
    description: File imports, aggregator integrations and connections, external records and their review.
  - name: classification
    description: Categorization rules, payee aliases, suggestions and categorization methods.
  - name: planning
    description: Schedules and their occurrences, budgets, goals, projections and committed amounts.
paths:
  /session:
    post:
      tags: [identity]
      operationId: createSession
      summary: Log in and start a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "204":
          description: Session created.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [identity]
      operationId: deleteSession
      summary: Log out and end the current session.
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "204":
          description: Session ended.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      summary: Return the authenticated user.
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
  /settings:
    get:
      tags: [ledger]
      operationId: getSettings
      summary: Return the ledger settings.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Problem"
    put:
      tags: [ledger]
      operationId: updateSettings
      summary: Change the base currency; allowed only before the first transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /institutions:
    get:
      tags: [ledger]
      operationId: listInstitutions
      summary: List institutions.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createInstitution
      summary: Create an institution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionInput"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /payees:
    get:
      tags: [ledger]
      operationId: listPayees
      summary: List payees.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayeeList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createPayee
      summary: Create a payee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayeeInput"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payee"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /tags:
    get:
      tags: [ledger]
      operationId: listTags
      summary: List tags in use.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "401":
          $ref: "#/components/responses/Problem"
  /accounts:
    get:
      tags: [ledger]
      operationId: listAccounts
      summary: List accounts, categories included.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createAccount
      summary: Create an account or category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: OK.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}:
    get:
      tags: [ledger]
      operationId: getAccount
      summary: Return an account.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [ledger]
      operationId: updateAccount
      summary: Rename or move an account.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/close:
    post:
      tags: [ledger]
      operationId: closeAccount
      summary: Close an account with zero balance.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseAccountInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/balance:
    get:
      tags: [ledger]
      operationId: getAccountBalance
      summary: Balance of an account at the end of a date.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: basis
          in: query
          required: false
          schema:
            type: string
            enum: [booked, settled]
        - name: value_in
          in: query
          required: false
          description: Currency to value the balance in with stored prices (P8 amendment A65).
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions:
    get:
      tags: [ledger]
      operationId: listTransactions
      summary: List transactions, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: account_id
          in: query
          schema:
            type: string
            format: uuid
        - name: payee_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: uncategorized
          in: query
          description: When true, only transactions whose category postings are all uncategorized (P5 amendment A17).
          schema:
            type: boolean
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createTransaction
      summary: Record a transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: OK.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /foreign-purchases:
    post:
      tags: [ledger]
      operationId: recordForeignPurchase
      summary: Record a purchase charged in another currency, with IOF (P8 amendment A66).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForeignPurchaseInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /exchanges:
    post:
      tags: [ledger]
      operationId: exchangeCurrency
      summary: Exchange money between own accounts in two currencies, one of them the base currency (P8 amendment A67).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}:
    get:
      tags: [ledger]
      operationId: getTransaction
      summary: Return a transaction.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [ledger]
      operationId: correctTransaction
      summary: Correct a transaction; creates a new version.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectionInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/void:
    post:
      tags: [ledger]
      operationId: voidTransaction
      summary: Void a transaction; it stays in history.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/categorize:
    post:
      tags: [ledger]
      operationId: categorizeTransaction
      summary: Replace the category postings of a transaction, keeping their total (P5 amendment A18).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategorizeInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/transfer:
    post:
      tags: [ledger]
      operationId: transferTransaction
      summary: Replace the category side with a posting on another of the owner's accounts, pairing with its imported other side (P5b amendments A28, A29).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/versions:
    get:
      tags: [ledger]
      operationId: listTransactionVersions
      summary: Previous versions of a transaction.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionVersionList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /reports/balances:
    get:
      tags: [reporting]
      operationId: getBalanceSeries
      summary: Daily balance of an account and its sub-accounts, one item per day in [from, to].
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: basis
          in: query
          required: false
          schema:
            type: string
            enum: [booked, settled]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSeries"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /calendars/{name}/holidays:
    get:
      tags: [marketdata]
      operationId: listHolidays
      summary: Non-business days of a calendar in a year, weekends excluded.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1900
            maximum: 2200
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HolidayList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /instruments:
    get:
      tags: [marketdata]
      operationId: listInstruments
      summary: Instruments of the instance in code order.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InstrumentType"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [marketdata]
      operationId: defineInstrument
      summary: Define a security for the whole instance (P8 amendment A59).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /instruments/{code}:
    get:
      tags: [marketdata]
      operationId: getInstrument
      summary: One instrument.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /prices:
    get:
      tags: [marketdata]
      operationId: listPrices
      summary: The chosen price of each date with prices in [from, to], at most 366 days (P8 amendment A60).
      parameters:
        - name: instrument
          in: query
          required: true
          schema:
            type: string
        - name: quote_instrument
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      tags: [marketdata]
      operationId: recordPrice
      summary: Record a manual price; a manual price of the same date is replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /prices/import:
    post:
      tags: [marketdata]
      operationId: importPrices
      summary: Record the prices of a CSV file as source csv, all or nothing.
      description: |
        Header `instrument,quote_instrument,date,value`, at most 10,000 lines. A rejected line returns
        422 with field `line N`, N counting the header as line 1.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceImport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/billing-cycle-rules:
    get:
      tags: [ledger]
      operationId: listBillingCycleRules
      summary: Billing cycle rule versions of a card.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCycleRuleList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createBillingCycleRule
      summary: Add a billing cycle rule version, effective from a reference month.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCycleRule"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCycleRule"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/credit-limits:
    get:
      tags: [ledger]
      operationId: listCreditLimits
      summary: Credit limit versions of a card.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLimitList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createCreditLimit
