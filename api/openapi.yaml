    CsvProfile:
      type: object
      additionalProperties: false
      required: [date_column, date_layout, decimal_separator, description_column]
      properties:
        delimiter:
          type: string
          enum: [comma, semicolon, tab, pipe]
        header_rows:
          type: integer
          minimum: 0
          maximum: 10
        date_column:
          type: string
          minLength: 1
          maxLength: 100
        date_layout:
          type: string
          pattern: '^(DD|MM|YYYY|YY)[/. -](DD|MM|YYYY|YY)[/. -](DD|MM|YYYY|YY)$'
          description: Order and separator of the date; day, month and year appear once each.
        amount_column:
          type: string
          minLength: 1
          maxLength: 100
        debit_column:
          type: string
          minLength: 1
          maxLength: 100
        credit_column:
          type: string
          minLength: 1
          maxLength: 100
        decimal_separator:
          type: string
          enum: [",", "."]
        description_column:
          type: string
          minLength: 1
          maxLength: 100
        id_column:
          type: string
          minLength: 1
          maxLength: 100
        amount_sign:
          type: string
          enum: [as_is, inverted]
          description: inverted flips the sign of every amount, for exports that list card charges as positive.
        encoding:
          type: string
          pattern: "^[a-z0-9_-]{2,40}$"
          default: auto
          description: Text encoding of the file. auto keeps valid UTF-8 and decodes anything else as windows-1252.
        group_separator:
          type: string
          pattern: "^[,. \u00a0']?$"
          description: Digit group separator of amounts; empty for none. Defaults to the one that is not decimal_separator.
