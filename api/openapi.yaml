          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchList"
        "401":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/csv-profile:
    get:
      tags: [ingestion]
      operationId: getCsvProfile
      summary: How the CSV files of the account are read.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvProfile"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [ingestion]
      operationId: saveCsvProfile
      summary: Set how the CSV files of the account are read (P4 amendment A13).
      description: |
        Columns are header names, or 1-based positions when header_rows is 0. Set amount_column, or
        debit_column and credit_column. Defaults: delimiter comma, header_rows 1, amount_sign as_is.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvProfile"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvProfile"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/imports:
    post:
      tags: [ingestion]
      operationId: importFile
      summary: Import an OFX or CSV statement into a balance account.
      description: |
        Each line is deduplicated (I10), matched to an existing transaction of the account with the
        same amount within 3 days, or created against an uncategorized account; ambiguous matches
        wait for review. A file balance becomes a balance assertion (chapter 3, F4). At most 10 MiB
        (P4 amendment A16); a CSV file needs the account's CSV profile.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [format, file]
              properties:
                format:
                  type: string
                  enum: [ofx, csv]
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /import-batches/{id}:
    get:
      tags: [ingestion]
      operationId: getImportBatch
      summary: One import batch with its counts.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /import-batches/{id}/records:
    get:
      tags: [ingestion]
      operationId: listBatchRecords
      summary: The external records of a batch, in file order.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: state
          in: query
          schema:
            type: string
            enum: [received, matched, created, needs_review, discarded, withdrawn]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalRecordList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /external-records/{id}/resolve:
    post:
      tags: [ingestion]
      operationId: resolveExternalRecord
      summary: Resolve a record that needs review.
      description: |
        match links the record to one of its candidates and clears that posting; create records a
        transaction against an uncategorized account; discard leaves the line out of the ledger.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordResolution"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalRecord"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /integrations:
    get:
      tags: [ingestion]
      operationId: listIntegrations
      summary: Aggregator integrations, by name.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationList"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ingestion]
      operationId: createIntegration
      summary: Store the credentials of an aggregator application (P6 amendment A34).
      description: |
        The provider validates the credentials before they are stored, sealed under
        EQUORI_SECRET_KEY (ADR 008); no response returns them. 409 integration_unavailable
        without the key; 422 provider_unauthorized when the provider rejects them; 502
        provider_unavailable when it does not answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationInput"
      responses:
        "201":
          description: OK.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /integrations/{id}:
    get:
      tags: [ingestion]
      operationId: getIntegration
      summary: Return an integration, without its credentials.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [ingestion]
      operationId: deleteIntegration
      summary: Delete an integration without connections (409 integration_in_use otherwise).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /integrations/{id}/credentials:
    put:
      tags: [ingestion]
      operationId: updateIntegrationCredentials
      summary: Replace the credentials of an integration after the provider validates them.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationCredentials"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /connections:
    get:
      tags: [ingestion]
      operationId: listConnections
      summary: Connections with their external accounts, by name.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ingestion]
      operationId: createConnection
      summary: Connect an aggregator item and list its accounts (P6 amendments A34, A35).
      description: |
        item_id is the item of the integration's application (Meu Pluggy: one item per bank).
        The name defaults to the item's connector name. Every external account starts pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionInput"
      responses:
        "201":
          description: OK.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /connections/{id}:
    get:
      tags: [ingestion]
      operationId: getConnection
      summary: Return a connection with its external accounts.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [ingestion]
      operationId: deleteConnection
      summary: Delete a connection and its mappings; imported records and batches stay.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /connections/{id}/sync:
    post:
      tags: [ingestion]
      operationId: syncConnection
      summary: Sync every mapped account of the connection now (P6 amendment A43).
      description: |
        One import batch per mapped account. An item that needs its owner in Meu Pluggy
        (LOGIN_ERROR, OUTDATED, WAITING_USER_INPUT) is not synced: batches is empty and the
        connection shows the status. A sync of an account waits for any other sync or import
        of it. A failure is stored in the connection's last_error.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /connections/{id}/accounts/{external_account_id}:
    put:
      tags: [ingestion]
      operationId: mapExternalAccount
      summary: Map an external account to a ledger account, or ignore it (P6 amendment A35).
      description: |
        account_id is a leaf balance account of the external account's currency and a compatible
        kind (CHECKING_ACCOUNT to checking, SAVINGS_ACCOUNT to savings or reserve, CREDIT_CARD to
        credit_card) that no other external account feeds; sync_from is the first date to import.
        Only mapped accounts sync.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: external_account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountMappingInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalAccount"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /schedules:
    get:
      tags: [planning]
      operationId: listSchedules
      summary: Schedules in creation order.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [planning]
      operationId: createSchedule
      summary: Create a schedule and generate its occurrences up to today + 12 months (P7 amendments A46-A49).
      description: |
        Money leaves account_id for every kind except income. The counterpart is an expense category for bill
        and subscription, an income category for income, and another balance account for transfer and savings.
        Both accounts are in the base currency (422 currency_unsupported otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /schedules/{id}:
    get:
      tags: [planning]
      operationId: getSchedule
      summary: A schedule with its terms versions and pauses.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /occurrences:
    get:
      tags: [planning]
      operationId: listOccurrences
      summary: Occurrences with expected date in [from, to], at most 366 days, by date.
      description: State overdue is derived from expected and the schedule's grace days (P7 amendment A50).
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: schedule_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OccurrenceState"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/realize:
    post:
      tags: [planning]
      operationId: realizeOccurrence
      summary: Link a transaction to an expected occurrence; ledger changes never release it (P7 amendment A51).
      description: |
        The transaction has a posting on the schedule's account. 409 occurrence_closed when the occurrence is not
        expected; 409 transaction_in_use when the transaction realizes another occurrence.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealizeInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/skip:
    post:
      tags: [planning]
      operationId: skipOccurrence
      summary: Skip an expected occurrence (T03; 409 occurrence_closed otherwise).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/move:
    post:
      tags: [planning]
      operationId: moveOccurrence
      summary: Move an expected occurrence to another date; terms changes never regenerate it (P7 amendment A52).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /schedules/{id}/terms:
    post:
      tags: [planning]
      operationId: changeScheduleTerms
      summary: Add a terms version effective from a date after the latest one (T09; P7 amendments A49, A52).
      description: |
        Without recurrence the previous rule is kept, start included. Expected occurrences from the date on that
        were not moved are regenerated; realized, skipped and moved ones stay. 409 schedule_ended on or after ends_on.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermsInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /schedules/{id}/pauses:
    post:
      tags: [planning]
      operationId: pauseSchedule
      summary: Suppress the dates in [from, to] (P7 amendment A52).
      description: 409 pause_overlap when it overlaps another pause; 409 schedule_ended on or after ends_on.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePause"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /schedules/{id}/end:
    post:
      tags: [planning]
      operationId: endSchedule
      summary: Produce no occurrence on or after a date; expected ones are removed, realized ones stay (P7 amendment A52).
      description: 409 schedule_ended when the schedule already ends on or before the date.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /budgets:
    get:
      tags: [planning]
      operationId: listBudgets
      summary: Budgets in creation order.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [planning]
      operationId: createBudget
      summary: Create the monthly budget of a category (P7 amendment A54; 409 budget_exists when it has one).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budgets/{id}:
    get:
      tags: [planning]
      operationId: getBudget
      summary: A budget with its amounts by month.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /budgets/{id}/amounts:
    post:
      tags: [planning]
      operationId: addBudgetAmount
      summary: Set the amount from a month on, after the latest one (T09).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetAmount"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budgets/{id}/progress:
    get:
      tags: [planning]
      operationId: getBudgetProgress
      summary: Planned, carried, spent and available amounts of a month, accrual view (P7 amendment A54).
      description: Spending of an income category is reported as a positive amount.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetProgress"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /goals:
    get:
      tags: [planning]
      operationId: listGoals
      summary: Goals in creation order, with their progress today.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [planning]
      operationId: createGoal
      summary: Create a target balance over balance accounts by a date (P7 amendment A55).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /goals/{id}:
    get:
      tags: [planning]
      operationId: getGoal
      summary: A goal with its progress today.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/projection:
    get:
      tags: [planning]
      operationId: getProjection
      summary: Projected balance of a balance account to a date after today, at most today + 12 months (P7 amendment A56).
      description: |
        opening is the booked balance today. Each point is an expected occurrence on the account, an overdue one
        dated today, ordered by date then amount. closing is the booked balance at to plus every point.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Projection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /commitments:
    get:
      tags: [planning]
      operationId: getCommitted
      summary: Installments and expected bills, subscriptions and savings committed in a month (P7 amendment A57).
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Committed"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/unrealize:
    post:
      tags: [planning]
      operationId: unrealizeOccurrence
      summary: Release a realized occurrence (409 occurrence_closed when it is not realized).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: equori_session
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    SessionCookie:
      name: equori_session
      in: cookie
      required: false
      schema:
        type: string
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ScheduleKind:
      type: string
      enum: [bill, income, subscription, transfer, savings]
    Recurrence:
      type: object
      additionalProperties: false
      required: [frequency, interval, start]
      description: |
        A monthly rule takes exactly one of day_of_month, weekday with ordinal, business_day_ordinal; -1 means
        the last one. Business days follow calendar br_banking. until is inclusive (P7 amendment A48).
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
          minimum: 1
          maximum: 120
        day_of_month:
          type: integer
          minimum: -1
          maximum: 31
        weekday:
          type: string
          enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
        ordinal:
          type: integer
          minimum: -1
          maximum: 5
        business_day_ordinal:
          type: integer
          minimum: -1
          maximum: 23
        adjustment:
          type: string
          enum: [none, following, preceding, modified_following]
          default: none
        start:
          type: string
          format: date
        until:
          type: string
          format: date
        count:
          type: integer
          minimum: 1
          maximum: 10000
    ScheduleInput:
      type: object
      additionalProperties: false
      required: [kind, account_id, counterpart_id, description, amount, recurrence]
      properties:
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        account_id:
          type: string
          format: uuid
        counterpart_id:
          type: string
          format: uuid
        payee_id:
          type: string
          format: uuid
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        match_tolerance_bp:
          type: integer
          minimum: 0
          maximum: 10000
          default: 1000
        grace_days:
          type: integer
          minimum: 0
          maximum: 31
          default: 3
    ScheduleTerms:
      type: object
      required: [effective_from, amount, recurrence]
      properties:
        effective_from:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        recurrence:
          $ref: "#/components/schemas/Recurrence"
    SchedulePause:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Inclusive.
    Schedule:
      type: object
      required: [id, kind, account_id, counterpart_id, description, match_tolerance_bp, grace_days, terms, pauses]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        account_id:
          type: string
          format: uuid
        counterpart_id:
          type: string
          format: uuid
        payee_id:
          type: string
          format: uuid
        description:
          type: string
        match_tolerance_bp:
          type: integer
        grace_days:
          type: integer
        ends_on:
          type: string
          format: date
          description: No occurrence on or after this date; absent while the schedule has no end.
        terms:
          type: array
          description: Versions by effective date.
          items:
            $ref: "#/components/schemas/ScheduleTerms"
        pauses:
          type: array
          items:
            $ref: "#/components/schemas/SchedulePause"
    SchedulePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        next_cursor:
          type: string
          description: Absent on the last page.
    OccurrenceState:
      type: string
      enum: [expected, overdue, realized, skipped]
    Occurrence:
      type: object
      required: [id, schedule_id, sequence, expected_on, expected_amount, state]
      properties:
        id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        sequence:
          type: integer
        expected_on:
          type: string
          format: date
        expected_amount:
          $ref: "#/components/schemas/Money"
        state:
          $ref: "#/components/schemas/OccurrenceState"
        transaction_id:
          type: string
          format: uuid
          description: Present when realized.
        moved_from:
          type: string
          format: date
          description: The generated date of a moved occurrence.
    BudgetAmount:
      type: object
      additionalProperties: false
      required: [effective_from, amount]
      properties:
        effective_from:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        amount:
          $ref: "#/components/schemas/Money"
    BudgetInput:
      type: object
      additionalProperties: false
      required: [category_id, amount, effective_from, rollover]
      properties:
        category_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        effective_from:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        rollover:
          type: boolean
    Budget:
      type: object
      required: [id, category_id, rollover, amounts]
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        rollover:
          type: boolean
        amounts:
          type: array
          description: Versions by month.
          items:
            $ref: "#/components/schemas/BudgetAmount"
    BudgetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Budget"
        next_cursor:
          type: string
          description: Absent on the last page.
    BudgetProgress:
      type: object
      required: [month, planned, carried, spent, available]
      description: |
        carried is the previous month's available amount when rollover is set, else zero; available is
        planned + carried - spent, negative when overspent.
      properties:
        month:
          type: string
        planned:
          $ref: "#/components/schemas/Money"
        carried:
          $ref: "#/components/schemas/Money"
        spent:
          $ref: "#/components/schemas/Money"
        available:
          $ref: "#/components/schemas/Money"
    GoalInput:
      type: object
      additionalProperties: false
      required: [name, target, due_on, account_ids]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        target:
          $ref: "#/components/schemas/Money"
        due_on:
          type: string
          format: date
        account_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
    Goal:
      type: object
      required: [id, name, target, due_on, account_ids, current, remaining, progress_bp]
      description: |
        current is the sum of the booked balances of the accounts today; remaining is max(target - current, 0);
        progress_bp is current / target in basis points, rounded down, between 0 and 10000.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        target:
          $ref: "#/components/schemas/Money"
        due_on:
          type: string
          format: date
        account_ids:
          type: array
          items:
            type: string
            format: uuid
        current:
          $ref: "#/components/schemas/Money"
        remaining:
          $ref: "#/components/schemas/Money"
        progress_bp:
          type: integer
    GoalPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
        next_cursor:
          type: string
          description: Absent on the last page.
    ProjectionPoint:
      type: object
      required: [date, occurrence_id, schedule_id, amount, balance]
      properties:
        date:
          type: string
          format: date
        occurrence_id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        balance:
          $ref: "#/components/schemas/Money"
    Projection:
      type: object
      required: [account_id, from, to, opening, closing, points]
      properties:
        account_id:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        opening:
          $ref: "#/components/schemas/Money"
        closing:
          $ref: "#/components/schemas/Money"
        points:
          type: array
          items:
            $ref: "#/components/schemas/ProjectionPoint"
    Committed:
      type: object
      required: [month, installments, occurrences, total]
      properties:
        month:
          type: string
        installments:
          $ref: "#/components/schemas/Money"
        occurrences:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
    SkipInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
    MoveInput:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date:
          type: string
          format: date
    TermsInput:
      type: object
      additionalProperties: false
      required: [effective_from]
      description: At least one of amount and recurrence.
      properties:
        effective_from:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        recurrence:
          $ref: "#/components/schemas/Recurrence"
    EndInput:
      type: object
      additionalProperties: false
      required: [from]
      properties:
        from:
          type: string
          format: date
    RealizeInput:
      type: object
      additionalProperties: false
      required: [transaction_id]
      properties:
        transaction_id:
          type: string
          format: uuid
    OccurrenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
    SourceCategory:
      type: object
      required: [id, provider, external_id, name, count]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [pluggy]
        external_id:
          type: string
        name:
          type: string
        count:
          type: integer
        category_id:
          type: string
          format: uuid
          description: Absent while unmapped.
    SourceCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceCategory"
        next_cursor:
          type: string
          description: Absent on the last page.
    SourceCategoryMapping:
      type: object
      additionalProperties: false
      required: [category_id]
      properties:
        category_id:
          type: string
          format: uuid
          nullable: true
    IntegrationInput:
      type: object
      additionalProperties: false
      required: [provider, name, client_id, client_secret]
      properties:
        provider:
          type: string
          enum: [pluggy]
        name:
          type: string
          minLength: 1
          maxLength: 60
        client_id:
          type: string
          minLength: 1
          maxLength: 200
        client_secret:
          type: string
          minLength: 1
          maxLength: 200
    IntegrationCredentials:
      type: object
      additionalProperties: false
      required: [client_id, client_secret]
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 200
        client_secret:
          type: string
          minLength: 1
          maxLength: 200
    Integration:
      type: object
      required: [id, provider, name, updated_at]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [pluggy]
        name:
          type: string
        updated_at:
          type: string
          format: date-time
    IntegrationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Integration"
        next_cursor:
          type: string
          description: Absent on the last page.
    ConnectionInput:
      type: object
      additionalProperties: false
      required: [integration_id, item_id]
      properties:
        integration_id:
          type: string
          format: uuid
        item_id:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 60
    Connection:
      type: object
      required: [id, integration_id, item_id, name, provider_status, created_at, accounts]
      properties:
        id:
          type: string
          format: uuid
        integration_id:
          type: string
          format: uuid
        item_id:
          type: string
        name:
          type: string
        provider_status:
          type: string
          description: The item status the provider reported (Pluggy UPDATED, LOGIN_ERROR, OUTDATED, ...).
        last_item_update_at:
          type: string
          format: date-time
        last_synced_at:
          type: string
          format: date-time
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ExternalAccount"
    SyncResult:
      type: object
      required: [connection, batches]
      properties:
        connection:
          $ref: "#/components/schemas/Connection"
        batches:
          type: array
          items:
            $ref: "#/components/schemas/ImportBatch"
    ConnectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        next_cursor:
          type: string
          description: Absent on the last page.
    ExternalAccount:
      type: object
      required: [id, type, subtype, name, currency, state]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        subtype:
          type: string
        name:
          type: string
        number_last4:
          type: string
          description: Last four digits of the account number; the full number is never stored.
        currency:
          type: string
        state:
          type: string
          enum: [pending, mapped, ignored]
        account_id:
          type: string
          format: uuid
        sync_from:
          type: string
          format: date
        last_synced_on:
          type: string
          format: date
    AccountMappingInput:
      type: object
      additionalProperties: false
      description: account_id with sync_from maps the account; ignored true leaves it out of syncs.
      properties:
        account_id:
          type: string
          format: uuid
        sync_from:
          type: string
          format: date
        ignored:
          type: boolean
    RecordResolution:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [match, create, discard]
        transaction_id:
          type: string
          format: uuid
          description: Required for match; one of the record's candidates.
    ExternalRecord:
      type: object
      required: [id, batch_id, account_id, date, amount, description, state, candidates]
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        external_id:
          type: string
        date:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
        state:
          type: string
          enum: [received, matched, created, needs_review, discarded, withdrawn]
        transaction_id:
          type: string
          format: uuid
        candidates:
          type: array
          description: Transactions the record may confirm, while it needs review.
          items:
            type: string
            format: uuid
        unapplied_change:
          type: string
          description: A change the aggregator reported that the ledger did not take (P6 amendment A36).
    ExternalRecordList:
      type: object
      required: [items]
      properties:
        items:
