          type: string
          format: uuid
        instrument:
          type: string
          pattern: "^[A-Z0-9.]{2,20}$"
        kind:
          $ref: "#/components/schemas/CorporateActionKind"
        date:
          type: string
          format: date
          description: The first day without the right.
        ratio_from:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
        ratio_to:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          description: Units received for each ratio_from held.
