          type: string
        tags:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        referenced_by:
          type: array
          description: Set only by GET /transactions/{id}; ordered by type, then source.
          items:
            $ref: "#/components/schemas/LinkReference"
        investment_income:
          $ref: "#/components/schemas/InvestmentIncome"
        trade:
          $ref: "#/components/schemas/Trade"
        corporate_action:
          $ref: "#/components/schemas/CorporateAction"
        postings:
          type: array
          items:
            $ref: "#/components/schemas/Posting"
    TransactionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        next_cursor:
          type: string
    TransferInput:
      type: object
      additionalProperties: false
      required: [expected_version, account_id]
      properties:
        expected_version:
          type: integer
          minimum: 1
        account_id:
          type: string
          format: uuid
        pair_with:
          type: string
          format: uuid
          description: The pairing candidate to use when there are several.
    ReimbursementInput:
      type: object
      additionalProperties: false
      required: [expected_version, allocations]
      properties:
        expected_version:
          type: integer
          minimum: 1
        allocations:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ReimbursementAllocation"
    ReimbursementAllocation:
      type: object
      additionalProperties: false
      required: [original_id, amount]
      properties:
        original_id:
          type: string
          format: uuid
          description: The expense this transaction repays.
        amount:
          $ref: "#/components/schemas/Money"
        category_id:
          type: string
          format: uuid
          description: Expense category that replaces the categories of the expense and takes the reimbursement.
    ReimbursementCandidate:
      type: object
      required: [transaction, remaining, allocated]
      properties:
        transaction:
          $ref: "#/components/schemas/Transaction"
        remaining:
          $ref: "#/components/schemas/Money"
        allocated:
          $ref: "#/components/schemas/Money"
    ReimbursementCandidateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReimbursementCandidate"
        suggestion:
          type: array
          items:
            type: string
            format: uuid
    ReimbursementSource:
      type: object
      required: [transaction, free]
      properties:
        transaction:
          $ref: "#/components/schemas/Transaction"
        free:
          $ref: "#/components/schemas/Money"
    ReimbursementSourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReimbursementSource"
    TransferResult:
      type: object
      required: [transaction]
      properties:
        transaction:
          $ref: "#/components/schemas/Transaction"
        voided_transaction_id:
          type: string
          format: uuid
          description: The paired transaction that was voided.
    BulkCategorizeInput:
      type: object
      additionalProperties: false
      required: [category_id, items]
      properties:
        category_id:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, expected_version]
            properties:
              id:
                type: string
                format: uuid
              expected_version:
                type: integer
                minimum: 1
    BulkCategorizeResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One result per item, in request order.
          items:
            $ref: "#/components/schemas/BulkCategorizeItemResult"
    BulkCategorizeItemResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [categorized, version_conflict, transaction_voided, not_categorizable, not_found]
        version:
          type: integer
          description: The new version when status is categorized.
    BulkVoidInput:
      type: object
      additionalProperties: false
      required: [reason, items]
      properties:
        reason:
          type: string
          maxLength: 500
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id:
                type: string
                format: uuid
    BulkVoidResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One result per item, in request order.
          items:
            $ref: "#/components/schemas/BulkVoidItemResult"
    BulkVoidItemResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [voided, not_found, transaction_voided, posting_reconciled, later_sale_exists]
    CategorizeInput:
      type: object
      additionalProperties: false
      required: [expected_version, parts]
      properties:
        expected_version:
          type: integer
          minimum: 1
        parts:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/CategoryPart"
        payee_id:
          type: string
          format: uuid
    CategoryPart:
      type: object
      additionalProperties: false
      required: [account_id, amount]
      properties:
        account_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
    VoidInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
    TransactionVersion:
      type: object
      required: [version, reason, replaced_at, transaction]
      properties:
        version:
          type: integer
        reason:
          type: string
        replaced_at:
          type: string
          format: date-time
        transaction:
          $ref: "#/components/schemas/Transaction"
    TransactionVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransactionVersion"
    CalendarList:
      type: object
      required: [items, default]
      properties:
        default:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: Calendar id the owner's region gives a new record (ADR 016).
        items:
          type: array
          items:
            $ref: "#/components/schemas/Calendar"
    Calendar:
      type: object
      additionalProperties: false
      required: [id, weekend]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        weekend:
          type: array
          items:
            type: string
            enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
    HolidayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Holiday"
    Index:
      type: object
      additionalProperties: false
      required: [id, period, first, last, expected]
      properties:
        id:
          type: string
        expected:
          type: boolean
          description: An enabled expectation source stored points for the index (ADR 026 E5).
        period:
          type: string
          enum: [day, month]
          description: The span one rate covers.
        first:
          type: string
          format: date
        last:
          type: string
          format: date
    IndexList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Index"
    IndexExpectations:
      type: object
      additionalProperties: false
      required: [survey_date, items]
      properties:
        survey_date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: "#/components/schemas/IndexExpectation"
    CurveList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Curve"
    Curve:
      type: object
      additionalProperties: false
      required: [id, kind, index, currency, base_date, source, points]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        kind:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: nominal for a fixed rate, real for a spread over the index.
        index:
          type: string
          nullable: true
          description: The index a real curve is a spread over.
        currency:
          type: string
        base_date:
          type: string
          format: date
        source:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/CurvePoint"
    CurvePoint:
      type: object
      additionalProperties: false
      required: [maturity, rate]
      properties:
        maturity:
          type: string
          format: date
        rate:
          type: string
          description: Annual rate at the maturity, an exact decimal fraction (0.1310 is 13.10%).
          example: "0.131000000000"
    InstitutionIndicators:
      type: object
      additionalProperties: false
      required:
        - source
        - source_url
        - currency
        - conglomerate_code
        - conglomerate_name
        - limits
        - periods
      properties:
        source:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        source_url:
          type: string
          description: The address of the portal of the source, where the figures can be checked.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: The currency of equity and net_income, whatever the base currency of the book.
        conglomerate_code:
          type: string
        conglomerate_name:
          type: string
          description: Whose figures these are, as of the newest period; the institution is covered by this conglomerate (A237 I6).
        limits:
          $ref: "#/components/schemas/InstitutionLimits"
        periods:
          type: array
          description: One item per quarter the source holds, newest first (A237 H3).
          minItems: 1
          items:
            $ref: "#/components/schemas/InstitutionPeriod"
    InstitutionPeriod:
      type: object
      additionalProperties: false
      required: [period, basel, principal_capital, fixed_asset, equity, net_income]
      properties:
        period:
          type: string
          format: date
          description: The last day of the quarter the figures refer to.
        basel:
          type: string
          nullable: true
          description: The Basel index, an exact decimal fraction (0.155 is 15.5%); null when the source does not inform it.
        principal_capital:
          type: string
          nullable: true
          description: The principal capital ratio, an exact decimal fraction; null when not informed.
        fixed_asset:
          type: string
          nullable: true
          description: The fixed-asset ratio (imobilização), an exact decimal fraction; null when not informed.
        equity:
          type: integer
          format: int64
          nullable: true
          description: The equity in minor units of currency; null when not informed.
        net_income:
          type: integer
          format: int64
          nullable: true
          description: The net income of the period in minor units of currency; null when not informed.
    CompanyReportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompanyReport"
    CompanyReport:
      type: object
      additionalProperties: false
      required: [source, source_url, identifier, name, consolidated, plan, currency, periods]
      properties:
        source:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        source_url:
          type: string
        identifier:
          type: string
          description: The company's identifier at the regulator.
        name:
          type: string
        consolidated:
          type: boolean
          description: True when the newest period reads the consolidated statements (CR3).
        plan:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: standard, or other for a chart of accounts without the standard lines (CR5).
        currency:
          type: string
        periods:
          type: array
          description: Newest first by period, then by months.
          items:
            $ref: "#/components/schemas/CompanyReportPeriod"
    CompanyReportPeriod:
      type: object
      additionalProperties: false
      description: A null account is a line the filing lacks or the chart of accounts does not hold; it is never zero.
      required: [period, months, delivered, total_assets, current_assets, cash, short_investments, current_liabilities, short_debt, long_debt, equity, revenue, gross_profit, net_income, operating_cash_flow, shares_issued, shares_treasury]
      properties:
        period:
          type: string
          format: date
          description: Last day of the fiscal year or quarter.
        months:
          type: integer
          minimum: 1
          maximum: 12
          description: 12 for a fiscal year; 3, 6 or 9 for the year to date of a quarter.
        delivered:
          type: string
          format: date
          nullable: true
        total_assets:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        current_assets:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        cash:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        short_investments:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        current_liabilities:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        short_debt:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        long_debt:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        equity:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        revenue:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        gross_profit:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        net_income:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        operating_cash_flow:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        shares_issued:
          type: integer
          format: int64
          nullable: true
          description: Count of shares.
        shares_treasury:
          type: integer
          format: int64
          nullable: true
          description: Count of shares held in treasury.
    FundReportList:
      type: object
      required: [items, candidates]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FundReport"
        candidates:
          type: array
          description: FR15. For each enabled source whose report set for the instrument is empty, the funds that share the instrument's exchange and code; a link by symbol picks one.
          items:
            $ref: "#/components/schemas/FundReportCandidate"
    FundReportCandidate:
      type: object
      additionalProperties: false
      required: [source, identifier, name, segment]
      properties:
        source:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        identifier:
          type: string
          description: The fund's identifier at the regulator; the value of the symbol that links it.
        name:
          type: string
        segment:
          type: string
    FundReport:
      type: object
      additionalProperties: false
      required: [source, source_url, exchange, code, currency, identifier, name, segment, periods]
      properties:
        source:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        source_url:
          type: string
          description: The register's page of the dataset.
        exchange:
          type: string
        code:
          type: string
        currency:
          type: string
        identifier:
          type: string
          description: The fund's identifier at the register, as of the newest period.
        name:
          type: string
        segment:
          type: string
          description: The segment as the source writes it; empty when the source states none.
        periods:
          type: array
          items:
            $ref: "#/components/schemas/FundReportPeriod"
    FundReportPeriod:
      type: object
      additionalProperties: false
      required: [period, delivered, net_assets, holders, units, unit_book_value, admin_fee, month_yield, month_amortization]
      description: A null figure is a value the source leaves blank; it is never zero.
      properties:
        period:
          type: string
          format: date
          description: The first day of the month the report covers.
        delivered:
          type: string
          format: date
          nullable: true
        net_assets:
          type: integer
          format: int64
          nullable: true
          description: Minor units of the report's currency.
        holders:
          type: integer
          format: int64
          nullable: true
        units:
          type: string
          nullable: true
          description: Units issued, an exact decimal.
        unit_book_value:
          type: string
          nullable: true
          description: Book value of one unit in the report's currency, an exact decimal.
        admin_fee:
          type: string
          nullable: true
          description: Administration fee of the month over the net assets, an exact decimal fraction.
        month_yield:
          type: string
          nullable: true
          description: Distributions of the month over the book value, an exact decimal fraction.
        month_amortization:
          type: string
          nullable: true
          description: Amortization of the month, an exact decimal fraction.
    InstitutionLimits:
      type: object
      additionalProperties: false
      required: [basel, principal_capital, rule]
      description: The regulatory floors of the jurisdiction of the source (A237 L1).
      properties:
        basel:
          $ref: "#/components/schemas/InstitutionFloor"
        principal_capital:
          $ref: "#/components/schemas/InstitutionFloor"
        rule:
          type: string
          description: The rule that sets the floors.
    InstitutionFloor:
      type: object
      additionalProperties: false
      required: [minimum, with_buffer]
      properties:
        minimum:
          type: string
          description: The minimum the rule sets, an exact decimal fraction.
        with_buffer:
          type: string
          description: The minimum plus the conservation buffer, an exact decimal fraction.
    IndexExpectation:
      type: object
      additionalProperties: false
      required: [date, rate]
      properties:
        date:
          type: string
          format: date
        rate:
          type: string
          description: Expected annual rate of the index on the date, an exact decimal fraction (0.1315 is 13.15%).
          example: "0.131500000000"
    MarketDataFeed:
      type: object
      additionalProperties: false
      required: [id, kind, enabled, suggested, last, stale, last_run, error, official, covers, history_pending, symbol_override, current, current_at, current_error]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        kind:
          type: string
          enum: [price, index, expectation, curve, institution, fund_report, company_report]
        enabled:
          type: boolean
        suggested:
          type: boolean
          description: Suggested for the calling book's region (ADR 025 F3); a suggestion enables nothing.
        last:
          type: string
          format: date
          nullable: true
          description: The latest date the feed stored.
        stale:
          type: boolean
          description: Enabled, and its next publication is overdue (ADR 025 F9).
        last_run:
          type: string
          format: date-time
          nullable: true
          description: The last tick that ran the feed since the process started.
        error:
          type: string
          nullable: true
          description: The failure of that tick, null when it succeeded.
        official:
          type: boolean
          description: False for a source that publishes no terms for this use; its prices rank last (A222 MQ1).
        covers:
          type: integer
          description: The number of defined instruments the source quotes; 0 for an index or expectation feed (A222 MQ25).
        history_pending:
          type: integer
          description: The history requests of the source not yet done (A222 MQ25).
        symbol_override:
          type: boolean
          description: The source reads a symbol set on the instrument (A222 MQ20).
        current:
          type: boolean
          description: The source reports current quotes (A248 CQ25).
        current_at:
          type: string
          format: date-time
          nullable: true
          description: Instant of its last successful request for current quotes.
        current_error:
          type: string
          nullable: true
          description: Message of its last failed request for current quotes.
    MarketDataFeedList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketDataFeed"
    MarketDataFeedInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        accept_unofficial:
          type: boolean
          description: Required as true to enable a source whose official is false (A222 MQ22).
    IndexRate:
      type: object
      additionalProperties: false
      required: [date, rate]
      properties:
        date:
          type: string
          format: date
          description: The date the rate is published for; the first day of the month for a monthly index.
        rate:
          type: string
          description: Exact decimal fraction, negative when the index fell (0.0042 is 0.42%).
          example: "0.004200000000"
    IndexRateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IndexRate"
    Instrument:
      type: object
      additionalProperties: false
      required: [code, type, scale, name, owned, hidden]
      properties:
        code:
          type: string
        type:
          $ref: "#/components/schemas/InstrumentType"
        scale:
          type: integer
        name:
          type: string
        hidden:
          type: boolean
          description: The book hides the instrument from its lists (A238 HD3).
        owned:
          type: boolean
          description: The instrument belongs to the book and no other book reads it.
        issuer:
          $ref: "#/components/schemas/InstrumentIssuer"
        quote_currency:
          type: string
          description: Absent for currencies.
        exchange:
          type: string
          pattern: "^[A-Z0-9]{4}$"
        subtype:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        symbols:
          $ref: "#/components/schemas/InstrumentSymbols"
        coverage:
          $ref: "#/components/schemas/InstrumentCoverage"
    InstrumentIssuer:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scheme:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: Registry of the identifier, such as br_cnpj.
        id:
          type: string
          minLength: 1
          maxLength: 40
    InstrumentCoverage:
      type: object
      additionalProperties: false
      required: [first, last, count, stale, sources]
      properties:
        first:
          type: string
          format: date
          nullable: true
          description: The first date with a price against the quote currency; any quote for a currency.
        last:
          type: string
          format: date
          nullable: true
        count:
          type: integer
          description: The number of dates with a price.
        stale:
          type: boolean
          description: An enabled source quotes the instrument and its next price is overdue (A222 MQ24).
        sources:
          type: array
          description: Every registered source that quotes the instrument, enabled or not.
          items:
            $ref: "#/components/schemas/InstrumentSourceCoverage"
    InstrumentSourceCoverage:
      type: object
      additionalProperties: false
      required: [id, enabled, official, first, last, history]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        enabled:
          type: boolean
        official:
          type: boolean
        first:
          type: string
          format: date
          nullable: true
        last:
          type: string
          format: date
          nullable: true
        history:
          allOf:
            - $ref: "#/components/schemas/InstrumentHistory"
          nullable: true
    InstrumentHistory:
      type: object
      additionalProperties: false
      required: [from, done, error]
      properties:
        from:
          type: string
          format: date
        done:
          type: boolean
        error:
          type: string
          nullable: true
          description: The failure of the last attempt; the next tick tries again.
    CatalogListing:
      type: object
      additionalProperties: false
      required: [code, name, exchange, quote_currency, symbol, source, defined]
      properties:
        code:
          type: string
        name:
          type: string
          description: Empty when the source states none.
        type:
          $ref: "#/components/schemas/InstrumentType"
        exchange:
          type: string
          description: ISO 10383 MIC, or empty.
        quote_currency:
          type: string
          description: Empty when the source states none.
        symbol:
          type: string
          description: The symbol the source requests, or empty.
        source:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        defined:
          type: boolean
          description: An instrument with this code exists.
    CatalogSearch:
      type: object
      required: [items, unavailable]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogListing"
        unavailable:
          type: array
          description: The enabled sources that failed or passed their bound.
          items:
            type: string
            pattern: "^[a-z0-9_]{2,40}$"
    ProbeInput:
      type: object
      additionalProperties: false
      required: [code, type, quote_currency]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9.]{2,20}$"
        type:
          $ref: "#/components/schemas/InstrumentType"
        exchange:
          type: string
          pattern: "^[A-Z0-9]{4}$"
        quote_currency:
          type: string
        symbols:
          $ref: "#/components/schemas/InstrumentSymbols"
    ProbeQuote:
      type: object
      additionalProperties: false
      required: [source, date, value, error]
      properties:
        source:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        date:
          type: string
          format: date
          nullable: true
        value:
          type: string
          nullable: true
          description: The price in the quote currency of the request; an exact decimal.
        error:
          type: string
          nullable: true
    ProbeResult:
      type: object
      required: [quotes, available]
      properties:
        quotes:
          type: array
          description: One item per enabled source that would quote the instrument.
          items:
            $ref: "#/components/schemas/ProbeQuote"
        available:
          type: array
          description: The disabled sources that would quote the instrument.
          items:
            type: string
            pattern: "^[a-z0-9_]{2,40}$"
    InstrumentPricePoint:
      type: object
      additionalProperties: false
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          $ref: "#/components/schemas/Rate"
    InstrumentPricesInput:
      type: object
      additionalProperties: false
      required: [quote_instrument, prices]
      properties:
        quote_instrument:
          type: string
        prices:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            $ref: "#/components/schemas/InstrumentPricePoint"
        dry_run:
          type: boolean
          description: True stores nothing and returns the counts.
    InstrumentPricesResult:
      type: object
      required: [new, replaced, unchanged, below_feed]
      properties:
        new:
          type: integer
          description: Dates without a csv price.
        replaced:
          type: integer
          description: Dates whose csv price has another value.
        unchanged:
          type: integer
          description: Dates whose csv price has the same value.
        below_feed:
          type: integer
          description: Dates of the request that hold a price of an official source.
    InstrumentHistoryInput:
      type: object
      additionalProperties: false
      required: [from]
      properties:
        from:
          type: string
          format: date
    InstrumentInput:
      type: object
      additionalProperties: false
      required: [code, type, scale, name, quote_currency]
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9.]{2,20}$"
        type:
          $ref: "#/components/schemas/InstrumentType"
        scale:
          type: integer
          minimum: 0
          maximum: 12
        name:
          type: string
          minLength: 1
          maxLength: 120
        quote_currency:
          type: string
        exchange:
          type: string
          pattern: "^[A-Z0-9]{4}$"
        subtype:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: Refines the type for the owner's jurisdiction, such as cri, cdb or equity_fund (investments design 4.1).
        symbols:
          $ref: "#/components/schemas/InstrumentSymbols"
        issuer:
          $ref: "#/components/schemas/InstrumentIssuer"
    InstrumentEdit:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        type:
          $ref: "#/components/schemas/InstrumentType"
        name:
          type: string
          minLength: 1
          maxLength: 120
        exchange:
          type: string
          pattern: "^[A-Z0-9]{4}$"
        subtype:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        symbols:
          $ref: "#/components/schemas/InstrumentSymbols"
        issuer:
          $ref: "#/components/schemas/InstrumentIssuer"
    InstrumentSymbols:
      type: object
      description: The symbol a source requests for the instrument, by source ID (A222 MQ20). In an edit, absent keeps the stored set and an empty object clears it.
      additionalProperties:
        type: string
        pattern: "^[A-Za-z0-9.=^_-]{1,40}$"
    InstrumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Instrument"
    FixedIncomeTermsInput:
      type: object
      additionalProperties: false
      required: [issued_on, matures_on, day_count, face_value]
      properties:
        issued_on:
          type: string
          format: date
        matures_on:
          type: string
          format: date
        index_id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: The index the security follows; absent for a pre-fixed security.
        percent_of_index_bp:
          type: integer
          minimum: 1
          description: 10000 is 100% of the index; 10000 when omitted.
        spread_bp:
          type: integer
          minimum: 0
          description: Annual spread over the index, or the annual rate of a pre-fixed security; 0 when omitted.
        day_count:
          $ref: "#/components/schemas/TermsDayCount"
        face_value:
          type: integer
          format: int64
          minimum: 1
          description: Price of one unit on issued_on, in minor units of the quote currency.
        calendar_id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: Calendar whose business days bus252 counts when the index does not compound by business day.
        daily_liquidity:
          type: boolean
          description: The security can be redeemed on any business day; false when omitted.
        redeemable_from:
          type: string
          format: date
          description: First date of a redemption before maturity; absent when redeemable from issued_on.
        payments:
          type: array
          maxItems: 400
          items:
            $ref: "#/components/schemas/FixedIncomePayment"
          description: Dates of interest and principal; empty when omitted. Merged by date with the interest_every_months schedule.
        interest_every_months:
          type: integer
          enum: [1, 3, 6, 12]
          description: Interest paid every n months from first_payment_on up to matures_on; expands into payments.
        first_payment_on:
          type: string
          format: date
          description: First interest date; required with interest_every_months.
    FixedIncomeTerms:
      type: object
      required: [issued_on, matures_on, percent_of_index_bp, spread_bp, day_count, face_value, daily_liquidity, payments]
      properties:
        issued_on:
          type: string
          format: date
        matures_on:
          type: string
          format: date
        index_id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        percent_of_index_bp:
          type: integer
        spread_bp:
          type: integer
        day_count:
          $ref: "#/components/schemas/TermsDayCount"
        face_value:
          type: integer
          format: int64
        calendar_id:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: Calendar whose business days bus252 counts when the index does not compound by business day.
        daily_liquidity:
          type: boolean
          description: The security can be redeemed on any business day; false when omitted.
        redeemable_from:
          type: string
          format: date
          description: First date of a redemption before maturity; absent when redeemable from issued_on.
        payments:
          type: array
          items:
            $ref: "#/components/schemas/FixedIncomePayment"
          description: The expanded payments, sorted by date; empty when none.
    FixedIncomePayment:
      type: object
      required: [pays_on, amortization_bp, pays_interest]
      properties:
        pays_on:
          type: string
          format: date
        amortization_bp:
          type: integer
          minimum: 0
          maximum: 10000
        pays_interest:
          type: boolean
    TermsDayCount:
      type: string
      enum: [bus252, act365]
    PriceInput:
      type: object
      additionalProperties: false
      required: [instrument, quote_instrument, date, value]
      properties:
        instrument:
          type: string
        quote_instrument:
          type: string
        date:
          type: string
          format: date
        value:
          $ref: "#/components/schemas/Rate"
    PriceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Price"
    InstrumentQuoteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InstrumentQuote"
    InstrumentQuote:
      type: object
      additionalProperties: false
      required: [instrument, quote_instrument, last, references, trend]
      properties:
        instrument:
          type: string
        quote_instrument:
          type: string
        trend:
          type: array
          description: The chosen price on or before each of 31 dates, every 3 days from 90 days before the date of `last` to that date, oldest first; null before the first price. Empty when the instrument has no price (IQ13).
          items:
            allOf:
              - $ref: "#/components/schemas/Rate"
            nullable: true
        last:
          allOf:
            - $ref: "#/components/schemas/QuotePoint"
          nullable: true
          description: The chosen price on or before today; null when the instrument has none.
        references:
          $ref: "#/components/schemas/QuoteReferences"
    QuoteReferences:
      type: object
      additionalProperties: false
      description: |
        The chosen price on or before 7 days, 1 month, 3 months and 12 months before the date of `last`, and on 31
        December of the previous year when `last` lies in the current year. A reference is null when no price exists on
        or before its date or when `last` does not lie after it.
      required: [week, month, quarter, year, year_to_date]
      properties:
        week:
          allOf:
            - $ref: "#/components/schemas/QuotePoint"
          nullable: true
        month:
          allOf:
            - $ref: "#/components/schemas/QuotePoint"
          nullable: true
        quarter:
          allOf:
            - $ref: "#/components/schemas/QuotePoint"
          nullable: true
        year:
          allOf:
            - $ref: "#/components/schemas/QuotePoint"
          nullable: true
        year_to_date:
          allOf:
            - $ref: "#/components/schemas/QuotePoint"
          nullable: true
    QuotePoint:
      type: object
      additionalProperties: false
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          $ref: "#/components/schemas/Rate"
    PriceImport:
      type: object
      required: [recorded]
      properties:
        recorded:
          type: integer
    Holiday:
      type: object
      required: [date, name, source]
      properties:
        date:
          type: string
          format: date
        name:
          type: string
          description: English text of a rule holiday, or the text typed for an instance holiday.
        code:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: Stable key of a rule holiday, which a client translates; absent for an instance holiday.
        source:
          type: string
          enum: [rule, instance]
    ScheduleKind:
      type: string
      enum: [bill, income, subscription, transfer, savings]
    Recurrence:
      type: object
      additionalProperties: false
      required: [frequency, interval, start]
      description: |
        A monthly rule takes exactly one of day_of_month, weekday with ordinal, business_day_ordinal; -1 means
        the last one. Business days follow the calendar of the schedule. until is inclusive (P7 amendment A48).
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
          minimum: 1
          maximum: 120
        day_of_month:
          type: integer
          minimum: -1
          maximum: 31
        weekday:
          type: string
          enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
        ordinal:
          type: integer
          minimum: -1
          maximum: 5
        business_day_ordinal:
          type: integer
          minimum: -1
          maximum: 23
        adjustment:
          type: string
          enum: [none, following, preceding, modified_following]
          default: none
        start:
          type: string
          format: date
        until:
          type: string
          format: date
        count:
          type: integer
          minimum: 1
          maximum: 10000
    ScheduleInput:
      type: object
      additionalProperties: false
      required: [kind, account_id, counterpart_id, description, amount, recurrence]
      properties:
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        account_id:
          type: string
          format: uuid
        counterpart_id:
          type: string
          format: uuid
        payee_id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
          description: |
            For the kinds savings and transfer: the goal that holds counterpart_id by allocations. Realizing an
            occurrence allocates its amount to that goal; unrealizing deletes that allocation (A255).
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        calendar:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: Business-day calendar id from GET /calendars; defaults to the calendar of the owner's region.
        match_tolerance_bp:
          type: integer
          minimum: 0
          maximum: 10000
          default: 1000
        grace_days:
          type: integer
          minimum: 0
          maximum: 31
          default: 3
        match_window_days:
          type: integer
    ScheduleTerms:
      type: object
      required: [effective_from, amount, recurrence]
      properties:
        effective_from:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        recurrence:
          $ref: "#/components/schemas/Recurrence"
    SchedulePause:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Inclusive.
    Schedule:
      type: object
      required: [id, kind, account_id, counterpart_id, description, calendar, match_tolerance_bp, grace_days, match_window_days, terms, pauses]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        calendar:
          type: string
          description: Business-day calendar id the schedule follows.
        account_id:
          type: string
          format: uuid
        counterpart_id:
          type: string
          format: uuid
        payee_id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
          description: |
            For the kinds savings and transfer: the goal that holds counterpart_id by allocations. Realizing an
            occurrence allocates its amount to that goal; unrealizing deletes that allocation (A255).
        description:
          type: string
        match_tolerance_bp:
          type: integer
        grace_days:
          type: integer
        match_window_days:
          type: integer
          minimum: 0
          maximum: 31
          default: 7
        ends_on:
          type: string
          format: date
          description: No occurrence on or after this date; absent while the schedule has no end.
        terms:
          type: array
          description: Versions by effective date.
          items:
            $ref: "#/components/schemas/ScheduleTerms"
        pauses:
          type: array
          items:
            $ref: "#/components/schemas/SchedulePause"
        moves:
          $ref: "#/components/schemas/ScheduleMoves"
    ScheduleMoves:
      type: object
      required: [from, to]
      readOnly: true
      description: |
        The sets a schedule of kind savings or transfer moves money between (A253): from is the set of its account and
        to the set of its counterpart. Absent for the other kinds.
      properties:
        from:
          $ref: "#/components/schemas/AccountSet"
        to:
          $ref: "#/components/schemas/AccountSet"
    AccountSet:
      type: string
      enum: [spending, savings, goals]
      description: |
        The set of an asset or liability account (A250): goals holds the accounts of the goals that do not count as
        savings; savings holds the savings, reserve and brokerage accounts outside it and the accounts of the goals that
        count as savings; spending holds every other account.
    SchedulePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        next_cursor:
          type: string
          description: Absent on the last page.
    OccurrenceState:
      type: string
      enum: [expected, overdue, realized, skipped]
    Occurrence:
      type: object
      required: [id, schedule_id, sequence, expected_on, expected_amount, state]
      properties:
        id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        sequence:
          type: integer
        expected_on:
          type: string
          format: date
        expected_amount:
          $ref: "#/components/schemas/Money"
        actual_amount:
          $ref: "#/components/schemas/Money"
        state:
          $ref: "#/components/schemas/OccurrenceState"
        transaction_id:
          type: string
          format: uuid
          description: Present when realized.
        moved_from:
          type: string
          format: date
          description: The generated date of a moved occurrence.
    BudgetAmount:
      type: object
      additionalProperties: false
      required: [effective_from, amount]
      properties:
        effective_from:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        amount:
          $ref: "#/components/schemas/Money"
    BudgetInput:
      type: object
      additionalProperties: false
      required: [category_id, amount, effective_from, rollover]
      properties:
        category_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        effective_from:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        rollover:
          type: boolean
    Budget:
      type: object
      required: [id, category_id, rollover, amounts]
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        rollover:
          type: boolean
        amounts:
          type: array
          description: Versions by month.
          items:
            $ref: "#/components/schemas/BudgetAmount"
    BudgetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Budget"
        next_cursor:
          type: string
          description: Absent on the last page.
    BudgetProgress:
      type: object
      required: [month, planned, carried, spent, goal_paid, available]
      description: |
        carried is the previous month's available amount when rollover is set, else zero; available is
        planned + carried - spent, negative when overspent. spent leaves out the expenses of the month that a goal
        pays, and goal_paid is the amount left out (planning coherence A257).
      properties:
        month:
          type: string
        planned:
          $ref: "#/components/schemas/Money"
        carried:
          $ref: "#/components/schemas/Money"
        spent:
          $ref: "#/components/schemas/Money"
        goal_paid:
          $ref: "#/components/schemas/Money"
        available:
          $ref: "#/components/schemas/Money"
    BudgetPlanSource:
      type: string
      enum: [expected_income, average_income, fixed]
    BudgetPlanIncome:
      type: object
      required: [schedule_id, description, amount]
      properties:
        schedule_id:
          type: string
          format: uuid
        description:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
    BudgetPlanRow:
      type: object
      required: [category_id, planned, last_month, average, counted]
      description: |
        A category of the plan. last_month and average read the subtree of a budgeted category and the own postings
        of another; counted is false for a budget under a category whose budget is in force.
      properties:
        category_id:
          type: string
          format: uuid
        budget_id:
          type: string
          format: uuid
        planned:
          $ref: "#/components/schemas/Money"
        last_month:
          $ref: "#/components/schemas/Money"
        average:
          $ref: "#/components/schemas/Money"
        counted:
          type: boolean
        next_change:
          type: string
          description: The month of the budget's first amount after this month.
    BudgetPlanAmount:
      type: object
      additionalProperties: false
      required: [category_id, amount]
      properties:
        category_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
    BudgetPlanInput:
      type: object
      additionalProperties: false
      required: [source, amounts]
      properties:
        source:
          $ref: "#/components/schemas/BudgetPlanSource"
        fixed:
          $ref: "#/components/schemas/Money"
        savings_target_bp:
          type: integer
          description: |
            The share of the reference set aside, in basis points, from 0 to 10000 (savings target A187, checked by the
            server as a 422 on this field). A save without it clears the stored target.
        amounts:
          type: array
          description: The changed categories only.
          maxItems: 500
          items:
            $ref: "#/components/schemas/BudgetPlanAmount"
    BudgetBucketInput:
      type: object
      additionalProperties: false
      required: [name, share_bp, takes_savings, category_ids]
      properties:
        id:
          type: string
          format: uuid
          description: The id of the bucket this one continues; absent for a new bucket (A241).
        name:
          type: string
          maxLength: 60
        share_bp:
          type: integer
          description: The bucket's share of the reference in basis points, from 0 to 10000.
        takes_savings:
          type: boolean
          description: The bucket also draws the month's savings; at most one bucket of a method.
        takes_goals:
          type: boolean
          default: false
          description: The bucket also draws what went into the goals' accounts from other accounts of the book; at most one bucket of a method, never the one that takes savings.
        at_least:
          type: boolean
          default: false
          description: The target is a floor the bucket should reach, not a ceiling it should stay under.
        category_ids:
          type: array
          maxItems: 500
          description: Expense categories placed in the bucket; a subcategory without a bucket of its own follows its ancestor.
          items:
            type: string
            format: uuid
    BudgetBucketsInput:
      type: object
      additionalProperties: false
      required: [buckets]
      properties:
        from:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
          description: First month of this version; the current month when absent (A240).
        buckets:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/BudgetBucketInput"
    BudgetBucket:
      type: object
      required: [id, name, share_bp, takes_savings, takes_goals, at_least, category_ids]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        share_bp:
          type: integer
        takes_savings:
          type: boolean
        takes_goals:
          type: boolean
        at_least:
          type: boolean
        category_ids:
          type: array
          items:
            type: string
            format: uuid
    BudgetBuckets:
      type: object
      required: [buckets]
      properties:
        from:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
          description: First month of the version in force; absent without a split.
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/BudgetBucket"
    BudgetBucketVersion:
      type: object
      required: [from, buckets]
      properties:
        from:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/BudgetBucket"
    BudgetBucketVersions:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/BudgetBucketVersion"
    BudgetBucketEntry:
      type: object
      required: [date, description, kind, amount]
      properties:
        transaction_id:
          type: string
          format: uuid
          description: Absent for an allocation to a goal, whose description is the goal's name (A255).
        category_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
        payee:
          type: string
        kind:
          type: string
          enum: [expense, savings, goals]
        amount:
          $ref: "#/components/schemas/Money"
    BudgetBucketEntries:
      type: object
      required: [currency, total, entries]
      properties:
        currency:
          type: string
        total:
          $ref: "#/components/schemas/Money"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/BudgetBucketEntry"
    BudgetBucketHistory:
      type: object
      required: [currency, methods, months]
      properties:
        currency:
          type: string
        methods:
          type: array
          items:
            $ref: "#/components/schemas/BudgetBucketVersion"
        months:
          type: array
          items:
            $ref: "#/components/schemas/BudgetBucketMonth"
    BudgetBucketMonth:
      type: object
      required: [month, received, outside, unallocated, retained, buckets]
      description: |
        received is the income of the month without retained, the yields and realized gains whose transaction has no
        posting in an account of the spending set (A252). unallocated is received minus the expenses by transaction date
        and the money set aside: an accrual figure, not money left in accounts (A235).
      properties:
        month:
          type: string
        from:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
          description: First month of the version that is the method of this month; absent without a split.
        received:
          $ref: "#/components/schemas/Money"
        outside:
          $ref: "#/components/schemas/Money"
        unallocated:
          $ref: "#/components/schemas/Money"
        retained:
          $ref: "#/components/schemas/Money"
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/BudgetBucketReal"
    BudgetBucketReal:
      type: object
      required: [id, real, goal_paid, covered]
      description: |
        The figures of a bucket in a month (A254). goal_paid is the spending of its categories that a goal paid; covered
        is the spending that the accumulated balance of its rollover budgets paid. A ceiling bucket kept its target when
        real - goal_paid - covered is at most the target. deposited and withdrawn are present for the bucket that takes
        goals: what went into the goal set and what left it; it kept its target when deposited is at least the target.
      properties:
        id:
          type: string
          format: uuid
        real:
          $ref: "#/components/schemas/Money"
        goal_paid:
          $ref: "#/components/schemas/Money"
        covered:
          $ref: "#/components/schemas/Money"
        deposited:
          $ref: "#/components/schemas/Money"
        withdrawn:
          $ref: "#/components/schemas/Money"
    BudgetPlanBucket:
      type: object
      required: [id, name, share_bp, takes_savings, takes_goals, at_least, category_ids, planned, spent]
      description: |
        A bucket of the method with its figures of the month (A230): target splits the reference by share and is absent
        with reference; planned sums the counted budgets of its categories, plus savings when it takes savings and
        goal_deposits when it takes goals (A253); spent sums the month's own postings of its categories, plus the realized
        savings when it takes savings.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        share_bp:
          type: integer
        takes_savings:
          type: boolean
        takes_goals:
          type: boolean
        at_least:
          type: boolean
        category_ids:
          type: array
          items:
            type: string
            format: uuid
        target:
          $ref: "#/components/schemas/Money"
        planned:
          $ref: "#/components/schemas/Money"
        spent:
          $ref: "#/components/schemas/Money"
    BudgetPlan:
      type: object
      required:
        - month
        - currency
        - source
        - received_income
        - installments
        - savings
        - goal_deposits
        - savings_brokerage
        - goal_deposits_brokerage
        - planned
        - rows
      description: |
        installments are those billed on the month's statements for purchases booked before it. savings is what the
        month's occurrences of savings and transfer schedules move into the savings set, minus what they move out of it;
        goal_deposits is the same over the goal set; savings_brokerage and goal_deposits_brokerage are their parts whose
        counterpart is a brokerage account (A253). unassigned is reference - installments - savings - goal_deposits -
        planned and is absent with reference, which is absent when the source has no figure.
      properties:
        month:
          type: string
        currency:
          type: string
        source:
          $ref: "#/components/schemas/BudgetPlanSource"
        fixed:
          $ref: "#/components/schemas/Money"
        expected_income:
          $ref: "#/components/schemas/Money"
        expected_items:
          type: array
          items:
            $ref: "#/components/schemas/BudgetPlanIncome"
        average_income:
          $ref: "#/components/schemas/Money"
        average_months:
          type: integer
          minimum: 1
          maximum: 3
        received_income:
          $ref: "#/components/schemas/Money"
        reference:
          $ref: "#/components/schemas/Money"
        installments:
          $ref: "#/components/schemas/Money"
        savings:
          $ref: "#/components/schemas/Money"
        goal_deposits:
          $ref: "#/components/schemas/Money"
        savings_brokerage:
          $ref: "#/components/schemas/Money"
        goal_deposits_brokerage:
          $ref: "#/components/schemas/Money"
        planned:
          $ref: "#/components/schemas/Money"
        unassigned:
          $ref: "#/components/schemas/Money"
        savings_target_bp:
          type: integer
          description: The stored savings target in basis points of the reference; absent without one (A187).
        savings_rate_bp:
          type: integer
          description: savings as basis points of reference, truncated; absent without a reference above zero (A188).
        savings_target:
          $ref: "#/components/schemas/Money"
        savings_gap:
          $ref: "#/components/schemas/Money"
        prices:
          type: array
          description: Prices that value occurrences in another currency at today (P8 amendment A72).
          items:
            $ref: "#/components/schemas/Price"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BudgetPlanRow"
        buckets:
          type: array
          description: The book's income bucket method; absent without one (A229).
          items:
            $ref: "#/components/schemas/BudgetPlanBucket"
        outside_planned:
          $ref: "#/components/schemas/Money"
        outside_spent:
          $ref: "#/components/schemas/Money"
        outside_category_ids:
          type: array
          description: |
            The open expense categories, the uncategorized one excepted, that resolve to no bucket of the method of the month,
            by name; present with `buckets` (A236).
          items:
            type: string
            format: uuid
    GoalInput:
      type: object
      additionalProperties: false
      required: [name, target, due_on]
      description: |
        A goal holds at least one account. account_ids are held whole: their balance counts. allocated_account_ids
        are held by allocated amounts, so several goals can share one account (planning coherence A255): an asset
        account without sub-accounts whose instrument is a currency. An account is held whole or by allocations
        across the goals of the book, never both.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        target:
          $ref: "#/components/schemas/Money"
        due_on:
          type: string
          format: date
        account_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        allocated_account_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        counts_as_savings:
          type: boolean
          description: |
            What goes into the goal's accounts counts in the bucket that takes savings instead of the bucket that
            takes goals (income buckets A239). False when absent.
    GoalPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        target:
          $ref: "#/components/schemas/Money"
        due_on:
          type: string
          format: date
        account_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        allocated_account_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          description: Replaces the accounts held by allocations; an account that leaves the list loses its allocations.
          items:
            type: string
            format: uuid
        counts_as_savings:
          type: boolean
          description: |
            What goes into the goal's accounts counts in the bucket that takes savings instead of the bucket that
            takes goals (income buckets A239).
    Goal:
      type: object
      required:
        - id
        - name
        - target
        - due_on
        - account_ids
        - counts_as_savings
        - current
        - remaining
        - progress_bp
        - spent
        - allocated_accounts
        - shared_with
      description: |
        current is the sum of the booked balances of the whole accounts today plus the amounts allocated to the goal
        in its allocated accounts (planning coherence A255), valued in the target currency with stored prices (P8
        amendment A72); remaining is max(target - current, 0); progress_bp is current / target
        in basis points, rounded down, between 0 and 10000. spent sums the expense postings of the transactions the
        goal pays, in the base currency (planning coherence A256).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        target:
          $ref: "#/components/schemas/Money"
        due_on:
          type: string
          format: date
        account_ids:
          type: array
          items:
            type: string
            format: uuid
        counts_as_savings:
          type: boolean
          description: |
            What goes into the goal's accounts counts in the bucket that takes savings instead of the bucket that
            takes goals (income buckets A239).
        current:
          $ref: "#/components/schemas/Money"
        remaining:
          $ref: "#/components/schemas/Money"
        progress_bp:
          type: integer
        spent:
          $ref: "#/components/schemas/Money"
        unexplained_withdrawal:
          $ref: "#/components/schemas/GoalWithdrawal"
        allocated_accounts:
          type: array
          items:
            $ref: "#/components/schemas/GoalAllocatedAccount"
        over_allocated:
          $ref: "#/components/schemas/Money"
        shared_with:
          type: array
          description: The other goals that hold one of this goal's accounts.
          items:
            type: string
            format: uuid
        prices:
          type: array
          description: Prices that value accounts in another currency (P8 amendment A72).
          items:
            $ref: "#/components/schemas/Price"
        parts:
          type: array
          description: |
            What current is made of: for each goal account, each instrument held in it and its sub-accounts with a
            non-zero quantity, in instrument order, valued in the target currency (P8 amendment A121).
          items:
            $ref: "#/components/schemas/GoalPart"
        trailing_return:
          $ref: "#/components/schemas/TrailingReturn"
    TrailingReturn:
      type: object
      required: [period_months, annual_bp]
      description: |
        The money-weighted return of the goal's accounts, taken as one tree, over the last 12 months or since their
        first posting if shorter, valued in the target currency (investments design 4.4). Absent with less than three
        months of postings or no external flow in the window.
      properties:
        period_months:
          type: integer
        annual_bp:
          type: integer
    GoalPart:
      type: object
      required: [account_id, instrument, quantity, value]
      properties:
        account_id:
          type: string
          format: uuid
        instrument:
          type: string
        quantity:
          $ref: "#/components/schemas/Money"
        value:
          $ref: "#/components/schemas/Money"
    GoalAllocatedAccount:
      type: object
      required: [account_id, allocated, available]
      description: |
        An account the goal holds by allocations (A255): allocated is the sum of this goal's allocations booked up to
        today; available is the booked balance of the account minus the allocations of every goal, negative when a
        withdrawal left the account over-allocated. Both are in the currency of the account. The goal's
        over_allocated sums the negated negative available amounts of its accounts, in the target currency.
      properties:
        account_id:
          type: string
          format: uuid
        allocated:
          $ref: "#/components/schemas/Money"
        available:
          $ref: "#/components/schemas/Money"
    GoalAllocationInput:
      type: object
      additionalProperties: false
      required: [account_id, amount]
      properties:
        account_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        booked_on:
          type: string
          format: date
          description: Today when absent.
    GoalAllocation:
      type: object
      required: [id, account_id, booked_on, amount]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        booked_on:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        occurrence_id:
          type: string
          format: uuid
          description: The occurrence that created the allocation; such an allocation is deleted by unrealizing it.
    GoalAllocations:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GoalAllocation"
    GoalWithdrawal:
      type: object
      required: [amount, since]
      description: |
        The latest withdrawal of the last 12 months from the accounts the goal holds whole into another balance
        account, less the expenses linked to the goal dated on or after it; absent when they cover it (planning
        coherence A256). The screen asks which expenses the goal paid.
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        since:
          type: string
          format: date
    GoalExpense:
      type: object
      required: [transaction_id, date, description, amount, direct]
      properties:
        transaction_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        direct:
          type: boolean
          description: Paid from an account the goal holds whole; false for a stored link.
    GoalExpenses:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GoalExpense"
    GoalPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
        next_cursor:
          type: string
          description: Absent on the last page.
    ProjectionPoint:
      type: object
      required: [date, occurrence_id, schedule_id, amount, balance]
      properties:
        date:
          type: string
          format: date
        occurrence_id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        balance:
          $ref: "#/components/schemas/Money"
    Projection:
      type: object
      required: [account_id, from, to, opening, closing, points]
      properties:
        account_id:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        opening:
          $ref: "#/components/schemas/Money"
        closing:
          $ref: "#/components/schemas/Money"
        points:
          type: array
          items:
            $ref: "#/components/schemas/ProjectionPoint"
    Committed:
      type: object
      required: [month, installments, occurrences, total]
      properties:
        month:
          type: string
        installments:
          $ref: "#/components/schemas/Money"
        occurrences:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        prices:
          type: array
          description: Prices that value occurrences in another currency at today (P8 amendment A72).
          items:
            $ref: "#/components/schemas/Price"
    SkipInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
    MoveInput:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date:
          type: string
          format: date
    TermsInput:
      type: object
      additionalProperties: false
      required: [effective_from]
      description: At least one of amount and recurrence.
      properties:
        effective_from:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        recurrence:
          $ref: "#/components/schemas/Recurrence"
    EndInput:
      type: object
      additionalProperties: false
      required: [from]
      properties:
        from:
          type: string
          format: date
    RealizeInput:
      type: object
      additionalProperties: false
      required: [transaction_id]
      properties:
        transaction_id:
          type: string
          format: uuid
    OccurrenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
    IncomeTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncomeType"
    AllocationGroup:
      type: object
      required: [key, value, share_bp]
      properties:
        key:
          type: string
        value:
          $ref: "#/components/schemas/Money"
        share_bp:
          type: integer
    Allocation:
      type: object
      required: [total, groups]
      properties:
        total:
          $ref: "#/components/schemas/Money"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/AllocationGroup"
        current:
          $ref: "#/components/schemas/CurrentQuotes"
    NetWorth:
      type: object
      required: [assets, liabilities, net]
      properties:
        assets:
          $ref: "#/components/schemas/Money"
        liabilities:
          $ref: "#/components/schemas/Money"
        net:
          $ref: "#/components/schemas/Money"
        current:
          $ref: "#/components/schemas/CurrentQuotes"
    NetWorthDay:
      type: object
      required: [date, assets, liabilities, net]
      properties:
        date:
          type: string
          format: date
        assets:
          $ref: "#/components/schemas/Money"
        liabilities:
          $ref: "#/components/schemas/Money"
        net:
          $ref: "#/components/schemas/Money"
        current:
          $ref: "#/components/schemas/CurrentQuotes"
    NetWorthDays:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NetWorthDay"
    ReturnFlow:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
    ReturnReport:
      type: object
      required: [annual_bp, flows, opening, closing, profile]
      properties:
        annual_bp:
          type: integer
        flows:
          type: array
          items:
            $ref: "#/components/schemas/ReturnFlow"
        opening:
          $ref: "#/components/schemas/Money"
        closing:
          $ref: "#/components/schemas/Money"
        profile:
          type: string
          enum: [rate, market]
          description: rate when every holding is the value_in currency or a fixed income instrument quoted in it; market otherwise (amendment A208 R11).
        period_bp:
          type: integer
        index:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: The daily index the report compares with, the named one or the region's default; absent only when the region has none and none is named (amendment A208 R21).
        benchmark:
          $ref: "#/components/schemas/ReturnBenchmark"
        inflation:
          $ref: "#/components/schemas/ReturnInflation"
        unavailable_reason:
          type: string
          pattern: "^[a-z_]{2,40}$"
          description: Why benchmark, or its percent_bp and annual_bp, is absent - no_index_for_region, currency_mismatch, nothing_held, no_yield_recorded, single_credit, single_credit_after_flow, too_small, too_few_days, no_rate_in_window or percent_undefined (amendment A208 R21).
        excluded:
          $ref: "#/components/schemas/ReturnExcluded"
    ReturnExcluded:
      type: object
      description: For a tree of cash whose yield is what the ledger records against the Yield account, the income and expense of the period that the comparison treated as flows, not as yield (amendment A208 R19).
      properties:
        income:
          $ref: "#/components/schemas/ReturnExcludedPart"
        expense:
          $ref: "#/components/schemas/ReturnExcludedPart"
    ReturnExcludedPart:
      type: object
      required: [amount, categories]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        categories:
          type: array
          maxItems: 3
          items:
            type: string
          description: The names of the categories that hold most of the amount.
    ReturnBenchmark:
      type: object
      required: [index, from, until, days, skipped, credits, restarted, started_late, index_bp]
      properties:
        started_late:
          type: boolean
          description: True when at least one rate of the period dated before from was left out, so the comparison starts after the first rate day of the window (amendment A208 R21).
        credits:
          type: integer
          description: For a tree whose yield is recorded, the yield credits the return covers, the positive credits after the first credit compared (amendment A208 R20); 0 otherwise.
        restarted:
          type: boolean
          description: True when a flow between two credits more than 7 days apart moved the start of the comparison to the credit after it (amendment A208 R20).
        percent_error_bp:
          type: integer
          description: The relative bound of percent_bp and annual_bp in basis points of themselves, from rounding each tree posting of a credit to the minor unit; percent_bp and annual_bp are absent above 500 (amendment A208 R22).
        index:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        from:
          type: string
          format: date
          description: The date of the first rate compared; the rates of the days the tree held nothing leave the comparison (amendment A208 R14).
        days:
          type: integer
          description: The number of rates compared.
        skipped:
          type: integer
          description: The rates of the period left out, on days the tree held nothing or, for a rate profile, before its first recorded yield (amendment A208 R14, R18).
        until:
          type: string
          format: date
        return_bp:
          type: integer
        index_bp:
          type: integer
        percent_bp:
          type: integer
        annual_bp:
          type: integer
          description: return_bp as a rate a year on the year basis of the index (252 rate days for cdi); absent when the basis is unknown or the profile is market.
        index_annual_bp:
          type: integer
          description: index_bp as a rate a year on the same basis.
        excess_bp:
          type: integer
          description: return_bp minus index_bp, in basis points of percentage points.
    ReturnInflation:
      type: object
      required: [index, from, until, index_bp, return_bp, real_bp]
      description: The return net of inflation over the whole months of the period with a stored rate (amendment A208 R16).
      properties:
        index:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
        from:
          type: string
          format: date
        until:
          type: string
          format: date
        index_bp:
          type: integer
        return_bp:
          type: integer
        real_bp:
          type: integer
    SubtypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9_]{2,40}$"
    Position:
      type: object
      required: [account_id, instrument, quantity, cost_basis]
      properties:
        account_id:
          type: string
          format: uuid
        instrument:
          type: string
        quantity:
          $ref: "#/components/schemas/Money"
        cost_basis:
          $ref: "#/components/schemas/Money"
        average_cost:
          description: Cost basis per unit; absent unless quantity and cost basis are positive.
          allOf:
            - $ref: "#/components/schemas/Rate"
        market_value:
          description: Quantity valued in the base currency; absent without a price.
          allOf:
            - $ref: "#/components/schemas/Money"
        estimated_tax:
          description: Income tax and IOF a sale of the whole quantity at market_value would withhold (A235); absent when the book has no table for the position or value_in is not the base currency.
          allOf:
            - $ref: "#/components/schemas/Money"
        estimated_net:
          description: market_value less estimated_tax.
          allOf:
            - $ref: "#/components/schemas/Money"
        prices:
          type: array
          items:
            $ref: "#/components/schemas/Price"
    PositionList:
      type: object
      required: [items, quote_warnings]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        quote_warnings:
          type: array
          description: The held instruments whose quote is stale or missing at the date (A222 MQ26).
          items:
            $ref: "#/components/schemas/PositionQuoteWarning"
    PositionQuoteWarning:
      type: object
      additionalProperties: false
      required: [instrument, last]
      properties:
        instrument:
          type: string
        last:
          type: string
          format: date
          nullable: true
          description: The date of the last stored price, or null.
    RealizedResult:
      type: object
      required: [transaction_id, account_id, instrument, date, month, kind, quantity, cost, proceeds, result, tax_class]
      properties:
        transaction_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        instrument:
          type: string
        date:
          type: string
          format: date
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        kind:
          type: string
          enum: [swing, day_trade]
        quantity:
          $ref: "#/components/schemas/Money"
        cost:
          $ref: "#/components/schemas/Money"
        proceeds:
          $ref: "#/components/schemas/Money"
        result:
          $ref: "#/components/schemas/Money"
        tax_class:
          type: string
          nullable: true
          pattern: "^[a-z0-9_]{2,40}$"
    RealizedResultList:
      type: object
      required: [from, to, items]
      properties:
        from:
          type: string
          format: date
          description: First day of the tax year.
        to:
          type: string
          format: date
          description: Last day of the tax year, included.
        items:
          type: array
          items:
            $ref: "#/components/schemas/RealizedResult"
    IncomeEvent:
      type: object
      required: [transaction_id, account_id, instrument, date, income_type, tax_treatment, gross, withheld]
      properties:
        transaction_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        instrument:
          type: string
        date:
          type: string
          format: date
        income_type:
          $ref: "#/components/schemas/IncomeType"
        tax_treatment:
          type: string
          nullable: true
          pattern: "^[a-z0-9_]{2,40}$"
        gross:
          $ref: "#/components/schemas/Money"
        withheld:
          $ref: "#/components/schemas/Money"
    IncomeEventList:
      type: object
      required: [from, to, items]
      properties:
        from:
          type: string
          format: date
          description: First day of the tax year.
        to:
          type: string
          format: date
          description: Last day of the tax year, included.
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncomeEvent"
    FixedIncomeEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FixedIncomeEvent"
    FixedIncomeEvent:
      type: object
      required: [account_id, instrument, date, kind, quantity, rate_missing, state]
      properties:
        account_id:
          type: string
          format: uuid
        instrument:
          type: string
        date:
          type: string
          format: date
          description: The payment date, adjusted to the next business day.
        kind:
          type: string
          pattern: ^[a-z0-9_]{2,40}$
          description: interest, amortization, maturity or unit_tax.
        quantity:
          $ref: "#/components/schemas/Money"
        gross:
          $ref: "#/components/schemas/Money"
        rate_missing:
          type: boolean
          description: The rate of the index is not published, so gross is absent.
        state:
          type: string
          enum: [upcoming, due, recorded]
    IssuerExposureReport:
      type: object
      required: [date, issuers, period_note, missing_prices]
      properties:
        date:
          type: string
          format: date
        issuers:
          type: array
          description: By market value, largest first; the group without issuer last.
          items:
            $ref: "#/components/schemas/IssuerExposure"
        guarantee:
          $ref: "#/components/schemas/DepositGuarantee"
        period_note:
          type: boolean
          description: The covered values of all issuers together exceed limit_per_period.
        missing_prices:
          type: array
          items:
            type: string
    IssuerExposure:
      type: object
      description: sovereign_value is the value of the securities the state of the region issues, to which the guarantee does not apply; uncovered_value is the rest outside the guarantee.
      required: [market_value, covered_value, uncovered_value, sovereign_value]
      properties:
        key:
          type: string
          description: The issuer identifier or the folded name; absent for holdings without issuer.
        issuer:
          type: string
        market_value:
          $ref: "#/components/schemas/Money"
        covered_value:
          $ref: "#/components/schemas/Money"
        uncovered_value:
          $ref: "#/components/schemas/Money"
        sovereign_value:
          $ref: "#/components/schemas/Money"
        limit:
          $ref: "#/components/schemas/Money"
        excess:
          $ref: "#/components/schemas/Money"
    DepositGuarantee:
      type: object
      required: [name, limit_per_issuer, limit_per_period, period_years, covered]
      properties:
        name:
          type: string
        limit_per_issuer:
          $ref: "#/components/schemas/Money"
        limit_per_period:
          $ref: "#/components/schemas/Money"
        period_years:
          type: integer
        covered:
          type: array
          description: The subtypes the guarantee covers.
          items:
            type: string
    ContributionPlan:
      type: object
      required: [status, total, classes, outside, missing]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [complete, incomplete]
        total:
          $ref: "#/components/schemas/Money"
        total_after:
          $ref: "#/components/schemas/Money"
        drift_bp:
          type: integer
        drift_after_bp:
          type: integer
        leftover:
          $ref: "#/components/schemas/Money"
        classes:
          type: array
          items:
            $ref: "#/components/schemas/ContributionClass"
        outside:
          type: array
          items:
            $ref: "#/components/schemas/ContributionOutside"
        missing:
          type: array
          items:
            $ref: "#/components/schemas/ContributionMissing"
        current:
          $ref: "#/components/schemas/CurrentQuotes"
    ContributionClass:
      type: object
      required: [name, target_bp, value, questions, question_ideals, members]
      properties:
        name:
          type: string
        target_bp:
          type: integer
        questions:
          type: array
          items:
            type: string
          description: The investor's yes-or-no questions of the group (CQ1); empty without them.
        question_ideals:
          type: boolean
          description: True when the group divides its target by the answers and one answer is yes (CQ3).
        value:
          $ref: "#/components/schemas/Money"
        share_bp:
          type: integer
        after_share_bp:
          type: integer
        amount:
          $ref: "#/components/schemas/Money"
        cost:
          $ref: "#/components/schemas/Money"
        members:
          type: array
          items:
            $ref: "#/components/schemas/ContributionMember"
    ContributionMember:
      type: object
      required: [value]
      properties:
        account_id:
          type: string
          format: uuid
        instrument:
          type: string
        target_bp:
          type: integer
        answers:
          type: array
          items:
            type: boolean
          description: One answer per question of the group, true for yes (CQ2); absent in a group without questions.
        value:
          $ref: "#/components/schemas/Money"
        share_bp:
          type: integer
        after_share_bp:
          type: integer
        unit_value:
          $ref: "#/components/schemas/Money"
        amount:
          $ref: "#/components/schemas/Money"
        quantity:
          $ref: "#/components/schemas/Money"
        cost:
          $ref: "#/components/schemas/Money"
    ContributionOutside:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        instrument:
          type: string
        value:
          $ref: "#/components/schemas/Money"
    ContributionMissing:
      type: object
      required: [instrument, kind]
      properties:
        account_id:
          type: string
          format: uuid
        instrument:
          type: string
        kind:
          type: string
          enum: [price, rate]
    ContributionPlanInput:
      type: object
      required: [classes]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        classes:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ContributionClassInput"
    ContributionClassInput:
      type: object
      required: [name, target_bp, members]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        target_bp:
          type: integer
          minimum: 0
          maximum: 10000
        questions:
          type: array
          items:
            type: string
          description: The investor's yes-or-no questions of the group (CQ1); empty without them.
        members:
          type: array
          items:
            $ref: "#/components/schemas/ContributionMemberInput"
    ContributionMemberInput:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        instrument:
          type: string
        target_bp:
          type: integer
          minimum: 0
          maximum: 10000
        answers:
          type: array
          items:
            type: boolean
          description: One answer per question of the group, true for yes (CQ2); absent in a group without questions.
    ContributionPreviewInput:
      type: object
      required: [classes, amount]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        classes:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ContributionClassInput"
    BalanceSeries:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 3660
          items:
            $ref: "#/components/schemas/BalancePoint"
    AccountFlows:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 366
          items:
            $ref: "#/components/schemas/FlowDay"
    FlowDay:
      type: object
      required: [date, inflow, outflow]
      properties:
        date:
          type: string
          format: date
        inflow:
          $ref: "#/components/schemas/Money"
        outflow:
          $ref: "#/components/schemas/Money"
    BalancePoint:
      type: object
      required: [date, balance]
      properties:
        date:
          type: string
          format: date
        balance:
          $ref: "#/components/schemas/Money"
    Indicators:
      type: object
      required: [currency, months]
      properties:
        currency:
          type: string
          description: The base currency of every amount.
        months:
          type: array
          minItems: 12
          maxItems: 12
          description: Oldest first; the last entry is the month asked.
          items:
            $ref: "#/components/schemas/IndicatorMonth"
    IndicatorMonth:
      type: object
      required: [month, income, expense, committed, debt_service, liquid_balance, liabilities, savings_rate, trailing_savings_rate, liquidity, committed_share, debt_service_share]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        income:
          $ref: "#/components/schemas/Money"
        expense:
          $ref: "#/components/schemas/Money"
        committed:
          $ref: "#/components/schemas/Money"
        debt_service:
          $ref: "#/components/schemas/Money"
        liquid_balance:
          $ref: "#/components/schemas/Money"
        liabilities:
          $ref: "#/components/schemas/Money"
        mean_income:
          $ref: "#/components/schemas/Money"
        mean_expense:
          $ref: "#/components/schemas/Money"
        savings_rate:
          $ref: "#/components/schemas/IndicatorRatio"
        trailing_savings_rate:
          $ref: "#/components/schemas/IndicatorRatio"
        liquidity:
          $ref: "#/components/schemas/IndicatorRatio"
        committed_share:
          $ref: "#/components/schemas/IndicatorRatio"
        debt_service_share:
          $ref: "#/components/schemas/IndicatorRatio"
    IndicatorRatio:
      type: object
      additionalProperties: false
      description: Either bp, in basis points truncated toward zero, or the reason there is no value.
      properties:
        bp:
          type: integer
          format: int64
        reason:
          type: string
          enum: [no_income, no_expense, insufficient_history]
    CategoryTotals:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTotal"
    CategoryTotal:
      type: object
      required: [account_id, total, subtree_total]
      properties:
        account_id:
          type: string
          format: uuid
        total:
          $ref: "#/components/schemas/Money"
        subtree_total:
          $ref: "#/components/schemas/Money"
    CategoryCashPayments:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCashPayment"
    CategoryCashPayment:
      type: object
      required: [date, amount, card_account_id, statement_id, statement_reference, payment_transaction_id]
      properties:
        date:
          type: string
          format: date
          description: The payment's date.
        amount:
          $ref: "#/components/schemas/Money"
        card_account_id:
          type: string
          format: uuid
        statement_id:
          type: string
          format: uuid
          description: The statement the payment pays.
        statement_reference:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
          description: The reference month of that statement, YYYY-MM.
        payment_transaction_id:
          type: string
          format: uuid
    Export:
      type: object
      required: [id, status, requested_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, ready, failed]
        requested_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
          description: Bytes of the archive; present when ready.
        sha256:
          type: string
          description: Hexadecimal SHA-256 of the archive; present when ready.
        problem:
          type: string
          description: The code of a failure, such as export_too_large; present when failed.
        archive_version:
          type: integer
          description: The archive_version of the archive (ADR 021); present when ready.
    ExportRequest:
      type: object
      properties:
        credentials_passphrase:
          type: string
          description: Adds the credentials of the book's integrations to the archive, sealed by this passphrase; 8 to 256 characters.
    ArchiveImport:
      type: object
      required: [archive_version, tables, credentials_in_archive, credentials_restored, provider_keys_restored]
      properties:
        archive_version:
          type: integer
          description: The archive_version the archive was written with (ADR 021).
        credentials_in_archive:
          type: boolean
          description: The archive carries integration credentials.
        credentials_restored:
          type: integer
          description: Integrations whose credential the import wrote; 0 without the passphrase.
        provider_keys_restored:
          type: integer
          description: Language model providers whose key the import wrote; 0 without the passphrase.
        tables:
          type: array
          items:
            type: object
            required: [name, rows]
            properties:
              name:
                type: string
              rows:
                type: integer
    StatementParts:
      type: object
      required: [purchases, installments, charges, credits, total]
      properties:
        purchases:
          $ref: "#/components/schemas/Money"
        installments:
          $ref: "#/components/schemas/Money"
        charges:
          $ref: "#/components/schemas/Money"
        credits:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
    StatementCategoryParts:
      allOf:
        - $ref: "#/components/schemas/StatementParts"
        - type: object
          required: [category_id]
          properties:
            category_id:
              type: string
              format: uuid
    StatementAnalytics:
      allOf:
        - $ref: "#/components/schemas/StatementAnalyticsItem"
        - type: object
          required: [categories]
          properties:
            categories:
              type: array
              items:
                $ref: "#/components/schemas/StatementCategoryParts"
    StatementAnalyticsItem:
      allOf:
        - $ref: "#/components/schemas/StatementParts"
        - type: object
          required: [statement_id, reference]
          properties:
            statement_id:
              type: string
              format: uuid
            reference:
              type: string
              pattern: "^[0-9]{4}-[0-9]{2}$"
    CardStatementAnalytics:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StatementAnalyticsItem"
