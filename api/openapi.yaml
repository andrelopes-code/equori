            - ambiguous_date
            - invalid_installments
            - installments_not_allowed
            - missing_account
            - ambiguous_account
            - unknown_account
            - missing_destination
            - ambiguous_transfer
            - too_many_accounts
            - same_account
            - currency_mismatch
            - possible_account
        field:
          type: string
          enum: [amount, date, installments, account, to_account]
        choices:
          type: array
          items:
            $ref: "#/components/schemas/CaptureChoice"
