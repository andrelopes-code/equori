        savings_target_bp:
          type: integer
          description: |
            The share of the reference set aside, in basis points, from 0 to 10000 (savings target A187, checked by the
            server as a 422 on this field). A save without it clears the stored target.
        amounts:
          type: array
          description: The changed categories only.
          maxItems: 500
          items:
            $ref: "#/components/schemas/BudgetPlanAmount"
    BudgetPlan:
      type: object
      required: [month, currency, source, received_income, installments, savings, planned, rows]
      description: |
        installments are those billed on the month's statements for purchases booked before it; savings are the month's
        occurrences of savings schedules; unassigned is reference - installments - savings - planned and is absent with
        reference, which is absent when the source has no figure.
      properties:
        month:
          type: string
        currency:
          type: string
        source:
          $ref: "#/components/schemas/BudgetPlanSource"
        fixed:
          $ref: "#/components/schemas/Money"
        expected_income:
          $ref: "#/components/schemas/Money"
        expected_items:
          type: array
          items:
            $ref: "#/components/schemas/BudgetPlanIncome"
        average_income:
          $ref: "#/components/schemas/Money"
        average_months:
          type: integer
          minimum: 1
          maximum: 3
        received_income:
          $ref: "#/components/schemas/Money"
        reference:
          $ref: "#/components/schemas/Money"
        installments:
          $ref: "#/components/schemas/Money"
        savings:
          $ref: "#/components/schemas/Money"
        planned:
          $ref: "#/components/schemas/Money"
        unassigned:
          $ref: "#/components/schemas/Money"
        savings_target_bp:
          type: integer
          description: The stored savings target in basis points of the reference; absent without one (A187).
        savings_rate_bp:
          type: integer
          description: savings as basis points of reference, truncated; absent without a reference above zero (A188).
        savings_target:
          $ref: "#/components/schemas/Money"
        savings_gap:
          $ref: "#/components/schemas/Money"
