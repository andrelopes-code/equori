      x-book-role: read
      summary: Request an archive of every fact of the books (SC6, docs/specs/2026-10-26-export-design.md).
      description: |
        The archive is built after the response and replaces the previous export. 409 export_pending while one is
        pending. With credentials_passphrase the archive also carries the credentials of the book's integrations,
        sealed by that passphrase, which the server never stores (export design C1 to C4); this needs the owner
