        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /connections/{id}:
    get:
      tags: [ingestion]
      operationId: getConnection
      x-book-role: read
      summary: Return a connection with its external accounts.
      parameters:
        - $ref: "#/components/parameters/ID"
