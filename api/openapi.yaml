          format: date
        name:
          type: string
          description: English text of a rule holiday, or the text typed for an instance holiday.
        code:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
          description: Stable key of a rule holiday, which a client translates; absent for an instance holiday.
        source:
          type: string
          enum: [rule, instance]
    BalanceSeries:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 3660
          items:
            $ref: "#/components/schemas/BalancePoint"
    AccountFlows:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 366
          items:
            $ref: "#/components/schemas/FlowDay"
    FlowDay:
