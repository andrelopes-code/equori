    ScheduleKind:
      type: string
      enum: [bill, income, subscription, transfer, savings]
    Recurrence:
      type: object
      additionalProperties: false
      required: [frequency, interval, start]
      description: |
        A monthly rule takes exactly one of day_of_month, weekday with ordinal, business_day_ordinal; -1 means
        the last one. Business days follow the calendar of the schedule. until is inclusive (P7 amendment A48).
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
          minimum: 1
          maximum: 120
        day_of_month:
          type: integer
          minimum: -1
          maximum: 31
        weekday:
          type: string
          enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
        ordinal:
          type: integer
          minimum: -1
          maximum: 5
        business_day_ordinal:
          type: integer
          minimum: -1
          maximum: 23
        adjustment:
          type: string
          enum: [none, following, preceding, modified_following]
          default: none
        start:
          type: string
          format: date
        until:
          type: string
          format: date
        count:
          type: integer
          minimum: 1
          maximum: 10000
    ScheduleInput:
      type: object
      additionalProperties: false
      required: [kind, account_id, counterpart_id, description, amount, recurrence]
      properties:
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        account_id:
          type: string
          format: uuid
        counterpart_id:
          type: string
          format: uuid
        payee_id:
