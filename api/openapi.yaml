          type: string
          format: uuid
          description: Account of a line that names none (A111).
    CapturePreview:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CaptureLine"
    CaptureLine:
      type: object
      required: [line, text, segments, kind, date, description, tags, issues]
      properties:
        line:
          type: integer
          description: 1-based position among the pieces of the text cut at line breaks and semicolons (A107).
        text:
          type: string
        segments:
          type: array
          description: The line cut by what each part was read as; the texts joined equal the line.
          items:
            $ref: "#/components/schemas/CaptureSegment"
        kind:
          type: string
          enum: [expense, income, transfer]
        amount:
          $ref: "#/components/schemas/Money"
        date:
          type: string
          format: date
        account_id:
          type: string
          format: uuid
        account_source:
          type: string
          enum: [text, default]
        to_account_id:
          type: string
          format: uuid
        installments:
          type: integer
          description: Installment count of a card purchase; absent for one payment.
        description:
          type: string
        payee_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        category_source:
          type: string
          enum: [rule, history]
        tags:
          type: array
          items:
            type: string
        issues:
          type: array
          description: Why the draft cannot be recorded as read; empty when it can.
          items:
            $ref: "#/components/schemas/CaptureIssue"
    CaptureSegment:
      type: object
      required: [text, role]
      properties:
        text:
          type: string
        role:
          type: string
          enum: [amount, date, installments, account, kind, tag, text]
    CaptureIssue:
      type: object
      required: [code, field, choices]
      properties:
        code:
          type: string
          enum:
            - missing_amount
            - ambiguous_amount
            - invalid_amount
            - invalid_date
            - ambiguous_date
            - invalid_installments
            - installments_not_allowed
            - missing_account
            - ambiguous_account
            - unknown_account
            - missing_destination
            - ambiguous_transfer
            - too_many_accounts
            - same_account
            - currency_mismatch
            - possible_account
        field:
          type: string
          enum: [amount, date, installments, account, to_account]
        choices:
          type: array
          items:
            $ref: "#/components/schemas/CaptureChoice"
    CaptureChoice:
      type: object
      description: An account for an account issue; an amount for an amount issue; the description the line has once the choice is made.
      properties:
        account_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
    CaptureSuggestionInput:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/CaptureSuggestionItem"
    CaptureSuggestionItem:
      type: object
      additionalProperties: false
