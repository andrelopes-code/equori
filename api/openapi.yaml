        plan_id:
          type: string
          format: uuid
        number:
          type: integer
        count:
          type: integer
    Posting:
      allOf:
        - $ref: "#/components/schemas/PostingInput"
        - type: object
          required: [id, weight, status]
          properties:
            id:
              type: string
              format: uuid
            installment:
              $ref: "#/components/schemas/Installment"
    Link:
      type: object
      additionalProperties: false
      description: A relation to another transaction. amount is the part of the target that a reimbursement_of link repays (A117); other types carry none.
      required: [type, target]
      properties:
        type:
          type: string
          enum: [refund_of, reimbursement_of, cancellation_of, anticipation_of, chargeback_of, correction_of]
        target:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
    LinkReference:
      type: object
      additionalProperties: false
      required: [type, source]
      description: An inbound link; source is the non-voided transaction that links to this one. amount is the part of this transaction that a reimbursement_of link repays (A117).
      properties:
        type:
          type: string
          enum: [refund_of, reimbursement_of, cancellation_of, anticipation_of, chargeback_of, correction_of]
        source:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
    TransactionInput:
      type: object
      additionalProperties: false
      required: [date, postings]
      properties:
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 500
        payee_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 60
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        postings:
          type: array
          items:
            $ref: "#/components/schemas/PostingInput"
          minItems: 2
          maxItems: 500
    CapturePreviewInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          maxLength: 10000
