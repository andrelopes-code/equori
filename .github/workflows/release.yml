name: release

on:
  push:
    tags: ["v*.*.*"]

# Write scopes go only to the jobs that publish; make check runs every development dependency.
permissions:
  contents: read

jobs:
  # R1: nothing is published from a commit that fails make check.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
      - run: corepack enable
      - run: make check

  dist:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
      - run: corepack enable
      - run: make dist DIST_VERSION=${{ github.ref_name }}
      # R4: the archive's binary reports the tag.
      - run: |
          name=equori_${GITHUB_REF_NAME#v}_linux_amd64
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/$name/equori" version | head -1)" = "equori $GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # R4: the image reports the tag before anything is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: equori:smoke
          build-args: VERSION=${{ github.ref_name }}
      - run: test "$(docker run --rm equori:smoke version | head -1)" = "equori ${{ github.ref_name }}"
      # R7: the database of the previous tag migrates under this image with every fact, before any push.
      - id: prev
        run: echo "tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - if: steps.prev.outputs.tag == ''
        run: echo "no previous tag; the first release has nothing to upgrade from"
      - if: steps.prev.outputs.tag != ''
        run: |
          prev=${{ steps.prev.outputs.tag }}
          scripts/upgrade-test.sh "ghcr.io/${{ github.repository }}:${prev#v}" equori:smoke "$prev"
      - id: meta-standalone
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-standalone
            type=semver,pattern={{major}}.{{minor}},suffix=-standalone
            type=raw,value=standalone,enable=${{ !contains(github.ref_name, '-') }}
      # R4: the standalone image turns healthy and reports the tag before it is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          load: true
          tags: equori:standalone
          build-args: VERSION=${{ github.ref_name }}
      - run: test "$(docker run --rm equori:standalone version | head -1)" = "equori ${{ github.ref_name }}"
      - run: scripts/standalone-smoke.sh equori:standalone
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - id: push-standalone
        uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-standalone.outputs.tags }}
          labels: ${{ steps.meta-standalone.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push-standalone.outputs.digest }}
          push-to-registry: true

  # The Windows installer (W-R4 to W-R7 of docs/specs/2026-10-27-distribution-windows-design.md).
  # It is built and tested on every tag and published only when signed (W-R6).
  windows:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
      - run: corepack enable
      # W-P4: no release ships a PostgreSQL minor older than the current one.
      - run: scripts/postgres-current.ps1
      - run: scripts/windows-postgres.ps1 -Out "$env:RUNNER_TEMP\payload\postgresql"
      - run: |
          Set-Location web
          pnpm install --frozen-lockfile
          pnpm build
      - run: go build -trimpath -ldflags "-s -w -X main.version=$env:GITHUB_REF_NAME" -o "$env:RUNNER_TEMP\payload\equori.exe" ./cmd/equori
      # W-R5: every PE file the installer holds is signed, the EDB build's included.
      - if: env.SIGN == 'true'
        run: scripts/windows-sign.ps1 @(Get-ChildItem -Recurse -File "$env:RUNNER_TEMP\payload" -Include *.exe, *.dll | ForEach-Object FullName)
      - run: |
          $iscc = @('/Qp', "/DAppVersion=$($env:GITHUB_REF_NAME -replace '^v', '')", "/DPayload=$env:RUNNER_TEMP\payload", "/O$env:RUNNER_TEMP\installer")
          if ($env:SIGN -eq 'true') { $iscc += '/DSign', "/Ssigntool=pwsh -NoProfile -File `"$pwd\scripts\windows-sign.ps1`" `$f" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @iscc packaging\windows\equori.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # R4: the installer works and reports the tag before anything is published.
      - run: scripts/windows-smoke.ps1 -Installer (Get-Item "$env:RUNNER_TEMP\installer\*.exe").FullName -Tag $env:GITHUB_REF_NAME -Region US -Currency USD
      # W-R7: from the second tag whose release holds a Windows installer.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prev = git describe --tags --abbrev=0 --match 'v*.*.*' HEAD^ 2>$null
          $installer = if ($prev) { gh release view $prev --json assets -q '.assets[].name' | Where-Object { $_ -like '*_windows_amd64_setup.exe' } }
          if (-not $installer) { "no earlier release holds a Windows installer; nothing to upgrade from"; exit 0 }
          gh release download $prev -p $installer -D "$env:RUNNER_TEMP\prev"
          Remove-Item -Recurse -Force "$env:ProgramData\equori"
          $version = (Get-Content packaging\windows\postgresql.env | Where-Object { $_ -match '^PG_VERSION=' }) -replace '^PG_VERSION=', ''
          $psql = Join-Path ([IO.Path]::GetTempPath()) "equori-pg-$version\pgsql\bin\psql.exe"
          scripts/windows-upgrade-test.ps1 -Previous "$env:RUNNER_TEMP\prev\$installer" -New (Get-Item "$env:RUNNER_TEMP\installer\*.exe").FullName -PreviousRef $prev -Psql $psql
      - if: env.SIGN == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/installer/*.exe
      - if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ runner.temp }}/installer/*.exe
      - if: env.SIGN != 'true'
        run: '"::notice::Windows installer not published: signing secrets are not set (W-R6)"'

  release:
    needs: [dist, image, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Pin compose.yaml to the release
        run: |
          version=${GITHUB_REF_NAME#v}
          sed -e "s/\${EQUORI_VERSION:-dev}/\${EQUORI_VERSION:-$version}/" -e '/^    build: \.$/d' compose.yaml > dist/compose.yaml
          grep -q "equori:\${EQUORI_VERSION:-$version}" dist/compose.yaml
      # Present only when the windows job signed it (W-R6).
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: windows
          path: dist/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          assets=(dist/*.tar.gz dist/compose.yaml)
          for installer in dist/*_windows_amd64_setup.exe; do
            [[ -e "$installer" ]] || continue
            (cd dist && sha256sum "$(basename "$installer")" >> SHA256SUMS)
            assets+=("$installer")
          done
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" "${assets[@]}" dist/SHA256SUMS

  # R5: in 0.x every tag moves the formula; from 1.0 only a tag without a pre-release suffix.
  #   v0.3.0 → true, v0.3.0-beta.1 → true, v1.0.0 → true, v1.1.0-rc.1 → false
  homebrew:
    needs: release
    if: startsWith(github.ref_name, 'v0.') || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: scripts/render-formula.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > "$RUNNER_TEMP/equori.rb"
      - uses: actions/checkout@v5
        with:
          repository: andrelopes-code/homebrew-equori
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - run: |
          mkdir -p tap/Formula
          cp "$RUNNER_TEMP/equori.rb" tap/Formula/equori.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/equori.rb
          git commit -m "equori ${GITHUB_REF_NAME#v}"
          git push

  # The published formula installs, passes its test, and runs managed mode on Homebrew's postgresql@18.
  homebrew-check:
    needs: homebrew
    runs-on: macos-latest
    steps:
      - run: brew tap andrelopes-code/equori
      - run: brew install andrelopes-code/equori/equori
      - run: brew test andrelopes-code/equori/equori
      - run: test "$(equori version | head -1)" = "equori ${GITHUB_REF_NAME}"
      - run: |
          export EQUORI_DATA_DIR="$RUNNER_TEMP/equori"
          equori serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          serve=$!
          for _ in $(seq 90); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          printf 'equori-check-pass\n' | equori user create --email check@equori.test --language en --region US --currency USD
          equori backup | grep -E '/backups/equori-[0-9-]+-s[0-9]+\.dump$'
          kill "$serve"
          wait "$serve" || true
          test ! -e "$EQUORI_DATA_DIR/pg/postmaster.pid"
