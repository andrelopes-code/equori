name: release

on:
  push:
    tags: ["v*.*.*"]

# Write scopes go only to the jobs that publish; make check runs every development dependency.
permissions:
  contents: read

jobs:
  # R1: nothing is published from a commit that fails make check.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
      - run: corepack enable
      - run: make check

  dist:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
      - run: corepack enable
      - run: make dist DIST_VERSION=${{ github.ref_name }}
      # R4: the archive's binary reports the tag.
      - run: |
          name=equori_${GITHUB_REF_NAME#v}_linux_amd64
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/$name/equori" version | head -1)" = "equori $GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # R4: the image reports the tag before anything is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: equori:smoke
          build-args: VERSION=${{ github.ref_name }}
      - run: test "$(docker run --rm equori:smoke version | head -1)" = "equori ${{ github.ref_name }}"
      # R7: the database of the previous tag migrates under this image with every fact, before any push.
      - id: prev
        run: echo "tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - if: steps.prev.outputs.tag == ''
        run: echo "no previous tag; the first release has nothing to upgrade from"
      - if: steps.prev.outputs.tag != ''
        run: |
          prev=${{ steps.prev.outputs.tag }}
          scripts/upgrade-test.sh "ghcr.io/${{ github.repository }}:${prev#v}" equori:smoke "$prev"
      - id: meta-standalone
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-standalone
            type=semver,pattern={{major}}.{{minor}},suffix=-standalone
            type=raw,value=standalone,enable=${{ !contains(github.ref_name, '-') }}
      # R4: the standalone image turns healthy and reports the tag before it is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          load: true
          tags: equori:standalone
          build-args: VERSION=${{ github.ref_name }}
      - run: test "$(docker run --rm equori:standalone version | head -1)" = "equori ${{ github.ref_name }}"
      - run: scripts/standalone-smoke.sh equori:standalone
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - id: push-standalone
        uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-standalone.outputs.tags }}
          labels: ${{ steps.meta-standalone.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push-standalone.outputs.digest }}
          push-to-registry: true

  release:
    needs: [dist, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Pin compose.yaml to the release
        run: |
          version=${GITHUB_REF_NAME#v}
          sed -e "s/\${EQUORI_VERSION:-dev}/\${EQUORI_VERSION:-$version}/" -e '/^    build: \.$/d' compose.yaml > dist/compose.yaml
          grep -q "equori:\${EQUORI_VERSION:-$version}" dist/compose.yaml
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*.tar.gz dist/SHA256SUMS dist/compose.yaml

  # R5: in 0.x every tag moves the formula; from 1.0 only a tag without a pre-release suffix.
  #   v0.3.0 → true, v0.3.0-beta.1 → true, v1.0.0 → true, v1.1.0-rc.1 → false
  homebrew:
    needs: release
    if: startsWith(github.ref_name, 'v0.') || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: scripts/render-formula.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > "$RUNNER_TEMP/equori.rb"
      - uses: actions/checkout@v5
        with:
          repository: andrelopes-code/homebrew-equori
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - run: |
          mkdir -p tap/Formula
          cp "$RUNNER_TEMP/equori.rb" tap/Formula/equori.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/equori.rb
          git commit -m "equori ${GITHUB_REF_NAME#v}"
          git push
