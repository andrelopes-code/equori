# Temporary: runs the upgrade test of the release workflow without a tag.
name: upgrade-debug

on: workflow_dispatch

permissions:
  contents: read
  packages: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t equori:smoke .
      - run: scripts/upgrade-test.sh ghcr.io/${{ github.repository }}:0.1.0-beta.1 equori:smoke v0.1.0-beta.1
