name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
      # pnpm comes from Corepack, pinned by packageManager in web/package.json.
      - run: corepack enable
      - run: make check
      - run: make vuln

  # Managed mode on Windows (docs/superpowers/specs/2026-10-27-distribution-windows-design.md, W-R1).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: pg
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pg
          key: postgres-${{ hashFiles('packaging/windows/postgresql.env', 'scripts/windows-postgres.ps1') }}
      - if: steps.pg.outputs.cache-hit != 'true'
        run: scripts/windows-postgres.ps1 -Out "$env:RUNNER_TEMP\pg"
      - run: go test ./internal/platform/pgcluster/

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          load: true
          tags: equori:standalone
      - run: scripts/standalone-smoke.sh equori:standalone
