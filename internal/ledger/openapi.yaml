paths:
  /settings:
    get:
      tags: [ledger]
      operationId: getSettings
      x-book-role: read
      summary: Return the ledger settings.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Problem"
    put:
      tags: [ledger]
      operationId: updateSettings
      x-book-role: owner
      summary: Change the base currency; allowed only before the first transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /institutions:
    get:
      tags: [ledger]
      operationId: listInstitutions
      x-book-role: read
      summary: List institutions.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createInstitution
      x-book-role: write
      summary: Create an institution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionInput"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /institutions/{id}:
    delete:
      tags: [ledger]
      operationId: deleteInstitution
      x-book-role: write
      summary: Delete an institution that no open account uses; closed accounts lose it.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /institution-identifier-schemes:
    get:
      tags: [ledger]
      operationId: listInstitutionIdentifierSchemes
      x-book-role: read
      summary: List the institution identifier schemes and their patterns.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionIdentifierSchemeList"
        "401":
          $ref: "#/components/responses/Problem"
  /institutions/{id}/identifier:
    put:
      tags: [ledger]
      operationId: setInstitutionIdentifier
      x-book-role: write
      summary: Set or clear the identifier of an institution; the br_ispb identifier keys its logo (ADR 013).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionIdentifierInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /payees:
    get:
      tags: [ledger]
      operationId: listPayees
      x-book-role: read
      summary: List payees.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayeeList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createPayee
      x-book-role: write
      summary: Create a payee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayeeInput"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payee"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /payees/{id}:
    patch:
      tags: [ledger]
      operationId: renamePayee
      x-book-role: write
      summary: Rename a payee (A82).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayeeInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payee"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /payees/{id}/merge:
    post:
      tags: [ledger]
      operationId: mergePayee
      x-book-role: write
      summary: Merge a payee into another; returns the destination (A82).
      description: |
        Every non-voided transaction of the payee gets a new version naming the destination; voided transactions and
        counterparty accounts name it in place. The payee is kept as merged and leaves listPayees.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePayeeInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payee"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /tags:
    get:
      tags: [ledger]
      operationId: listTags
      x-book-role: read
      summary: List tags in use.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "401":
          $ref: "#/components/responses/Problem"
  /tags/{name}:
    parameters:
      - $ref: "#/components/parameters/TagName"
    get:
      tags: [ledger]
      operationId: getTag
      x-book-role: read
      summary: A tag and the number of non-voided transactions that carry it.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagUsage"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [ledger]
      operationId: renameTag
      x-book-role: write
      summary: Rename a tag on every transaction; no transaction gets a new version.
      description: The name is normalized as a transaction tag. A name in use is 422 on name; merge the tags instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagUsage"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [ledger]
      operationId: deleteTag
      x-book-role: write
      summary: Delete a tag; every non-voided transaction that carries it gets a new version without it.
      description: Voided transactions lose the tag in place.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /tags/{name}/merge:
    post:
      tags: [ledger]
      operationId: mergeTag
      x-book-role: write
      summary: Merge a tag into another; returns the destination.
      description: |
        Every non-voided transaction that carries the tag gets a new version carrying the destination once; voided
        transactions name the destination in place. The tag is deleted.
      parameters:
        - $ref: "#/components/parameters/TagName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeTagInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagUsage"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts:
    get:
      tags: [ledger]
      operationId: listAccounts
      x-book-role: read
      summary: List accounts, categories included.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createAccount
      x-book-role: write
      summary: Create an account or category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: OK.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}:
    get:
      tags: [ledger]
      operationId: getAccount
      x-book-role: read
      summary: Return an account.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [ledger]
      operationId: updateAccount
      x-book-role: write
      summary: Rename or move an account.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/close:
    post:
      tags: [ledger]
      operationId: closeAccount
      x-book-role: write
      summary: Close an account and its open descendants (A74).
      description: |
        Every closed account needs no postings after closed_on; an asset, liability or equity account
        also needs a zero balance. A subtree holding a system account is rejected with system_account.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseAccountInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/reopen:
    post:
      tags: [ledger]
      operationId: reopenAccount
      x-book-role: write
      summary: Reopen a closed account and its closed ancestors (A74).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/appearance:
    put:
      tags: [ledger]
      operationId: setAccountAppearance
      x-book-role: write
      summary: Set or clear the colour and the icon of an account (A83).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAppearance"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/parent:
    put:
      tags: [ledger]
      operationId: setAccountParent
      x-book-role: write
      summary: Set or clear the parent of an account (A84).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountParent"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/merge:
    post:
      tags: [ledger]
      operationId: mergeAccount
      x-book-role: write
      summary: Merge a category into another; returns the destination (A75).
      description: |
        Every non-voided transaction with a posting on the category gets a new version with that posting
        on the destination; the subcategories move under the destination; the category closes today.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeAccountInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/balance:
    get:
      tags: [ledger]
      operationId: getAccountBalance
      x-book-role: read
      summary: Balance of an account at the end of a date.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: basis
          in: query
          required: false
          schema:
            type: string
            enum: [booked, settled]
        - name: value_in
          in: query
          required: false
          description: Currency to value the balance in with stored prices (P8 amendment A65).
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /balances:
    get:
      tags: [ledger]
      operationId: listBalances
      x-book-role: read
      summary: Balance of every balance-sheet account at the end of a date, ordered by account name then id.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: basis
          in: query
          required: false
          schema:
            type: string
            enum: [booked, settled]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /transactions:
    get:
      tags: [ledger]
      operationId: listTransactions
      x-book-role: read
      summary: List transactions, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: account_id
          in: query
          description: Transactions with a posting on the account or on one of its descendants (A76).
          schema:
            type: string
            format: uuid
        - name: payee_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: amount_min
          in: query
          description: Smallest amount moved, in minor units of the book's balancing currency. A transaction moves the sum of its positive weights, so a split and a transfer count once.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: amount_max
          in: query
          description: Largest amount moved, on the same basis as amount_min.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: uncategorized
          in: query
          description: When true, only transactions whose category postings are all uncategorized (P5 amendment A17).
          schema:
            type: boolean
        - name: exclude_voided
          in: query
          description: When true, voided transactions are left out of the pages; the default keeps them as history.
          schema:
            type: boolean
        - name: q
          in: query
          description: Blank-separated words; each must appear, ignoring case and accents, in the description, payee name or a posting memo.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createTransaction
      x-book-role: write
      summary: Record a transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: OK.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /foreign-purchases:
    post:
      tags: [ledger]
      operationId: recordForeignPurchase
      x-book-role: write
      summary: Record a purchase charged in another currency, with the card's foreign charge (P8 amendment A66).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForeignPurchaseInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /exchanges:
    post:
      tags: [ledger]
      operationId: exchangeCurrency
      x-book-role: write
      summary: Exchange money between own accounts in two currencies, one of them the base currency (P8 amendment A67).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /trades:
    post:
      tags: [ledger]
      operationId: recordTrade
      x-book-role: write
      summary: Buy or sell a security for cash of the same brokerage at average cost (P8 amendment A68).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /investment-income:
    post:
      tags: [ledger]
      operationId: recordInvestmentIncome
      x-book-role: write
      summary: Record income paid on a security into cash of the same brokerage (P8 amendment A70).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentIncomeInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}:
    get:
      tags: [ledger]
      operationId: getTransaction
      x-book-role: read
      summary: Return a transaction.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [ledger]
      operationId: correctTransaction
      x-book-role: write
      summary: Correct a transaction; creates a new version.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectionInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/void:
    post:
      tags: [ledger]
      operationId: voidTransaction
      x-book-role: write
      summary: Void a transaction; it stays in history.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidInput"
      responses:
        "200":
          description: OK.
