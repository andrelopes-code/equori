  /balance-assertions/{id}/resolve:
    post:
      tags: [ledger]
      operationId: resolveBalanceAssertion
      x-book-role: write
      summary: Resolve the open difference of an assertion and reconcile the account.
      description: |
        adjustment records the difference against the equity account Adjustments; yield records a
        positive difference as income against the account Yield and is rejected for a negative one;
        transactions_added requires the settled balance to match the assertion after the missing
        transactions were recorded.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssertionResolutionInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssertionResult"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/reconciliation:
    get:
      tags: [ledger]
      operationId: getReconciliationStatus
      x-book-role: read
      summary: Last reconciliation date and the open difference of the latest assertion.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/unlock:
    post:
      tags: [ledger]
      operationId: unlockAccount
      x-book-role: write
      summary: Return reconciled postings settled on or after a date to cleared.
      description: Deletes the account's reconciliations dated on or after the date (P3 amendment A8).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /statements/{id}/reconcile:
    post:
      tags: [ledger]
      operationId: reconcileStatement
      x-book-role: write
      summary: Confirm the institution's amount due for a closed statement.
      description: |
        An amount equal to the derived amount due marks the statement's postings reconciled
        (P3 amendment A7); a different amount returns difference_remains.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementReconciliationInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /statements/{id}/defer:
    post:
      tags: [ledger]
      operationId: deferStatementPostings
      x-book-role: write
      summary: Move card postings of a statement to the next statement, as the owner's choice (A137).
      description: |
        Each transaction's card posting on the statement moves to the next statement through a
        correction; every transaction is checked before the first one moves. A transaction with no
        card posting on the statement, or whose posting follows an installment plan, returns
        posting_not_movable; a reconciled posting returns posting_reconciled.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeferPostingsInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /statements/{id}/facts:
    put:
      tags: [ledger]
      operationId: setStatementFacts
      x-book-role: write
      summary: Record the institution's facts for a statement, as the owner reads them (A85).
      description: |
        The owner's facts win over an aggregator's. The statement takes their dates, and the
        card postings billed by a date the new dates move are billed again (A86).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementFactsInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [ledger]
      operationId: removeStatementFacts
      x-book-role: write
      summary: Remove the owner's facts; the statement takes the aggregator's facts or the rule's dates.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /transactions/{id}/attachments:
    get:
      tags: [ledger]
      operationId: listAttachments
      x-book-role: read
      summary: Files attached to a transaction.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags: [ledger]
      operationId: createAttachment
      x-book-role: write
      summary: Attach a file to a transaction.
      description: |
        At most 10 MiB of content (N26); the request body limit of this route is 11 MiB. Accepted media
        types, detected from the content: application/pdf, image/jpeg, image/png, image/webp, text/plain.
        A file already attached to the transaction returns the existing attachment.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /attachments/{id}:
    delete:
      tags: [ledger]
      operationId: deleteAttachment
      x-book-role: write
      summary: Remove an attachment; the stored file is deleted when no attachment references it.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /attachments/{id}/content:
    get:
      tags: [ledger]
      operationId: getAttachmentContent
      x-book-role: read
      summary: Download the attached file, or show a PDF or an image in a frame of the application.
      description: |
        With disposition=inline the response is shown in place and its Content-Security-Policy
        allows a frame of the application's own origin (ADR 007, C9a); 422
        attachment_not_inlineable for any media type but a PDF or an image. The default is a
        download and no frame may show it.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: disposition
          in: query
          required: false
          schema:
            type: string
            enum: [attachment, inline]
            default: attachment
      responses:
        "200":
          description: The file, with its stored media type.
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Security-Policy:
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
parameters:
  TagName:
    name: name
    in: path
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 60
schemas:
  Attachment:
    type: object
    required: [id, transaction_id, file_name, media_type, size, sha256, created_at]
    properties:
      id:
        type: string
        format: uuid
      transaction_id:
        type: string
        format: uuid
      file_name:
        type: string
      media_type:
        type: string
      size:
        type: integer
        format: int64
      sha256:
        type: string
        description: Hexadecimal SHA-256 of the content.
      created_at:
        type: string
        format: date-time
  AttachmentList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Attachment"
      next_cursor:
        type: string
        description: Absent on the last page.
  StatementReconciliationInput:
    type: object
    additionalProperties: false
    required: [amount_due]
    properties:
      amount_due:
        $ref: "#/components/schemas/Money"
  AssertionResolutionInput:
    type: object
    additionalProperties: false
    required: [resolution]
    properties:
      resolution:
        type: string
        enum: [adjustment, yield, transactions_added]
  ReconciliationStatus:
    type: object
    properties:
      last_reconciled_on:
        type: string
        format: date
      open_difference:
        $ref: "#/components/schemas/OpenDifference"
  OpenDifference:
    type: object
    required: [assertion_id, date, difference]
    properties:
      assertion_id:
        type: string
        format: uuid
      date:
        type: string
        format: date
      difference:
        $ref: "#/components/schemas/Money"
  UnlockInput:
    type: object
    additionalProperties: false
    required: [from]
    properties:
      from:
        type: string
        format: date
  BalanceAssertionInput:
    type: object
    additionalProperties: false
    required: [date, amount]
    properties:
      date:
        type: string
        format: date
      amount:
        $ref: "#/components/schemas/Money"
      source:
        type: string
        enum: [manual, import, aggregator]
  BalanceAssertion:
    type: object
    required: [id, account_id, date, amount, source, recorded_at, reconciled]
    properties:
      id:
        type: string
        format: uuid
      account_id:
        type: string
        format: uuid
      date:
        type: string
        format: date
      amount:
        $ref: "#/components/schemas/Money"
      source:
        type: string
        enum: [manual, import, aggregator]
      recorded_at:
        type: string
        format: date-time
      reconciled:
        type: boolean
  BalanceAssertionList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/BalanceAssertion"
      next_cursor:
        type: string
        description: Absent on the last page.
  AssertionResult:
    type: object
    required: [assertion, difference]
    properties:
      assertion:
        $ref: "#/components/schemas/BalanceAssertion"
      difference:
        $ref: "#/components/schemas/Money"
      resolution:
        type: string
        enum: [none, yield, adjustment, transactions_added]
        description: Absent while the difference stays open.
      resolution_transaction_id:
        type: string
        format: uuid
        description: The yield or adjustment transaction recorded by the resolution.
  DisputeInput:
    type: object
    additionalProperties: false
    required: [opened_on]
    properties:
      opened_on:
        type: string
        format: date
  DisputeResolution:
    type: object
    additionalProperties: false
    required: [resolved_on, outcome]
    properties:
      resolved_on:
        type: string
        format: date
      outcome:
        type: string
        enum: [won, lost]
      statement:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
  Dispute:
    type: object
    required: [id, transaction_id, opened_on]
    properties:
      id:
        type: string
        format: uuid
      transaction_id:
        type: string
        format: uuid
      opened_on:
        type: string
        format: date
      resolved_on:
        type: string
        format: date
      outcome:
        type: string
        enum: [won, lost]
      refund_transaction_id:
        type: string
        format: uuid
  InstallmentPlan:
    type: object
    required: [id, transaction_id, account_id, status, count, installments]
    properties:
      id:
        type: string
        format: uuid
      transaction_id:
        type: string
        format: uuid
        description: The purchase or financing transaction that created the plan.
      account_id:
        type: string
        format: uuid
        description: The card account billed by the plan.
      status:
        type: string
        enum: [active, cancelled, anticipated]
        description: cancelled when a non-voided cancellation exists, else anticipated when a non-voided anticipation exists, else active.
      count:
        type: integer
      interest:
        $ref: "#/components/schemas/Money"
      installments:
        type: array
        description: Ordered by number.
        items:
          $ref: "#/components/schemas/ScheduledInstallment"
  ScheduledInstallment:
    type: object
    required: [number, statement, amount, reversed]
    properties:
      number:
        type: integer
      statement:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
        example: "2026-11"
      amount:
        $ref: "#/components/schemas/Money"
      reversed:
        type: boolean
        description: True when a cancellation or an anticipation credited the installment on its statement.
  DisputeList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Dispute"
  RefundInput:
    type: object
    additionalProperties: false
    required: [date, amount]
    properties:
      date:
        type: string
        format: date
      amount:
        $ref: "#/components/schemas/Money"
      statement:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
  CancellationInput:
    type: object
    additionalProperties: false
    required: [date]
    properties:
      date:
        type: string
        format: date
      credit_statement:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
  AnticipationInput:
    type: object
    additionalProperties: false
    required: [date, from_installment, to_installment, target_statement, amount]
    properties:
      date:
        type: string
        format: date
      from_installment:
        type: integer
        minimum: 1
        maximum: 420
      to_installment:
        type: integer
        minimum: 1
        maximum: 420
      target_statement:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
      amount:
        $ref: "#/components/schemas/Money"
  StatementPaymentInput:
    type: object
    additionalProperties: false
    required: [date, from_account_id, amount]
    properties:
      date:
        type: string
        format: date
      from_account_id:
        type: string
        format: uuid
      amount:
        $ref: "#/components/schemas/Money"
  StatementFinancingInput:
    type: object
    additionalProperties: false
    required: [date, installment_count, installment_amount]
    properties:
      date:
        type: string
        format: date
      installment_count:
        type: integer
        minimum: 2
        maximum: 420
      installment_amount:
        $ref: "#/components/schemas/Money"
  Split:
    type: object
    additionalProperties: false
    required: [account_id, amount]
    properties:
      account_id:
        type: string
        format: uuid
      amount:
        $ref: "#/components/schemas/Money"
  InstallmentPurchaseInput:
    type: object
    additionalProperties: false
    required: [card_account_id, date, splits, installment_count]
    properties:
      card_account_id:
        type: string
        format: uuid
      date:
        type: string
        format: date
      description:
        type: string
        maxLength: 500
      payee_id:
        type: string
        format: uuid
      tags:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 60
      splits:
        type: array
        items:
          $ref: "#/components/schemas/Split"
        minItems: 1
        maxItems: 500
      installment_count:
        type: integer
        minimum: 2
        maximum: 420
      interest:
        $ref: "#/components/schemas/Money"
      first_statement:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
      installment_amounts:
        type: array
        items:
          $ref: "#/components/schemas/Money"
        maxItems: 420
  InstallmentPurchase:
    type: object
    required: [transaction, plan_id]
    properties:
      transaction:
        $ref: "#/components/schemas/Transaction"
      plan_id:
        type: string
        format: uuid
  Commitment:
    type: object
    required: [month, amount]
    properties:
      month:
        type: string
      amount:
        $ref: "#/components/schemas/Money"
  StatementSummary:
    type: object
    required: [id, account_id, reference, closing_date, due_date, opening, charges, credits, amount_due, payments, unpaid, status, reconciled,
      settled, prior_credits, early_payments, billed_amount, open_amount]
    description: >-
      Amounts are positive when owed by the user. Every card posting is billed on the statement of its
      cycle (A89). opening is the previous amount_due; credits and payments are those billed on the
      statement; amount_due = opening + charges − credits − payments, the card balance at closing;
      settled is the credits and payments of the next statement, up to today, that cover amount_due;
      unpaid = amount_due − settled, zero for a credit balance; prior_credits are the credits that
      settled the previous statement; early_payments are the payments beyond what settled it;
      billed_amount = amount_due + early_payments; open_amount = amount_due less the unpaid amount of a
      previous statement not yet due (closed or partially_paid), the institution's open bill (A138). institution and amount_difference (amount_due −
      institution.total) are present when the institution reported the statement (A92). confirmed_amount and
      awaiting_amount split amount_due − opening into the postings an external record confirms and those it
      does not; both are present when some posting of the account carries a record (A170).
    properties:
      id:
        type: string
        format: uuid
      account_id:
        type: string
        format: uuid
      reference:
        type: string
      closing_date:
        type: string
        format: date
      due_date:
        type: string
        format: date
      opening:
        $ref: "#/components/schemas/Money"
      charges:
        $ref: "#/components/schemas/Money"
      credits:
        $ref: "#/components/schemas/Money"
      amount_due:
        $ref: "#/components/schemas/Money"
      payments:
        $ref: "#/components/schemas/Money"
      settled:
        $ref: "#/components/schemas/Money"
      unpaid:
        $ref: "#/components/schemas/Money"
      prior_credits:
        $ref: "#/components/schemas/Money"
      early_payments:
        $ref: "#/components/schemas/Money"
      billed_amount:
        $ref: "#/components/schemas/Money"
      open_amount:
        $ref: "#/components/schemas/Money"
      status:
        type: string
        enum: [open, closed, paid, partially_paid, overdue, financed]
      reconciled:
        type: boolean
        description: The institution's amount due was confirmed (POST /statements/{id}/reconcile).
      institution:
        $ref: "#/components/schemas/StatementFact"
      amount_difference:
        $ref: "#/components/schemas/Money"
      confirmed_amount:
        $ref: "#/components/schemas/Money"
      awaiting_amount:
        $ref: "#/components/schemas/Money"
  StatementFact:
    type: object
    description: What the institution reported for the statement (A85); the owner's facts first.
    required: [source, due_date, total]
    properties:
      source:
        type: string
        enum: [aggregator, owner]
      closing_date:
        type: string
        format: date
      due_date:
        type: string
        format: date
      total:
        $ref: "#/components/schemas/Money"
      minimum:
        $ref: "#/components/schemas/Money"
  StatementFactsInput:
    type: object
    additionalProperties: false
    required: [due_date, total]
    properties:
      closing_date:
        type: string
        format: date
      due_date:
        type: string
        format: date
      total:
        $ref: "#/components/schemas/Money"
      minimum:
        $ref: "#/components/schemas/Money"
  StatementList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/StatementSummary"
      next_cursor:
        type: string
        description: Absent on the last page.
  StatementPosting:
    type: object
    required: [transaction_id, date, description, card_role, amount, provisional]
    properties:
      transaction_id:
        type: string
        format: uuid
      date:
        type: string
        format: date
      description:
        type: string
      card_role:
        type: string
        enum: [charge, credit, payment]
      amount:
        $ref: "#/components/schemas/Money"
      installment:
        $ref: "#/components/schemas/Installment"
      provisional:
        type: boolean
        description: >-
          The institution may still bill the posting on another statement: no line stated its bill,
          the statement is not reconciled and the posting is dated within 10 days before the closing
          date (A136).
  StatementDetail:
    allOf:
      - $ref: "#/components/schemas/StatementSummary"
      - type: object
        required: [postings]
        properties:
          postings:
            type: array
            items:
              $ref: "#/components/schemas/StatementPosting"
          difference_proposal:
            $ref: "#/components/schemas/DifferenceProposal"
          rounding_difference:
            type: boolean
            description: >-
              Present and true when no set of provisional postings explains amount_difference and the
              difference is at most one minor unit per posting: the source likely rounded a line (A137).
  DifferenceProposal:
    type: object
    required: [transaction_ids, amount]
    description: >-
      On a closed statement whose amount due differs from the institution's total, the provisional
      postings whose move to the next statement closes the difference (A137).
    properties:
      transaction_ids:
        type: array
        items:
          type: string
          format: uuid
      amount:
        $ref: "#/components/schemas/Money"
  DeferPostingsInput:
    type: object
    additionalProperties: false
    required: [transaction_ids]
    properties:
      transaction_ids:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          format: uuid
  BillingCycleRule:
    type: object
    additionalProperties: false
    required: [effective_from, due_day]
    description: >-
      closing_mode day closes on closing_day; before_due closes closing_days_before_due days before
      the nominal due date. closing_adjustment shifts the closing date, projected or reported by the
      institution, on the rule's calendar (A87).
    properties:
      effective_from:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
        description: Reference month (YYYY-MM) from which the rule applies.
      closing_mode:
        type: string
        enum: [day, before_due]
      closing_day:
        type: integer
        minimum: 1
        maximum: 31
      closing_days_before_due:
        type: integer
        minimum: 1
        maximum: 28
      closing_adjustment:
        type: string
        enum: [none, following, preceding, modified_following]
      due_day:
        type: integer
        minimum: 1
        maximum: 31
      closing_day_assignment:
        type: string
        enum: [next, closing]
      due_date_adjustment:
        type: string
        enum: [none, following, preceding, modified_following]
      calendar:
        type: string
        description: Business-day calendar id from GET /calendars; defaults to the calendar of the owner's region.
  StatementPlacement:
