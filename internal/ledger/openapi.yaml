    get:
      tags: [ledger]
      operationId: listReimbursementSources
      x-book-role: read
      summary: Incoming transactions that can repay an expense (A117).
      description: |
        Non-voided inflows in the currency of the expense dated from its date through 90 days after, whose
        category side holds only uncategorized income and reimbursements and that do not repay this expense yet,
        each with the amount not allocated. Oldest first, at most 10. Empty when the transaction is voided or
        has no expense category.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
