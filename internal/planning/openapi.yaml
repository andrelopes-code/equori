paths:
  /schedules:
    get:
      tags: [planning]
      operationId: listSchedules
      x-book-role: read
      summary: Schedules in creation order.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [planning]
      operationId: createSchedule
      x-book-role: write
      summary: Create a schedule and generate its occurrences up to today + 12 months (P7 amendments A46-A49).
      description: |
        Money leaves account_id for every kind except income. The counterpart is an expense category for bill
        and subscription, an income category for income, and another balance account for transfer and savings.
        Both accounts are in the base currency (422 currency_unsupported otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /schedules/{id}:
    get:
      tags: [planning]
      operationId: getSchedule
      x-book-role: read
      summary: A schedule with its terms versions and pauses.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [planning]
      operationId: updateScheduleMatching
      x-book-role: write
      summary: Rename a schedule, start it earlier or change how transactions are matched to its occurrences (P7 amendments A198, A199).
      description: |
        Each field is optional; absent fields keep their value. The description applies to every occurrence of
        the schedule, an ended schedule included. starts_on moves the first date of the schedule before the
        current one, on the rhythm of its recurrence: the occurrences that exist stay, the dates gained before
        them are inserted, a recorded transaction realizes one it fits, and one that is overdue is skipped.
        422 validation_failed on starts_on when it is not before the current start, is off the rhythm, or the
        recurrence has a count. The matching change applies to transactions recorded,
        corrected or voided afterwards; occurrences already realized stay.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                starts_on:
                  type: string
                  format: date
                match_tolerance_bp:
                  type: integer
                grace_days:
                  type: integer
                match_window_days:
                  type: integer
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences:
    get:
      tags: [planning]
      operationId: listOccurrences
      x-book-role: read
      summary: Occurrences with expected date in [from, to], at most 366 days, by date, or those a transaction realized.
      description: |
        State overdue is derived from expected and the schedule's grace days (P7 amendment A50). With transaction_id the
        answer is the occurrences that transaction realized, whatever their date, and from, to, schedule_id and state
        are ignored; without it from and to are required.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: transaction_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: schedule_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OccurrenceState"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/realize:
    post:
      tags: [planning]
      operationId: realizeOccurrence
      x-book-role: write
      summary: Link a transaction to an expected occurrence; ledger changes never release it (P7 amendment A51).
      description: |
        The transaction has a posting on the schedule's account. 409 occurrence_closed when the occurrence is not
        expected; 409 transaction_in_use when the transaction realizes another occurrence.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealizeInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/skip:
    post:
      tags: [planning]
      operationId: skipOccurrence
      x-book-role: write
      summary: Skip an expected occurrence (T03; 409 occurrence_closed otherwise).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/move:
    post:
      tags: [planning]
      operationId: moveOccurrence
      x-book-role: write
      summary: Move an expected occurrence to another date; terms changes never regenerate it (P7 amendment A52).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /schedules/{id}/terms:
    post:
      tags: [planning]
      operationId: changeScheduleTerms
      x-book-role: write
      summary: Add a terms version effective from a date after the latest one (T09; P7 amendments A49, A52).
      description: |
        Without recurrence the previous rule is kept, start included. Expected occurrences from the date on that
        were not moved are regenerated; realized, skipped and moved ones stay. 409 schedule_ended on or after ends_on.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermsInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /schedules/{id}/pauses:
    post:
      tags: [planning]
      operationId: pauseSchedule
      x-book-role: write
      summary: Suppress the dates in [from, to] (P7 amendment A52).
      description: 409 pause_overlap when it overlaps another pause; 409 schedule_ended on or after ends_on.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePause"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /schedules/{id}/end:
    post:
      tags: [planning]
      operationId: endSchedule
      x-book-role: write
      summary: Produce no occurrence on or after a date; expected ones are removed, realized ones stay (P7 amendment A52).
      description: 409 schedule_ended when the schedule already ends on or before the date.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /budgets:
    get:
      tags: [planning]
      operationId: listBudgets
      x-book-role: read
      summary: Budgets in creation order.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [planning]
      operationId: createBudget
      x-book-role: write
      summary: Create the monthly budget of a category (P7 amendment A54; 409 budget_exists when it has one).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budgets/{id}:
    get:
      tags: [planning]
      operationId: getBudget
      x-book-role: read
      summary: A budget with its amounts by month.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [planning]
      operationId: deleteBudget
      x-book-role: write
      summary: Delete a budget with its amounts; its category and postings are not touched (S144).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /budgets/{id}/amounts:
    post:
      tags: [planning]
      operationId: addBudgetAmount
      x-book-role: write
      summary: Set the amount from a month on, after the latest one (T09).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetAmount"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budgets/{id}/progress:
    get:
      tags: [planning]
      operationId: getBudgetProgress
      x-book-role: read
      summary: Planned, carried, spent and available amounts of a month, accrual view (P7 amendment A54).
      description: Spending of an income category is reported as a positive amount.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetProgress"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /goals:
    get:
      tags: [planning]
      operationId: listGoals
      x-book-role: read
      summary: Goals in creation order, with their progress today.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [planning]
      operationId: createGoal
      x-book-role: write
      summary: Create a target balance over balance accounts by a date (P7 amendment A55).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /goals/{id}:
    get:
      tags: [planning]
      operationId: getGoal
      x-book-role: read
      summary: A goal with its progress today.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [planning]
      operationId: updateGoal
      x-book-role: write
      summary: Change the name, target, due date or accounts of a goal; fields not sent stay as they are.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [planning]
      operationId: deleteGoal
      x-book-role: write
      summary: Delete a goal; its accounts are not touched.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /goals/{id}/allocations:
    get:
      tags: [planning]
      operationId: listGoalAllocations
      x-book-role: read
      summary: The allocations of a goal, the latest first (planning coherence A255).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalAllocations"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      tags: [planning]
      operationId: createGoalAllocation
      x-book-role: write
      summary: Assign a signed amount of an allocated account to a goal; no balance changes (planning coherence A255).
      description: |
        `account_id` is an account the goal holds by allocations; any other is a 422 on `account_id`. `amount` is in
        the currency of the account and is not zero: a positive amount sets money aside for the goal, a negative
        one releases it. An amount above what the account has available, or one that brings the goal's allocation
        in the account below zero, is a 422 on `amount`.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalAllocationInput"
      responses:
        "200":
          description: The goal after the allocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /goals/{id}/allocations/{allocation_id}:
    delete:
      tags: [planning]
      operationId: deleteGoalAllocation
      x-book-role: write
      summary: Delete an allocation of a goal.
      description: |
        An allocation an occurrence created is a 422 on `allocation_id`: unrealizing the occurrence deletes it. So is
        one whose removal brings the goal's allocation in the account below zero.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: allocation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /goals/{id}/expenses:
    get:
      tags: [planning]
      operationId: listGoalExpenses
      x-book-role: read
      summary: The expense transactions a goal pays, the latest first (planning coherence A256).
      description: |
        A goal pays a transaction by a stored link, or directly: the transaction holds an expense posting and a posting
        in an account that this goal alone holds whole, sub-accounts included. `amount` sums the expense postings of
        the transaction in the base currency.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalExpenses"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /goals/{id}/expenses/{transaction_id}:
    put:
      tags: [planning]
      operationId: linkGoalExpense
      x-book-role: write
      summary: State that a goal paid an expense transaction (planning coherence A256).
      description: |
        The transaction is a non-voided transaction of the book with at least one expense posting; any other is a 422
        on `transaction_id`. A transaction holds one link: a new link replaces the one it had. The expense stays in
        every report; the bucket of its category is judged without it and the budget of its category leaves it out
        of the spending (A257).
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/GoalTransactionID"
      responses:
        "204":
          description: Linked.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [planning]
      operationId: unlinkGoalExpense
      x-book-role: write
      summary: Remove the link between a goal and an expense transaction; 404 without that link.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/GoalTransactionID"
      responses:
        "204":
          description: Unlinked.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/projection:
    get:
      tags: [planning]
      operationId: getProjection
      x-book-role: read
      summary: Projected balance of a balance account to a date after today, at most today + 12 months (P7 amendment A56).
      description: |
        opening is the booked balance today. Each point is an expected occurrence on the account, an overdue one
        dated today, ordered by date then amount. closing is the booked balance at to plus every point.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Projection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /commitments:
    get:
      tags: [planning]
      operationId: getCommitted
      x-book-role: read
      summary: Installments and expected bills, subscriptions and savings committed in a month (P7 amendment A57).
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Committed"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budget-plan:
    get:
      tags: [planning]
      operationId: getBudgetPlan
      x-book-role: read
      summary: The reference income of a month, what is committed and the budgets to distribute it across (budget plan A129, A131).
      parameters:
        - $ref: "#/components/parameters/PlanMonth"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPlan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    put:
      tags: [planning]
      operationId: saveBudgetPlan
      x-book-role: write
      summary: Save the reference choice and the amounts of a month from the current one on, in one transaction (budget plan A130).
      description: |
        Each listed category gets the amount from the month on, replacing the version of that month; a category without a
        budget and an amount above zero gets a budget without rollover. Versions of other months are not touched.
      parameters:
        - $ref: "#/components/parameters/PlanMonth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetPlanInput"
      responses:
        "200":
          description: The plan after the save.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPlan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budget-buckets:
    get:
      tags: [planning]
      operationId: getBudgetBuckets
      x-book-role: read
      summary: The income bucket method in force in a month, in order, without figures; an empty list without one (income buckets A229, A240).
      parameters:
        - name: month
          in: query
          required: false
          description: The month to read; the current month when absent.
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetBuckets"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    put:
      tags: [planning]
      operationId: saveBudgetBuckets
      x-book-role: write
      summary: Save the version of the income bucket method that starts in a month; an empty list ends the split from that month (A240).
      description: |
        Shares sum to 10000 basis points; names are unique ignoring case; at most one bucket takes savings; a category
        is an expense category of the book listed in one bucket. A broken rule is a 422 on its field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetBucketsInput"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budget-buckets/versions:
    get:
      tags: [planning]
      operationId: getBudgetBucketVersions
      x-book-role: read
      summary: Every version of the income bucket method, by start month ascending (income buckets A240).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetBucketVersions"
        "401":
          $ref: "#/components/responses/Problem"
  /budget-buckets/versions/{from}:
    delete:
      tags: [planning]
      operationId: deleteBudgetBucketVersion
      x-book-role: write
      summary: Delete the version of the income bucket method that starts in a month; its months fall to the version before it (A240).
      parameters:
        - name: from
          in: path
          required: true
          description: The first month of the version.
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budget-buckets/history:
    get:
      tags: [planning]
      operationId: getBudgetBucketHistory
      x-book-role: read
      summary: The income split of a month and the five before it (income buckets A233).
      description: |
        Each month reads the method in force in it (A242): `from` names its version, absent without a split, and
        `buckets` holds the real amount of each bucket of that method in its order. `methods` lists the versions
        that are the method of at least one month. A month also holds the income received and the spending outside
        the split. A bucket's real amount is the own spending of its categories; the bucket that takes savings adds
        what went into the book's savings, reserve and brokerage accounts in the month. `unallocated` is the income
        that no bucket and no spending took: the real amounts, `outside` and `unallocated` sum to `received`, and a
        negative value is spending paid from balances (A235).
      parameters:
        - $ref: "#/components/parameters/PlanMonth"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetBucketHistory"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budget-buckets/entries:
    get:
      tags: [planning]
      operationId: getBudgetBucketEntries
      x-book-role: read
      summary: The entries that sum to the real amount of a bucket in a month (A243).
      description: |
        Without `bucket`, the entries of the spending outside the split. `bucket` is the id of a bucket of the method
        of the month; 404 otherwise. An `expense` entry is an own posting of a category that resolves to the bucket; a
        `savings` or `goals` entry is a transaction that moved money into the savings or the goals. The entries come
        by date descending, then by `transaction_id` descending, and `total` is their sum.
      parameters:
        - $ref: "#/components/parameters/PlanMonth"
        - name: bucket
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetBucketEntries"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/reopen:
    post:
      tags: [planning]
      operationId: reopenOccurrence
      x-book-role: write
      summary: Make a skipped occurrence expected again; a recorded transaction that fits it realizes it (P7 amendment A200).
      description: |
        409 occurrence_closed when the occurrence is not skipped; 409 schedule_ended when its date is on or after
        ends_on; 422 when its date falls inside a pause.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/unrealize:
    post:
      tags: [planning]
      operationId: unrealizeOccurrence
      x-book-role: write
      summary: Release a realized occurrence (409 occurrence_closed when it is not realized).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
parameters:
  GoalTransactionID:
    name: transaction_id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  PlanMonth:
    name: month
    in: query
    required: true
    schema:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}$"
schemas:
  ScheduleKind:
    type: string
    enum: [bill, income, subscription, transfer, savings]
  Recurrence:
    type: object
    additionalProperties: false
    required: [frequency, interval, start]
    description: |
      A monthly rule takes exactly one of day_of_month, weekday with ordinal, business_day_ordinal; -1 means
      the last one. Business days follow the calendar of the schedule. until is inclusive (P7 amendment A48).
    properties:
      frequency:
        type: string
        enum: [daily, weekly, monthly, yearly]
      interval:
        type: integer
        minimum: 1
        maximum: 120
      day_of_month:
        type: integer
        minimum: -1
        maximum: 31
      weekday:
        type: string
        enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
      ordinal:
        type: integer
        minimum: -1
        maximum: 5
      business_day_ordinal:
        type: integer
        minimum: -1
        maximum: 23
      adjustment:
        type: string
        enum: [none, following, preceding, modified_following]
        default: none
      start:
        type: string
        format: date
      until:
        type: string
        format: date
      count:
        type: integer
        minimum: 1
        maximum: 10000
  ScheduleInput:
    type: object
    additionalProperties: false
    required: [kind, account_id, counterpart_id, description, amount, recurrence]
    properties:
      kind:
        $ref: "#/components/schemas/ScheduleKind"
      account_id:
        type: string
        format: uuid
      counterpart_id:
        type: string
        format: uuid
      payee_id:
        type: string
        format: uuid
      goal_id:
        type: string
        format: uuid
        description: |
          For the kinds savings and transfer: the goal that holds counterpart_id by allocations. Realizing an
          occurrence allocates its amount to that goal; unrealizing deletes that allocation (A255).
      description:
        type: string
        minLength: 1
        maxLength: 200
      amount:
        $ref: "#/components/schemas/Money"
      recurrence:
        $ref: "#/components/schemas/Recurrence"
      calendar:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: Business-day calendar id from GET /calendars; defaults to the calendar of the owner's region.
      match_tolerance_bp:
        type: integer
        minimum: 0
        maximum: 10000
        default: 1000
      grace_days:
        type: integer
        minimum: 0
        maximum: 31
        default: 3
      match_window_days:
        type: integer
  ScheduleTerms:
    type: object
    required: [effective_from, amount, recurrence]
    properties:
      effective_from:
        type: string
        format: date
      amount:
        $ref: "#/components/schemas/Money"
      recurrence:
        $ref: "#/components/schemas/Recurrence"
  SchedulePause:
    type: object
    additionalProperties: false
    required: [from, to]
    properties:
      from:
        type: string
        format: date
      to:
        type: string
        format: date
        description: Inclusive.
  Schedule:
    type: object
    required: [id, kind, account_id, counterpart_id, description, calendar, match_tolerance_bp, grace_days, match_window_days, terms, pauses]
    properties:
      id:
        type: string
        format: uuid
      kind:
        $ref: "#/components/schemas/ScheduleKind"
      calendar:
        type: string
        description: Business-day calendar id the schedule follows.
      account_id:
        type: string
        format: uuid
      counterpart_id:
        type: string
        format: uuid
      payee_id:
        type: string
        format: uuid
      goal_id:
        type: string
        format: uuid
        description: |
          For the kinds savings and transfer: the goal that holds counterpart_id by allocations. Realizing an
          occurrence allocates its amount to that goal; unrealizing deletes that allocation (A255).
      description:
        type: string
      match_tolerance_bp:
        type: integer
      grace_days:
        type: integer
      match_window_days:
        type: integer
        minimum: 0
        maximum: 31
        default: 7
      ends_on:
        type: string
        format: date
        description: No occurrence on or after this date; absent while the schedule has no end.
      terms:
        type: array
        description: Versions by effective date.
        items:
          $ref: "#/components/schemas/ScheduleTerms"
      pauses:
        type: array
        items:
          $ref: "#/components/schemas/SchedulePause"
      moves:
        $ref: "#/components/schemas/ScheduleMoves"
  ScheduleMoves:
    type: object
    required: [from, to]
    readOnly: true
    description: |
      The sets a schedule of kind savings or transfer moves money between (A253): from is the set of its account and
      to the set of its counterpart. Absent for the other kinds.
    properties:
      from:
        $ref: "#/components/schemas/AccountSet"
      to:
        $ref: "#/components/schemas/AccountSet"
  AccountSet:
    type: string
    enum: [spending, savings, goals]
    description: |
      The set of an asset or liability account (A250): goals holds the accounts of the goals that do not count as
      savings; savings holds the savings, reserve and brokerage accounts outside it and the accounts of the goals that
      count as savings; spending holds every other account.
  SchedulePage:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Schedule"
      next_cursor:
        type: string
        description: Absent on the last page.
  OccurrenceState:
    type: string
    enum: [expected, overdue, realized, skipped]
  Occurrence:
    type: object
    required: [id, schedule_id, sequence, expected_on, expected_amount, state]
    properties:
      id:
        type: string
        format: uuid
      schedule_id:
        type: string
        format: uuid
      sequence:
        type: integer
      expected_on:
        type: string
        format: date
      expected_amount:
        $ref: "#/components/schemas/Money"
      actual_amount:
        $ref: "#/components/schemas/Money"
      state:
        $ref: "#/components/schemas/OccurrenceState"
      transaction_id:
        type: string
        format: uuid
        description: Present when realized.
      moved_from:
        type: string
        format: date
        description: The generated date of a moved occurrence.
  BudgetAmount:
    type: object
    additionalProperties: false
    required: [effective_from, amount]
    properties:
      effective_from:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
      amount:
        $ref: "#/components/schemas/Money"
  BudgetInput:
    type: object
    additionalProperties: false
    required: [category_id, amount, effective_from, rollover]
    properties:
      category_id:
        type: string
        format: uuid
      amount:
        $ref: "#/components/schemas/Money"
      effective_from:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
      rollover:
        type: boolean
  Budget:
    type: object
    required: [id, category_id, rollover, amounts]
    properties:
      id:
        type: string
        format: uuid
      category_id:
        type: string
        format: uuid
      rollover:
        type: boolean
      amounts:
        type: array
        description: Versions by month.
        items:
          $ref: "#/components/schemas/BudgetAmount"
  BudgetPage:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Budget"
      next_cursor:
        type: string
        description: Absent on the last page.
  BudgetProgress:
    type: object
    required: [month, planned, carried, spent, goal_paid, available]
    description: |
      carried is the previous month's available amount when rollover is set, else zero; available is
      planned + carried - spent, negative when overspent. spent leaves out the expenses of the month that a goal
      pays, and goal_paid is the amount left out (planning coherence A257).
    properties:
      month:
        type: string
      planned:
        $ref: "#/components/schemas/Money"
      carried:
        $ref: "#/components/schemas/Money"
      spent:
        $ref: "#/components/schemas/Money"
      goal_paid:
        $ref: "#/components/schemas/Money"
      available:
        $ref: "#/components/schemas/Money"
  BudgetPlanSource:
    type: string
    enum: [expected_income, average_income, fixed]
  BudgetPlanIncome:
    type: object
    required: [schedule_id, description, amount]
    properties:
      schedule_id:
        type: string
        format: uuid
      description:
        type: string
      amount:
        $ref: "#/components/schemas/Money"
  BudgetPlanInstallment:
    type: object
    required: [transaction_id, description, card_account_id, count, amount]
    description: |
      One charge of installments: installment number of count of the purchase transaction_id, or the charge of an
      anticipation of that purchase when number is absent.
    properties:
      transaction_id:
        type: string
        format: uuid
      description:
        type: string
      card_account_id:
        type: string
        format: uuid
      number:
        type: integer
        minimum: 1
      count:
        type: integer
        minimum: 2
      amount:
        $ref: "#/components/schemas/Money"
  BudgetPlanRow:
    type: object
    required: [category_id, planned, last_month, average, counted]
    description: |
      A category of the plan. last_month and average read the subtree of a budgeted category and the own postings
      of another; counted is false for a budget under a category whose budget is in force.
    properties:
      category_id:
        type: string
        format: uuid
      budget_id:
        type: string
        format: uuid
      planned:
        $ref: "#/components/schemas/Money"
      last_month:
        $ref: "#/components/schemas/Money"
      average:
        $ref: "#/components/schemas/Money"
      counted:
        type: boolean
      next_change:
        type: string
        description: The month of the budget's first amount after this month.
  BudgetPlanAmount:
    type: object
    additionalProperties: false
    required: [category_id, amount]
    properties:
      category_id:
        type: string
        format: uuid
      amount:
        $ref: "#/components/schemas/Money"
  BudgetPlanInput:
    type: object
    additionalProperties: false
    required: [source, amounts]
    properties:
      source:
        $ref: "#/components/schemas/BudgetPlanSource"
      fixed:
        $ref: "#/components/schemas/Money"
      savings_target_bp:
        type: integer
        description: |
          The share of the reference set aside, in basis points, from 0 to 10000 (savings target A187, checked by the
          server as a 422 on this field). A save without it clears the stored target.
      amounts:
        type: array
        description: The changed categories only.
        maxItems: 500
        items:
          $ref: "#/components/schemas/BudgetPlanAmount"
  BudgetBucketInput:
    type: object
    additionalProperties: false
    required: [name, share_bp, takes_savings, category_ids]
    properties:
      id:
        type: string
        format: uuid
        description: The id of the bucket this one continues; absent for a new bucket (A241).
      name:
        type: string
        maxLength: 60
      share_bp:
        type: integer
        description: The bucket's share of the reference in basis points, from 0 to 10000.
      takes_savings:
        type: boolean
        description: The bucket also draws the month's savings; at most one bucket of a method.
      takes_goals:
        type: boolean
        default: false
        description: The bucket also draws what went into the goals' accounts from other accounts of the book; at most one bucket of a method, never the one that takes savings.
      at_least:
        type: boolean
        default: false
        description: The target is a floor the bucket should reach, not a ceiling it should stay under.
      category_ids:
        type: array
        maxItems: 500
        description: Expense categories placed in the bucket; a subcategory without a bucket of its own follows its ancestor.
        items:
          type: string
          format: uuid
  BudgetBucketsInput:
    type: object
    additionalProperties: false
    required: [buckets]
    properties:
      from:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        description: First month of this version; the current month when absent (A240).
      buckets:
        type: array
        maxItems: 10
        items:
          $ref: "#/components/schemas/BudgetBucketInput"
  BudgetBucket:
    type: object
    required: [id, name, share_bp, takes_savings, takes_goals, at_least, category_ids]
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      share_bp:
        type: integer
      takes_savings:
        type: boolean
      takes_goals:
        type: boolean
      at_least:
        type: boolean
      category_ids:
        type: array
        items:
          type: string
          format: uuid
  BudgetBuckets:
    type: object
    required: [buckets]
    properties:
      from:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        description: First month of the version in force; absent without a split.
      buckets:
        type: array
        items:
          $ref: "#/components/schemas/BudgetBucket"
  BudgetBucketVersion:
    type: object
    required: [from, buckets]
    properties:
      from:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      buckets:
        type: array
        items:
          $ref: "#/components/schemas/BudgetBucket"
  BudgetBucketVersions:
    type: object
    required: [versions]
    properties:
      versions:
        type: array
        items:
          $ref: "#/components/schemas/BudgetBucketVersion"
  BudgetBucketEntry:
    type: object
    required: [date, description, kind, amount]
    properties:
      transaction_id:
        type: string
        format: uuid
        description: Absent for an allocation to a goal, whose description is the goal's name (A255).
      category_id:
        type: string
        format: uuid
      date:
        type: string
        format: date
      description:
        type: string
      payee:
        type: string
      kind:
        type: string
        enum: [expense, savings, goals]
      amount:
        $ref: "#/components/schemas/Money"
  BudgetBucketEntries:
    type: object
    required: [currency, total, entries]
    properties:
      currency:
        type: string
      total:
        $ref: "#/components/schemas/Money"
      entries:
        type: array
        items:
          $ref: "#/components/schemas/BudgetBucketEntry"
  BudgetBucketHistory:
    type: object
    required: [currency, methods, months]
    properties:
      currency:
        type: string
      methods:
        type: array
        items:
          $ref: "#/components/schemas/BudgetBucketVersion"
      months:
        type: array
        items:
          $ref: "#/components/schemas/BudgetBucketMonth"
  BudgetBucketMonth:
    type: object
    required: [month, received, outside, unallocated, retained, buckets]
    description: |
      received is the income of the month without retained, the yields and realized gains whose transaction has no
      posting in an account of the spending set (A252). unallocated is received minus the expenses by transaction date
      and the money set aside: an accrual figure, not money left in accounts (A235).
    properties:
      month:
        type: string
      from:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        description: First month of the version that is the method of this month; absent without a split.
      received:
        $ref: "#/components/schemas/Money"
      outside:
        $ref: "#/components/schemas/Money"
      unallocated:
        $ref: "#/components/schemas/Money"
      retained:
        $ref: "#/components/schemas/Money"
      buckets:
        type: array
        items:
          $ref: "#/components/schemas/BudgetBucketReal"
  BudgetBucketReal:
    type: object
    required: [id, real, goal_paid, covered]
    description: |
      The figures of a bucket in a month (A254). goal_paid is the spending of its categories that a goal paid; covered
      is the spending that the accumulated balance of its rollover budgets paid. A ceiling bucket kept its target when
      real - goal_paid - covered is at most the target. deposited and withdrawn are present for the bucket that takes
      goals: what went into the goal set and what left it; it kept its target when deposited is at least the target.
    properties:
      id:
        type: string
        format: uuid
      real:
        $ref: "#/components/schemas/Money"
      goal_paid:
        $ref: "#/components/schemas/Money"
      covered:
        $ref: "#/components/schemas/Money"
      deposited:
        $ref: "#/components/schemas/Money"
      withdrawn:
        $ref: "#/components/schemas/Money"
  BudgetPlanBucket:
    type: object
    required: [id, name, share_bp, takes_savings, takes_goals, at_least, category_ids, planned, spent]
    description: |
      A bucket of the method with its figures of the month (A230): target splits the reference by share and is absent
      with reference; planned sums the counted budgets of its categories, plus savings when it takes savings and
      goal_deposits when it takes goals (A253); spent sums the month's own postings of its categories, plus the realized
      savings when it takes savings.
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      share_bp:
        type: integer
      takes_savings:
        type: boolean
      takes_goals:
        type: boolean
      at_least:
        type: boolean
      category_ids:
        type: array
        items:
          type: string
          format: uuid
      target:
        $ref: "#/components/schemas/Money"
      planned:
        $ref: "#/components/schemas/Money"
      spent:
        $ref: "#/components/schemas/Money"
  BudgetPlan:
    type: object
    required:
      - month
      - currency
      - source
      - received_income
      - installments
      - installment_items
      - savings
      - goal_deposits
      - savings_brokerage
      - goal_deposits_brokerage
      - planned
      - rows
    description: |
      installments are those billed on the month's statements for purchases booked before it; installment_items
      holds them one per charge, by card and then in the order of the purchase dates. savings is what the
      month's occurrences of savings and transfer schedules move into the savings set, minus what they move out of it;
      goal_deposits is the same over the goal set; savings_brokerage and goal_deposits_brokerage are their parts whose
      counterpart is a brokerage account (A253). unassigned is reference - installments - savings - goal_deposits -
      planned and is absent with reference, which is absent when the source has no figure.
    properties:
      month:
        type: string
      currency:
        type: string
      source:
        $ref: "#/components/schemas/BudgetPlanSource"
      fixed:
        $ref: "#/components/schemas/Money"
      expected_income:
        $ref: "#/components/schemas/Money"
      expected_items:
        type: array
        items:
          $ref: "#/components/schemas/BudgetPlanIncome"
      average_income:
        $ref: "#/components/schemas/Money"
      average_months:
        type: integer
        minimum: 1
        maximum: 3
      received_income:
        $ref: "#/components/schemas/Money"
      reference:
        $ref: "#/components/schemas/Money"
      installments:
        $ref: "#/components/schemas/Money"
      installment_items:
        type: array
        items:
          $ref: "#/components/schemas/BudgetPlanInstallment"
      savings:
        $ref: "#/components/schemas/Money"
      goal_deposits:
        $ref: "#/components/schemas/Money"
      savings_brokerage:
        $ref: "#/components/schemas/Money"
      goal_deposits_brokerage:
        $ref: "#/components/schemas/Money"
      planned:
        $ref: "#/components/schemas/Money"
      unassigned:
        $ref: "#/components/schemas/Money"
      savings_target_bp:
        type: integer
        description: The stored savings target in basis points of the reference; absent without one (A187).
      savings_rate_bp:
        type: integer
        description: savings as basis points of reference, truncated; absent without a reference above zero (A188).
      savings_target:
        $ref: "#/components/schemas/Money"
      savings_gap:
        $ref: "#/components/schemas/Money"
      prices:
        type: array
        description: Prices that value occurrences in another currency at today (P8 amendment A72).
        items:
          $ref: "#/components/schemas/Price"
      rows:
        type: array
        items:
          $ref: "#/components/schemas/BudgetPlanRow"
      buckets:
        type: array
        description: The book's income bucket method; absent without one (A229).
        items:
          $ref: "#/components/schemas/BudgetPlanBucket"
      outside_planned:
        $ref: "#/components/schemas/Money"
      outside_spent:
        $ref: "#/components/schemas/Money"
      outside_category_ids:
        type: array
        description: |
          The open expense categories, the uncategorized one excepted, that resolve to no bucket of the method of the month,
          by name; present with `buckets` (A236).
        items:
          type: string
          format: uuid
  GoalInput:
    type: object
    additionalProperties: false
    required: [name, target, due_on]
    description: |
      A goal holds at least one account. account_ids are held whole: their balance counts. allocated_account_ids
      are held by allocated amounts, so several goals can share one account (planning coherence A255): an asset
      account without sub-accounts whose instrument is a currency. An account is held whole or by allocations
      across the goals of the book, never both.
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 60
      target:
        $ref: "#/components/schemas/Money"
      due_on:
        type: string
        format: date
      account_ids:
        type: array
        maxItems: 20
        uniqueItems: true
        items:
          type: string
          format: uuid
      allocated_account_ids:
        type: array
        maxItems: 20
        uniqueItems: true
        items:
          type: string
          format: uuid
      counts_as_savings:
        type: boolean
        description: |
          What goes into the goal's accounts counts in the bucket that takes savings instead of the bucket that
          takes goals (income buckets A239). False when absent.
  GoalPatch:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 60
      target:
        $ref: "#/components/schemas/Money"
      due_on:
        type: string
        format: date
      account_ids:
        type: array
        maxItems: 20
        uniqueItems: true
        items:
          type: string
          format: uuid
      allocated_account_ids:
        type: array
        maxItems: 20
        uniqueItems: true
        description: Replaces the accounts held by allocations; an account that leaves the list loses its allocations.
        items:
          type: string
          format: uuid
      counts_as_savings:
        type: boolean
        description: |
          What goes into the goal's accounts counts in the bucket that takes savings instead of the bucket that
          takes goals (income buckets A239).
  Goal:
    type: object
    required:
      - id
      - name
      - target
      - due_on
      - account_ids
      - counts_as_savings
      - current
      - remaining
      - progress_bp
      - spent
      - allocated_accounts
      - shared_with
    description: |
      current is the sum of the booked balances of the whole accounts today plus the amounts allocated to the goal
      in its allocated accounts (planning coherence A255), valued in the target currency with stored prices (P8
      amendment A72); remaining is max(target - current, 0); progress_bp is current / target
      in basis points, rounded down, between 0 and 10000. spent sums the expense postings of the transactions the
      goal pays, in the base currency (planning coherence A256).
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      target:
        $ref: "#/components/schemas/Money"
      due_on:
        type: string
        format: date
      account_ids:
        type: array
        items:
          type: string
          format: uuid
      counts_as_savings:
        type: boolean
        description: |
          What goes into the goal's accounts counts in the bucket that takes savings instead of the bucket that
          takes goals (income buckets A239).
      current:
        $ref: "#/components/schemas/Money"
      remaining:
        $ref: "#/components/schemas/Money"
      progress_bp:
        type: integer
      spent:
        $ref: "#/components/schemas/Money"
      unexplained_withdrawal:
        $ref: "#/components/schemas/GoalWithdrawal"
      allocated_accounts:
        type: array
        items:
          $ref: "#/components/schemas/GoalAllocatedAccount"
      over_allocated:
        $ref: "#/components/schemas/Money"
      shared_with:
        type: array
        description: The other goals that hold one of this goal's accounts.
        items:
          type: string
          format: uuid
      prices:
        type: array
        description: Prices that value accounts in another currency (P8 amendment A72).
        items:
          $ref: "#/components/schemas/Price"
      parts:
        type: array
        description: |
          What current is made of: for each goal account, each instrument held in it and its sub-accounts with a
          non-zero quantity, in instrument order, valued in the target currency (P8 amendment A121).
        items:
          $ref: "#/components/schemas/GoalPart"
      trailing_return:
        $ref: "#/components/schemas/TrailingReturn"
  TrailingReturn:
    type: object
    required: [period_months, annual_bp]
    description: |
      The money-weighted return of the goal's accounts, taken as one tree, over the last 12 months or since their
      first posting if shorter, valued in the target currency (investments design 4.4). Absent with less than three
      months of postings or no external flow in the window.
    properties:
      period_months:
        type: integer
      annual_bp:
        type: integer
  GoalPart:
    type: object
    required: [account_id, instrument, quantity, value]
    properties:
      account_id:
        type: string
        format: uuid
      instrument:
        type: string
      quantity:
        $ref: "#/components/schemas/Money"
      value:
        $ref: "#/components/schemas/Money"
  GoalAllocatedAccount:
    type: object
    required: [account_id, allocated, available]
    description: |
      An account the goal holds by allocations (A255): allocated is the sum of this goal's allocations booked up to
      today; available is the booked balance of the account minus the allocations of every goal, negative when a
      withdrawal left the account over-allocated. Both are in the currency of the account. The goal's
      over_allocated sums the negated negative available amounts of its accounts, in the target currency.
    properties:
      account_id:
        type: string
        format: uuid
      allocated:
        $ref: "#/components/schemas/Money"
      available:
        $ref: "#/components/schemas/Money"
  GoalAllocationInput:
    type: object
    additionalProperties: false
    required: [account_id, amount]
    properties:
      account_id:
        type: string
        format: uuid
      amount:
        $ref: "#/components/schemas/Money"
      booked_on:
        type: string
        format: date
        description: Today when absent.
  GoalAllocation:
    type: object
    required: [id, account_id, booked_on, amount]
    properties:
      id:
        type: string
        format: uuid
      account_id:
        type: string
        format: uuid
      booked_on:
        type: string
        format: date
      amount:
        $ref: "#/components/schemas/Money"
      occurrence_id:
        type: string
        format: uuid
        description: The occurrence that created the allocation; such an allocation is deleted by unrealizing it.
  GoalAllocations:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/GoalAllocation"
  GoalWithdrawal:
    type: object
    required: [amount, since]
    description: |
      The latest withdrawal of the last 12 months from the accounts the goal holds whole into another balance
      account, less the expenses linked to the goal dated on or after it; absent when they cover it (planning
      coherence A256). The screen asks which expenses the goal paid.
    properties:
      amount:
        $ref: "#/components/schemas/Money"
      since:
        type: string
        format: date
  GoalExpense:
    type: object
    required: [transaction_id, date, description, amount, direct]
    properties:
      transaction_id:
        type: string
        format: uuid
      date:
        type: string
        format: date
      description:
        type: string
      amount:
        $ref: "#/components/schemas/Money"
      direct:
        type: boolean
        description: Paid from an account the goal holds whole; false for a stored link.
  GoalExpenses:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/GoalExpense"
  GoalPage:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Goal"
      next_cursor:
        type: string
        description: Absent on the last page.
  ProjectionPoint:
    type: object
    required: [date, occurrence_id, schedule_id, amount, balance]
    properties:
      date:
        type: string
        format: date
      occurrence_id:
        type: string
        format: uuid
      schedule_id:
        type: string
        format: uuid
      amount:
        $ref: "#/components/schemas/Money"
      balance:
        $ref: "#/components/schemas/Money"
  Projection:
    type: object
    required: [account_id, from, to, opening, closing, points]
    properties:
      account_id:
        type: string
        format: uuid
      from:
        type: string
        format: date
      to:
        type: string
        format: date
      opening:
        $ref: "#/components/schemas/Money"
      closing:
        $ref: "#/components/schemas/Money"
      points:
        type: array
        items:
          $ref: "#/components/schemas/ProjectionPoint"
  Committed:
    type: object
    required: [month, installments, occurrences, total]
    properties:
      month:
        type: string
      installments:
        $ref: "#/components/schemas/Money"
      occurrences:
        $ref: "#/components/schemas/Money"
      total:
        $ref: "#/components/schemas/Money"
      prices:
        type: array
        description: Prices that value occurrences in another currency at today (P8 amendment A72).
        items:
          $ref: "#/components/schemas/Price"
  SkipInput:
    type: object
    additionalProperties: false
    properties:
      reason:
        type: string
        maxLength: 200
  MoveInput:
    type: object
    additionalProperties: false
    required: [date]
    properties:
      date:
        type: string
        format: date
  TermsInput:
    type: object
    additionalProperties: false
    required: [effective_from]
    description: At least one of amount and recurrence.
    properties:
      effective_from:
        type: string
        format: date
      amount:
        $ref: "#/components/schemas/Money"
      recurrence:
        $ref: "#/components/schemas/Recurrence"
  EndInput:
    type: object
    additionalProperties: false
    required: [from]
    properties:
      from:
        type: string
        format: date
  RealizeInput:
    type: object
    additionalProperties: false
    required: [transaction_id]
    properties:
      transaction_id:
        type: string
        format: uuid
  OccurrenceList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Occurrence"
