paths:
  /schedules:
    get:
      tags: [planning]
      operationId: listSchedules
      x-book-role: read
      summary: Schedules in creation order.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [planning]
      operationId: createSchedule
      x-book-role: write
      summary: Create a schedule and generate its occurrences up to today + 12 months (P7 amendments A46-A49).
      description: |
        Money leaves account_id for every kind except income. The counterpart is an expense category for bill
        and subscription, an income category for income, and another balance account for transfer and savings.
        Both accounts are in the base currency (422 currency_unsupported otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /schedules/{id}:
    get:
      tags: [planning]
      operationId: getSchedule
      x-book-role: read
      summary: A schedule with its terms versions and pauses.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [planning]
      operationId: updateScheduleMatching
      x-book-role: write
      summary: Rename a schedule, start it earlier or change how transactions are matched to its occurrences (P7 amendments A198, A199).
      description: |
        Each field is optional; absent fields keep their value. The description applies to every occurrence of
        the schedule, an ended schedule included. starts_on moves the first date of the schedule before the
        current one, on the rhythm of its recurrence: the occurrences that exist stay, the dates gained before
        them are inserted, a recorded transaction realizes one it fits, and one that is overdue is skipped.
        422 validation_failed on starts_on when it is not before the current start, is off the rhythm, or the
        recurrence has a count. The matching change applies to transactions recorded,
        corrected or voided afterwards; occurrences already realized stay.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                starts_on:
                  type: string
                  format: date
                match_tolerance_bp:
                  type: integer
                grace_days:
                  type: integer
                match_window_days:
                  type: integer
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences:
    get:
      tags: [planning]
      operationId: listOccurrences
      x-book-role: read
      summary: Occurrences with expected date in [from, to], at most 366 days, by date, or those a transaction realized.
      description: |
        State overdue is derived from expected and the schedule's grace days (P7 amendment A50). With transaction_id the
        answer is the occurrences that transaction realized, whatever their date, and from, to, schedule_id and state
        are ignored; without it from and to are required.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: transaction_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: schedule_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OccurrenceState"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/realize:
    post:
      tags: [planning]
      operationId: realizeOccurrence
      x-book-role: write
      summary: Link a transaction to an expected occurrence; ledger changes never release it (P7 amendment A51).
      description: |
        The transaction has a posting on the schedule's account. 409 occurrence_closed when the occurrence is not
        expected; 409 transaction_in_use when the transaction realizes another occurrence.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealizeInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/skip:
    post:
      tags: [planning]
      operationId: skipOccurrence
      x-book-role: write
      summary: Skip an expected occurrence (T03; 409 occurrence_closed otherwise).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/move:
    post:
      tags: [planning]
      operationId: moveOccurrence
      x-book-role: write
      summary: Move an expected occurrence to another date; terms changes never regenerate it (P7 amendment A52).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /schedules/{id}/terms:
    post:
      tags: [planning]
      operationId: changeScheduleTerms
      x-book-role: write
      summary: Add a terms version effective from a date after the latest one (T09; P7 amendments A49, A52).
      description: |
        Without recurrence the previous rule is kept, start included. Expected occurrences from the date on that
        were not moved are regenerated; realized, skipped and moved ones stay. 409 schedule_ended on or after ends_on.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermsInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /schedules/{id}/pauses:
    post:
      tags: [planning]
      operationId: pauseSchedule
      x-book-role: write
      summary: Suppress the dates in [from, to] (P7 amendment A52).
      description: 409 pause_overlap when it overlaps another pause; 409 schedule_ended on or after ends_on.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePause"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /schedules/{id}/end:
    post:
      tags: [planning]
      operationId: endSchedule
      x-book-role: write
      summary: Produce no occurrence on or after a date; expected ones are removed, realized ones stay (P7 amendment A52).
      description: 409 schedule_ended when the schedule already ends on or before the date.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /budgets:
    get:
      tags: [planning]
      operationId: listBudgets
      x-book-role: read
      summary: Budgets in creation order.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [planning]
      operationId: createBudget
      x-book-role: write
      summary: Create the monthly budget of a category (P7 amendment A54; 409 budget_exists when it has one).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budgets/{id}:
    get:
      tags: [planning]
      operationId: getBudget
      x-book-role: read
      summary: A budget with its amounts by month.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [planning]
      operationId: deleteBudget
      x-book-role: write
      summary: Delete a budget with its amounts; its category and postings are not touched (S144).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /budgets/{id}/amounts:
    post:
      tags: [planning]
      operationId: addBudgetAmount
      x-book-role: write
      summary: Set the amount from a month on, after the latest one (T09).
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetAmount"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budgets/{id}/progress:
    get:
      tags: [planning]
      operationId: getBudgetProgress
      x-book-role: read
      summary: Planned, carried, spent and available amounts of a month, accrual view (P7 amendment A54).
      description: Spending of an income category is reported as a positive amount.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetProgress"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /goals:
    get:
      tags: [planning]
      operationId: listGoals
      x-book-role: read
      summary: Goals in creation order, with their progress today.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [planning]
      operationId: createGoal
      x-book-role: write
      summary: Create a target balance over balance accounts by a date (P7 amendment A55).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /goals/{id}:
    get:
      tags: [planning]
      operationId: getGoal
      x-book-role: read
      summary: A goal with its progress today.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [planning]
      operationId: updateGoal
      x-book-role: write
      summary: Change the name, target, due date or accounts of a goal; fields not sent stay as they are.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [planning]
      operationId: deleteGoal
      x-book-role: write
      summary: Delete a goal; its accounts are not touched.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /accounts/{id}/projection:
    get:
      tags: [planning]
      operationId: getProjection
      x-book-role: read
      summary: Projected balance of a balance account to a date after today, at most today + 12 months (P7 amendment A56).
      description: |
        opening is the booked balance today. Each point is an expected occurrence on the account, an overdue one
        dated today, ordered by date then amount. closing is the booked balance at to plus every point.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Projection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /commitments:
    get:
      tags: [planning]
      operationId: getCommitted
      x-book-role: read
      summary: Installments and expected bills, subscriptions and savings committed in a month (P7 amendment A57).
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Committed"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budget-plan:
    get:
      tags: [planning]
      operationId: getBudgetPlan
      x-book-role: read
      summary: The reference income of a month, what is committed and the budgets to distribute it across (budget plan A129, A131).
      parameters:
        - $ref: "#/components/parameters/PlanMonth"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPlan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    put:
      tags: [planning]
      operationId: saveBudgetPlan
      x-book-role: write
      summary: Save the reference choice and the amounts of a month from the current one on, in one transaction (budget plan A130).
      description: |
        Each listed category gets the amount from the month on, replacing the version of that month; a category without a
        budget and an amount above zero gets a budget without rollover. Versions of other months are not touched.
      parameters:
        - $ref: "#/components/parameters/PlanMonth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetPlanInput"
      responses:
        "200":
          description: The plan after the save.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPlan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /budget-buckets:
    get:
      tags: [planning]
      operationId: getBudgetBuckets
      x-book-role: read
      summary: The book's income bucket method in order, without figures; an empty list without one (income buckets A229).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetBuckets"
        "401":
          $ref: "#/components/responses/Problem"
    put:
      tags: [planning]
      operationId: saveBudgetBuckets
      x-book-role: write
      summary: Replace the book's income bucket method; an empty list removes it (income buckets A229).
      description: |
        Shares sum to 10000 basis points; names are unique ignoring case; at most one bucket takes savings; a category
        is an expense category of the book listed in one bucket. A broken rule is a 422 on its field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetBucketsInput"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/reopen:
    post:
      tags: [planning]
      operationId: reopenOccurrence
      x-book-role: write
      summary: Make a skipped occurrence expected again; a recorded transaction that fits it realizes it (P7 amendment A200).
      description: |
        409 occurrence_closed when the occurrence is not skipped; 409 schedule_ended when its date is on or after
        ends_on; 422 when its date falls inside a pause.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /occurrences/{id}/unrealize:
    post:
      tags: [planning]
      operationId: unrealizeOccurrence
      x-book-role: write
      summary: Release a realized occurrence (409 occurrence_closed when it is not realized).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
parameters:
  PlanMonth:
    name: month
    in: query
    required: true
    schema:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}$"
schemas:
  ScheduleKind:
    type: string
    enum: [bill, income, subscription, transfer, savings]
  Recurrence:
    type: object
    additionalProperties: false
    required: [frequency, interval, start]
    description: |
      A monthly rule takes exactly one of day_of_month, weekday with ordinal, business_day_ordinal; -1 means
      the last one. Business days follow the calendar of the schedule. until is inclusive (P7 amendment A48).
    properties:
      frequency:
        type: string
        enum: [daily, weekly, monthly, yearly]
      interval:
        type: integer
        minimum: 1
        maximum: 120
      day_of_month:
        type: integer
        minimum: -1
        maximum: 31
      weekday:
        type: string
        enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
      ordinal:
        type: integer
        minimum: -1
        maximum: 5
      business_day_ordinal:
        type: integer
        minimum: -1
        maximum: 23
      adjustment:
        type: string
        enum: [none, following, preceding, modified_following]
        default: none
      start:
        type: string
        format: date
      until:
        type: string
        format: date
      count:
        type: integer
        minimum: 1
        maximum: 10000
  ScheduleInput:
    type: object
    additionalProperties: false
    required: [kind, account_id, counterpart_id, description, amount, recurrence]
    properties:
      kind:
        $ref: "#/components/schemas/ScheduleKind"
      account_id:
        type: string
        format: uuid
      counterpart_id:
        type: string
        format: uuid
      payee_id:
        type: string
        format: uuid
      description:
        type: string
        minLength: 1
        maxLength: 200
      amount:
        $ref: "#/components/schemas/Money"
      recurrence:
        $ref: "#/components/schemas/Recurrence"
      calendar:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: Business-day calendar id from GET /calendars; defaults to the calendar of the owner's region.
      match_tolerance_bp:
        type: integer
        minimum: 0
        maximum: 10000
        default: 1000
      grace_days:
        type: integer
        minimum: 0
        maximum: 31
        default: 3
      match_window_days:
        type: integer
  ScheduleTerms:
    type: object
    required: [effective_from, amount, recurrence]
    properties:
      effective_from:
        type: string
        format: date
      amount:
        $ref: "#/components/schemas/Money"
      recurrence:
        $ref: "#/components/schemas/Recurrence"
  SchedulePause:
    type: object
    additionalProperties: false
    required: [from, to]
    properties:
      from:
        type: string
        format: date
      to:
        type: string
        format: date
        description: Inclusive.
  Schedule:
    type: object
    required: [id, kind, account_id, counterpart_id, description, calendar, match_tolerance_bp, grace_days, match_window_days, terms, pauses]
    properties:
      id:
        type: string
        format: uuid
      kind:
        $ref: "#/components/schemas/ScheduleKind"
      calendar:
        type: string
        description: Business-day calendar id the schedule follows.
      account_id:
        type: string
        format: uuid
      counterpart_id:
        type: string
        format: uuid
      payee_id:
        type: string
        format: uuid
      description:
        type: string
      match_tolerance_bp:
        type: integer
      grace_days:
        type: integer
      match_window_days:
        type: integer
        minimum: 0
        maximum: 31
        default: 7
      ends_on:
        type: string
        format: date
        description: No occurrence on or after this date; absent while the schedule has no end.
      terms:
        type: array
        description: Versions by effective date.
        items:
          $ref: "#/components/schemas/ScheduleTerms"
      pauses:
        type: array
        items:
          $ref: "#/components/schemas/SchedulePause"
  SchedulePage:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Schedule"
      next_cursor:
        type: string
        description: Absent on the last page.
  OccurrenceState:
    type: string
    enum: [expected, overdue, realized, skipped]
  Occurrence:
    type: object
    required: [id, schedule_id, sequence, expected_on, expected_amount, state]
    properties:
      id:
        type: string
        format: uuid
      schedule_id:
        type: string
        format: uuid
      sequence:
        type: integer
      expected_on:
        type: string
        format: date
      expected_amount:
        $ref: "#/components/schemas/Money"
      actual_amount:
        $ref: "#/components/schemas/Money"
      state:
        $ref: "#/components/schemas/OccurrenceState"
      transaction_id:
        type: string
        format: uuid
        description: Present when realized.
      moved_from:
        type: string
        format: date
        description: The generated date of a moved occurrence.
  BudgetAmount:
    type: object
    additionalProperties: false
    required: [effective_from, amount]
    properties:
      effective_from:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
      amount:
        $ref: "#/components/schemas/Money"
  BudgetInput:
    type: object
    additionalProperties: false
    required: [category_id, amount, effective_from, rollover]
    properties:
      category_id:
        type: string
        format: uuid
      amount:
        $ref: "#/components/schemas/Money"
      effective_from:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
      rollover:
        type: boolean
  Budget:
    type: object
    required: [id, category_id, rollover, amounts]
    properties:
      id:
        type: string
        format: uuid
      category_id:
        type: string
        format: uuid
      rollover:
        type: boolean
      amounts:
        type: array
        description: Versions by month.
        items:
          $ref: "#/components/schemas/BudgetAmount"
  BudgetPage:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Budget"
      next_cursor:
        type: string
        description: Absent on the last page.
  BudgetProgress:
    type: object
    required: [month, planned, carried, spent, available]
    description: |
      carried is the previous month's available amount when rollover is set, else zero; available is
      planned + carried - spent, negative when overspent.
    properties:
      month:
        type: string
      planned:
        $ref: "#/components/schemas/Money"
      carried:
        $ref: "#/components/schemas/Money"
      spent:
        $ref: "#/components/schemas/Money"
      available:
        $ref: "#/components/schemas/Money"
  BudgetPlanSource:
    type: string
    enum: [expected_income, average_income, fixed]
  BudgetPlanIncome:
    type: object
    required: [schedule_id, description, amount]
    properties:
      schedule_id:
        type: string
        format: uuid
      description:
        type: string
      amount:
        $ref: "#/components/schemas/Money"
  BudgetPlanRow:
    type: object
    required: [category_id, planned, last_month, average, counted]
    description: |
      A category of the plan. last_month and average read the subtree of a budgeted category and the own postings
      of another; counted is false for a budget under a category whose budget is in force.
    properties:
      category_id:
        type: string
        format: uuid
      budget_id:
        type: string
        format: uuid
      planned:
        $ref: "#/components/schemas/Money"
      last_month:
        $ref: "#/components/schemas/Money"
      average:
        $ref: "#/components/schemas/Money"
      counted:
        type: boolean
      next_change:
        type: string
        description: The month of the budget's first amount after this month.
  BudgetPlanAmount:
    type: object
    additionalProperties: false
    required: [category_id, amount]
    properties:
      category_id:
        type: string
        format: uuid
      amount:
        $ref: "#/components/schemas/Money"
  BudgetPlanInput:
    type: object
    additionalProperties: false
    required: [source, amounts]
    properties:
      source:
        $ref: "#/components/schemas/BudgetPlanSource"
      fixed:
        $ref: "#/components/schemas/Money"
      savings_target_bp:
        type: integer
        description: |
          The share of the reference set aside, in basis points, from 0 to 10000 (savings target A187, checked by the
          server as a 422 on this field). A save without it clears the stored target.
      amounts:
        type: array
        description: The changed categories only.
        maxItems: 500
        items:
          $ref: "#/components/schemas/BudgetPlanAmount"
  BudgetBucketInput:
    type: object
    additionalProperties: false
    required: [name, share_bp, takes_savings, category_ids]
    properties:
      name:
        type: string
        maxLength: 60
      share_bp:
        type: integer
        description: The bucket's share of the reference in basis points, from 0 to 10000.
      takes_savings:
        type: boolean
        description: The bucket also draws the month's savings; at most one bucket of a method.
      category_ids:
        type: array
        maxItems: 500
        description: Expense categories placed in the bucket; a subcategory without a bucket of its own follows its ancestor.
        items:
          type: string
          format: uuid
  BudgetBucketsInput:
    type: object
    additionalProperties: false
    required: [buckets]
    properties:
      buckets:
        type: array
        maxItems: 10
        items:
          $ref: "#/components/schemas/BudgetBucketInput"
  BudgetBucket:
    type: object
    required: [id, name, share_bp, takes_savings, category_ids]
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      share_bp:
        type: integer
      takes_savings:
        type: boolean
      category_ids:
        type: array
        items:
          type: string
          format: uuid
  BudgetBuckets:
    type: object
    required: [buckets]
    properties:
      buckets:
        type: array
        items:
          $ref: "#/components/schemas/BudgetBucket"
  BudgetPlanBucket:
    type: object
    required: [id, name, share_bp, takes_savings, category_ids, planned, spent]
    description: |
      A bucket of the method with its figures of the month (A230): target splits the reference by share and is absent
      with reference; planned sums the counted budgets of its categories, plus savings when it takes savings; spent sums
      the month's own postings of its categories, plus the realized savings when it takes savings.
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      share_bp:
        type: integer
      takes_savings:
        type: boolean
      category_ids:
        type: array
        items:
          type: string
          format: uuid
      target:
        $ref: "#/components/schemas/Money"
      planned:
        $ref: "#/components/schemas/Money"
      spent:
        $ref: "#/components/schemas/Money"
  BudgetPlan:
    type: object
    required: [month, currency, source, received_income, installments, savings, planned, rows]
    description: |
      installments are those billed on the month's statements for purchases booked before it; savings are the month's
      occurrences of savings schedules; unassigned is reference - installments - savings - planned and is absent with
      reference, which is absent when the source has no figure.
    properties:
      month:
        type: string
      currency:
        type: string
      source:
        $ref: "#/components/schemas/BudgetPlanSource"
      fixed:
        $ref: "#/components/schemas/Money"
      expected_income:
        $ref: "#/components/schemas/Money"
      expected_items:
        type: array
        items:
          $ref: "#/components/schemas/BudgetPlanIncome"
      average_income:
        $ref: "#/components/schemas/Money"
      average_months:
        type: integer
        minimum: 1
        maximum: 3
      received_income:
        $ref: "#/components/schemas/Money"
      reference:
        $ref: "#/components/schemas/Money"
      installments:
        $ref: "#/components/schemas/Money"
      savings:
        $ref: "#/components/schemas/Money"
      planned:
        $ref: "#/components/schemas/Money"
      unassigned:
        $ref: "#/components/schemas/Money"
      savings_target_bp:
        type: integer
        description: The stored savings target in basis points of the reference; absent without one (A187).
      savings_rate_bp:
        type: integer
        description: savings as basis points of reference, truncated; absent without a reference above zero (A188).
      savings_target:
        $ref: "#/components/schemas/Money"
      savings_gap:
        $ref: "#/components/schemas/Money"
      prices:
        type: array
        description: Prices that value occurrences in another currency at today (P8 amendment A72).
        items:
          $ref: "#/components/schemas/Price"
      rows:
        type: array
        items:
          $ref: "#/components/schemas/BudgetPlanRow"
      buckets:
        type: array
        description: The book's income bucket method; absent without one (A229).
        items:
          $ref: "#/components/schemas/BudgetPlanBucket"
      outside_planned:
        $ref: "#/components/schemas/Money"
      outside_spent:
        $ref: "#/components/schemas/Money"
  GoalInput:
    type: object
    additionalProperties: false
    required: [name, target, due_on, account_ids]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 60
      target:
        $ref: "#/components/schemas/Money"
      due_on:
        type: string
        format: date
      account_ids:
        type: array
        minItems: 1
        maxItems: 20
        uniqueItems: true
        items:
          type: string
          format: uuid
  GoalPatch:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 60
      target:
        $ref: "#/components/schemas/Money"
      due_on:
        type: string
        format: date
      account_ids:
        type: array
        minItems: 1
        maxItems: 20
        uniqueItems: true
        items:
          type: string
          format: uuid
  Goal:
    type: object
    required: [id, name, target, due_on, account_ids, current, remaining, progress_bp]
    description: |
      current is the sum of the booked balances of the accounts today, valued in the target currency with
      stored prices (P8 amendment A72); remaining is max(target - current, 0); progress_bp is current / target
      in basis points, rounded down, between 0 and 10000.
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      target:
        $ref: "#/components/schemas/Money"
      due_on:
        type: string
        format: date
      account_ids:
        type: array
        items:
          type: string
          format: uuid
      current:
        $ref: "#/components/schemas/Money"
      remaining:
        $ref: "#/components/schemas/Money"
      progress_bp:
        type: integer
      prices:
        type: array
        description: Prices that value accounts in another currency (P8 amendment A72).
        items:
          $ref: "#/components/schemas/Price"
      parts:
        type: array
        description: |
          What current is made of: for each goal account, each instrument held in it and its sub-accounts with a
          non-zero quantity, in instrument order, valued in the target currency (P8 amendment A121).
        items:
          $ref: "#/components/schemas/GoalPart"
      trailing_return:
        $ref: "#/components/schemas/TrailingReturn"
  TrailingReturn:
    type: object
    required: [period_months, annual_bp]
    description: |
      The money-weighted return of the goal's accounts, taken as one tree, over the last 12 months or since their
      first posting if shorter, valued in the target currency (investments design 4.4). Absent with less than three
      months of postings or no external flow in the window.
    properties:
      period_months:
        type: integer
      annual_bp:
        type: integer
  GoalPart:
    type: object
    required: [account_id, instrument, quantity, value]
    properties:
      account_id:
        type: string
        format: uuid
      instrument:
        type: string
      quantity:
        $ref: "#/components/schemas/Money"
      value:
        $ref: "#/components/schemas/Money"
  GoalPage:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Goal"
      next_cursor:
        type: string
        description: Absent on the last page.
  ProjectionPoint:
    type: object
    required: [date, occurrence_id, schedule_id, amount, balance]
    properties:
      date:
        type: string
        format: date
      occurrence_id:
        type: string
        format: uuid
      schedule_id:
        type: string
        format: uuid
      amount:
        $ref: "#/components/schemas/Money"
      balance:
        $ref: "#/components/schemas/Money"
  Projection:
    type: object
    required: [account_id, from, to, opening, closing, points]
    properties:
      account_id:
        type: string
        format: uuid
      from:
        type: string
        format: date
      to:
        type: string
        format: date
      opening:
        $ref: "#/components/schemas/Money"
      closing:
        $ref: "#/components/schemas/Money"
      points:
        type: array
        items:
          $ref: "#/components/schemas/ProjectionPoint"
  Committed:
    type: object
    required: [month, installments, occurrences, total]
    properties:
      month:
        type: string
      installments:
        $ref: "#/components/schemas/Money"
      occurrences:
        $ref: "#/components/schemas/Money"
      total:
        $ref: "#/components/schemas/Money"
      prices:
        type: array
        description: Prices that value occurrences in another currency at today (P8 amendment A72).
        items:
          $ref: "#/components/schemas/Price"
  SkipInput:
    type: object
    additionalProperties: false
    properties:
      reason:
        type: string
        maxLength: 200
  MoveInput:
    type: object
    additionalProperties: false
    required: [date]
    properties:
      date:
        type: string
        format: date
  TermsInput:
    type: object
    additionalProperties: false
    required: [effective_from]
    description: At least one of amount and recurrence.
    properties:
      effective_from:
        type: string
        format: date
      amount:
        $ref: "#/components/schemas/Money"
      recurrence:
        $ref: "#/components/schemas/Recurrence"
  EndInput:
    type: object
    additionalProperties: false
    required: [from]
    properties:
      from:
        type: string
        format: date
  RealizeInput:
    type: object
    additionalProperties: false
    required: [transaction_id]
    properties:
      transaction_id:
        type: string
        format: uuid
  OccurrenceList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Occurrence"
