      new:
        type: integer
        description: Dates without a csv price.
      replaced:
        type: integer
        description: Dates whose csv price has another value.
      unchanged:
        type: integer
        description: Dates whose csv price has the same value.
      below_feed:
        type: integer
        description: Dates of the request that hold a price of an official source.
  InstrumentHistoryInput:
    type: object
    additionalProperties: false
    required: [from]
    properties:
      from:
        type: string
        format: date
  InstrumentInput:
    type: object
    additionalProperties: false
    required: [code, type, scale, name, quote_currency]
    properties:
      code:
        type: string
        pattern: "^[A-Z0-9.]{2,20}$"
      type:
        $ref: "#/components/schemas/InstrumentType"
      scale:
        type: integer
        minimum: 0
        maximum: 12
      name:
        type: string
        minLength: 1
        maxLength: 120
      quote_currency:
        type: string
      exchange:
        type: string
        pattern: "^[A-Z0-9]{4}$"
      subtype:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: Refines the type for the owner's jurisdiction, such as cri, cdb or equity_fund (investments design 4.1).
      symbols:
        $ref: "#/components/schemas/InstrumentSymbols"
      issuer:
        $ref: "#/components/schemas/InstrumentIssuer"
  InstrumentEdit:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      type:
        $ref: "#/components/schemas/InstrumentType"
      name:
        type: string
        minLength: 1
        maxLength: 120
      exchange:
        type: string
        pattern: "^[A-Z0-9]{4}$"
      subtype:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      symbols:
        $ref: "#/components/schemas/InstrumentSymbols"
      issuer:
        $ref: "#/components/schemas/InstrumentIssuer"
  InstrumentSymbols:
    type: object
    description: The symbol a source requests for the instrument, by source ID (A222 MQ20). In an edit, absent keeps the stored set and an empty object clears it.
    additionalProperties:
      type: string
      pattern: "^[A-Za-z0-9.=^_-]{1,40}$"
  InstrumentList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Instrument"
  FixedIncomeTermsInput:
    type: object
    additionalProperties: false
    required: [issued_on, matures_on, day_count, face_value]
    properties:
      issued_on:
        type: string
        format: date
      matures_on:
        type: string
        format: date
      index_id:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: The index the security follows; absent for a pre-fixed security.
      percent_of_index_bp:
        type: integer
        minimum: 1
        description: 10000 is 100% of the index; 10000 when omitted.
      spread_bp:
        type: integer
        minimum: 0
        description: Annual spread over the index, or the annual rate of a pre-fixed security; 0 when omitted.
      day_count:
        $ref: "#/components/schemas/TermsDayCount"
      face_value:
        type: integer
        format: int64
        minimum: 1
        description: Price of one unit on issued_on, in minor units of the quote currency.
      calendar_id:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: Calendar whose business days bus252 counts when the index does not compound by business day.
      daily_liquidity:
        type: boolean
        description: The security can be redeemed on any business day; false when omitted.
      redeemable_from:
        type: string
        format: date
        description: First date of a redemption before maturity; absent when redeemable from issued_on.
      payments:
        type: array
        maxItems: 400
        items:
          $ref: "#/components/schemas/FixedIncomePayment"
        description: Dates of interest and principal; empty when omitted. Merged by date with the interest_every_months schedule.
      interest_every_months:
        type: integer
        enum: [1, 3, 6, 12]
        description: Interest paid every n months from first_payment_on up to matures_on; expands into payments.
      first_payment_on:
        type: string
        format: date
        description: First interest date; required with interest_every_months.
      rate_steps:
        type: array
        maxItems: 20
        items:
          $ref: "#/components/schemas/FixedIncomeRateStep"
        description: The rate after a number of days held from issued_on, increasing; percent_of_index_bp and spread_bp hold before the first step (progressive rate PR1).
      rate_steps_apply:
        type: string
        enum: [retroactive, stepped]
        description: Required with rate_steps. retroactive applies the step a day has reached to the whole period since issued_on; stepped accrues each step from its own day (PR2).
  FixedIncomeTerms:
    type: object
    required: [issued_on, matures_on, percent_of_index_bp, spread_bp, day_count, face_value, daily_liquidity, payments, rate_steps]
    properties:
      issued_on:
        type: string
        format: date
      matures_on:
        type: string
        format: date
      index_id:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      percent_of_index_bp:
        type: integer
      spread_bp:
        type: integer
      day_count:
        $ref: "#/components/schemas/TermsDayCount"
      face_value:
        type: integer
        format: int64
      calendar_id:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: Calendar whose business days bus252 counts when the index does not compound by business day.
      daily_liquidity:
        type: boolean
        description: The security can be redeemed on any business day; false when omitted.
      redeemable_from:
        type: string
        format: date
        description: First date of a redemption before maturity; absent when redeemable from issued_on.
      payments:
        type: array
        items:
          $ref: "#/components/schemas/FixedIncomePayment"
        description: The expanded payments, sorted by date; empty when none.
      rate_steps:
        type: array
        items:
          $ref: "#/components/schemas/FixedIncomeRateStep"
        description: Empty when the rate does not change with the days held.
      rate_steps_apply:
        type: string
        enum: [retroactive, stepped]
  FixedIncomeRateStep:
    type: object
    additionalProperties: false
    required: [after_days, percent_of_index_bp, spread_bp]
    properties:
      after_days:
        type: integer
        minimum: 1
        maximum: 36600
      percent_of_index_bp:
        type: integer
        minimum: 0
        maximum: 100000
      spread_bp:
        type: integer
        minimum: -10000
        maximum: 100000
  FixedIncomePayment:
    type: object
    required: [pays_on, amortization_bp, pays_interest]
    properties:
      pays_on:
        type: string
        format: date
      amortization_bp:
        type: integer
        minimum: 0
        maximum: 10000
      pays_interest:
        type: boolean
  TermsDayCount:
    type: string
    enum: [bus252, act365]
  PriceInput:
    type: object
    additionalProperties: false
    required: [instrument, quote_instrument, date, value]
    properties:
      instrument:
        type: string
      quote_instrument:
        type: string
      date:
        type: string
        format: date
      value:
        $ref: "#/components/schemas/Rate"
  PriceList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Price"
  InstrumentQuoteList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/InstrumentQuote"
  InstrumentQuote:
    type: object
    additionalProperties: false
    required: [instrument, quote_instrument, last, references, trend]
    properties:
      instrument:
        type: string
      quote_instrument:
        type: string
      trend:
        type: array
        description: The chosen price on or before each of 31 dates, every 3 days from 90 days before the date of `last` to that date, oldest first; null before the first price. Empty when the instrument has no price (IQ13).
        items:
          allOf:
            - $ref: "#/components/schemas/Rate"
          nullable: true
      last:
        allOf:
          - $ref: "#/components/schemas/QuotePoint"
        nullable: true
        description: The chosen price on or before today; null when the instrument has none.
      references:
        $ref: "#/components/schemas/QuoteReferences"
  QuoteReferences:
    type: object
    additionalProperties: false
    description: |
      The chosen price on or before 7 days, 1 month, 3 months and 12 months before the date of `last`, and on 31
      December of the previous year when `last` lies in the current year. A reference is null when no price exists on
      or before its date or when `last` does not lie after it.
    required: [week, month, quarter, year, year_to_date]
    properties:
      week:
        allOf:
          - $ref: "#/components/schemas/QuotePoint"
        nullable: true
      month:
        allOf:
          - $ref: "#/components/schemas/QuotePoint"
        nullable: true
      quarter:
        allOf:
          - $ref: "#/components/schemas/QuotePoint"
        nullable: true
      year:
        allOf:
          - $ref: "#/components/schemas/QuotePoint"
        nullable: true
      year_to_date:
        allOf:
          - $ref: "#/components/schemas/QuotePoint"
        nullable: true
  QuotePoint:
    type: object
    additionalProperties: false
    required: [date, value]
    properties:
      date:
        type: string
        format: date
      value:
        $ref: "#/components/schemas/Rate"
  PriceImport:
    type: object
    required: [recorded]
    properties:
      recorded:
        type: integer
  Holiday:
    type: object
    required: [date, name, source]
    properties:
      date:
        type: string
        format: date
      name:
        type: string
        description: English text of a rule holiday, or the text typed for an instance holiday.
      code:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: Stable key of a rule holiday, which a client translates; absent for an instance holiday.
      source:
        type: string
        enum: [rule, instance]
