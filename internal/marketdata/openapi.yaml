paths:
  /calendars:
    get:
      tags: [marketdata]
      operationId: listCalendars
      x-book-role: read
      summary: Business-day calendars of the instance in identifier order.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarList"
        "401":
          $ref: "#/components/responses/Problem"
  /calendars/{name}/holidays:
    get:
      tags: [marketdata]
      operationId: listHolidays
      x-book-role: read
      summary: Non-business days of a calendar in a year, weekends excluded.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1900
            maximum: 2200
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HolidayList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /indexes:
    get:
      tags: [marketdata]
      operationId: listIndexes
      x-book-role: read
      summary: The enabled indexes with at least one stored rate, those of the caller's region first (ADR 025 F3).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /indexes/{id}/rates:
    get:
      tags: [marketdata]
      operationId: listIndexRates
      x-book-role: read
      summary: The stored rates of an enabled index in [from, to], at most 7,320 days, oldest first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexRateList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /indexes/{id}/expectations:
    get:
      tags: [marketdata]
      operationId: listIndexExpectations
      x-book-role: read
      summary: The latest survey of the expected annual rate of an index, oldest point first (ADR 026 E5).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexExpectations"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /curves:
    get:
      tags: [marketdata]
      operationId: listCurves
      x-book-role: read
      summary: The stored curves of the enabled curve sources, oldest maturity first (indexer comparison IC12).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurveList"
        "401":
          $ref: "#/components/responses/Problem"
  /fund-reports:
    get:
      tags: [marketdata]
      operationId: listFundReports
      x-book-role: read
      summary: The monthly reports the enabled fund report sources stored for an instrument, newest period first (fund report FR6).
      parameters:
        - name: code
          in: query
          required: true
          description: The instrument code, such as a ticker.
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundReportList"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /company-reports:
    get:
      tags: [marketdata]
      operationId: listCompanyReports
      x-book-role: read
      summary: The statements the enabled company report sources stored for an instrument, newest period first (company report CR6).
      parameters:
        - name: code
          in: query
          required: true
          description: The instrument code, such as a ticker.
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyReportList"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /company-figures:
    get:
      tags: [marketdata]
      operationId: listCompanyFigures
      x-book-role: read
      summary: The figures of the listed company of an instrument, from its stored statements and today's price (contribution criteria AC4 to AC9).
      parameters:
        - name: code
          in: query
          required: true
          description: The instrument code, such as a ticker.
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyFiguresList"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /market-data/institution-indicators:
    get:
      tags: [marketdata]
      operationId: getInstitutionIndicators
      x-book-role: read
      summary: The prudential indicators of an institution from the latest period of an enabled source (A237 I9).
      parameters:
        - name: scheme
          in: query
          required: true
          description: The identifier scheme of the institution, for example br_ispb.
          schema:
            type: string
            pattern: "^[a-z0-9_]{2,40}$"
        - name: identifier
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionIndicators"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /market-data/feeds:
    get:
      tags: [marketdata]
      operationId: listMarketDataFeeds
      x-book-role: read
      summary: Every price and index feed of the instance with its state (ADR 025 F5).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataFeedList"
        "401":
          $ref: "#/components/responses/Problem"
  /market-data/feeds/{id}:
    put:
      tags: [marketdata]
      operationId: setMarketDataFeed
      x-book-role: read
      summary: Enable or disable a feed for the whole instance; admin only (ADR 025 F6, F8).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9_]{2,40}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataFeedInput"
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataFeed"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /market-data/refresh:
    post:
      tags: [marketdata]
      operationId: refreshMarketData
      x-book-role: read
      summary: Run the enabled feeds now; admin only (ADR 025 F7, F8).
      description: |
        The tick runs after the response. 409 refresh_running while a tick, scheduled or requested, runs.
      responses:
        "202":
          description: Accepted; the tick runs.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /market-data/catalog:
    get:
      tags: [marketdata]
      operationId: searchInstrumentCatalog
      x-book-role: read
      summary: The instruments the enabled sources can quote, searched by code or name; at most 20 (A222 MQ29).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 60
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSearch"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /market-data/probe:
    post:
      tags: [marketdata]
      operationId: probeQuote
      x-book-role: write
      summary: The latest quote each enabled source gives for an instrument not yet defined; nothing is stored (A222 MQ27).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /instrument-quotes:
    get:
      tags: [marketdata]
      operationId: listInstrumentQuotes
      x-book-role: read
      summary: The last price of each instrument and the prices its changes over a week, a month, a quarter, the year to date and 12 months start from, counted back from the date of the last price, in code order (IQ1 to IQ5).
      parameters:
        - name: base
          in: query
          required: true
          description: The currency a currency instrument is quoted in; the instrument itself has no item.
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentQuoteList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /instruments:
    get:
      tags: [marketdata]
      operationId: listInstruments
      x-book-role: read
      summary: Instruments of the instance in code order; the ones the book hides are left out unless include_hidden is true (A238).
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InstrumentType"
        - name: include_hidden
          in: query
          required: false
          description: When true, the instruments the book hides are listed with hidden set to true (A238 HD4).
          schema:
            type: boolean
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [marketdata]
      operationId: defineInstrument
      x-book-role: write
      summary: Define a security for the whole instance (P8 amendment A59).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: Path of the created record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /instruments/{code}:
    get:
      tags: [marketdata]
      operationId: getInstrument
      x-book-role: read
      summary: One instrument.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [marketdata]
      operationId: editInstrument
      x-book-role: write
      summary: Replace the name, exchange and subtype of a security, and its type among stock, etf, reit and depositary_receipt; an absent exchange or subtype is cleared, an absent type is kept (A134, A224).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentEdit"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instrument"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [marketdata]
      operationId: deleteInstrument
      x-book-role: write
      summary: Delete a security with its prices, terms, history requests and symbols; a security that a record references is refused (A223).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /instruments/{code}/hidden:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [marketdata]
      operationId: hideInstrument
      x-book-role: write
      summary: Hide the security from the lists of the book; idempotent (A238 HD2).
      responses:
        "204":
          description: Hidden.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [marketdata]
      operationId: showInstrument
      x-book-role: write
      summary: Return a hidden security to the lists of the book; idempotent (A238 HD2).
      responses:
        "204":
          description: Shown.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /instruments/{code}/terms:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [marketdata]
      operationId: getInstrumentTerms
      x-book-role: read
      summary: The terms of a fixed income instrument (investments design 4.2).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixedIncomeTerms"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [marketdata]
      operationId: putInstrumentTerms
      x-book-role: write
      summary: Set the terms of a fixed income instrument, replacing the earlier ones and the prices accrued from them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixedIncomeTermsInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixedIncomeTerms"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /instruments/{code}/history:
    post:
      tags: [marketdata]
      operationId: requestInstrumentHistory
      x-book-role: write
      summary: Request the prices of an instrument since a date from each enabled source that quotes it (A222 MQ8).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentHistoryInput"
      responses:
        "202":
          description: Accepted; a tick fetches the prices.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /instruments/{code}/prices:
    post:
      tags: [marketdata]
      operationId: recordInstrumentPrices
      x-book-role: write
      summary: Record a series of prices of one instrument as source csv, all or nothing, or count what it would change (A222 MQ32).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentPricesInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentPricesResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /prices:
    get:
      tags: [marketdata]
      operationId: listPrices
      x-book-role: read
      summary: The chosen price of each date with prices in [from, to], at most 18,300 days, one point per date with a price (P8 amendment A60, A222 MQ30).
      parameters:
        - name: instrument
          in: query
          required: true
          schema:
            type: string
        - name: quote_instrument
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      tags: [marketdata]
      operationId: recordPrice
      x-book-role: write
      summary: Record a manual price; a manual price of the same date is replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /prices/import:
    post:
      tags: [marketdata]
      operationId: importPrices
      x-book-role: write
      summary: Record the prices of a CSV file as source csv, all or nothing.
      description: |
        Header `instrument,quote_instrument,date,value`, at most 10,000 lines. A rejected line returns
        422 with field `line N`, N counting the header as line 1.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceImport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
schemas:
  CalendarList:
    type: object
    required: [items, default]
    properties:
      default:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: Calendar id the owner's region gives a new record (ADR 016).
      items:
        type: array
        items:
          $ref: "#/components/schemas/Calendar"
  Calendar:
    type: object
    additionalProperties: false
    required: [id, weekend]
    properties:
      id:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      weekend:
        type: array
        items:
          type: string
          enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
  HolidayList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Holiday"
  Index:
    type: object
    additionalProperties: false
    required: [id, period, kind, first, last, expected]
    properties:
      id:
        type: string
      expected:
        type: boolean
        description: An enabled expectation source stored points for the index (ADR 026 E5).
      period:
        type: string
        enum: [day, month]
        description: The span one rate covers.
      kind:
        type: string
        enum: [rate, market]
        description: A rate a contract pays, or the growth of a market that no contract pays (A265 MI6).
      first:
        type: string
        format: date
      last:
        type: string
        format: date
  IndexList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Index"
  IndexExpectations:
    type: object
    additionalProperties: false
    required: [survey_date, items]
    properties:
      survey_date:
        type: string
        format: date
      items:
        type: array
        items:
          $ref: "#/components/schemas/IndexExpectation"
  CurveList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Curve"
  Curve:
    type: object
    additionalProperties: false
    required: [id, kind, index, currency, base_date, source, points]
    properties:
      id:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      kind:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: nominal for a fixed rate, real for a spread over the index.
      index:
        type: string
        nullable: true
        description: The index a real curve is a spread over.
      currency:
        type: string
      base_date:
        type: string
        format: date
      source:
        type: string
      points:
        type: array
        items:
          $ref: "#/components/schemas/CurvePoint"
  CurvePoint:
    type: object
    additionalProperties: false
    required: [maturity, rate]
    properties:
      maturity:
        type: string
        format: date
      rate:
        type: string
        description: Annual rate at the maturity, an exact decimal fraction (0.1310 is 13.10%).
        example: "0.131000000000"
  InstitutionIndicators:
    type: object
    additionalProperties: false
    required:
      - source
      - source_url
      - currency
      - conglomerate_code
      - conglomerate_name
      - limits
      - periods
    properties:
      source:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      source_url:
        type: string
        description: The address of the portal of the source, where the figures can be checked.
      currency:
        type: string
        pattern: "^[A-Z]{3}$"
        description: The currency of equity and net_income, whatever the base currency of the book.
      conglomerate_code:
        type: string
      conglomerate_name:
        type: string
        description: Whose figures these are, as of the newest period; the institution is covered by this conglomerate (A237 I6).
      limits:
        $ref: "#/components/schemas/InstitutionLimits"
      periods:
        type: array
        description: One item per quarter the source holds, newest first (A237 H3).
        minItems: 1
        items:
          $ref: "#/components/schemas/InstitutionPeriod"
  InstitutionPeriod:
    type: object
    additionalProperties: false
    required: [period, basel, principal_capital, fixed_asset, equity, net_income]
    properties:
      period:
        type: string
        format: date
        description: The last day of the quarter the figures refer to.
      basel:
        type: string
        nullable: true
        description: The Basel index, an exact decimal fraction (0.155 is 15.5%); null when the source does not inform it.
      principal_capital:
        type: string
        nullable: true
        description: The principal capital ratio, an exact decimal fraction; null when not informed.
      fixed_asset:
        type: string
        nullable: true
        description: The fixed-asset ratio (imobilização), an exact decimal fraction; null when not informed.
      equity:
        type: integer
        format: int64
        nullable: true
        description: The equity in minor units of currency; null when not informed.
      net_income:
        type: integer
        format: int64
        nullable: true
        description: The net income of the period in minor units of currency; null when not informed.
  CompanyFiguresList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/CompanyFigures"
  CompanyFigures:
    type: object
    additionalProperties: false
    required: [source, source_url, name, currency, price_earnings, price_book, return_on_equity, net_margin, net_debt_to_equity, gross_profit_to_assets, current_ratio, revenue_growth, positive_years, profit, revenue]
    properties:
      source:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      source_url:
        type: string
      name:
        type: string
      currency:
        type: string
      price_date:
        type: string
        format: date
        description: The date of the price the multiples read; absent without one.
      price_earnings:
        $ref: "#/components/schemas/CompanyFigure"
      price_book:
        $ref: "#/components/schemas/CompanyFigure"
      price_earnings_range:
        $ref: "#/components/schemas/CompanyRange"
      price_book_range:
        $ref: "#/components/schemas/CompanyRange"
      return_on_equity:
        $ref: "#/components/schemas/CompanyFigure"
      net_margin:
        $ref: "#/components/schemas/CompanyFigure"
      net_debt_to_equity:
        $ref: "#/components/schemas/CompanyFigure"
      gross_profit_to_assets:
        $ref: "#/components/schemas/CompanyFigure"
      current_ratio:
        $ref: "#/components/schemas/CompanyFigure"
      revenue_growth:
        $ref: "#/components/schemas/CompanyFigure"
      positive_years:
        $ref: "#/components/schemas/CompanyPositiveYears"
      profit:
        $ref: "#/components/schemas/CompanyChange"
      revenue:
        $ref: "#/components/schemas/CompanyChange"
  CompanyFigure:
    type: object
    additionalProperties: false
    description: A value with the end of the window or of the balance it reads, or the reason it has none.
    properties:
      value:
        type: string
        description: Decimal of at most six places; a rate is a fraction.
      reason:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      date:
        type: string
        format: date
  CompanyRange:
    type: object
    additionalProperties: false
    description: The least and the greatest value over the fiscal years that have one, three at least.
    required: [least, greatest, years]
    properties:
      least:
        type: string
      greatest:
        type: string
      years:
        type: integer
  CompanyPositiveYears:
    type: object
    additionalProperties: false
    required: [positive, years]
    properties:
      positive:
        type: integer
      years:
        type: integer
  CompanyChange:
    type: object
    additionalProperties: false
    description: An account against the same months of the year before.
    properties:
      state:
        type: string
        description: rate, loss (at or below zero) or turned (above zero after a year at or below it); absent without a comparison.
        pattern: "^[a-z0-9_]{2,40}$"
      rate:
        type: string
        description: The change as a fraction, in the state rate.
      date:
        type: string
        format: date
        description: The end of the period compared.
      months:
        type: integer
      reason:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
  CompanyReportList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/CompanyReport"
  CompanyReport:
    type: object
    additionalProperties: false
    required: [source, source_url, identifier, name, consolidated, plan, financial, currency, periods]
    properties:
      source:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      source_url:
        type: string
      identifier:
        type: string
        description: The company's identifier at the regulator.
      name:
        type: string
      consolidated:
        type: boolean
        description: True when the newest period reads the consolidated statements (CR3).
      plan:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: standard, or other for a chart of accounts without the standard lines (CR5).
      financial:
        type: boolean
        description: True for a company of the financial sector, which the signals do not cover (CR11).
      currency:
        type: string
      periods:
        type: array
        description: Newest first by period, then by months.
        items:
          $ref: "#/components/schemas/CompanyReportPeriod"
  CompanyReportPeriod:
    type: object
    additionalProperties: false
    description: A null account is a line the filing lacks or the chart of accounts does not hold; it is never zero.
    required: [period, months, delivered, total_assets, current_assets, cash, short_investments, current_liabilities, short_debt, long_debt, equity, revenue, gross_profit, net_income, operating_cash_flow, shares_issued, shares_treasury, capital_raised]
    properties:
      period:
        type: string
        format: date
        description: Last day of the fiscal year or quarter.
      months:
        type: integer
        minimum: 1
        maximum: 12
        description: 12 for a fiscal year; 3, 6 or 9 for the year to date of a quarter.
      delivered:
        type: string
        format: date
        nullable: true
      total_assets:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      current_assets:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      cash:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      short_investments:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      current_liabilities:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      short_debt:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      long_debt:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      equity:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      revenue:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      gross_profit:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      net_income:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      operating_cash_flow:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      shares_issued:
        type: integer
        format: int64
        nullable: true
        description: Count of shares.
      shares_treasury:
        type: integer
        format: int64
        nullable: true
        description: Count of shares held in treasury.
      capital_raised:
        type: boolean
        nullable: true
        description: True when the share capital grew with new resources in the period, false when it grew only with reserves, null when it did not grow or the filing does not say (CR5).
  FundReportList:
    type: object
    required: [items, candidates]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/FundReport"
      candidates:
        type: array
        description: FR15. For each enabled source whose report set for the instrument is empty, the funds that share the instrument's exchange and code; a link by symbol picks one.
        items:
          $ref: "#/components/schemas/FundReportCandidate"
  FundReportCandidate:
    type: object
    additionalProperties: false
    required: [source, identifier, name, segment]
    properties:
      source:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      identifier:
        type: string
        description: The fund's identifier at the regulator; the value of the symbol that links it.
      name:
        type: string
      segment:
        type: string
  FundReport:
    type: object
    additionalProperties: false
    required: [source, source_url, exchange, code, currency, identifier, name, segment, periods]
    properties:
      source:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      source_url:
        type: string
        description: The register's page of the dataset.
      exchange:
        type: string
      code:
        type: string
      currency:
        type: string
      identifier:
        type: string
        description: The fund's identifier at the register, as of the newest period.
      name:
        type: string
      segment:
        type: string
        description: The segment as the source writes it; empty when the source states none.
      periods:
        type: array
        items:
          $ref: "#/components/schemas/FundReportPeriod"
  FundReportPeriod:
    type: object
    additionalProperties: false
    required: [period, delivered, net_assets, holders, units, unit_book_value, admin_fee, month_yield, month_amortization]
    description: A null figure is a value the source leaves blank; it is never zero.
    properties:
      period:
        type: string
        format: date
        description: The first day of the month the report covers.
      delivered:
        type: string
        format: date
        nullable: true
      net_assets:
        type: integer
        format: int64
        nullable: true
        description: Minor units of the report's currency.
      holders:
        type: integer
        format: int64
        nullable: true
      units:
        type: string
        nullable: true
        description: Units issued, an exact decimal.
      unit_book_value:
        type: string
        nullable: true
        description: Book value of one unit in the report's currency, an exact decimal.
      admin_fee:
        type: string
        nullable: true
        description: Administration fee of the month over the net assets, an exact decimal fraction.
      month_yield:
        type: string
        nullable: true
        description: Distributions of the month over the book value, an exact decimal fraction.
      month_amortization:
        type: string
        nullable: true
        description: Amortization of the month, an exact decimal fraction.
  InstitutionLimits:
    type: object
    additionalProperties: false
    required: [basel, principal_capital, rule]
    description: The regulatory floors of the jurisdiction of the source (A237 L1).
    properties:
      basel:
        $ref: "#/components/schemas/InstitutionFloor"
      principal_capital:
        $ref: "#/components/schemas/InstitutionFloor"
      rule:
        type: string
        description: The rule that sets the floors.
  InstitutionFloor:
    type: object
    additionalProperties: false
    required: [minimum, with_buffer]
    properties:
      minimum:
        type: string
        description: The minimum the rule sets, an exact decimal fraction.
      with_buffer:
        type: string
        description: The minimum plus the conservation buffer, an exact decimal fraction.
  IndexExpectation:
    type: object
    additionalProperties: false
    required: [date, rate]
    properties:
      date:
        type: string
        format: date
      rate:
        type: string
        description: Expected annual rate of the index on the date, an exact decimal fraction (0.1315 is 13.15%).
        example: "0.131500000000"
  MarketDataFeed:
    type: object
    additionalProperties: false
    required: [id, kind, enabled, suggested, last, stale, missing, last_run, error, official, covers, history_pending, symbol_override, current, current_at, current_error]
    properties:
      id:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      kind:
        type: string
        enum: [price, index, expectation, curve, institution, fund_report, company_report]
      enabled:
        type: boolean
      suggested:
        type: boolean
        description: Suggested for the calling book's region (ADR 025 F3); a suggestion enables nothing.
      last:
        type: string
        format: date
        nullable: true
        description: The latest date the feed stored.
      stale:
        type: boolean
        description: Enabled, and its next publication is overdue (ADR 025 F9).
      missing:
        type: integer
        description: The expected days of an index without a rate; 0 for any other feed (A265 RI4).
      last_run:
        type: string
        format: date-time
        nullable: true
        description: The last tick that ran the feed since the process started.
      error:
        type: string
        nullable: true
        description: The failure of that tick, null when it succeeded.
      official:
        type: boolean
        description: False for a source that publishes no terms for this use; its prices rank last (A222 MQ1).
      covers:
        type: integer
        description: The number of defined instruments the source quotes; 0 for an index or expectation feed (A222 MQ25).
      history_pending:
        type: integer
        description: The history requests of the source not yet done (A222 MQ25).
      symbol_override:
        type: boolean
        description: The source reads a symbol set on the instrument (A222 MQ20).
      current:
        type: boolean
        description: The source reports current quotes (A248 CQ25).
      current_at:
        type: string
        format: date-time
        nullable: true
        description: Instant of its last successful request for current quotes.
      current_error:
        type: string
        nullable: true
        description: Message of its last failed request for current quotes.
  MarketDataFeedList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/MarketDataFeed"
  MarketDataFeedInput:
    type: object
    additionalProperties: false
    required: [enabled]
    properties:
      enabled:
        type: boolean
      accept_unofficial:
        type: boolean
        description: Required as true to enable a source whose official is false (A222 MQ22).
  IndexRate:
    type: object
    additionalProperties: false
    required: [date, rate]
    properties:
      date:
        type: string
        format: date
        description: The date the rate is published for; the first day of the month for a monthly index.
      rate:
        type: string
        description: Exact decimal fraction, negative when the index fell (0.0042 is 0.42%).
        example: "0.004200000000"
  IndexRateList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/IndexRate"
  Instrument:
    type: object
    additionalProperties: false
    required: [code, type, scale, name, owned, hidden]
    properties:
      code:
        type: string
      type:
        $ref: "#/components/schemas/InstrumentType"
      scale:
        type: integer
      name:
        type: string
      hidden:
        type: boolean
        description: The book hides the instrument from its lists (A238 HD3).
      owned:
        type: boolean
        description: The instrument belongs to the book and no other book reads it.
      issuer:
        $ref: "#/components/schemas/InstrumentIssuer"
      quote_currency:
        type: string
        description: Absent for currencies.
      exchange:
        type: string
        pattern: "^[A-Z0-9]{4}$"
      subtype:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      symbols:
        $ref: "#/components/schemas/InstrumentSymbols"
      coverage:
        $ref: "#/components/schemas/InstrumentCoverage"
  InstrumentIssuer:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 80
      scheme:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: Registry of the identifier, such as br_cnpj.
      id:
        type: string
        minLength: 1
        maxLength: 40
  InstrumentCoverage:
    type: object
    additionalProperties: false
    required: [first, last, count, stale, sources]
    properties:
      first:
        type: string
        format: date
        nullable: true
        description: The first date with a price against the quote currency; any quote for a currency.
      last:
        type: string
        format: date
        nullable: true
      count:
        type: integer
        description: The number of dates with a price.
      stale:
        type: boolean
        description: An enabled source quotes the instrument and its next price is overdue (A222 MQ24).
      sources:
        type: array
        description: Every registered source that quotes the instrument, enabled or not.
        items:
          $ref: "#/components/schemas/InstrumentSourceCoverage"
  InstrumentSourceCoverage:
    type: object
    additionalProperties: false
    required: [id, enabled, official, first, last, history]
    properties:
      id:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      enabled:
        type: boolean
      official:
        type: boolean
      first:
        type: string
        format: date
        nullable: true
      last:
        type: string
        format: date
        nullable: true
      history:
        allOf:
          - $ref: "#/components/schemas/InstrumentHistory"
        nullable: true
  InstrumentHistory:
    type: object
    additionalProperties: false
    required: [from, done, error]
    properties:
      from:
        type: string
        format: date
      done:
        type: boolean
      error:
        type: string
        nullable: true
        description: The failure of the last attempt; the next tick tries again.
  CatalogListing:
    type: object
    additionalProperties: false
    required: [code, name, exchange, quote_currency, symbol, source, defined]
    properties:
      code:
        type: string
      name:
        type: string
        description: Empty when the source states none.
      type:
        $ref: "#/components/schemas/InstrumentType"
      exchange:
        type: string
        description: ISO 10383 MIC, or empty.
      quote_currency:
        type: string
        description: Empty when the source states none.
      symbol:
        type: string
        description: The symbol the source requests, or empty.
      source:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      defined:
        type: boolean
        description: An instrument with this code exists.
  CatalogSearch:
    type: object
    required: [items, unavailable]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/CatalogListing"
      unavailable:
        type: array
        description: The enabled sources that failed or passed their bound.
        items:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
  ProbeInput:
    type: object
    additionalProperties: false
    required: [code, type, quote_currency]
    properties:
      code:
        type: string
        pattern: "^[A-Z0-9.]{2,20}$"
      type:
        $ref: "#/components/schemas/InstrumentType"
      exchange:
        type: string
        pattern: "^[A-Z0-9]{4}$"
      quote_currency:
        type: string
      symbols:
        $ref: "#/components/schemas/InstrumentSymbols"
  ProbeQuote:
    type: object
    additionalProperties: false
    required: [source, date, value, error]
    properties:
      source:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      date:
        type: string
        format: date
        nullable: true
      value:
        type: string
        nullable: true
        description: The price in the quote currency of the request; an exact decimal.
      error:
        type: string
        nullable: true
  ProbeResult:
    type: object
    required: [quotes, available]
    properties:
      quotes:
        type: array
        description: One item per enabled source that would quote the instrument.
        items:
          $ref: "#/components/schemas/ProbeQuote"
      available:
        type: array
        description: The disabled sources that would quote the instrument.
        items:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
  InstrumentPricePoint:
    type: object
    additionalProperties: false
    required: [date, value]
    properties:
      date:
        type: string
        format: date
      value:
        $ref: "#/components/schemas/Rate"
  InstrumentPricesInput:
    type: object
    additionalProperties: false
    required: [quote_instrument, prices]
    properties:
      quote_instrument:
        type: string
      prices:
        type: array
        minItems: 1
        maxItems: 20000
        items:
          $ref: "#/components/schemas/InstrumentPricePoint"
      dry_run:
        type: boolean
        description: True stores nothing and returns the counts.
  InstrumentPricesResult:
    type: object
    required: [new, replaced, unchanged, below_feed]
