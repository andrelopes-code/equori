paths:
  /positions:
    get:
      tags: [portfolio]
      operationId: listPositions
      x-book-role: read
      summary: Positions of the security accounts at the end of a date, valued with stored prices.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: value_in
          in: query
          required: false
          description: Currency of market_value; the base currency by default. A missing price to it is price_missing.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /realized-results:
    get:
      tags: [portfolio]
      operationId: listRealizedResults
      x-book-role: read
      summary: Results of the sales of a year at average cost (D1).
      parameters:
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealizedResultList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /income-events:
    get:
      tags: [portfolio]
      operationId: listIncomeEvents
      x-book-role: read
      summary: Investment income of a year by tax treatment (D1).
      parameters:
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeEventList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /fixed-income-events:
    get:
      tags: [portfolio]
      operationId: listFixedIncomeEvents
      x-book-role: read
      summary: Payments dated in a range of the fixed income securities the book holds (A236 FC17).
      description: Interest, amortization and maturity events with their gross amount and state. 422 validation_failed on field to when to is before from or the range exceeds 400 days.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixedIncomeEventList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /issuer-exposure:
    get:
      tags: [portfolio]
      operationId: getIssuerExposure
      x-book-role: read
      summary: Fixed income held per issuer against the deposit guarantee of the book's region (A236 FC23).
      description: Each holding is valued in the base currency at date. A holding without a price is in missing_prices and out of every sum. limit, excess and guarantee are absent when the region has no guarantee.
      parameters:
        - name: date
          in: query
          required: false
          description: Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuerExposureReport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /investment-income-types:
    get:
      tags: [portfolio]
      operationId: listInvestmentIncomeTypes
      x-book-role: read
      summary: Income types the book's jurisdiction accepts.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeTypeList"
        "401":
          $ref: "#/components/responses/Problem"
  /reports/return:
    get:
      tags: [portfolio]
      operationId: getReturn
      x-book-role: read
      summary: Money-weighted annual return of an account and its sub-accounts over a period of at most 3660 days (return honesty HR2).
      description: |
        The flows are the money that entered or left the tree in transactions that also touch a balance account
        outside it; income, expense and tax postings are performance. Opening is valued on the day before from, closing
        on to, flows on their dates, all in value_in (the base currency by default). annual_bp is the internal rate of
        return, days over 365, rounded half to even to basis points. Without account_id the tree is every brokerage account
        of the book with its sub-accounts, and a transfer between two of them is not a flow. 422 return_undefined when
        no money was invested.

        period_bp is the time-weighted return of the period: the period splits at each flow date, a flow earns from the
        next day, and the growth of each piece is chained (amendment A208). benchmark compares it with a daily index:
        index names an enabled index; without it, the default index of the book's region applies, and benchmark is absent
        when that index has no rate. until is the last rate date in [from, to]; return_bp is the time-weighted return up
        to until, index_bp the growth of the index over the same days, and percent_bp the percent of the index (10000 is
        100%) that grows as much. 400 on index when the named index is not enabled, has no rate or is not daily.
      parameters:
        - name: account_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: value_in
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
        - name: index
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z0-9_]{2,40}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnReport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /reports/allocation:
    get:
      tags: [portfolio]
      operationId: getAllocation
      x-book-role: read
      summary: Value of the asset accounts at a date grouped by instrument type, currency or institution (investments design 4.3).
      description: |
        Each account counts its own balance, valued in value_in (the base currency by default) with the stored prices
        of the date. type groups by the type of the instrument held (currency for cash); currency by the quotation
        currency of a security or the currency itself; institution by the institution id, empty without one. Groups are
        ordered by value, largest first; shares are in basis points of the sum of the positive groups, rounded down,
        and the last positive group takes the remainder so they add up to 10000. A group that is not positive (a
        cash balance below zero) has share 0.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: by
          in: query
          required: true
          schema:
            type: string
            enum: [type, currency, institution]
        - name: value_in
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Allocation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /reports/net-worth:
    get:
      tags: [portfolio]
      operationId: getNetWorth
      x-book-role: read
      summary: Assets, liabilities and their difference at a date (investments design 4.3).
      description: Liabilities are the balances of the liability accounts as a positive amount, valued like the assets.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: value_in
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorth"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /reports/net-worth/days:
    get:
      tags: [portfolio]
      operationId: getNetWorthDays
      x-book-role: read
      summary: Assets, liabilities and their difference at the end of each day of [from, to], at most 62 days (net worth days design, D1).
      description: Each day is valued as getNetWorth values a date. 400 invalid_request when from is after to or the range exceeds 62 days.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: value_in
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorthDays"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /contribution-plan:
    get:
      tags: [portfolio]
      operationId: getContributionPlan
      x-book-role: read
      summary: The contribution plan of the book with the current value, share and drift of each class (contribution plan design, CN5 to CN10).
      description: A book without a plan returns no class. status is incomplete when a member has no price or rate at today (CN10); the response then carries no share and no drift.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionPlan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    put:
      tags: [portfolio]
      operationId: saveContributionPlan
      x-book-role: write
      summary: Replaces the contribution plan and returns it as getContributionPlan does.
      description: 422 contribution_target_sum, contribution_member_target_sum, contribution_class_name_duplicate, contribution_member_duplicate, contribution_member_invalid, contribution_amount_invalid, contribution_question_invalid, contribution_answers_invalid or contribution_rule_invalid; 400 invalid_request when the plan breaks a limit (CN2 to CN4, CN11, CQ1 to CQ3, GR1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionPlanInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionPlan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /contribution-plan/preview:
    post:
      tags: [portfolio]
      operationId: previewContributionPlan
      x-book-role: read
      summary: The split of an amount over the plan in the request, with the drift before and after, without storing either (CN13).
      description: When set, the amount is positive and in the base currency, else 422 contribution_amount_invalid; a draft with questions breaks CQ1 to CQ3 with 422 contribution_question_invalid or contribution_answers_invalid, and a draft with invalid rules returns 422 contribution_rule_invalid. Without amount, the draft is valued with no split (GR8). The plan rules are those of saveContributionPlan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionPreviewInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionPlan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /instrument-subtypes:
    get:
      tags: [portfolio]
      operationId: listInstrumentSubtypes
      x-book-role: read
      summary: Subtypes of an instrument type that the book's jurisdiction knows; none without a jurisdiction.
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/InstrumentType"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtypeList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
parameters:
  Year:
    name: year
    in: query
    required: true
    description: Year in which the tax year of the owner's jurisdiction starts.
    schema:
      type: integer
      minimum: 1900
      maximum: 2200
schemas:
  IncomeTypeList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/IncomeType"
  AllocationGroup:
    type: object
    required: [key, value, share_bp]
    properties:
      key:
        type: string
      value:
        $ref: "#/components/schemas/Money"
      share_bp:
        type: integer
  Allocation:
    type: object
    required: [total, groups]
    properties:
      total:
        $ref: "#/components/schemas/Money"
      groups:
        type: array
        items:
          $ref: "#/components/schemas/AllocationGroup"
      current:
        $ref: "#/components/schemas/CurrentQuotes"
  NetWorth:
    type: object
    required: [assets, liabilities, net]
    properties:
      assets:
        $ref: "#/components/schemas/Money"
      liabilities:
        $ref: "#/components/schemas/Money"
      net:
        $ref: "#/components/schemas/Money"
      current:
        $ref: "#/components/schemas/CurrentQuotes"
  NetWorthDay:
    type: object
    required: [date, assets, liabilities, net]
    properties:
      date:
        type: string
        format: date
      assets:
        $ref: "#/components/schemas/Money"
      liabilities:
        $ref: "#/components/schemas/Money"
      net:
        $ref: "#/components/schemas/Money"
      current:
        $ref: "#/components/schemas/CurrentQuotes"
  NetWorthDays:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/NetWorthDay"
  ReturnFlow:
    type: object
    required: [date, amount]
    properties:
      date:
        type: string
        format: date
      amount:
        $ref: "#/components/schemas/Money"
  ReturnReport:
    type: object
    required: [annual_bp, flows, opening, closing, profile]
    properties:
      annual_bp:
        type: integer
      flows:
        type: array
        items:
          $ref: "#/components/schemas/ReturnFlow"
      opening:
        $ref: "#/components/schemas/Money"
      closing:
        $ref: "#/components/schemas/Money"
      profile:
        type: string
        enum: [rate, market]
        description: rate when every holding is the value_in currency or a fixed income instrument quoted in it; market otherwise (amendment A208 R11).
      period_bp:
        type: integer
      index:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
        description: The daily index the report compares with, the named one or the region's default; absent only when the region has none and none is named (amendment A208 R21).
      benchmark:
        $ref: "#/components/schemas/ReturnBenchmark"
      inflation:
        $ref: "#/components/schemas/ReturnInflation"
      unavailable_reason:
        type: string
        pattern: "^[a-z_]{2,40}$"
        description: Why benchmark, or its percent_bp and annual_bp, is absent - no_index_for_region, currency_mismatch, nothing_held, no_yield_recorded, single_credit, single_credit_after_flow, too_small, too_few_days, no_rate_in_window or percent_undefined (amendment A208 R21).
      excluded:
        $ref: "#/components/schemas/ReturnExcluded"
  ReturnExcluded:
    type: object
    description: For a tree of cash whose yield is what the ledger records against the Yield account, the income and expense of the period that the comparison treated as flows, not as yield (amendment A208 R19).
    properties:
      income:
        $ref: "#/components/schemas/ReturnExcludedPart"
      expense:
        $ref: "#/components/schemas/ReturnExcludedPart"
  ReturnExcludedPart:
    type: object
    required: [amount, categories]
    properties:
      amount:
        $ref: "#/components/schemas/Money"
      categories:
        type: array
        maxItems: 3
        items:
          type: string
        description: The names of the categories that hold most of the amount.
  ReturnBenchmark:
    type: object
    required: [index, from, until, days, skipped, credits, restarted, started_late, index_bp]
    properties:
      started_late:
        type: boolean
        description: True when at least one rate of the period dated before from was left out, so the comparison starts after the first rate day of the window (amendment A208 R21).
      credits:
        type: integer
        description: For a tree whose yield is recorded, the yield credits the return covers, the positive credits after the first credit compared (amendment A208 R20); 0 otherwise.
      restarted:
        type: boolean
        description: True when a flow between two credits more than 7 days apart moved the start of the comparison to the credit after it (amendment A208 R20).
      percent_error_bp:
        type: integer
        description: The relative bound of percent_bp and annual_bp in basis points of themselves, from rounding each tree posting of a credit to the minor unit; percent_bp and annual_bp are absent above 500 (amendment A208 R22).
      index:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      from:
        type: string
        format: date
        description: The date of the first rate compared; the rates of the days the tree held nothing leave the comparison (amendment A208 R14).
      days:
        type: integer
        description: The number of rates compared.
      skipped:
        type: integer
        description: The rates of the period left out, on days the tree held nothing or, for a rate profile, before its first recorded yield (amendment A208 R14, R18).
      until:
        type: string
        format: date
      return_bp:
        type: integer
      index_bp:
        type: integer
      percent_bp:
        type: integer
      annual_bp:
        type: integer
        description: return_bp as a rate a year on the year basis of the index (252 rate days for cdi); absent when the basis is unknown or the profile is market.
      index_annual_bp:
        type: integer
        description: index_bp as a rate a year on the same basis.
      excess_bp:
        type: integer
        description: return_bp minus index_bp, in basis points of percentage points.
  ReturnInflation:
    type: object
    required: [index, from, until, index_bp, return_bp, real_bp]
    description: The return net of inflation over the whole months of the period with a stored rate (amendment A208 R16).
    properties:
      index:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      from:
        type: string
        format: date
      until:
        type: string
        format: date
      index_bp:
        type: integer
      return_bp:
        type: integer
      real_bp:
        type: integer
  SubtypeList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
  Position:
    type: object
    required: [account_id, instrument, quantity, cost_basis]
    properties:
      account_id:
        type: string
        format: uuid
      instrument:
        type: string
      quantity:
        $ref: "#/components/schemas/Money"
      cost_basis:
        $ref: "#/components/schemas/Money"
      average_cost:
        description: Cost basis per unit; absent unless quantity and cost basis are positive.
        allOf:
          - $ref: "#/components/schemas/Rate"
      market_value:
        description: Quantity valued in the base currency; absent without a price.
        allOf:
          - $ref: "#/components/schemas/Money"
      estimated_tax:
        description: Income tax and IOF a sale of the whole quantity at market_value would withhold (A235); absent when the book has no table for the position or value_in is not the base currency.
        allOf:
          - $ref: "#/components/schemas/Money"
      estimated_net:
        description: market_value less estimated_tax.
        allOf:
          - $ref: "#/components/schemas/Money"
      prices:
        type: array
        items:
          $ref: "#/components/schemas/Price"
  PositionList:
    type: object
    required: [items, quote_warnings]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Position"
      quote_warnings:
        type: array
        description: The held instruments whose quote is stale or missing at the date (A222 MQ26).
        items:
          $ref: "#/components/schemas/PositionQuoteWarning"
  PositionQuoteWarning:
    type: object
    additionalProperties: false
    required: [instrument, last]
    properties:
      instrument:
        type: string
      last:
        type: string
        format: date
        nullable: true
        description: The date of the last stored price, or null.
  RealizedResult:
    type: object
    required: [transaction_id, account_id, instrument, date, month, kind, quantity, cost, proceeds, result, tax_class]
    properties:
      transaction_id:
        type: string
        format: uuid
      account_id:
        type: string
        format: uuid
      instrument:
        type: string
      date:
        type: string
        format: date
      month:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}$"
      kind:
        type: string
        enum: [swing, day_trade]
      quantity:
        $ref: "#/components/schemas/Money"
      cost:
        $ref: "#/components/schemas/Money"
      proceeds:
        $ref: "#/components/schemas/Money"
      result:
        $ref: "#/components/schemas/Money"
      tax_class:
        type: string
        nullable: true
        pattern: "^[a-z0-9_]{2,40}$"
  RealizedResultList:
    type: object
    required: [from, to, items]
    properties:
      from:
        type: string
        format: date
        description: First day of the tax year.
      to:
        type: string
        format: date
        description: Last day of the tax year, included.
      items:
        type: array
        items:
          $ref: "#/components/schemas/RealizedResult"
  IncomeEvent:
    type: object
    required: [transaction_id, account_id, instrument, date, income_type, tax_treatment, gross, withheld]
    properties:
      transaction_id:
        type: string
        format: uuid
      account_id:
        type: string
        format: uuid
      instrument:
        type: string
      date:
        type: string
        format: date
      income_type:
        $ref: "#/components/schemas/IncomeType"
      tax_treatment:
        type: string
        nullable: true
        pattern: "^[a-z0-9_]{2,40}$"
      gross:
        $ref: "#/components/schemas/Money"
      withheld:
        $ref: "#/components/schemas/Money"
  IncomeEventList:
    type: object
    required: [from, to, items]
    properties:
      from:
        type: string
        format: date
        description: First day of the tax year.
      to:
        type: string
        format: date
        description: Last day of the tax year, included.
      items:
        type: array
        items:
          $ref: "#/components/schemas/IncomeEvent"
  FixedIncomeEventList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/FixedIncomeEvent"
  FixedIncomeEvent:
    type: object
    required: [account_id, instrument, date, kind, quantity, rate_missing, state]
    properties:
      account_id:
        type: string
        format: uuid
      instrument:
        type: string
      date:
        type: string
        format: date
        description: The payment date, adjusted to the next business day.
      kind:
        type: string
        pattern: ^[a-z0-9_]{2,40}$
        description: interest, amortization, maturity or unit_tax.
      quantity:
        $ref: "#/components/schemas/Money"
      gross:
        $ref: "#/components/schemas/Money"
      rate_missing:
        type: boolean
        description: The rate of the index is not published, so gross is absent.
      custody_fee:
        description: The custody fee a payment pays on its receipt, such as the 0.10% of a monthly payment of an RendA+ above 6 minimum wages; absent when it pays none.
        allOf:
          - $ref: "#/components/schemas/Money"
      estimated_tax:
        description: The come-cotas a unit_tax event takes, estimated on the gain of the units since the later of their average cost and the price of the previous come-cotas, at the rate of the fund's subtype; absent without a price.
        allOf:
          - $ref: "#/components/schemas/Money"
      state:
        type: string
        enum: [upcoming, due, recorded]
  IssuerExposureReport:
    type: object
    required: [date, issuers, period_note, missing_prices]
    properties:
      date:
        type: string
        format: date
      issuers:
        type: array
        description: By market value, largest first; the group without issuer last.
        items:
          $ref: "#/components/schemas/IssuerExposure"
      guarantee:
        $ref: "#/components/schemas/DepositGuarantee"
      period_note:
        type: boolean
        description: The covered values of all issuers together exceed limit_per_period.
      missing_prices:
        type: array
        items:
          type: string
  IssuerExposure:
    type: object
    description: sovereign_value is the value of the securities the state of the region issues, to which the guarantee does not apply; uncovered_value is the rest outside the guarantee. covered_value holds special_value, the part under the special guarantee (a DPGE); limit is the limit per issuer plus the special limit when the issuer holds special securities, and excess what passes each limit.
    required: [market_value, covered_value, uncovered_value, sovereign_value, special_value]
    properties:
      key:
        type: string
        description: The issuer identifier or the folded name; absent for holdings without issuer.
      issuer:
        type: string
      market_value:
        $ref: "#/components/schemas/Money"
      covered_value:
        $ref: "#/components/schemas/Money"
      uncovered_value:
        $ref: "#/components/schemas/Money"
      sovereign_value:
        $ref: "#/components/schemas/Money"
      special_value:
        $ref: "#/components/schemas/Money"
      limit:
        $ref: "#/components/schemas/Money"
      excess:
        $ref: "#/components/schemas/Money"
  DepositGuarantee:
    type: object
    required: [name, limit_per_issuer, limit_per_period, period_years, covered]
    properties:
      name:
        type: string
      limit_per_issuer:
        $ref: "#/components/schemas/Money"
      limit_per_period:
        $ref: "#/components/schemas/Money"
      period_years:
        type: integer
      covered:
        type: array
        description: The subtypes the guarantee covers.
        items:
          type: string
      special_limit:
        $ref: "#/components/schemas/Money"
      special:
        type: array
        description: The subtypes of the special guarantee, covered up to special_limit per issuer apart from limit_per_issuer and outside limit_per_period.
        items:
          type: string
  ContributionPlan:
    type: object
    required: [status, total, classes, outside, missing]
    properties:
      amount:
        $ref: "#/components/schemas/Money"
      status:
        type: string
        enum: [complete, incomplete]
      total:
        $ref: "#/components/schemas/Money"
      total_after:
        $ref: "#/components/schemas/Money"
      drift_bp:
        type: integer
      drift_after_bp:
        type: integer
      leftover:
        $ref: "#/components/schemas/Money"
      classes:
        type: array
        items:
          $ref: "#/components/schemas/ContributionClass"
      outside:
        type: array
        items:
          $ref: "#/components/schemas/ContributionOutside"
      missing:
        type: array
        items:
          $ref: "#/components/schemas/ContributionMissing"
      current:
        $ref: "#/components/schemas/CurrentQuotes"
      guarantee_name:
        type: string
        description: Name of the deposit guarantee of the book's region in the base currency; absent without one (GR8).
  ContributionClass:
    type: object
    required: [name, target_bp, value, questions, question_ideals, members, rules, matched]
    properties:
      name:
        type: string
      target_bp:
        type: integer
      questions:
        type: array
        items:
          type: string
        description: The investor's yes-or-no questions of the group (CQ1); empty without them.
      question_ideals:
        type: boolean
        description: True when the group divides its target by the answers and one answer is yes (CQ3).
      value:
        $ref: "#/components/schemas/Money"
      share_bp:
        type: integer
      after_share_bp:
        type: integer
      amount:
        $ref: "#/components/schemas/Money"
      cost:
        $ref: "#/components/schemas/Money"
      members:
        type: array
        items:
          $ref: "#/components/schemas/ContributionMember"
      rules:
        type: array
        items:
          $ref: "#/components/schemas/ContributionRule"
      matched:
        type: array
        items:
          $ref: "#/components/schemas/ContributionMatched"
        description: The securities a rule of the group takes (GR5, GR8).
  ContributionRule:
    type: object
    description: A conjunction of the conditions it sets (contribution rules GR2); at least one.
    properties:
      instrument_type:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      subtypes:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          pattern: "^[a-z0-9_]{2,40}$"
      quote_currency:
        type: string
      return_kind:
        type: string
        enum: [rate, inflation, fixed]
      matures_from_year:
        type: integer
        minimum: 1900
        maximum: 2200
      matures_to_year:
        type: integer
        minimum: 1900
        maximum: 2200
      daily_liquidity:
        type: boolean
      guarantee:
        type: string
        enum: [covered, sovereign, uncovered]
  ContributionMatched:
    type: object
    required: [instrument, value]
    properties:
      instrument:
        type: string
      value:
        $ref: "#/components/schemas/Money"
      share_bp:
        type: integer
  ContributionMember:
    type: object
    required: [value]
    properties:
      account_id:
        type: string
        format: uuid
      instrument:
        type: string
      target_bp:
        type: integer
      answers:
        type: array
        items:
          type: boolean
        description: One answer per question of the group, true for yes (CQ2); absent in a group without questions.
      value:
        $ref: "#/components/schemas/Money"
      share_bp:
        type: integer
      after_share_bp:
        type: integer
      unit_value:
        $ref: "#/components/schemas/Money"
      amount:
        $ref: "#/components/schemas/Money"
      quantity:
        $ref: "#/components/schemas/Money"
      cost:
        $ref: "#/components/schemas/Money"
  ContributionOutside:
    type: object
    properties:
      account_id:
        type: string
        format: uuid
      instrument:
        type: string
      value:
        $ref: "#/components/schemas/Money"
      return_kind:
        type: string
        enum: [rate, inflation, fixed]
  ContributionMissing:
    type: object
    required: [instrument, kind]
    properties:
      account_id:
        type: string
        format: uuid
      instrument:
        type: string
      kind:
        type: string
        enum: [price, rate]
  ContributionPlanInput:
    type: object
    required: [classes]
    properties:
      amount:
        $ref: "#/components/schemas/Money"
      classes:
        type: array
        maxItems: 20
        items:
          $ref: "#/components/schemas/ContributionClassInput"
  ContributionClassInput:
    type: object
    required: [name, target_bp, members]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 60
      target_bp:
        type: integer
        minimum: 0
        maximum: 10000
      questions:
        type: array
        items:
          type: string
        description: The investor's yes-or-no questions of the group (CQ1); empty without them.
      members:
        type: array
        items:
          $ref: "#/components/schemas/ContributionMemberInput"
      rules:
        type: array
        maxItems: 5
        items:
          $ref: "#/components/schemas/ContributionRule"
        description: The rules of a group by rule (GR1); absent or empty for a group of members.
  ContributionMemberInput:
    type: object
    properties:
      account_id:
        type: string
        format: uuid
      instrument:
        type: string
      target_bp:
        type: integer
        minimum: 0
        maximum: 10000
      answers:
        type: array
        items:
          type: boolean
        description: One answer per question of the group, true for yes (CQ2); absent in a group without questions.
  ContributionPreviewInput:
    type: object
    required: [classes]
    properties:
      amount:
        $ref: "#/components/schemas/Money"
      classes:
        type: array
        maxItems: 20
        items:
          $ref: "#/components/schemas/ContributionClassInput"
