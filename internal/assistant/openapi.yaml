paths:
  /assistant/presets:
    get:
      tags: [assistant]
      operationId: listPresets
      x-book-role: read
      summary: Known language model services, their notices and suggested models.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetList"
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/providers:
    get:
      tags: [assistant]
      operationId: listProviders
      x-book-role: read
      summary: The book's providers in creation order, then the instance providers; never a key.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [assistant]
      operationId: createProvider
      x-book-role: owner
      summary: Store a provider; its key is sealed under EQUORI_SECRET_KEY (ADR 008).
      description: |
        422 key_required when the preset requires a key and none is sent; 409 secret_key_missing
        when a key is sent and EQUORI_SECRET_KEY is not set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /assistant/providers/{id}:
    patch:
      tags: [assistant]
      operationId: updateProvider
      x-book-role: owner
      summary: Change a provider's name, base URL or key; an absent key keeps the stored one.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [assistant]
      operationId: deleteProvider
      x-book-role: owner
      summary: Delete a provider and its chain targets; their uses fall back to the default.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /assistant/providers/{id}/models:
    get:
      tags: [assistant]
      operationId: listProviderModels
      x-book-role: read
      summary: Ask the provider's API for its models, which also checks its key.
      description: 502 provider_unauthorized when the provider rejects the key; 502 provider_unavailable otherwise.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderModels"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /assistant/usage:
    get:
      tags: [assistant]
      operationId: listUsage
      x-book-role: read
      summary: The book's usage per provider and model today and over the last 30 days, with declared limits (ADR 019 U6).
      description: Today is the instance's date; a provider resets its quota on its own schedule.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageList"
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/usage/days:
    get:
      tags: [assistant]
      operationId: listUsageDays
      x-book-role: read
      summary: The book's usage per day, provider and model over a range of at most 90 days.
      description: Both ends are included and the figures sum the uses. A day without use has no row.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageDayList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/usage/limits:
    put:
      tags: [assistant]
      operationId: setUsageLimit
      x-book-role: owner
      summary: Declare the daily limits of a provider and model; absent quotas remove them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageLimitInput"
      responses:
        "204":
          description: Stored.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /assistant/chat:
    get:
      tags: [assistant]
      operationId: getAssistantChat
      x-book-role: read
      summary: Whether the conversation can be used now, with the target it would reach and when to retry.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChat"
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/turns:
    post:
      tags: [assistant]
      operationId: sendAssistantMessage
      x-book-role: read
      summary: Run one conversation turn and stream its progress as Server-Sent Events.
      description: |
        Events: turn {conversation_id, message_id}, delta {text}, step {tool}, answer (AssistantMessage) and error (Problem).
        Text received since the previous step belongs to a model call that asked for tools; a client drops it at the step.
        The stream ends after answer or error. Problems before the stream: 404 conversation_not_found,
        429 assistant_exhausted with retry_at, 503 assistant_unavailable, 400 invalid_request for text that is
        empty without a file or over 4000 characters after trimming, 404 file_not_found for a file_ids entry
        that is not an unsent file of the member. An error event carries assistant_exhausted,
        assistant_unavailable or assistant_failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantTurnInput"
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /assistant/conversations:
    get:
      tags: [assistant]
      operationId: listAssistantConversations
      x-book-role: read
      summary: The book's conversations, most recently updated first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationPage"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [assistant]
      operationId: deleteAssistantConversations
      x-book-role: read
      summary: Delete every conversation of the book with its messages and proposals.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/conversations/{id}:
    get:
      tags: [assistant]
      operationId: getAssistantConversation
      x-book-role: read
      summary: A conversation with its messages and their proposals.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [assistant]
      operationId: deleteAssistantConversation
      x-book-role: read
      summary: Delete a conversation with its messages and proposals; 404 conversation_not_found.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /assistant/files:
    post:
      tags: [assistant]
      operationId: createAssistantFile
      x-book-role: read
      summary: Store a file the member attaches to the next message of a conversation.
      description: |
        The kind is read from the content: ofx, csv, pdf, image (JPEG, PNG, WebP) or text; another content
        returns 415 file_kind_unsupported. At most 10 MiB per file (413 file_too_large) and 50 MiB per
        conversation, or for the unsent files of the member when conversation_id is absent
        (409 conversation_files_full). The same content attached twice to one conversation returns the
        stored file. An unsent file is deleted 24 hours after its upload. 404 conversation_not_found.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                conversation_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantFile"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /assistant/files/{id}/content:
    get:
      tags: [assistant]
      operationId: getAssistantFileContent
      x-book-role: read
      summary: Open a conversation file of the member; 404 file_not_found.
      description: |
        A pdf, image or text file is shown in place (inline); an ofx or csv file is a download. The
        Content-Security-Policy lets no content of the file run.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The file, with the media type of its content.
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Security-Policy:
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /assistant/files/{id}:
    delete:
      tags: [assistant]
      operationId: deleteAssistantFile
      x-book-role: read
      summary: Remove a file no message has sent yet; 404 file_not_found.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /assistant/proposals/{id}/confirm:
    post:
      tags: [assistant]
      operationId: confirmAssistantProposal
      x-book-role: write
      summary: Execute a pending proposal once, after checking that its data did not change.
      description: "Answers 409 with Problem code proposal_closed, proposal_expired, proposal_stale or proposal_waiting (the proposal waits for the confirmation of another)."
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantProposal"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /assistant/proposals/{id}/reject:
    post:
      tags: [assistant]
      operationId: rejectAssistantProposal
      x-book-role: read
      summary: Reject a pending proposal.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantProposal"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /assistant/uses:
    get:
      tags: [assistant]
      operationId: listUses
      x-book-role: read
      summary: Every declared use with its effective chain for the book.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseList"
        "401":
          $ref: "#/components/responses/Problem"
  /assistant/uses/{use}/chain:
    put:
      tags: [assistant]
      operationId: setUseChain
      x-book-role: owner
      summary: Replace the book's chain of a use; an empty list restores the default.
      description: 422 capability_missing when a model lacks a capability the use needs.
      parameters:
        - name: use
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9_.]{2,40}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChainInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Use"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
schemas:
  Capability:
    type: string
    enum: [tools, structured_output, image_input]
  Notice:
    type: string
    description: trains, the free tier uses submitted content; local, data stays on the configured host; provider_terms, read the provider's terms.
    enum: [trains, local, provider_terms]
  PresetModel:
    type: object
    required: [id, capabilities]
    properties:
      id:
        type: string
      capabilities:
        type: array
        items:
          $ref: "#/components/schemas/Capability"
  Preset:
    type: object
    required: [id, api, base_url, key_required, notice, models]
    properties:
      id:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      api:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      base_url:
        type: string
        description: Empty for custom.
      key_required:
        type: boolean
      notice:
        $ref: "#/components/schemas/Notice"
      models:
        type: array
        items:
          $ref: "#/components/schemas/PresetModel"
  PresetList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Preset"
  Provider:
    type: object
    required: [id, preset, name, base_url, has_key, notice, instance]
    properties:
      id:
        type: string
        description: A UUID, or the adapter name of an instance provider.
      preset:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      name:
        type: string
      base_url:
        type: string
        description: Empty for an instance provider.
      has_key:
        type: boolean
      notice:
        $ref: "#/components/schemas/Notice"
      instance:
        type: boolean
        description: Configured through the environment for every book; read-only.
  ProviderList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Provider"
  ProviderInput:
    type: object
    required: [preset, name]
    properties:
      preset:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      name:
        type: string
      base_url:
        type: string
        description: Absent takes the preset's.
      key:
        type: string
        writeOnly: true
  ProviderPatch:
    type: object
    properties:
      name:
        type: string
      base_url:
        type: string
      key:
        type: string
        writeOnly: true
        description: Absent keeps the stored key; empty removes it.
  ProviderModels:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: string
  UseTarget:
    type: object
    required: [provider_id, provider_name, preset, notice, model, capabilities]
    properties:
      provider_id:
        type: string
      provider_name:
        type: string
      preset:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      notice:
        $ref: "#/components/schemas/Notice"
      model:
        type: string
      capabilities:
        type: array
        items:
          $ref: "#/components/schemas/Capability"
  Use:
    type: object
    required: [id, needs, sends_financial_data, default, targets]
    properties:
      id:
        type: string
        pattern: "^[a-z0-9_.]{2,40}$"
      needs:
        type: array
        items:
          $ref: "#/components/schemas/Capability"
      sends_financial_data:
        type: boolean
      default:
        type: boolean
        description: The chain comes from the use's declaration.
      targets:
        type: array
        items:
          $ref: "#/components/schemas/UseTarget"
  UseList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/Use"
  UsageRow:
    type: object
    required: [provider_id, provider_name, preset, instance, model, today_requests, today_errors, today_tokens,
      period_requests, period_tokens, period_days]
    properties:
      provider_id:
        type: string
      provider_name:
        type: string
      preset:
        type: string
        pattern: "^[a-z0-9_]{2,40}$"
      instance:
        type: boolean
      model:
        type: string
      today_requests:
        type: integer
        format: int64
        description: Requests sent today, answered or not.
      today_errors:
        type: integer
        format: int64
      today_tokens:
        type: integer
        format: int64
        description: Input and output tokens of today's answers.
      period_requests:
        type: integer
        format: int64
      period_tokens:
        type: integer
        format: int64
      period_days:
        type: integer
        description: Days summed in the period figures, today included.
      requests_per_day:
        type: integer
        format: int64
        description: Absent when the owner declared none.
      tokens_per_day:
        type: integer
        format: int64
      cooling_until:
        type: string
        format: date-time
        description: Present while the model cools down after a refusal.
  UsageList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/UsageRow"
  UsageDay:
    type: object
    required: [day, provider_id, model, requests, errors, tokens]
    properties:
      day:
        type: string
        format: date
      provider_id:
        type: string
      model:
        type: string
      requests:
        type: integer
        format: int64
        description: Requests sent that day, answered or not.
      errors:
        type: integer
        format: int64
      tokens:
        type: integer
        format: int64
        description: Input and output tokens of the day's answers.
  UsageDayList:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/UsageDay"
  AssistantChat:
    type: object
    additionalProperties: false
    required: [available]
    properties:
      available: {type: boolean}
      provider_name: {type: string}
      model: {type: string}
      notice: {type: string, pattern: "^[a-z0-9_]{2,40}$"}
      reads_files:
        type: boolean
        description: A model of the chat reads the content of a pdf, image or text file (F5).
      retry_at: {type: string, format: date-time}
  AssistantFile:
    type: object
    additionalProperties: false
    required: [id, name, kind, size, created_at]
    properties:
      id: {type: string, format: uuid}
      conversation_id: {type: string, format: uuid}
      name: {type: string}
      kind: {type: string, enum: [ofx, csv, pdf, image, text]}
      size: {type: integer, minimum: 1}
      created_at: {type: string, format: date-time}
  AssistantTurnInput:
    type: object
    additionalProperties: false
    required: [text]
    properties:
      conversation_id: {type: string, format: uuid}
      text:
        type: string
        maxLength: 4000
        description: Empty only when file_ids names a file.
      file_ids:
        type: array
        maxItems: 5
        uniqueItems: true
        items: {type: string, format: uuid}
        description: Unsent files of createAssistantFile the message carries.
      page: {type: string, pattern: "^/[A-Za-z0-9/_$.-]{0,199}$"}
  AssistantConversation:
    type: object
    additionalProperties: false
    required: [id, title, created_at, updated_at]
    properties:
      id: {type: string, format: uuid}
      title: {type: string}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
  AssistantConversationPage:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/components/schemas/AssistantConversation"
      next_cursor:
        type: string
        description: Absent on the last page.
  AssistantMessage:
    type: object
    additionalProperties: false
    required: [id, role, content, created_at, proposals, files, views]
    properties:
      id: {type: string, format: uuid}
      role: {type: string, enum: [user, assistant]}
      content: {type: string}
      outcome: {type: string, enum: [answered, step_limit, failed, canceled]}
      created_at: {type: string, format: date-time}
      files:
        type: array
        description: The files the message carried, in the order uploaded (FU5).
        items:
          $ref: "#/components/schemas/AssistantFile"
      proposals:
        type: array
        items:
          $ref: "#/components/schemas/AssistantProposal"
      views:
        type: array
        description: The views of an answer, built by the server from reads of its turn (answer views design, V9).
        items:
          $ref: "#/components/schemas/AssistantView"
  AssistantView:
    type: object
    additionalProperties: false
    required: [id, form, payload]
    properties:
      id: {type: string, format: uuid}
      form: {type: string, pattern: "^[a-z][a-z0-9_]{1,39}$"}
      payload: {$ref: "#/components/schemas/AssistantViewPayload"}
  AssistantViewPayload:
    type: object
    additionalProperties: false
    required: [title, window, verdict, next, rows, data]
    properties:
      title: {$ref: "#/components/schemas/AssistantViewText"}
      window: {$ref: "#/components/schemas/AssistantViewWindow"}
      verdict: {$ref: "#/components/schemas/AssistantViewText"}
      prov: {$ref: "#/components/schemas/AssistantViewText"}
      open: {$ref: "#/components/schemas/AssistantViewLink"}
      next:
        type: array
        maxItems: 3
        items: {type: string, maxLength: 60}
      rows: {$ref: "#/components/schemas/AssistantViewTable"}
      data:
        type: object
        description: The body of the form; its shape is the form's (answer views design, V6).
        additionalProperties: true
  AssistantViewText:
    type: object
    additionalProperties: false
    required: [key]
    properties:
      key: {type: string}
      params:
        type: object
        additionalProperties: {$ref: "#/components/schemas/AssistantViewValue"}
  AssistantViewValue:
    type: object
    additionalProperties: false
    description: One typed figure; exactly one property is present (V7).
    properties:
      text: {type: string}
      money: {$ref: "#/components/schemas/AssistantViewMoney"}
      bp: {type: integer, format: int64, description: share in basis points}
      count: {type: integer, format: int64}
      date: {type: string, format: date}
      month: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}
      times: {type: integer, format: int64, description: a multiple in basis points}
      rate: {type: integer, format: int64, description: a return in basis points}
      points: {type: integer, format: int64, description: a difference of two rates in basis points}
      decimal: {type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$", description: a number written with a dot}
  AssistantViewMoney:
    type: object
    additionalProperties: false
    required: [amount, currency]
    properties:
      amount: {type: integer, format: int64, description: minor units of the currency}
      currency: {type: string}
  AssistantViewWindow:
    type: object
    additionalProperties: false
    properties:
      from: {type: string, format: date}
      to: {type: string, format: date}
      at: {type: string, format: date}
      label_key: {type: string}
  AssistantViewLink:
    type: object
    additionalProperties: false
    required: [screen]
    properties:
      screen: {type: string}
      params:
        type: object
        additionalProperties: {type: string}
  AssistantViewTable:
    type: object
    additionalProperties: false
    required: [head, rows]
    properties:
      head:
        type: array
        items: {type: string}
      rows:
        type: array
        items:
          type: array
          items: {$ref: "#/components/schemas/AssistantViewValue"}
  AssistantConversationDetail:
    type: object
    additionalProperties: false
    required: [id, title, created_at, updated_at, messages]
    properties:
      id: {type: string, format: uuid}
      title: {type: string}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
      messages:
        type: array
        items:
          $ref: "#/components/schemas/AssistantMessage"
  AssistantProposal:
    type: object
    additionalProperties: false
    required: [id, tool, status, preview, created_at, expires_at, suggested, waiting_for]
    properties:
      id: {type: string, format: uuid}
      tool: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}
      status: {type: string, enum: [pending, executing, executed, failed, rejected, stale, discarded, expired, waiting, blocked]}
      suggested: {type: boolean}
      reason: {type: string, maxLength: 200}
      summary: {type: string, maxLength: 200}
      waiting_for: {type: array, items: {type: string, format: uuid}}
      preview: {$ref: "#/components/schemas/AssistantPreview"}
      result: {description: "Tool output when executed, tool error when failed."}
      created_at: {type: string, format: date-time}
      expires_at: {type: string, format: date-time}
      decided_at: {type: string, format: date-time}
  AssistantPreview:
    type: object
    additionalProperties: false
    required: [action, changes]
    properties:
      action: {type: string}
      target: {type: string}
      destructive: {type: boolean}
      changes:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [field]
          properties:
            field: {type: string, pattern: "^[a-z_]{2,40}$"}
            before: {$ref: "#/components/schemas/AssistantValue"}
            after: {$ref: "#/components/schemas/AssistantValue"}
      items:
        type: array
        items: {$ref: "#/components/schemas/AssistantPreviewItem"}
      recurrence: {$ref: "#/components/schemas/AssistantRecurrence"}
  AssistantPreviewItem:
    type: object
    additionalProperties: false
    required: [description]
    properties:
      description: {type: string}
      date: {type: string, format: date}
      amount: {$ref: "#/components/schemas/AssistantValue"}
      account: {type: string}
      category: {type: string}
  AssistantRecurrence:
    type: object
    additionalProperties: false
    required: [frequency, interval]
    properties:
      frequency: {type: string, pattern: "^[a-z_]{2,40}$"}
      interval: {type: integer, minimum: 1}
      day: {type: integer, minimum: 1, maximum: 31}
  AssistantValue:
    type: object
    additionalProperties: false
    properties:
      text: {type: string}
      amount: {type: string}
      currency: {type: string}
      date: {type: string, format: date}
  UsageLimitInput:
    type: object
    required: [provider_id, model]
    properties:
      provider_id:
        type: string
        minLength: 1
        maxLength: 60
      model:
        type: string
        minLength: 1
        maxLength: 200
      requests_per_day:
        type: integer
        format: int64
        minimum: 1
        maximum: 2147483647
      tokens_per_day:
        type: integer
        format: int64
        minimum: 1
  ChainTargetInput:
    type: object
    required: [provider_id, model]
    properties:
      provider_id:
        type: string
        format: uuid
      model:
        type: string
      capabilities:
        type: array
        description: Asserted for a model its preset does not name.
        items:
          $ref: "#/components/schemas/Capability"
  ChainInput:
    type: object
    required: [targets]
    properties:
      targets:
        type: array
        maxItems: 10
        items:
          $ref: "#/components/schemas/ChainTargetInput"
